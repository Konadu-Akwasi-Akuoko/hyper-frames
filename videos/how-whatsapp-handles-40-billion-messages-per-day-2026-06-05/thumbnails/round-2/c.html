<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RUN BY 32 ENGINEERS</title>
  <link rel="stylesheet" href="file:///Users/akwasikonaduakuoko/Projects/WebDev/hyper-frames/.claude/skills/thumbnail-and-title-generator/templates/styles.css">
  <!-- Walter White stunned bust (576x549 portrait, warm desert-lit source).
       Warm spill eroded off the alpha. Open-mouth stun reads as disbelief at
       the numbers. Sits in the right third; nudged right so the head clears the
       headline. Placement only. -->
  <style>
    .face-wrap { right: -36px; }
    .face-glow { right: 120px; bottom: 250px; }
  </style>
</head>
<body>
  <div class="thumbnail  acc-cyan ">
    <div class="bg-grid"></div>

    <div class="face-wrap">
      <div class="face-glow"></div>
      <img class="face" src="file:///Users/akwasikonaduakuoko/Projects/WebDev/hyper-frames/videos/how-whatsapp-handles-40-billion-messages-per-day-2026-06-05/thumbnails/cutouts/walter-cut.png" alt="">
    </div>



    <div class="thumbnail-text" style="font-size: 96px;">
      <span class="thumbnail-row ">RUN BY</span>
      <span class="thumbnail-row punch accent">32</span>
      <span class="thumbnail-row ">ENGINEERS</span>
      <span class="thumbnail-row"></span>
      <span class="thumbnail-row"></span>
      <div class="mono-tell">// <span class="stat">14M</span> users per engineer</div>
    </div>

    <div class="vignette"></div>

    <div class="grid-overlay" aria-hidden="true">
      <div class="grid-safe-area"></div>
    </div>
  </div>
  <script>
    (function () {
      var t = document.querySelector('.thumbnail');
      if (location.search.includes('grid')) t.classList.add('with-grid');
      var g = t.querySelector('.grid-overlay');
      if (g) {
        var W = t.classList.contains('vertical') ? 1080 : 1280;
        var H = t.classList.contains('vertical') ? 1920 : 720;
        for (var x = 100; x < W; x += 100) { var ex = document.createElement('div'); ex.className = 'cg-label cg-x'; ex.style.left = x + 'px'; ex.textContent = x; g.appendChild(ex); }
        for (var y = 100; y < H; y += 100) { var ey = document.createElement('div'); ey.className = 'cg-label cg-y'; ey.style.top = y + 'px'; ey.textContent = y; g.appendChild(ey); }
      }
    })();
  </script>
</body>
</html>
