<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 09 — summary</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-09-summary { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-09-summary .relay {
      position: absolute; top: 420px; left: 0; right: 0; text-align: center;
      font-size: 92px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.05;
    }
    #scene-09-summary .relay .a { color: var(--accent-2); opacity: 0; display: inline-block; text-shadow: 0 0 50px rgba(125,211,252,0.3); }
    #scene-09-summary .relay .b { position: relative; color: var(--muted); opacity: 0; display: inline-block; }
    #scene-09-summary .relay .b .strike { position: absolute; left: -4%; top: 52%; height: 6px; width: 0; background: var(--danger); border-radius: 3px; }

    #scene-09-summary .narr {
      position: absolute; top: 820px; left: 90px; right: 90px; text-align: center;
      font-size: 64px; font-weight: 300; color: var(--soft); line-height: 1.25; opacity: 0;
    }
    #scene-09-summary .narr b { font-weight: 800; color: var(--fg); }

    #scene-09-summary .steps {
      position: absolute; top: 1240px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px;
    }
    #scene-09-summary .steps .t { font-size: 120px; font-weight: 700; color: var(--accent); opacity: 0; line-height: 0.8; text-shadow: 0 0 36px rgba(37,211,102,0.45); }
    #scene-09-summary .stepcap { position: absolute; top: 1420px; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 500; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-09-summary" data-composition-id="scene-09-summary" data-width="1080" data-height="1920">
    <div class="relay"><span class="a" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2290">a relay —</span><br><span class="b" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2900">not a mailbox<span class="strike" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3280"></span></span></div>
    <div class="narr">the machine, <b>narrating its own delivery</b></div>
    <div class="steps"><span class="t" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="8080">✓</span><span class="t" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="8260" data-sfx-volume="0.42">✓</span><span class="t" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="8440">✓</span></div>
    <div class="stepcap">one step at a time</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-09-summary";
    const S = 44.82; // host data-start; local = global - S

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
    // "a relay" @46.66 -> local 1.84
    tl.fromTo(root + " .relay .a", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 46.66 - S);
    // "not a mailbox" @47.32 -> local 2.50, strike on "mailbox" @47.70 -> local 2.88
    tl.fromTo(root + " .relay .b", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 47.32 - S);
    tl.fromTo(root + " .relay .b .strike", { width: 0 }, { width: "108%", duration: 0.4, ease: "power2.inOut" }, 47.70 - S);
    // "the machine narrating its own delivery" @48.86 -> local 4.04
    tl.fromTo(root + " .narr", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 48.86 - S);
    // "one step at a time" @53.02 -> local 8.20 : ticks step in one at a time
    tl.fromTo(root + " .steps .t", { opacity: 0, scale: 1.4, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "power4.out", stagger: 0.18 }, 52.6 - S);
    tl.fromTo(root + " .stepcap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 53.02 - S);
    // idle
    tl.to(root + " .narr", { y: -6, duration: 1.3, ease: "sine.inOut", repeat: 1, yoyo: true }, 50.0 - S);
    // clear before seam with scene 10
    tl.to([root + " .relay", root + " .narr", root + " .steps", root + " .stepcap"], { opacity: 0, duration: 0.34, ease: "power2.in" }, 53.72 - S);

    window.__timelines["scene-09-summary"] = tl;
  </script>
</body>
</html>
