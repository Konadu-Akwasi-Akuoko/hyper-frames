<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 07 — offline queue</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-07-queue { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-07-queue .hd {
      position: absolute; top: 250px; left: 0; right: 0; text-align: center;
      font-size: 58px; font-weight: 300; color: var(--soft); opacity: 0;
    }
    #scene-07-queue .hd b { font-weight: 800; color: var(--fg); }

    #scene-07-queue .queue { position: absolute; left: 50%; top: 720px; transform: translateX(-50%); width: 560px; display: flex; flex-direction: column; gap: 22px; }
    #scene-07-queue .cell {
      display: flex; align-items: center; gap: 28px; padding: 30px 40px; border-radius: 20px;
      background: var(--panel); border: 3px solid #3a3320; opacity: 0; will-change: transform, opacity;
    }
    #scene-07-queue .cell svg { flex: 0 0 auto; }
    #scene-07-queue .cell .dots { display: flex; gap: 14px; }
    #scene-07-queue .cell .dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--cost); opacity: 0.55; display: block; }
    #scene-07-queue .drop {
      position: absolute; left: 50%; top: 560px; width: 54px; height: 54px; margin-left: -27px;
      border-radius: 50%; background: var(--accent); box-shadow: 0 0 30px 5px rgba(37,211,102,0.6);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-07-queue .timer { position: absolute; left: 0; right: 0; top: 1240px; text-align: center; }
    #scene-07-queue .timer .big {
      font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 200px; line-height: 0.9;
      color: var(--cost); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; opacity: 0;
      text-shadow: 0 0 60px rgba(240,180,41,0.3); will-change: transform, opacity;
    }
    #scene-07-queue .timer .lbl { margin-top: 6px; font-size: 50px; font-weight: 500; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-07-queue" data-composition-id="scene-07-queue" data-width="1080" data-height="1920">
    <div class="hd">if they're <b>offline</b>…</div>
    <div class="drop" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3300"></div>
    <div class="queue">
      <div class="cell c1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="3660" data-sfx-volume="0.42"><svg width="44" height="50" viewBox="0 0 44 50"><rect x="4" y="22" width="36" height="26" rx="5" fill="none" stroke="#f0b429" stroke-width="3"/><path d="M12 22 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#f0b429" stroke-width="3"/></svg><div class="dots"><i></i><i></i><i></i><i></i></div></div>
      <div class="cell c2" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="3900"><svg width="44" height="50" viewBox="0 0 44 50"><rect x="4" y="22" width="36" height="26" rx="5" fill="none" stroke="#f0b429" stroke-width="3"/><path d="M12 22 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#f0b429" stroke-width="3"/></svg><div class="dots"><i></i><i></i><i></i><i></i></div></div>
      <div class="cell c3" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="4140" data-sfx-volume="0.42"><svg width="44" height="50" viewBox="0 0 44 50"><rect x="4" y="22" width="36" height="26" rx="5" fill="none" stroke="#f0b429" stroke-width="3"/><path d="M12 22 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#f0b429" stroke-width="3"/></svg><div class="dots"><i></i><i></i><i></i></div></div>
    </div>
    <div class="timer" data-layout-allow-overflow>
      <div class="big" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="6130">30</div>
      <div class="lbl">days, waiting</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-07-queue";
    const S = 33.52; // host data-start; local = global - S

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
    // "if they're offline" @34.66 -> local 1.14
    tl.fromTo(root + " .hd", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 34.50 - S);
    // "drops into an encrypted queue" @36.28 -> local 2.76 : the dot drops, cells appear
    tl.fromTo(root + " .drop", { opacity: 0, top: 560 }, { opacity: 1, top: 560, duration: 0.2, ease: "power2.out" }, 36.28 - S);
    tl.to(root + " .drop", { top: 740, duration: 0.4, ease: "power2.in" }, 36.42 - S);
    tl.to(root + " .drop", { opacity: 0, scale: 0.4, duration: 0.2, ease: "power2.in" }, 36.82 - S);
    tl.fromTo(root + " .cell.c1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 36.86 - S);
    tl.fromTo(root + " .cell.c2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 37.10 - S);
    tl.fromTo(root + " .cell.c3", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 37.34 - S);
    // "thirty days" @39.38 -> local 5.86 : the countdown
    tl.fromTo(root + " .timer .big", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 39.20 - S);
    tl.fromTo(root + " .timer .lbl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 39.50 - S);
    // queue cells pulse gently (waiting)
    tl.to(root + " .queue", { y: -6, duration: 1.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 38.0 - S);
    // clear before seam with scene 08
    tl.to([root + " .hd", root + " .queue", root + " .timer"], { opacity: 0, duration: 0.36, ease: "power2.in" }, 39.92 - S);

    window.__timelines["scene-07-queue"] = tl;
  </script>
</body>
</html>
