<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 07 — one in, a hundred out</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-07-in-out { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-07-in-out .wrap {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0;
    }
    #scene-07-in-out .side { display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; }
    #scene-07-in-out .fig {
      font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums;
      font-weight: 700; line-height: 0.9; letter-spacing: -0.02em;
    }
    #scene-07-in-out .in .fig { font-size: 240px; color: var(--accent); text-shadow: 0 0 60px rgba(37,211,102,0.3); }
    #scene-07-in-out .out .fig { font-size: 300px; color: var(--cost); text-shadow: 0 0 80px rgba(240,180,41,0.36); }
    #scene-07-in-out .lbl { font-size: 46px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    #scene-07-in-out .in .lbl { color: var(--accent); opacity: 0.8; }
    #scene-07-in-out .out .lbl { color: var(--cost); opacity: 0.85; }
    #scene-07-in-out .arrow { font-size: 90px; color: var(--dim); margin: 18px 0; opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-07-in-out" data-composition-id="scene-07-in-out" data-width="1080" data-height="1920">
    <div class="wrap">
      <div class="side in" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="920"><div class="fig">1</div><div class="lbl">in</div></div>
      <div class="arrow" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1780">&darr;</div>
      <div class="side out" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="2720"><div class="fig">100</div><div class="lbl">out</div></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-07-in-out";
    const S = 36.86; // host data-start; local = global - S

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 0);
    // "One message in" @37.36 -> local 0.50
    tl.fromTo(root + " .in", { opacity: 0, scale: 0.8, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" }, 37.36 - S);
    // "in," @38.30 -> arrow drops
    tl.fromTo(root + " .arrow", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 38.30 - S);
    // "a hundred messages out" @39.08 -> local 2.22 — the explosion of copies
    tl.fromTo(root + " .out", { opacity: 0, scale: 1.25, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power4.out" }, 39.08 - S);
    // idle pulse on the big out figure
    tl.to(root + " .out .fig", { scale: 1.04, duration: 0.7, ease: "sine.inOut", repeat: 1, yoyo: true, overwrite: "auto" }, 39.9 - S);
    // clear before seam with scene 08 (scene-08 host start 40.80; its name punches ~41.88)
    tl.to(root + " .wrap", { opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.in", overwrite: "auto" }, 40.95 - S);

    window.__timelines["scene-07-in-out"] = tl;
  </script>
</body>
</html>
