<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 06 — fan-out: the server multiplies one copy into many</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-06-fanout { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-06-fanout .kick {
      position: absolute; left: 0; right: 0; top: 300px; text-align: center;
      font-size: 50px; font-weight: 700; color: var(--soft);
      letter-spacing: 0.03em; text-transform: uppercase; opacity: 0;
    }
    /* the stage holds the diagram in the title-safe band */
    #scene-06-fanout .stage { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }

    /* member dots arc across the upper-middle */
    #scene-06-fanout .member {
      position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
      background: var(--panel); border: 2px solid var(--accent-2); box-shadow: 0 0 16px rgba(125,211,252,0.32); opacity: 0;
    }
    /* the server node, center */
    #scene-06-fanout .server {
      position: absolute; left: 50%; top: 1180px; transform: translate(-50%,-50%);
      width: 300px; height: 150px; border-radius: 22px; background: var(--panel);
      border: 2px solid var(--border); opacity: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft);
    }
    /* the single inbound packet rising from the bottom */
    #scene-06-fanout .inbound {
      position: absolute; left: 50%; top: 1500px; transform: translate(-50%,-50%);
      width: 110px; height: 76px; border-radius: 14px; background: var(--accent);
      box-shadow: 0 0 28px rgba(37,211,102,0.5); opacity: 0;
    }
    /* outbound copies that spray from the server to each member */
    #scene-06-fanout .copy {
      position: absolute; left: 540px; top: 1180px; width: 30px; height: 30px; margin: -15px 0 0 -15px;
      border-radius: 7px; background: var(--accent-2); box-shadow: 0 0 14px rgba(125,211,252,0.55); opacity: 0;
    }
  </style>
</head>
<body>
  <div id="scene-06-fanout" data-composition-id="scene-06-fanout" data-width="1080" data-height="1920">
    <div class="kick" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1020" data-sfx-volume="0.35">The server multiplies it</div>
    <div class="stage" data-layout-allow-overflow>
      <!-- 7 members in an arc across the top band -->
      <div class="member" style="left:170px;  top:760px;" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3430" data-sfx-volume="0.42"></div>
      <div class="member" style="left:330px;  top:660px;"></div>
      <div class="member" style="left:500px;  top:620px;"></div>
      <div class="member" style="left:680px;  top:640px;"></div>
      <div class="member" style="left:840px;  top:720px;"></div>
      <div class="member" style="left:910px;  top:880px;"></div>
      <div class="member" style="left:200px;  top:920px;"></div>

      <div class="server" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2320">Server</div>
      <div class="inbound" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1820"></div>

      <!-- 7 spray copies, one per member (positioned at server, animated outward) -->
      <div class="copy" data-mx="170" data-my="760" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="5680"></div>
      <div class="copy" data-mx="330" data-my="660"></div>
      <div class="copy" data-mx="500" data-my="620"></div>
      <div class="copy" data-mx="680" data-my="640"></div>
      <div class="copy" data-mx="840" data-my="720"></div>
      <div class="copy" data-mx="910" data-my="880"></div>
      <div class="copy" data-mx="200" data-my="920"></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-06-fanout";
    const S = 28.78; // host data-start; local = global - S

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
    // "The multiplying" @29.40 -> local 0.62
    tl.fromTo(root + " .kick", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 29.40 - S);
    // the single packet rises into the server
    tl.fromTo(root + " .inbound", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", overwrite: "auto" }, 29.60 - S);
    tl.to(root + " .inbound", { top: 1180, duration: 0.7, ease: "power2.inOut" }, 29.90 - S);
    // "happens on the server" @30.70 -> local 1.92 — server lights up green and swallows the packet
    tl.fromTo(root + " .server", { opacity: 0, scale: 0.9, borderColor: "#1e2722" }, { opacity: 1, scale: 1, borderColor: "#25d366", duration: 0.4, ease: "back.out(1.6)", overwrite: "auto" }, 30.70 - S);
    tl.to(root + " .inbound", { opacity: 0, scale: 0.5, duration: 0.25, ease: "power2.in" }, 30.66 - S);
    // "every member of that group" @31.86 -> local 3.08 — the recipients appear
    tl.fromTo(root + " .member", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.06 }, 31.86 - S);
    // "queues a separate copy for each one" @33.96 -> local 5.18 — copies spray out, one per member
    const copies = gsap.utils.toArray(root + " .copy");
    copies.forEach((c, i) => {
      const mx = parseFloat(c.getAttribute("data-mx"));
      const my = parseFloat(c.getAttribute("data-my"));
      const at = (33.96 - S) + i * 0.16;
      tl.fromTo(c, { opacity: 0, x: 0, y: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, at);
      tl.to(c, { x: mx - 540, y: my - 1180, duration: 0.5, ease: "power2.inOut" }, at);
    });
    // clear before seam with scene 07 (scene-07 host start 36.86; its "1" legible ~37.36)
    tl.to([root + " .kick", root + " .stage"], { opacity: 0, duration: 0.3, ease: "power2.in", overwrite: "auto" }, 36.98 - S);

    window.__timelines["scene-06-fanout"] = tl;
  </script>
</body>
</html>
