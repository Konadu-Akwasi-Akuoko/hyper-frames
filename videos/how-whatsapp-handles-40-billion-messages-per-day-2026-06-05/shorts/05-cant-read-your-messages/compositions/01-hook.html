<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 01 — hook: WhatsApp can't read your messages</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-01-hook { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-01-hook .stack {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0;
    }

    /* The server's eye — watching, then blinded */
    #scene-01-hook .eye { position: relative; width: 196px; height: 196px; margin-bottom: 70px; opacity: 0; will-change: transform, opacity; }
    #scene-01-hook .eye svg { width: 100%; height: 100%; overflow: visible; }
    #scene-01-hook .eye .lid { stroke: var(--danger); stroke-width: 11; stroke-linecap: round; opacity: 0; transform-origin: 30px 64px; }
    #scene-01-hook .eye .iris { fill: var(--accent-2); will-change: opacity; }
    #scene-01-hook .eye .ring { fill: none; stroke: var(--soft); stroke-width: 8; }

    /* The chat bubble that snaps shut behind a lock */
    #scene-01-hook .bubble {
      position: relative; width: 440px; padding: 40px 46px 46px; border-radius: 34px 34px 34px 8px;
      background: var(--panel); border: 3px solid var(--accent); box-shadow: 0 0 46px rgba(37,211,102,0.18);
      display: flex; flex-direction: column; gap: 22px; opacity: 0; will-change: transform, opacity;
    }
    #scene-01-hook .bar { height: 26px; border-radius: 13px; background: linear-gradient(90deg, rgba(37,211,102,0.55), rgba(37,211,102,0.22)); opacity: 0; transform-origin: left center; }
    #scene-01-hook .bar.b2 { width: 78%; }
    #scene-01-hook .bar.b3 { width: 54%; }
    /* the lock that engages over the bubble */
    #scene-01-hook .lock {
      position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px;
      display: flex; align-items: center; justify-content: center; opacity: 0; will-change: transform, opacity;
    }
    #scene-01-hook .lock svg { width: 100%; height: 100%; }
    #scene-01-hook .lock .body { fill: var(--accent); }
    #scene-01-hook .lock .shackle { fill: none; stroke: var(--accent); stroke-width: 13; }

    #scene-01-hook .head {
      margin-top: 78px; font-size: 86px; font-weight: 800; line-height: 1.04; color: var(--fg);
      letter-spacing: -0.02em; opacity: 0; max-width: 900px; will-change: transform, opacity;
    }
    #scene-01-hook .head .hot { color: var(--fg); will-change: text-shadow; }
    #scene-01-hook .head .lit { display: block; margin-top: 16px; font-size: 64px; font-weight: 900; color: var(--danger); text-shadow: 0 0 48px rgba(255,107,93,0.34); opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-01-hook" data-composition-id="scene-01-hook" data-width="1080" data-height="1920">
    <div class="stack">
      <div class="eye" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1060">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <path class="ring" d="M18 100 Q100 26 182 100 Q100 174 18 100 Z"></path>
          <circle class="iris" cx="100" cy="100" r="34"></circle>
          <line class="lid" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3200" x1="30" y1="64" x2="170" y2="136"></line>
        </svg>
      </div>
      <div class="bubble" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="540">
        <div class="bar b1" style="width:92%"></div>
        <div class="bar b2"></div>
        <div class="bar b3"></div>
        <div class="lock" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="2660" data-sfx-volume="0.35" data-sfx-hook="true">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="shackle" d="M30 50 V36 a20 20 0 0 1 40 0 V50"></path>
            <rect class="body" x="24" y="48" width="52" height="42" rx="9"></rect>
          </svg>
        </div>
      </div>
      <div class="head"><span class="hot">can't</span> read your messages<span class="lit">Literally can't.</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-01-hook";
    const S = 0; // host data-start; scene-local = global - S

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.inOut" }, 0);

    // "WhatsApp" @0.12 — the bubble of messages appears
    tl.fromTo(root + " .bubble", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, 0.12);
    tl.fromTo(root + " .bar.b1", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.26, ease: "power2.out" }, 0.30);
    // "can't" @0.74 — the watching eye opens above
    tl.fromTo(root + " .eye", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.40, ease: "back.out(1.8)" }, 0.66);
    tl.fromTo(root + " .head", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 0.74);
    // "read your messages" @1.20–1.66 — the rest of the message bars fill in
    tl.fromTo(root + " .bar.b2", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.24, ease: "power2.out" }, 1.20);
    tl.fromTo(root + " .bar.b3", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.24, ease: "power2.out" }, 1.66);
    // "Literally" @2.40 — the lock SNAPS shut over the bubble (green = encryption engaged)
    tl.fromTo(root + " .lock", { opacity: 0, scale: 1.9, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.30, ease: "back.out(2.4)" }, 2.36);
    tl.to(root + " .bubble", { boxShadow: "0 0 70px rgba(37,211,102,0.4)", duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.40);
    // "can't" @2.96 — the eye is BLINDED: iris dims, the danger lid slashes across
    tl.to(root + " .eye .iris", { opacity: 0.12, duration: 0.30, ease: "power2.in" }, 2.86);
    tl.fromTo(root + " .eye .lid", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.28, ease: "power3.out", svgOrigin: "30 64" }, 2.92);
    tl.fromTo(root + " .head .lit", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 2.96);
    tl.to(root + " .head .hot", { textShadow: "0 0 40px rgba(255,107,93,0.5)", duration: 0.3, ease: "sine.inOut" }, 2.96);
    // idle drift so nothing sits still
    tl.to(root + " .eye", { y: -8, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);

    window.__timelines["scene-01-hook"] = tl;
  </script>
</body>
</html>
