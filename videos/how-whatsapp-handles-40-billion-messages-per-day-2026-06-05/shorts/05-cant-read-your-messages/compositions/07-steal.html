<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 07 — steal one key, unlock exactly one message, nothing else</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-07-steal { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-07-steal .head { position: absolute; top: 470px; left: 0; right: 0; text-align: center;
      font-size: 80px; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; opacity: 0; will-change: transform, opacity; }
    #scene-07-steal .head .v { font-weight: 800; }

    /* the field of locked messages — all green, all still; one gets stolen */
    #scene-07-steal .field { position: absolute; top: 690px; left: 0; right: 0; margin: 0 auto;
      width: 560px; display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; }
    #scene-07-steal .msg { position: relative; width: 160px; height: 122px; border-radius: 18px;
      background: var(--panel); border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center;
      opacity: 0; will-change: transform, opacity; }
    #scene-07-steal .msg .lock { width: 58px; height: 70px; }
    #scene-07-steal .msg .lock svg { width: 100%; height: 100%; overflow: visible; }
    #scene-07-steal .msg .shackle { fill: none; stroke: var(--accent); stroke-width: 7; transform-origin: 18px 30px; }
    #scene-07-steal .msg .lbody { fill: none; stroke: var(--accent); stroke-width: 7; }
    /* the stolen message flips to danger */
    #scene-07-steal .msg.stolen { border-color: var(--accent); }
    #scene-07-steal .msg.stolen .lock { will-change: transform; }

    /* the stolen key, danger-red, that snaps down onto the stolen message */
    #scene-07-steal .stolenkey { position: absolute; left: 481px; top: 612px; width: 118px; height: 118px; opacity: 0; will-change: transform, opacity; }
    #scene-07-steal .stolenkey svg { width: 100%; height: 100%; overflow: visible; }
    #scene-07-steal .stolenkey .bow { fill: none; stroke: var(--danger); stroke-width: 13; }
    #scene-07-steal .stolenkey .stem { stroke: var(--danger); stroke-width: 13; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(255,107,93,0.5)); }

    /* the captions */
    #scene-07-steal .cap { position: absolute; top: 1210px; left: 0; right: 0; text-align: center;
      font-size: 58px; font-weight: 700; color: var(--soft); letter-spacing: -0.01em; opacity: 0; will-change: transform, opacity; }
    #scene-07-steal .cap .one { color: var(--danger); font-weight: 800; }
    #scene-07-steal .nothing { position: absolute; top: 1340px; left: 0; right: 0; text-align: center;
      font-size: 96px; font-weight: 900; color: var(--fg); letter-spacing: 0.02em; opacity: 0; will-change: transform, opacity; text-shadow: 0 0 44px rgba(233,237,235,0.12); }
  </style>
</head>
<body>
  <div id="scene-07-steal" data-composition-id="scene-07-steal" data-width="1080" data-height="1920">
    <div class="head"><span class="v">Steal</span> one key&hellip;</div>

    <div class="field" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="860" data-sfx-volume="0.35">
      <div class="msg"><div class="lock"><svg viewBox="0 0 60 70"><path class="shackle" d="M18 30 V20 a12 12 0 0 1 24 0 V30"></path><rect class="lbody" x="11" y="30" width="38" height="32" rx="6"></rect></svg></div></div>
      <div class="msg stolen" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1780" data-sfx-volume="0.35"><div class="lock"><svg viewBox="0 0 60 70"><path class="shackle" d="M18 30 V20 a12 12 0 0 1 24 0 V30"></path><rect class="lbody" x="11" y="30" width="38" height="32" rx="6"></rect></svg></div></div>
      <div class="msg"><div class="lock"><svg viewBox="0 0 60 70"><path class="shackle" d="M18 30 V20 a12 12 0 0 1 24 0 V30"></path><rect class="lbody" x="11" y="30" width="38" height="32" rx="6"></rect></svg></div></div>
      <div class="msg"><div class="lock"><svg viewBox="0 0 60 70"><path class="shackle" d="M18 30 V20 a12 12 0 0 1 24 0 V30"></path><rect class="lbody" x="11" y="30" width="38" height="32" rx="6"></rect></svg></div></div>
      <div class="msg"><div class="lock"><svg viewBox="0 0 60 70"><path class="shackle" d="M18 30 V20 a12 12 0 0 1 24 0 V30"></path><rect class="lbody" x="11" y="30" width="38" height="32" rx="6"></rect></svg></div></div>
      <div class="msg"><div class="lock"><svg viewBox="0 0 60 70"><path class="shackle" d="M18 30 V20 a12 12 0 0 1 24 0 V30"></path><rect class="lbody" x="11" y="30" width="38" height="32" rx="6"></rect></svg></div></div>
    </div>

    <div class="stolenkey" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1620"><svg viewBox="0 0 118 118"><circle class="bow" cx="40" cy="40" r="26"></circle><line class="stem" x1="58" y1="58" x2="104" y2="104"></line><line class="stem" x1="104" y1="104" x2="104" y2="80"></line><line class="stem" x1="104" y1="104" x2="80" y2="104"></line></svg></div>

    <div class="cap" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2380">unlock exactly <span class="one">one message</span></div>
    <div class="nothing" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="3640">Nothing else.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-07-steal";
    const S = 34.10; // host data-start; scene-local = global - S

    // root crossfade during the seam overlap; content held to 0.50 (global 34.60, "Steal")
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.inOut" }, 0);

    // "Steal one key" @34.60 -> local 0.50 — the head + the field of six green-locked messages snap in
    tl.fromTo(root + " .head", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.50);
    tl.fromTo(root + " .msg", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)", stagger: 0.05 }, 0.56);

    // "and you" @35.40 -> local 1.30 — the danger-red stolen key drops in from above
    tl.fromTo(root + " .stolenkey", { opacity: 0, y: -50, rotation: -18 }, { opacity: 1, y: 0, rotation: 0, duration: 0.32, ease: "power3.in" }, 1.30);
    // "unlock" @35.70 -> local 1.60 — the one message flips to danger, blooms, its lock springs open
    tl.to(root + " .msg.stolen", { borderColor: "var(--danger)", duration: 0.18, ease: "power2.out" }, 1.60);
    tl.to(root + " .msg.stolen .shackle, " + root + " .msg.stolen .lbody", { stroke: "var(--danger)", duration: 0.18, ease: "power2.out" }, 1.60);
    tl.fromTo(root + " .msg.stolen", { scale: 1 }, { scale: 1.12, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, 1.60);
    tl.to(root + " .msg.stolen .shackle", { rotation: -38, x: -6, duration: 0.22, ease: "back.out(2)" }, 1.66);

    // "exactly one message" @36.22-37.22 -> local 2.12-3.12 — the caption lands, "one message" in danger
    tl.fromTo(root + " .cap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 2.04);
    tl.to(root + " .cap .one", { textShadow: "0 0 30px rgba(255,107,93,0.6)", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.60);

    // "Nothing else." @37.52 -> local 3.42 — hard snap, then a slight scale-down settle (definitive punctuation)
    tl.fromTo(root + " .nothing", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1.04, duration: 0.22, ease: "power4.out" }, 3.42);
    tl.to(root + " .nothing", { scale: 1, duration: 0.2, ease: "power2.inOut" }, 3.64);
    // a faint idle on the head only — the locked field stays perfectly still (its stillness is the argument)
    tl.to(root + " .head", { y: -6, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);

    window.__timelines["scene-07-steal"] = tl;
  </script>
</body>
</html>
