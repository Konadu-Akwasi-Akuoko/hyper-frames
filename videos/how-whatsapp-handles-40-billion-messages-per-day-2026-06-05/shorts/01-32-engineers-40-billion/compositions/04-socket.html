<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 04 — one persistent socket</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-04-socket { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-04-socket .phone {
      position: absolute; left: 50%; top: 430px; transform: translateX(-50%);
      width: 230px; height: 380px; border-radius: 36px;
      border: 4px solid var(--dim); background: rgba(16,22,19,0.6); opacity: 0;
      will-change: opacity, transform;
    }
    #scene-04-socket .phone::after {
      content: ""; position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
      width: 70px; height: 8px; border-radius: 4px; background: var(--dim);
    }
    #scene-04-socket .phone .scr {
      position: absolute; inset: 46px 20px 20px; border-radius: 14px;
      background: rgba(125,211,252,0.04);
    }

    #scene-04-socket .pipe {
      position: absolute; left: 50%; top: 810px; transform: translateX(-50%);
      width: 18px; height: 480px; transform-origin: top center;
      background: linear-gradient(to bottom, rgba(125,211,252,0.95), rgba(125,211,252,0.55));
      border-radius: 9px; opacity: 0; transform: translateX(-50%) scaleY(0);
      box-shadow: 0 0 24px rgba(125,211,252,0.35); will-change: transform, opacity, box-shadow;
    }

    #scene-04-socket .server {
      position: absolute; left: 50%; top: 1300px; transform: translateX(-50%);
      width: 380px; height: 240px; border-radius: 20px;
      background: var(--panel); border: 2px solid var(--accent-2); opacity: 0;
      box-shadow: 0 0 30px rgba(125,211,252,0.08); will-change: opacity, transform;
      display: flex; align-items: center; justify-content: center;
    }
    #scene-04-socket .server .slabel {
      font-family: "JetBrains Mono", monospace; font-size: 34px; color: var(--soft); letter-spacing: 0.06em;
    }

    #scene-04-socket .cap {
      position: absolute; left: 90px; right: 90px; top: 1610px; text-align: center;
      font-size: 52px; font-weight: 700; color: var(--fg); opacity: 0; line-height: 1.25;
    }
    #scene-04-socket .cap .hi { color: var(--accent-2); }
    #scene-04-socket .cap .sub { display: block; margin-top: 12px; font-size: 38px; font-weight: 400; color: var(--soft); }
  </style>
</head>
<body>
  <div id="scene-04-socket" data-composition-id="scene-04-socket" data-width="1080" data-height="1920">
    <div class="phone" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1000" data-sfx-volume="0.42"><div class="scr"></div></div>
    <div class="pipe" data-layout-allow-overflow data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3600"></div>
    <div class="server" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1400"><div class="slabel">server</div></div>
    <div class="cap" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="4350"><span class="hi">one persistent connection</span><span class="sub">opened once · kept alive for hours</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-04-socket";
    // host data-start = 15.30, scene-local = global - 15.30.

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0);

    // "It opens" @0.50 — phone, then server settles in
    tl.fromTo(root + " .phone", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.50);
    tl.fromTo(root + " .server", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.90);

    // "one persistent connection" — pipe draws down 2.30 → fully lit at "connection" 3.72
    tl.fromTo(root + " .pipe", { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 1.3, ease: "power2.inOut" }, 2.30);
    // phone + server go live (sky) as the socket completes
    tl.to(root + " .phone", { borderColor: "#7dd3fc", duration: 0.4, ease: "power2.out" }, 3.72);
    tl.to(root + " .phone .scr", { background: "rgba(125,211,252,0.10)", duration: 0.4 }, 3.72);

    // caption "one persistent connection / opened once · kept alive for hours" @3.72
    tl.fromTo(root + " .cap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.80);

    // "kept it alive for hours" — the pipe breathes (a held, living connection) 5.38+
    tl.to(root + " .pipe", { boxShadow: "0 0 40px rgba(125,211,252,0.6)", duration: 0.7, ease: "sine.inOut", repeat: 3, yoyo: true }, 5.10);

    // idle drift on the whole stack
    tl.to([root + " .phone", root + " .server"], { y: "+=6", duration: 1.5, ease: "sine.inOut", repeat: 1, yoyo: true }, 4.2);

    // clear before seam (scene end local 7.46)
    tl.to([root + " .phone", root + " .pipe", root + " .server", root + " .cap"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 7.06);

    window.__timelines["scene-04-socket"] = tl;
  </script>
</body>
</html>
