<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 01 — hook</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-01-hook { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-01-hook .stack {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0; text-align: center;
    }
    #scene-01-hook .team { display: flex; flex-direction: column; align-items: center; }
    #scene-01-hook .n32 {
      font-family: "JetBrains Mono", monospace; font-weight: 700;
      font-size: 300px; line-height: 0.9; color: var(--accent-2);
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-01-hook .team .lbl {
      margin-top: 6px; font-size: 46px; font-weight: 500; color: var(--muted);
      letter-spacing: 0.26em; text-transform: uppercase; opacity: 0;
    }
    #scene-01-hook .moved {
      margin: 44px 0; font-size: 52px; font-weight: 300; color: var(--soft);
      opacity: 0;
    }
    #scene-01-hook .msgs { display: flex; flex-direction: column; align-items: center; }
    #scene-01-hook .bignum {
      font-family: "JetBrains Mono", monospace; font-weight: 700;
      font-size: 220px; line-height: 0.9; color: var(--fg);
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
      display: flex; align-items: baseline; gap: 20px;
    }
    #scene-01-hook .bignum .n40 { opacity: 0; will-change: transform, opacity; }
    #scene-01-hook .bignum .bil {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 130px;
      color: var(--accent); opacity: 0; will-change: transform, opacity;
    }
    #scene-01-hook .mad {
      margin-top: 18px; font-size: 50px; font-weight: 500; color: var(--soft);
      letter-spacing: 0.01em; opacity: 0;
    }
    #scene-01-hook .bloom {
      position: absolute; left: 50%; top: 62%; width: 1200px; height: 1200px;
      transform: translate(-50%, -50%) scale(0.2);
      border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(37,211,102,0.22) 0%, rgba(37,211,102,0) 60%);
      filter: blur(34px); will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-01-hook" data-composition-id="scene-01-hook" data-width="1080" data-height="1920">
    <div class="bloom" data-layout-allow-overflow></div>
    <div class="stack">
      <div class="team">
        <div class="n32" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="620" data-sfx-volume="0.42">32</div>
        <div class="lbl">engineers</div>
      </div>
      <div class="moved">moved</div>
      <div class="msgs">
        <div class="bignum"><span class="n40">40</span><span class="bil" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="2260" data-sfx-hook="true">BILLION</span></div>
        <div class="mad">messages a day</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-01-hook";
    // host data-start = 0, scene-local time == global transcript time.

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0);

    // "32" @0.12, "engineers" @0.56
    tl.fromTo(root + " .n32", { opacity: 0, scale: 1.6, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.12);
    tl.fromTo(root + " .lbl", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.56);
    // "moved" @1.24
    tl.fromTo(root + " .moved", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.24);
    // "40" @1.56, "billion" @1.86 — detonation
    tl.fromTo(root + " .n40", { opacity: 0, scale: 1.55 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 1.56);
    tl.fromTo(root + " .bil", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 1.86);
    tl.fromTo(root + " .bloom", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1.0, duration: 0.8, ease: "power2.out" }, 1.90);
    tl.to(root + " .bloom", { opacity: 0.4, scale: 1.12, duration: 1.2, ease: "sine.out" }, 2.7);
    tl.to(root + " .bil", { textShadow: "0 0 44px rgba(37,211,102,0.55)", duration: 0.35, ease: "power2.out" }, 1.98);
    // "messages a day" @2.22
    tl.fromTo(root + " .mad", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.22);

    // gentle idle so nothing sits still
    tl.to(root + " .stack", { y: -8, duration: 1.3, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6);

    // clear foreground before the seam so it doesn't bleed onto scene 02
    tl.to(root + " .stack", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 3.18);
    tl.to(root + " .bloom", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.18);

    window.__timelines["scene-01-hook"] = tl;
  </script>
</body>
</html>
