<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 06 — one process per phone</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-06-process { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    #scene-06-process .stack {
      position: absolute; left: 90px; right: 90px; top: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    }
    #scene-06-process .reject { position: relative; opacity: 0; }
    #scene-06-process .reject .t {
      font-size: 64px; font-weight: 500; color: var(--muted); white-space: nowrap;
    }
    #scene-06-process .reject .x {
      position: absolute; left: -10px; top: 50%; width: 0; height: 7px; margin-top: -3px;
      background: var(--danger); border-radius: 4px; box-shadow: 0 0 14px rgba(255,107,93,0.5);
    }

    #scene-06-process .affirm {
      margin-top: 24px; text-align: center; opacity: 0; will-change: transform, opacity;
    }
    #scene-06-process .affirm .big {
      font-size: 96px; font-weight: 900; color: var(--fg); line-height: 1.06; letter-spacing: -0.01em;
    }
    #scene-06-process .affirm .big .pp { color: var(--accent); }
    #scene-06-process .affirm .sub {
      margin-top: 22px; font-size: 42px; font-weight: 400; color: var(--soft);
    }
    #scene-06-process .cell {
      display: inline-block; width: 34px; height: 34px; border-radius: 9px; vertical-align: middle;
      margin: 0 6px -4px 6px; background: radial-gradient(circle at 40% 35%, #5ce08e, var(--accent));
      box-shadow: 0 0 18px rgba(37,211,102,0.6); opacity: 0; will-change: opacity, transform;
    }
  </style>
</head>
<body>
  <div id="scene-06-process" data-composition-id="scene-06-process" data-width="1080" data-height="1920">
    <div class="stack">
      <div class="reject r1" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="900" data-sfx-volume="0.35"><span class="t">Not a thread.</span><span class="x" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1170"></span></div>
      <div class="reject r2" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1660"><span class="t">Not a request handler.</span><span class="x" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2270"></span></div>
      <div class="affirm" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="3190" data-sfx-volume="0.42">
        <div class="big">One <span class="cell"></span> isolated <span class="pp" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="4810">process</span><br>per phone.</div>
        <div class="sub">alive as long as you're connected</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-06-process";
    // host data-start = 28.66, scene-local = global - 28.66.

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0);

    // "Not a thread" @0.50 → strike @0.78
    tl.fromTo(root + " .r1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.50);
    tl.fromTo(root + " .r1 .x", { width: 0 }, { width: 430, duration: 0.35, ease: "power2.inOut" }, 0.82);
    // "not a request handler" @1.26 → strike @1.88
    tl.fromTo(root + " .r2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.26);
    tl.fromTo(root + " .r2 .x", { width: 0 }, { width: 640, duration: 0.35, ease: "power2.inOut" }, 1.92);

    // "one isolated little process per phone" — affirm @2.64
    tl.fromTo(root + " .affirm", { opacity: 0, y: 26, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 2.64);
    tl.fromTo(root + " .cell", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 3.06);
    // "process" ignites green @4.46
    tl.fromTo(root + " .affirm .pp", { textShadow: "0 0 0 rgba(37,211,102,0)" }, { textShadow: "0 0 30px rgba(37,211,102,0.6)", duration: 0.35, ease: "power2.out" }, 4.46);
    // "alive as long as you're connected" sub @5.52
    tl.fromTo(root + " .affirm .sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.52);

    // idle
    tl.to(root + " .affirm", { y: -7, duration: 1.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 4.0);
    tl.to(root + " .cell", { scale: 1.12, duration: 0.7, ease: "sine.inOut", repeat: 2, yoyo: true }, 4.2);

    // clear before seam (scene end local 6.78)
    tl.to(root + " .stack", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 6.38);

    window.__timelines["scene-06-process"] = tl;
  </script>
</body>
</html>
