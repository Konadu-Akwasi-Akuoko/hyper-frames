<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene 08 — a supervisor spawns a fresh, clean copy</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
    #scene-08-supervisor { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }

    /* the supervisor node, watching */
    #scene-08-supervisor .sup {
      position: absolute; left: 50%; top: 560px; transform: translate(-50%,0); opacity: 0;
      padding: 22px 50px; border-radius: 20px; background: rgba(125,211,252,0.07);
      border: 2px solid var(--accent-2); box-shadow: 0 0 50px rgba(125,211,252,0.22);
      font-family: "JetBrains Mono", monospace; font-size: 48px; font-weight: 500; color: var(--accent-2);
    }
    /* connector from supervisor down to the slot */
    #scene-08-supervisor .link {
      position: absolute; left: 50%; top: 678px; transform: translateX(-50%); transform-origin: top center;
      width: 3px; height: 300px; background: linear-gradient(var(--accent-2), rgba(125,211,252,0.15));
      opacity: 0; scale: 1 0;
    }
    /* the worker row with one crashed slot */
    #scene-08-supervisor .row {
      position: absolute; left: 50%; top: 1080px; transform: translate(-50%,0);
      display: flex; gap: 30px;
    }
    #scene-08-supervisor .dot {
      width: 150px; height: 150px; border-radius: 24px; background: rgba(37,211,102,0.10);
      border: 3px solid var(--accent); opacity: 0;
    }
    #scene-08-supervisor .dot.slot {
      background: transparent; border-color: var(--dim); border-style: dashed; box-shadow: none;
    }
    #scene-08-supervisor .dot.fresh {
      box-shadow: 0 0 56px rgba(37,211,102,0.55); background: rgba(37,211,102,0.16);
    }
    #scene-08-supervisor .caption {
      position: absolute; left: 0; right: 0; top: 1340px; text-align: center; opacity: 0;
      font-size: 52px; font-weight: 700; color: var(--fg);
    }
    #scene-08-supervisor .caption .em { color: var(--accent); }
  </style>
</head>
<body>
  <div id="scene-08-supervisor" data-composition-id="scene-08-supervisor" data-width="1080" data-height="1920">
    <div class="sup" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="800" data-sfx-volume="0.35"></div>
    <div class="link" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1700"></div>
    <div class="row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot slot" id="slot" data-sfx-hook="true" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="2460" data-sfx-volume="0.35"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="caption" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2800">spawns a <span class="em">fresh, clean copy</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-08-supervisor";
    const S = 39.10; // local = global - S

    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.inOut" }, 0);
    // "A supervisor notices." supervisor@0.60 notices@1.24
    tl.fromTo(root + " .sup", { opacity: 0, y: -16, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)", overwrite: "auto" }, 0.40);
    // the worker row (with the dashed empty slot) present beneath
    tl.fromTo(root + " .dot", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power2.out", stagger: 0.05, overwrite: "auto" }, 0.55);
    // "notices" — the supervisor pulses + the link draws down to the slot @1.24
    tl.to(root + " .sup", { boxShadow: "0 0 86px rgba(125,211,252,0.5)", duration: 0.3, ease: "power2.inOut", yoyo: true, repeat: 1, overwrite: "auto" }, 1.14);
    tl.fromTo(root + " .link", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.inOut", overwrite: "auto" }, 1.30);
    // "spawns a fresh, clean copy" spawns@2.00 copy@3.18 — green copy fills the slot
    tl.call(() => { const s = document.getElementById("slot"); if (s) { s.classList.remove("slot"); s.classList.add("fresh"); } }, [], 2.00);
    tl.fromTo("#slot", { scale: 0.4, opacity: 0.2 }, { scale: 1, opacity: 1, duration: 0.46, ease: "back.out(2)", overwrite: "auto" }, 2.00);
    tl.fromTo(root + " .caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", overwrite: "auto" }, 2.40);
    // "the other million never even feel it" — calm idle drift, no flicker
    tl.to(root + " .row", { y: -6, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1, overwrite: "auto" }, 4.0);

    window.__timelines["scene-08-supervisor"] = tl;
  </script>
</body>
</html>
