<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 88 — The leverage wasn't an accident. It was the whole point, and it wasn't free either</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-88-lev { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-88-lev .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-88-lev .hero {
      position: absolute; left: 0; right: 0; top: 308px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 100px; line-height: 1;
      color: var(--accent); letter-spacing: -0.03em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }

    #scene-88-lev .anti {
      position: absolute; left: 0; right: 0; top: 470px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 52px;
      color: var(--soft); letter-spacing: -0.012em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-88-lev .acc { position: relative; display: inline-block; color: var(--muted); }
    #scene-88-lev .acc .strike {
      position: absolute; left: -4px; right: -4px; top: 54%; height: 5px; border-radius: 3px;
      background: var(--danger); box-shadow: 0 0 10px rgba(255,107,93,0.5);
      transform: scaleX(0); transform-origin: left center; will-change: transform;
    }
    #scene-88-lev .wp { color: var(--accent); font-weight: 800; opacity: 0; will-change: opacity, text-shadow; }

    #scene-88-lev .cost {
      position: absolute; left: 0; right: 0; top: 588px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 58px;
      color: var(--cost); letter-spacing: -0.015em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
  </style>
</head>
<body>
  <div id="scene-88-lev" data-composition-id="scene-88-lev" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="hero" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500" data-sfx-volume="0.42">leverage</div>

      <div class="anti">not an <span class="acc">accident<span class="strike" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1880" data-sfx-volume="0.42"></span></span> &mdash; <span class="wp" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3160" data-sfx-volume="0.35">the whole point</span></div>

      <div class="cost" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4700" data-sfx-volume="0.42">and it wasn't free</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-88-lev";

    // Host data-start = 632.46 → scene-local = global − 632.46. Chunk first word "The" 632.96 = local 0.50.

    // Entrance crossfade over scene 87's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "The leverage" 632.96→633.13 (local 0.50→0.67) — the concept
    tl.fromTo(root + " .hero", { opacity: 0, y: 14, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 0.50);
    tl.fromTo(root + " .hero", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 36px rgba(37,211,102,0.4)", duration: 0.5, ease: "power2.out" }, 0.72);

    // "wasn't an accident." 633.71→634.34 (local 1.25→1.88) — the negation
    tl.fromTo(root + " .anti", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 1.25);
    tl.fromTo(root + " .acc .strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.in" }, 1.88);

    // "It was the whole point," 635.26→635.88 (local 2.80→3.42) — the affirmation
    tl.fromTo(root + " .wp", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.80);
    tl.fromTo(root + " .wp", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 24px rgba(37,211,102,0.55)", duration: 0.4, ease: "power2.out" }, 3.16);

    // "and it wasn't free either." 636.46→637.44 (local 4.00→4.98) — the cost
    tl.fromTo(root + " .cost", { opacity: 0, y: 14, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 4.40);
    tl.fromTo(root + " .cost", { textShadow: "0 0 0px rgba(240,180,41,0)" }, { textShadow: "0 0 30px rgba(240,180,41,0.45)", duration: 0.5, ease: "power2.out" }, 4.7);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 5.2);

    window.__timelines["scene-88-lev"] = tl;
  </script>
</body>
</html>
