<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 80 — around 550 servers, over 11,000 CPU cores, 147 million phones connected at peak</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-80-stats { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-80-stats .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-80-stats .card {
      position: absolute; top: 400px; width: 480px; height: 268px;
      border-radius: 22px; border: 1.6px solid var(--border); background: rgba(255,255,255,0.018);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-80-stats .c1 { left: 200px; }
    #scene-80-stats .c2 { left: 720px; }
    #scene-80-stats .c3 { left: 1240px; border-color: rgba(37,211,102,0.45); }

    #scene-80-stats .card .val {
      position: absolute; left: 0; right: 0; top: 64px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; line-height: 1; letter-spacing: -0.025em;
    }
    #scene-80-stats .c1 .val, #scene-80-stats .c2 .val { font-size: 88px; color: var(--accent-2); }
    #scene-80-stats .c3 .val { font-size: 100px; color: var(--accent); will-change: text-shadow; }

    #scene-80-stats .card .lbl {
      position: absolute; left: 0; right: 0; top: 184px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 26px;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    #scene-80-stats .c3 .lbl { color: var(--accent); }
    #scene-80-stats .card .sub {
      position: absolute; left: 0; right: 0; top: 222px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 22px; color: var(--muted);
    }

    #scene-80-stats .peak {
      position: absolute; left: 1392px; top: 372px;
      padding: 7px 18px; border-radius: 999px; border: 1.4px solid rgba(240,180,41,0.5);
      background: rgba(240,180,41,0.1); white-space: nowrap;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px;
      color: var(--cost); letter-spacing: 0.08em;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-80-stats" data-composition-id="scene-80-stats" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="card c1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="1140" data-sfx-volume="0.35">
        <div class="val">&asymp;550</div>
        <div class="lbl">servers</div>
      </div>

      <div class="card c2" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="3640" data-sfx-volume="0.35">
        <div class="val">11,000+</div>
        <div class="lbl">CPU cores</div>
      </div>

      <div class="card c3" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="6580" data-sfx-volume="0.35">
        <div class="val">147M</div>
        <div class="lbl">phones</div>
        <div class="sub">connected at once</div>      </div>
      <div class="peak" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="10040" data-sfx-volume="0.42">AT PEAK</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-80-stats";

    // Host data-start = 587.54 → scene-local = global − 587.54. Chunk first word "around" 588.04 = local 0.50.

    // Entrance crossfade over scene 79's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "around 550 servers" 588.04→589.50 (local 0.50→1.96) — first card
    tl.fromTo(root + " .c1", { opacity: 0, y: 22, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 1.14);

    // "over 11,000 CPU cores" 590.92→592.44 (local 3.38→4.90) — second card
    tl.fromTo(root + " .c2", { opacity: 0, y: 22, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 3.64);

    // "and 147 million phones connected at once" 593.63→596.34 (local 6.09→8.80) — climax card
    tl.fromTo(root + " .c3", { opacity: 0, y: 22, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.54, ease: "back.out(1.4)" }, 6.58);
    tl.fromTo(root + " .c3 .val", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 40px rgba(37,211,102,0.5)", duration: 0.5, ease: "power2.out" }, 6.9);

    // "at peak," 597.58 (local 10.04) — the peak badge
    tl.fromTo(root + " .peak", { opacity: 0, scale: 0.7, y: 6 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 10.04);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 8.4);

    window.__timelines["scene-80-stats"] = tl;
  </script>
</body>
</html>
