<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 59 — they didn't just rent the hardware</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-59-rent { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-59-rent .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-59-rent .server {
      position: absolute; left: 50%; top: 286px; margin-left: -126px; width: 252px; height: 290px;
      background: var(--panel); border: 1.7px solid #2b3a44; border-radius: 15px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-59-rent .server .slot { position: absolute; left: 26px; right: 26px; height: 30px; border: 1.4px solid #243843; border-radius: 6px; }
    #scene-59-rent .server .s1 { top: 28px; } #scene-59-rent .server .s2 { top: 72px; } #scene-59-rent .server .s3 { top: 116px; }
    #scene-59-rent .server .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); right: 40px; }
    #scene-59-rent .server .slbl {
      position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 20px;
      color: var(--accent-2); letter-spacing: 0.16em; text-transform: uppercase;
    }

    /* the OWNED stamp slammed across it */
    #scene-59-rent .stamp {
      position: absolute; left: 50%; top: 388px; margin-left: -130px; width: 260px; padding: 12px 0; text-align: center;
      border: 3.5px solid var(--accent); border-radius: 12px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 44px;
      color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;
      background: rgba(37,211,102,0.06);
      opacity: 0; transform: scale(1.6) rotate(-13deg); transform-origin: center center;
      will-change: transform, opacity, filter;
    }

    #scene-59-rent .cap {
      position: absolute; left: 0; right: 0; top: 656px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 52px;
      color: var(--soft); letter-spacing: -0.012em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-59-rent .cap .rwrap { position: relative; display: inline-block; }
    #scene-59-rent .cap .rent { color: var(--muted); will-change: color; }
    #scene-59-rent .cap .strike {
      position: absolute; left: -6px; top: 52%; height: 5px; width: calc(100% + 12px);
      background: var(--danger); border-radius: 3px; margin-top: -2.5px;
      transform: scaleX(0); transform-origin: left center; will-change: transform;
    }
  </style>
</head>
<body>
  <div id="scene-59-rent" data-composition-id="scene-59-rent" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="server" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500">
        <div class="slot s1"><span class="dot"></span></div>
        <div class="slot s2"><span class="dot"></span></div>
        <div class="slot s3"><span class="dot"></span></div>
        <div class="slbl">hardware</div>
      </div>

      <div class="stamp" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="1560" data-sfx-volume="0.42">owned</div>

      <div class="cap">they didn't just <span class="rwrap"><span class="rent">rent</span><span class="strike" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1340" data-sfx-volume="0.35"></span></span> it</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-59-rent";

    // Host data-start = 480.56 → scene-local = global − 480.56. Chunk first word "And" 481.06 = local 0.50.

    // Entrance crossfade over scene 58's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "And they didn't just rent" 481.06→481.90 (local 0.50→1.34) — the hardware + claim appear
    tl.fromTo(root + " .server", { opacity: 0, y: 14, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 0.50);
    tl.fromTo(root + " .cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 0.50);

    // "rent" 481.90 (local 1.34) — struck out
    tl.fromTo(root + " .cap .strike", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power2.out" }, 1.34);
    tl.to(root + " .cap .rent", { color: "#5a635e", duration: 0.4, ease: "power2.out" }, 1.42);

    // "the hardware" 482.10→482.34 (local 1.54→1.78) — the OWNED stamp slams down
    tl.fromTo(root + " .stamp", { opacity: 0, scale: 1.6, rotation: -13 }, { opacity: 1, scale: 1, rotation: -11, duration: 0.36, ease: "back.out(1.8)" }, 1.56);
    tl.fromTo(root + " .stamp", { filter: "drop-shadow(0 0 0px rgba(37,211,102,0))" }, { filter: "drop-shadow(0 0 16px rgba(37, 211, 102, 0.5))", duration: 0.4, ease: "power2.out" }, 1.56);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 1.8, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-59-rent"] = tl;
  </script>
</body>
</html>
