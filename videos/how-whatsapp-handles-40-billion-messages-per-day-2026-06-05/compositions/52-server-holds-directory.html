<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 52 — the server still holds no key, just a directory of where those keys live</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-52-dir { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-52-dir .stage { position: absolute; inset: 0; will-change: transform; }

    /* the server rack — the familiar blind server */
    #scene-52-dir .server {
      position: absolute; left: 286px; top: 348px; width: 244px; height: 286px;
      background: var(--panel); border: 1.6px solid #2b3a44; border-radius: 14px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-52-dir .server .slot {
      position: absolute; left: 26px; right: 26px; height: 30px;
      border: 1.4px solid #243843; border-radius: 6px;
    }
    #scene-52-dir .server .s1 { top: 30px; }
    #scene-52-dir .server .s2 { top: 78px; }
    #scene-52-dir .server .s3 { top: 126px; }
    #scene-52-dir .server .dot {
      position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); right: 40px;
    }
    #scene-52-dir .server .slbl {
      position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 22px;
      color: var(--accent-2); letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* the "no key" badge */
    #scene-52-dir .nokey {
      position: absolute; left: 312px; top: 668px; width: 192px;
      display: flex; align-items: center; gap: 14px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-52-dir .nokey .ktxt {
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 30px; color: var(--danger); letter-spacing: -0.01em;
    }
    #scene-52-dir .nokey svg .slash { stroke-dasharray: 40; stroke-dashoffset: 40; will-change: stroke-dashoffset; }

    /* the directory panel — what the server DOES hold */
    #scene-52-dir .dir {
      position: absolute; left: 952px; top: 322px; width: 686px; height: 436px;
      background: rgba(16,22,19,0.6); border: 1.5px solid #2b3a44; border-radius: 16px;
      padding: 30px 36px; opacity: 0; will-change: transform, opacity;
    }
    #scene-52-dir .dir .dhead {
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 23px;
      color: var(--accent-2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 26px;
    }
    #scene-52-dir .dir .row {
      display: flex; align-items: center; gap: 22px; height: 92px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-52-dir .dir .row + .row { border-top: 1px solid var(--border); }
    #scene-52-dir .dir .rid {
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 30px;
      color: var(--soft); letter-spacing: 0.04em; width: 116px; white-space: nowrap;
    }
    #scene-52-dir .dir .arr { flex: none; }
    #scene-52-dir .dir .rloc {
      display: flex; align-items: center; gap: 14px;
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px; color: var(--accent-2); letter-spacing: -0.004em;
    }
  </style>
</head>
<body>
  <div id="scene-52-dir" data-composition-id="scene-52-dir" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="server" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500">
        <div class="slot s1"><span class="dot"></span></div>
        <div class="slot s2"><span class="dot"></span></div>
        <div class="slot s3"><span class="dot"></span></div>
        <div class="slbl">server</div>
      </div>

      <div class="nokey">
        <svg viewBox="0 0 40 40" width="52" height="52" fill="none" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1360" data-sfx-volume="0.42">
          <circle cx="13" cy="13" r="7.4" stroke="#25d366" stroke-width="2.6"></circle>
          <path d="M18.4 18.4 L33 33 M29 29 l3.4 3.4 M32 32 l3.4 3.4" stroke="#25d366" stroke-width="2.6" stroke-linecap="round"></path>
          <line class="slash" x1="6" y1="34" x2="34" y2="6" stroke="#ff6b5d" stroke-width="3" stroke-linecap="round"></line>
        </svg>
        <div class="ktxt">no key</div>
      </div>

      <div class="dir" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="2660" data-sfx-volume="0.42">
        <div class="dhead">directory · where keys live</div>

        <div class="row rw1" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3600" data-sfx-volume="0.42">
          <div class="rid">d · 7f</div>
          <svg class="arr" viewBox="0 0 40 16" width="48" height="20" fill="none">
            <path d="M2 8 H34 M28 3 l7 5 l-7 5" stroke="#39443f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <div class="rloc">
            <svg viewBox="0 0 32 48" width="26" height="38" fill="none">
              <rect x="6" y="4" width="20" height="40" rx="4" stroke="#7dd3fc" stroke-width="2.2"></rect>
              <line x1="13" y1="39" x2="19" y2="39" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"></line>
            </svg>
            <span>your phone</span>
          </div>
        </div>

        <div class="row rw2">
          <div class="rid">d · a4</div>
          <svg class="arr" viewBox="0 0 40 16" width="48" height="20" fill="none">
            <path d="M2 8 H34 M28 3 l7 5 l-7 5" stroke="#39443f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <div class="rloc">
            <svg viewBox="0 0 40 48" width="32" height="38" fill="none">
              <rect x="5" y="5" width="30" height="38" rx="3.4" stroke="#7dd3fc" stroke-width="2.2"></rect>
              <circle cx="20" cy="38.5" r="1.6" fill="#7dd3fc"></circle>
            </svg>
            <span>your tablet</span>
          </div>
        </div>

        <div class="row rw3">
          <div class="rid">d · c1</div>
          <svg class="arr" viewBox="0 0 40 16" width="48" height="20" fill="none">
            <path d="M2 8 H34 M28 3 l7 5 l-7 5" stroke="#39443f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <div class="rloc">
            <svg viewBox="0 0 48 40" width="36" height="30" fill="none">
              <rect x="9" y="6" width="30" height="20" rx="2.4" stroke="#7dd3fc" stroke-width="2.2"></rect>
              <path d="M4 32 h40 l-3 -6 H7 Z" stroke="#7dd3fc" stroke-width="2.2" stroke-linejoin="round"></path>
            </svg>
            <span>your laptop</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-52-dir";

    // Host data-start = 441.00 → scene-local = global − 441.00. Chunk first word "The" 441.50 = local 0.50.

    // Entrance crossfade over scene 51's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "The server" 441.50→441.62 (local 0.50→0.62) — the familiar server appears
    tl.fromTo(root + " .server", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 0.50);

    // "still holds no key" 441.90→442.58 (local 0.90→1.58) — the key is crossed out, no key here
    tl.fromTo(root + " .nokey", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.90);
    tl.fromTo(root + " .nokey .slash", { strokeDashoffset: 40 }, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 1.36);

    // "just a directory" 443.66→444.04 (local 2.66→3.04) — what it DOES hold slides in
    tl.fromTo(root + " .dir", { opacity: 0, x: 22, scale: 0.97 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 2.66);

    // "of where those keys live" 444.60→445.68 (local 3.60→4.68) — each row points to where the key lives
    tl.fromTo(root + " .dir .rw1", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.60);
    tl.fromTo(root + " .dir .rw2", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.92);
    tl.fromTo(root + " .dir .rw3", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 4.24);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.2);

    window.__timelines["scene-52-dir"] = tl;
  </script>
</body>
</html>
