<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 76 — they ran each near a million on purpose, leaving headroom for failover and spikes</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-76-head { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-76-head .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-76-head .col {
      position: absolute; left: 880px; top: 252px; width: 160px; height: 460px;
      border-radius: 16px; border: 2.2px solid var(--accent-2); background: rgba(255,255,255,0.015);
      opacity: 0; will-change: transform, opacity;
    }
    /* amber headroom overlay — the reserved upper zone */
    #scene-76-head .room {
      position: absolute; left: 4px; right: 4px; top: 4px; height: 240px;
      border-radius: 12px 12px 0 0; background: rgba(240,180,41,0.07);
      border-bottom: 1.5px dashed rgba(240,180,41,0.4);
      opacity: 0; will-change: opacity;
    }
    /* green running fill — what they actually run */
    #scene-76-head .fill {
      position: absolute; left: 4px; right: 4px; bottom: 4px; height: 208px;
      border-radius: 0 0 12px 12px; background: linear-gradient(180deg, var(--accent), rgba(37,211,102,0.5));
      box-shadow: 0 0 18px rgba(37,211,102,0.35);
      transform: scaleY(0); transform-origin: bottom center; will-change: transform;
    }

    #scene-76-head .captop {
      position: absolute; left: 832px; top: 214px; width: 256px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px;
      color: var(--accent-2); letter-spacing: 0.06em;
      opacity: 0; will-change: opacity;
    }

    /* running label — left of column at the fill top */
    #scene-76-head .runlbl {
      position: absolute; left: 540px; top: 452px; width: 312px; text-align: right;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-76-head .runlbl .v {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 56px; color: var(--accent); line-height: 1;
    }
    #scene-76-head .runlbl .s {
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px; color: var(--muted); margin-top: 6px;
    }

    /* headroom brace — right of column over the reserved zone */
    #scene-76-head .brace {
      position: absolute; left: 1062px; top: 256px; width: 2px; height: 236px;
      background: rgba(240,180,41,0.55); opacity: 0; will-change: opacity;
    }
    #scene-76-head .brace::before, #scene-76-head .brace::after {
      content: ""; position: absolute; left: 0; width: 14px; height: 2px; background: rgba(240,180,41,0.55);
    }
    #scene-76-head .brace::before { top: 0; }
    #scene-76-head .brace::after { bottom: 0; }
    #scene-76-head .roomlbl {
      position: absolute; left: 1092px; top: 326px; width: 360px;
    }
    #scene-76-head .roomlbl .h {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px; color: var(--cost); line-height: 1;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-76-head .roomlbl .sub {
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; color: var(--soft);
      margin-top: 10px; letter-spacing: 0.02em;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-76-head" data-composition-id="scene-76-head" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="captop">capacity &asymp; 2M</div>

      <div class="col" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
        <div class="room"></div>
        <div class="fill"></div>
      </div>

      <div class="runlbl">
        <div class="v">&asymp; 1M</div>
        <div class="s">running on purpose</div>
      </div>

      <div class="brace"></div>
      <div class="roomlbl">
        <div class="h">headroom</div>
        <div class="sub" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5960" data-sfx-volume="0.42">failover &middot; spikes</div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-76-head";

    // Host data-start = 564.04 → scene-local = global − 564.04. Chunk first word "In" 564.54 = local 0.50.

    // Entrance crossfade over scene 75's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "In production" 564.54→564.68 (local 0.50→0.64) — the capacity column
    tl.fromTo(root + " .col", { opacity: 0, y: 14, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 0.50);
    tl.fromTo(root + " .captop", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.86);

    // "they ran each near a million on purpose" 565.74→567.80 (local 1.70→3.76) — fill rises to ~1M, not the top
    tl.fromTo(root + " .fill", { scaleY: 0 }, { scaleY: 1, duration: 0.95, ease: "power3.out", onStart() {} }, 2.06);
    tl.fromTo(root + " .runlbl", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 2.92);
    // "on purpose" — a small confirm pulse on the running level
    tl.to(root + " .runlbl .v", { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 3.76);

    // "leaving headroom" 569.04→569.34 (local 5.00→5.30) — the reserved amber zone + brace
    tl.fromTo(root + " .room", { opacity: 0 }, { opacity: 1, duration: 0.44, ease: "power2.out" }, 5.00);
    tl.fromTo(root + " .brace", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 5.10);
    tl.fromTo(root + " .roomlbl .h", { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, 5.20);

    // "for failover and spikes." 569.78→570.66 (local 5.74→6.62) — the sub-label
    tl.fromTo(root + " .roomlbl .sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 5.96);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.4);

    window.__timelines["scene-76-head"] = tl;
  </script>
</body>
</html>
