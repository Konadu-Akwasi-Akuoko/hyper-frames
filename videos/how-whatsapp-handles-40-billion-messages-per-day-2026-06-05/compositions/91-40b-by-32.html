<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 91 — 40 billion messages a day ran by a team of roughly 32</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-91-payoff { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-91-payoff .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-91-payoff .big {
      position: absolute; left: 0; right: 0; top: 250px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 200px; line-height: 1;
      color: var(--accent); letter-spacing: -0.04em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
    #scene-91-payoff .biglbl {
      position: absolute; left: 0; right: 0; top: 472px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 30px;
      color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0; will-change: opacity;
    }

    #scene-91-payoff .ran {
      position: absolute; left: 0; right: 0; top: 556px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 40px;
      color: var(--soft); letter-spacing: -0.01em;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-91-payoff .teamrow {
      position: absolute; left: 0; right: 0; top: 626px;
      display: flex; align-items: center; justify-content: center; gap: 40px;
    }
    #scene-91-payoff .num32 {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 132px; line-height: 1;
      color: var(--soft); letter-spacing: -0.03em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-91-payoff .grid {
      display: grid; grid-template-columns: repeat(8, 14px); gap: 9px;
    }
    #scene-91-payoff .dot {
      width: 14px; height: 14px; border-radius: 50%; background: var(--soft);
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-91-payoff" data-composition-id="scene-91-payoff" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="big" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="740" data-sfx-volume="0.35">40B</div>
      <div class="biglbl">messages a day</div>

      <div class="ran" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2660" data-sfx-volume="0.35">ran by a team of</div>

      <div class="teamrow">
        <div class="num32" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="4260" data-sfx-volume="0.42">32</div>
        <div class="grid"></div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-91-payoff";

    // generate the 32-person grid (deterministic)
    const grid = document.querySelector(root + " .grid");
    for (let i = 0; i < 32; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      grid.appendChild(d);
    }

    // Host data-start = 647.10 → scene-local = global − 647.10. Chunk first word "40" 647.60 = local 0.50.

    // Entrance crossfade over scene 90's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "40 billion messages a day" 647.60→648.60 (local 0.50→1.50) — the colossal number
    tl.fromTo(root + " .big", { opacity: 0, scale: 0.9, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" }, 0.50);
    tl.fromTo(root + " .big", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 60px rgba(37,211,102,0.4)", duration: 0.6, ease: "power2.out" }, 0.74);
    tl.fromTo(root + " .biglbl", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.20);

    // "ran by a team of" 649.76→650.62 (local 2.66→3.52)
    tl.fromTo(root + " .ran", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 2.66);

    // "roughly 32." 650.84→651.36 (local 3.74→4.26) — the tiny team
    tl.fromTo(root + " .num32", { opacity: 0, y: 14, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 4.26);
    tl.fromTo(root + " .dot", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", stagger: { each: 0.022, from: "start" } }, 4.4);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 5.0);

    window.__timelines["scene-91-payoff"] = tl;
  </script>
</body>
</html>
