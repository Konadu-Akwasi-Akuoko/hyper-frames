<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 67 — on the 22nd of February 2014, three days after the $19 billion Facebook deal</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-67-deal { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-67-deal .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-67-deal .date {
      position: absolute; left: 0; right: 0; top: 280px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 52px;
      color: var(--accent-2); letter-spacing: 0.14em;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-67-deal .conn {
      position: absolute; left: 0; right: 0; top: 392px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 28px;
      color: var(--muted); letter-spacing: 0.02em;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-67-deal .big {
      position: absolute; left: 0; right: 0; top: 446px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 200px; line-height: 1;
      color: var(--cost); letter-spacing: -0.03em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }

    #scene-67-deal .dlbl {
      position: absolute; left: 0; right: 0; top: 706px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 36px;
      color: var(--accent-2); letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-67-deal" data-composition-id="scene-67-deal" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="date" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500" data-sfx-volume="0.42">22 FEB 2014</div>
      <div class="conn" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3080" data-sfx-volume="0.42">just three days after —</div>
      <div class="big" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4030" data-sfx-volume="0.35">$19B</div>
      <div class="dlbl" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="5340" data-sfx-volume="0.42">Facebook deal</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-67-deal";

    // Host data-start = 520.28 → scene-local = global − 520.28. Chunk first word "On" 520.78 = local 0.50.

    // Entrance crossfade over scene 66's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "On the 22nd of February 2014" 520.78→522.08 (local 0.50→1.80) — the date
    tl.fromTo(root + " .date", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.50);

    // "just three days after" 523.36→523.94 (local 3.08→3.66) — the connector
    tl.fromTo(root + " .conn", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 3.08);

    // "$19 billion" 524.31→524.96 (local 4.03→4.68) — the deal figure slams in
    tl.fromTo(root + " .big", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.48, ease: "back.out(1.5)" }, 4.03);
    tl.fromTo(root + " .big", { textShadow: "0 0 0px rgba(240,180,41,0)" }, { textShadow: "0 0 40px rgba(240, 180, 41, 0.42)", duration: 0.5, ease: "power2.out" }, 4.30);

    // "Facebook deal" 525.62→526.02 (local 5.34→5.74) — the label
    tl.fromTo(root + " .dlbl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 5.34);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-67-deal"] = tl;
  </script>
</body>
</html>
