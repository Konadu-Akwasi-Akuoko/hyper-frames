<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 96 — Which of WhatsApp's trades would you have made differently? Tell me in the comments</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-96-sign { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-96-sign .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-96-sign .kick {
      position: absolute; left: 0; right: 0; top: 268px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px;
      color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-96-sign .q {
      position: absolute; left: 0; right: 0; top: 338px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 66px; line-height: 1.24;
      color: var(--fg); letter-spacing: -0.022em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-96-sign .q .diff { color: var(--accent-2); font-weight: 800; will-change: text-shadow; }

    #scene-96-sign .field {
      position: absolute; left: 50%; top: 596px; transform: translateX(-50%);
      width: 760px; padding: 26px 30px; border-radius: 16px;
      background: var(--panel); border: 1.5px solid var(--border);
      border-left: 4px solid var(--accent);
      display: flex; align-items: center;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-96-sign .field .ph {
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 36px; color: var(--soft); letter-spacing: -0.01em;
    }
    #scene-96-sign .field .cursor {
      display: inline-block; width: 3px; height: 40px; margin-left: 6px;
      background: var(--accent); border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="scene-96-sign" data-composition-id="scene-96-sign" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="kick">i&rsquo;m genuinely curious</div>

      <div class="q">which of WhatsApp&rsquo;s trades<br>would you have <span class="diff">made differently?</span></div>

      <div class="field" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="5620" data-sfx-volume="0.42">
        <span class="ph">Tell me in the comments</span><span class="cursor"></span>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-96-sign";

    // Host data-start = 674.26 → scene-local = global − 674.26. Chunk first word "And" 674.76 = local 0.50.

    // Entrance crossfade over scene 95's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "And I'm genuinely curious," 674.76→675.68 (local 0.50→1.42)
    tl.fromTo(root + " .kick", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 0.50);

    // "which of WhatsApp trades would you have made differently?" 676.72→678.84 (local 2.46→4.58)
    tl.fromTo(root + " .q", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.46);
    tl.fromTo(root + " .q .diff", { textShadow: "0 0 0px rgba(125,211,252,0)" }, { textShadow: "0 0 24px rgba(125,211,252,0.45)", duration: 0.6, ease: "power2.out" }, 4.0);

    // "Tell me in the comments." 679.88→680.82 (local 5.62→6.56) — the comment field
    tl.fromTo(root + " .field", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.3)" }, 5.40);
    // blinking cursor — invites the comment, holds through the tail
    tl.fromTo(root + " .field .cursor", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "steps(1)", repeat: 5, yoyo: true }, 5.9);

    // gentle settle
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut" }, 6.0);

    window.__timelines["scene-96-sign"] = tl;
  </script>
</body>
</html>
