<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 43 — the Double Ratchet derives a fresh key per message</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-43-ratchet { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-43-ratchet .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-43-ratchet .hdr {
      position: absolute; left: 0; right: 0; top: 222px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 54px;
      color: var(--accent-2); letter-spacing: 0.04em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
    #scene-43-ratchet .sub {
      position: absolute; left: 0; right: 0; top: 306px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 23px;
      color: var(--muted); letter-spacing: 0.24em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-43-ratchet .gear {
      position: absolute; left: 50%; top: 366px; margin-left: -52px;
      opacity: 0; will-change: transform, opacity; transform-origin: center center;
    }

    #scene-43-ratchet .col {
      position: absolute; top: 552px; width: 120px;
      display: flex; flex-direction: column; align-items: center; gap: 26px;
    }
    #scene-43-ratchet .c1 { left: 450px; }
    #scene-43-ratchet .c2 { left: 750px; }
    #scene-43-ratchet .c3 { left: 1050px; }
    #scene-43-ratchet .c4 { left: 1350px; }
    #scene-43-ratchet .mbub { opacity: 0; will-change: transform, opacity; }
    #scene-43-ratchet .mkey {
      opacity: 0; transform: scale(0); transform-origin: center center;
      will-change: transform, opacity, filter;
    }
  </style>
</head>
<body>
  <div id="scene-43-ratchet" data-composition-id="scene-43-ratchet" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="hdr">Double Ratchet</div>
      <div class="sub">a fresh key for every message</div>

      <svg class="gear" viewBox="0 0 48 48" width="104" height="104" fill="none" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="1920" data-sfx-volume="0.35">
        <g stroke="#7dd3fc" stroke-width="2.4" stroke-linecap="round">
          <circle cx="24" cy="24" r="11"></circle>
          <circle cx="24" cy="24" r="4"></circle>
          <line x1="24" y1="5.5" x2="24" y2="11"></line>
          <line x1="24" y1="37" x2="24" y2="42.5"></line>
          <line x1="5.5" y1="24" x2="11" y2="24"></line>
          <line x1="37" y1="24" x2="42.5" y2="24"></line>
          <line x1="10.9" y1="10.9" x2="14.8" y2="14.8"></line>
          <line x1="33.2" y1="33.2" x2="37.1" y2="37.1"></line>
          <line x1="10.9" y1="37.1" x2="14.8" y2="33.2"></line>
          <line x1="33.2" y1="14.8" x2="37.1" y2="10.9"></line>
        </g>
      </svg>

      <div class="col c1">
        <svg class="mbub" viewBox="0 0 32 24" width="46" height="35" fill="none">
          <path d="M4 4 h24 a3 3 0 0 1 3 3 v7 a3 3 0 0 1 -3 3 h-13 l-6 4.5 v-4.5 h-5 a3 3 0 0 1 -3 -3 v-7 a3 3 0 0 1 3 -3 Z" stroke="#c3cbc7" stroke-width="2"></path>
        </svg>
        <svg class="mkey" viewBox="0 0 32 32" width="50" height="50" fill="none" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3600" data-sfx-volume="0.35">
          <circle cx="10.5" cy="10.5" r="6" stroke="#25d366" stroke-width="2.2"></circle>
          <path d="M14.8 14.8 L26 26 M22 22 l3 3 M25 25 l3 3" stroke="#25d366" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
      </div>

      <div class="col c2">
        <svg class="mbub" viewBox="0 0 32 24" width="46" height="35" fill="none">
          <path d="M4 4 h24 a3 3 0 0 1 3 3 v7 a3 3 0 0 1 -3 3 h-13 l-6 4.5 v-4.5 h-5 a3 3 0 0 1 -3 -3 v-7 a3 3 0 0 1 3 -3 Z" stroke="#c3cbc7" stroke-width="2"></path>
        </svg>
        <svg class="mkey" viewBox="0 0 32 32" width="50" height="50" fill="none" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4700" data-sfx-volume="0.42">
          <circle cx="10.5" cy="10.5" r="6" stroke="#25d366" stroke-width="2.2"></circle>
          <path d="M14.8 14.8 L26 26 M22 22 l3 3 M25 25 l3 3" stroke="#25d366" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
      </div>

      <div class="col c3">
        <svg class="mbub" viewBox="0 0 32 24" width="46" height="35" fill="none">
          <path d="M4 4 h24 a3 3 0 0 1 3 3 v7 a3 3 0 0 1 -3 3 h-13 l-6 4.5 v-4.5 h-5 a3 3 0 0 1 -3 -3 v-7 a3 3 0 0 1 3 -3 Z" stroke="#c3cbc7" stroke-width="2"></path>
        </svg>
        <svg class="mkey" viewBox="0 0 32 32" width="50" height="50" fill="none" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5700" data-sfx-volume="0.42">
          <circle cx="10.5" cy="10.5" r="6" stroke="#25d366" stroke-width="2.2"></circle>
          <path d="M14.8 14.8 L26 26 M22 22 l3 3 M25 25 l3 3" stroke="#25d366" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
      </div>

      <div class="col c4">
        <svg class="mbub" viewBox="0 0 32 24" width="46" height="35" fill="none">
          <path d="M4 4 h24 a3 3 0 0 1 3 3 v7 a3 3 0 0 1 -3 3 h-13 l-6 4.5 v-4.5 h-5 a3 3 0 0 1 -3 -3 v-7 a3 3 0 0 1 3 -3 Z" stroke="#c3cbc7" stroke-width="2"></path>
        </svg>
        <svg class="mkey" viewBox="0 0 32 32" width="50" height="50" fill="none" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="6600" data-sfx-volume="0.42">
          <circle cx="10.5" cy="10.5" r="6" stroke="#25d366" stroke-width="2.2"></circle>
          <path d="M14.8 14.8 L26 26 M22 22 l3 3 M25 25 l3 3" stroke="#25d366" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-43-ratchet";

    // Host data-start = 379.00 → scene-local = global − 379.00. Chunk first word "Then" 379.50 = local 0.50.

    // Entrance crossfade over scene 42's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "Then the Double Ratchet takes over" 379.50→381.76 (local 0.50→2.76) — the mechanism names itself and engages
    tl.fromTo(root + " .hdr", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.42);
    tl.fromTo(root + " .hdr", { textShadow: "0 0 0px rgba(125,211,252,0)" }, { textShadow: "0 0 24px rgba(125, 211, 252, 0.32)", duration: 0.5, ease: "power2.out" }, 1.92);
    tl.fromTo(root + " .sub", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 2.1);
    tl.fromTo(root + " .gear", { opacity: 0, scale: 0.7, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, 1.92);

    // "deriving a fresh key ... for every single message" 382.54→386.16 (local 3.54→7.16)
    // the gear clicks forward — each click stamps out a fresh key
    const keys = [
      { c: ".c1", t: 3.60 },
      { c: ".c2", t: 4.70 },
      { c: ".c3", t: 5.70 },
      { c: ".c4", t: 6.60 },
    ];
    keys.forEach(function (k, i) {
      // gear ratchets 45° just before the key drops
      tl.to(root + " .gear", { rotation: "+=45", duration: 0.22, ease: "back.out(2.4)" }, k.t - 0.12);
      tl.fromTo(root + " " + k.c + " .mbub", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, k.t - 0.1);
      tl.fromTo(root + " " + k.c + " .mkey", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, k.t);
      tl.fromTo(root + " " + k.c + " .mkey", { filter: "drop-shadow(0 0 0px rgba(37,211,102,0))" }, { filter: "drop-shadow(0 0 10px rgba(37, 211, 102, 0.55))", duration: 0.3, ease: "power2.out" }, k.t);
      tl.to(root + " " + k.c + " .mkey", { filter: "drop-shadow(0 0 3px rgba(37, 211, 102, 0.2))", duration: 0.5, ease: "power2.inOut" }, k.t + 0.32);
    });

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6);

    window.__timelines["scene-43-ratchet"] = tl;
  </script>
</body>
</html>
