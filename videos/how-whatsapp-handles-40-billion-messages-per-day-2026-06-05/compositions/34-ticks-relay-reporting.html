<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 34 — the ticks are the relay reporting back</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-34-ticks-relay { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-34-ticks-relay .stage { position: absolute; inset: 0; will-change: transform; }

    /* sky fusion glow behind the ticks */
    #scene-34-ticks-relay .fuse {
      position: absolute; left: 898px; top: 452px; width: 184px; height: 112px;
      border-radius: 50%; filter: blur(16px); opacity: 0; pointer-events: none;
      background: radial-gradient(circle, rgba(125,211,252,0.22), rgba(125,211,252,0) 70%);
    }

    /* the WhatsApp-style outgoing chat bubble */
    #scene-34-ticks-relay .bubble {
      position: absolute; left: 560px; top: 404px; width: 486px;
      background: #0d3b2c; border: 1px solid rgba(37, 211, 102, 0.22);
      border-radius: 18px; border-top-right-radius: 4px;
      padding: 26px 28px 18px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.42);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-34-ticks-relay .tail {
      position: absolute; top: 0; right: -11px; width: 0; height: 0;
      border-left: 14px solid #0d3b2c; border-top: 14px solid transparent;
    }
    #scene-34-ticks-relay .msg {
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 40px;
      color: var(--fg); letter-spacing: -0.005em;
    }
    #scene-34-ticks-relay .meta {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 14px;
    }
    #scene-34-ticks-relay .time {
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 22px;
      color: var(--muted); letter-spacing: 0.01em;
    }
    #scene-34-ticks-relay .ticks { display: block; will-change: filter; }

    /* the drawn annotation */
    #scene-34-ticks-relay .lead { position: absolute; inset: 0; overflow: visible; }
    #scene-34-ticks-relay .leadpath {
      fill: none; stroke: var(--accent-2); stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 150; stroke-dashoffset: 150;
    }
    #scene-34-ticks-relay .leadhead { fill: var(--accent-2); opacity: 0; }
    #scene-34-ticks-relay .alabel {
      position: absolute; left: 1140px; top: 430px;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 30px;
      color: var(--accent-2); letter-spacing: 0.01em;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-34-ticks-relay" data-composition-id="scene-34-ticks-relay" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="fuse"></div>

      <div class="bubble" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="300">
        <div class="tail"></div>
        <div class="msg">On my way</div>
        <div class="meta">
          <span class="time">9:41</span>
          <svg class="ticks" viewBox="0 0 24 16" width="62" height="41" fill="none">
            <polyline class="t1" points="1,8 5,12 13,3" stroke="#c3cbc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1280" data-sfx-volume="0.35"></polyline>
            <polyline class="t2" points="9,8 13,12 21,3" stroke="#c3cbc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1500"></polyline>
          </svg>
        </div>
      </div>

      <svg class="lead" viewBox="0 0 1920 1080" width="1920" height="1080">
        <path class="leadpath" d="M1150 486 C 1115 506, 1075 510, 1032 506"></path>
        <polygon class="leadhead" points="1026,506 1040,499 1040,513"></polygon>
      </svg>
      <div class="alabel" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="3380" data-sfx-volume="0.42">relay reporting back</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-34-ticks-relay";

    // Host data-start = 323.02 → scene-local = global − 323.02. Chunk first word "And" 323.52 = local 0.50.

    // Entrance crossfade over scene 33's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "And those little ticks" 323.52→324.78 (local 0.50→1.76) — the bubble settles in
    tl.fromTo(root + " .bubble", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.3)" }, 0.30);

    // "ticks" 324.30 (local 1.28) — the double-check lands, second tick a beat after the first
    tl.fromTo(root + " .t1", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.28);
    tl.fromTo(root + " .t2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.50);

    // "you watch" 324.84→325.20 (local 1.82→1.98) — an attention bloom on the ticks
    tl.fromTo(root + " .ticks", { filter: "drop-shadow(0 0 0px rgba(195,203,199,0))" }, { filter: "drop-shadow(0 0 11px rgba(195, 203, 199, 0.55))", duration: 0.4, ease: "power2.out" }, 1.98);
    tl.to(root + " .ticks", { filter: "drop-shadow(0 0 3px rgba(195, 203, 199, 0.18))", duration: 0.6, ease: "power2.inOut" }, 2.5);

    // "relay" 326.12 (local 3.10) — the sky leader line strokes toward the ticks; relay meets the UI
    tl.fromTo(root + " .leadpath", { strokeDashoffset: 150 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.10);
    tl.fromTo(root + " .leadhead", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 3.52);
    tl.fromTo(root + " .fuse", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.45);
    tl.to(root + " .fuse", { opacity: 0.42, duration: 0.7, ease: "power2.inOut" }, 3.95);

    // "reporting back" 326.40→327.16 (local 3.38→4.14) — the label arrives, naming the ticks
    tl.fromTo(root + " .alabel", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.38);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.2);

    window.__timelines["scene-34-ticks-relay"] = tl;
  </script>
</body>
</html>
