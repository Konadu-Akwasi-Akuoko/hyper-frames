<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 20 — fast enough for every message</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-20-lookup-stream { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }

    #scene-20-lookup-stream .stage { position: absolute; inset: 0; will-change: transform; }

    /* left-locked headline stack */
    #scene-20-lookup-stream .head {
      position: absolute; left: 188px; top: 392px; width: 700px;
    }
    #scene-20-lookup-stream .lead {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 28px; color: var(--accent-2); letter-spacing: 0.04em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-20-lookup-stream .l1 {
      margin-top: 22px; font-size: 58px; font-weight: 700; color: var(--fg);
      line-height: 1.12; letter-spacing: 0.004em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-20-lookup-stream .l2 {
      font-size: 58px; font-weight: 700; color: var(--fg);
      line-height: 1.12; letter-spacing: 0.004em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-20-lookup-stream .l2 .ev { color: var(--accent-2); }

    /* the lookup flood — a grid of dots, each one a lookup firing */
    #scene-20-lookup-stream .fieldglow {
      position: absolute; left: 1000px; top: 320px; width: 760px; height: 560px;
      border-radius: 28px; background: radial-gradient(circle at 50% 45%, rgba(125,211,252,0.10), rgba(125,211,252,0) 70%);
      opacity: 0; will-change: opacity;
    }
    #scene-20-lookup-stream .grid {
      position: absolute; left: 1040px; top: 372px;
      display: grid; grid-template-columns: repeat(12, 56px); grid-auto-rows: 56px;
    }
    #scene-20-lookup-stream .dot {
      width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
    }
    #scene-20-lookup-stream .dot::after {
      content: ""; width: 15px; height: 15px; border-radius: 50%;
      background: var(--accent-2); box-shadow: 0 0 9px rgba(125, 211, 252, 0.55);
    }

    /* the climbing throughput counter beneath the field */
    #scene-20-lookup-stream .count {
      position: absolute; left: 1040px; top: 832px; width: 672px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 46px; color: var(--accent-2); letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px rgba(125, 211, 252, 0.18);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-20-lookup-stream .clabel {
      position: absolute; left: 1040px; top: 894px; width: 672px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 22px; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase;
      opacity: 0; will-change: opacity;
    }
  </style>
</head>
<body>
  <div id="scene-20-lookup-stream" data-composition-id="scene-20-lookup-stream" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="head">
        <div class="lead" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500">an in-memory lookup &mdash;</div>
        <div class="l1">fast enough to run on</div>
        <div class="l2" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3300" data-sfx-volume="0.35"><span class="ev">every single message</span>.</div>
      </div>

      <div class="fieldglow"></div>
      <div class="grid" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2600"></div>

      <div class="count" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="7620">0</div>
      <div class="clabel">messages routed / day</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-20-lookup-stream";

    // Host data-start = 199.32 → scene-local = global − 199.32.

    // Build the 96-dot lookup field deterministically (12 × 8).
    const grid = document.querySelector(root + " .grid");
    for (let i = 0; i < 96; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      grid.appendChild(d);
    }
    gsap.set(root + " .dot", { opacity: 0, scale: 0 });

    const counter = { v: 0 };
    const cEl = document.querySelector(root + " .count");

    // Entrance crossfade over scene 19's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "An in-memory lookup" 199.82 (local 0.50) — the lead-in
    tl.fromTo(root + " .lead", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.50);
    // "is fast enough to run on" 201.18 (local 1.86) — the speed claim
    tl.fromTo(root + " .l1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.86);

    // the field-glow rises into the seam overlap (local 0.15) so the right half carries
    // scene-20 presence over scene 19's tail (crossfade cover) and fills the frame
    // while the left headline builds
    tl.fromTo(root + " .fieldglow", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.out" }, 0.15);
    // the lookup field floods — each dot a lookup firing, a visibly progressive rapid wave
    // (adapted from matrix-scale-up-grid-grow: column-by-column cell-fill, population that keeps multiplying)
    tl.to(root + " .dot", {
      opacity: 1, scale: 1, duration: 0.16, ease: "power2.out",
      stagger: { amount: 1.6, grid: [8, 12], from: "start" }
    }, 2.60);

    // "every single message." 202.62 (local 3.30) — the repetition payoff, sky-blue bloom
    tl.fromTo(root + " .l2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.30);
    tl.fromTo(root + " .l2 .ev",
      { textShadow: "0 0 0 rgba(125,211,252,0)" },
      { textShadow: "0 0 26px rgba(125, 211, 252, 0.45)", duration: 0.5, ease: "power2.out" }, 3.78);

    // the throughput counter climbs as the field fills — "which is exactly what routing
    // tens of billions of them demands" 204.56→208.28 (local 5.24→8.96)
    tl.fromTo(root + " .count", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.10);
    tl.fromTo(root + " .clabel", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 3.40);
    tl.to(counter, {
      v: 40000000000, duration: 4.5, ease: "power1.inOut",
      onUpdate: () => { cEl.textContent = Math.round(counter.v).toLocaleString("en-US"); }
    }, 3.10);
    // "tens of billions" 206.94 (local 7.62) — the count blooms as the figure lands
    tl.to(root + " .count", { textShadow: "0 0 30px rgba(125, 211, 252, 0.5)", duration: 0.5, ease: "power2.out" }, 7.62);
    tl.to(root + " .count", { scale: 1.06, duration: 0.18, ease: "power2.out" }, 7.62);
    tl.to(root + " .count", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 7.80);

    // idle — the field breathes faintly (finite yoyo)
    tl.to(root + " .stage", { y: -4, duration: 3.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 0.8);

    window.__timelines["scene-20-lookup-stream"] = tl;
  </script>
</body>
</html>
