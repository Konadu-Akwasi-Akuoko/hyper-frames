<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 36 — the ticks are the architecture leaking through</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-36-ticks-arch { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-36-ticks-arch .stage { position: absolute; inset: 0; will-change: transform; }

    /* the distributed architecture, surfacing behind the tick */
    #scene-36-ticks-arch .graph {
      position: absolute; left: 960px; top: 410px; width: 1400px; height: 660px;
      margin-left: -700px; margin-top: -330px; opacity: 0; will-change: transform, opacity;
    }

    /* the surface point — a single read-blue double tick, held perfectly still */
    #scene-36-ticks-arch .tick {
      position: absolute; left: 50%; top: 378px; transform: translateX(-50%);
      opacity: 0; will-change: opacity, filter;
    }

    /* the verbal anchor */
    #scene-36-ticks-arch .cap {
      position: absolute; left: 0; right: 0; top: 868px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 28px;
      color: var(--soft); letter-spacing: 0.004em; opacity: 0; will-change: transform, opacity;
    }
    #scene-36-ticks-arch .cap .sky { color: var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-36-ticks-arch" data-composition-id="scene-36-ticks-arch" data-width="1920" data-height="1080">
    <div class="stage">

      <svg class="graph" viewBox="0 0 1400 660" width="1400" height="660" fill="none" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1450" data-sfx-volume="0.42">
        <g stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.5">
          <line x1="700" y1="70" x2="250" y2="130"></line>
          <line x1="700" y1="70" x2="1150" y2="130"></line>
          <line x1="250" y1="130" x2="150" y2="440"></line>
          <line x1="1150" y1="130" x2="1250" y2="440"></line>
          <line x1="150" y1="440" x2="440" y2="570"></line>
          <line x1="1250" y1="440" x2="960" y2="570"></line>
          <line x1="440" y1="570" x2="700" y2="600"></line>
          <line x1="960" y1="570" x2="700" y2="600"></line>
          <line x1="250" y1="130" x2="960" y2="570"></line>
          <line x1="1150" y1="130" x2="440" y2="570"></line>
          <line x1="150" y1="440" x2="1250" y2="440"></line>
          <line x1="700" y1="70" x2="700" y2="600"></line>
        </g>
        <g fill="rgba(125,211,252,0.4)" stroke="#7dd3fc" stroke-width="2">
          <circle cx="700" cy="70" r="11"></circle>
          <circle cx="250" cy="130" r="13"></circle>
          <circle cx="1150" cy="130" r="13"></circle>
          <circle cx="150" cy="440" r="11"></circle>
          <circle cx="1250" cy="440" r="13"></circle>
          <circle cx="440" cy="570" r="11"></circle>
          <circle cx="960" cy="570" r="11"></circle>
          <circle cx="700" cy="600" r="11"></circle>
        </g>
        <g class="nlabels" fill="#79857f" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="400" text-anchor="middle" opacity="0">
          <text x="250" y="98">relay</text>
          <text x="1150" y="98">queue</text>
          <text x="1250" y="414">device</text>
        </g>
      </svg>

      <svg class="tick" viewBox="0 0 30 18" width="112" height="67" fill="none" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="3420">
        <polyline points="2,9 7,15 16,4" stroke="#53bdeb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <polyline points="11,9 16,15 27,4" stroke="#53bdeb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>

      <div class="cap">the architecture, <span class="sky">leaking through</span></div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-36-ticks-arch";

    // Host data-start = 338.16 → scene-local = global − 338.16. Chunk first word "The" 338.66 = local 0.50.

    // Entrance crossfade over scene 35's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "The ticks" 338.66→339.18 (local 0.50→1.02) — the surface point appears, and holds still
    tl.fromTo(root + " .tick", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.50);

    // "architecture" 339.54 (local 1.38) → "leaking through" 340.34 (local 2.18) — the system blooms outward behind the tick
    tl.set(root + " .graph", { transformOrigin: "center center" });
    tl.fromTo(root + " .graph", { opacity: 0, scale: 0 }, { opacity: 0.62, scale: 1, duration: 0.85, ease: "back.out(1.2)" }, 1.38);
    tl.fromTo(root + " .cap", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.50);

    // "through onto" 341.04→341.44 (local ~2.5) — the node identities settle in
    tl.fromTo(root + " .nlabels", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.5);

    // "onto your screen" 341.58 (local 3.42) — the surface point glows, powered by the machine behind it
    tl.to(root + " .tick", { filter: "drop-shadow(0 0 16px rgba(83, 189, 235, 0.7))", duration: 0.4, ease: "power2.out" }, 3.42);
    tl.to(root + " .tick", { filter: "drop-shadow(0 0 6px rgba(83, 189, 235, 0.3))", duration: 0.6, ease: "power2.inOut" }, 3.9);

    // ambient — the surfaced machine breathes faintly
    tl.to(root + " .graph", { opacity: 0.5, duration: 1.7, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6);

    window.__timelines["scene-36-ticks-arch"] = tl;
  </script>
</body>
</html>
