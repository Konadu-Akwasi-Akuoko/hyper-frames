<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 22 — one upload, to a group</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-22-one-upload-to-a-group { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }

    #scene-22-one-upload-to-a-group .stage { position: absolute; inset: 0; will-change: transform; }

    /* the sender device — a phone, the one source of the single upload */
    #scene-22-one-upload-to-a-group .phone {
      position: absolute; left: 320px; top: 300px; width: 196px; height: 360px;
      border-radius: 30px; background: var(--panel);
      border: 2px solid rgba(125, 211, 252, 0.42);
      box-shadow: 0 0 38px rgba(125, 211, 252, 0.10);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-22-one-upload-to-a-group .phone .screen {
      position: absolute; inset: 16px; border-radius: 18px;
      background: linear-gradient(180deg, rgba(125,211,252,0.05), rgba(10,15,13,0.2));
      border: 1px solid rgba(125, 211, 252, 0.12);
    }
    #scene-22-one-upload-to-a-group .plabel {
      position: absolute; left: 288px; top: 678px; width: 260px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 21px; color: #9aa69f; letter-spacing: 0.06em; text-transform: uppercase;
      opacity: 0; will-change: opacity;
    }

    /* the single upload path — the one green message line, the protagonist */
    #scene-22-one-upload-to-a-group .wire {
      position: absolute; left: 540px; top: 478px; width: 824px; height: 3px;
      background: linear-gradient(90deg, rgba(37,211,102,0.25), var(--accent));
      transform-origin: left center; transform: scaleX(0);
      box-shadow: 0 0 12px rgba(37, 211, 102, 0.35); will-change: transform;
    }
    #scene-22-one-upload-to-a-group .arrowhead {
      position: absolute; left: 1356px; top: 469px;
      width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent;
      border-left: 14px solid var(--accent); opacity: 0; will-change: opacity;
    }

    /* the message itself — one green bubble, uploaded exactly once */
    #scene-22-one-upload-to-a-group .msg {
      position: absolute; left: 430px; top: 454px; width: 64px; height: 46px;
      border-radius: 13px 13px 13px 3px; background: var(--accent);
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
      opacity: 0; will-change: transform, opacity;
    }

    /* the "exactly once" counter that rides above the path */
    #scene-22-one-upload-to-a-group .x1 {
      position: absolute; left: 868px; top: 422px; width: 168px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500;
      font-size: 34px; color: var(--accent); letter-spacing: 0.04em;
      opacity: 0; will-change: transform, opacity;
    }

    /* the group — many recipients, the address, kept muted so weight stays on the line */
    #scene-22-one-upload-to-a-group .group {
      position: absolute; left: 1380px; top: 300px; width: 360px; height: 360px;
    }
    #scene-22-one-upload-to-a-group .rc {
      position: absolute; width: 78px; height: 78px; border-radius: 50%;
      background: rgba(195, 203, 199, 0.07); border: 1.5px solid rgba(195, 203, 199, 0.34);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-22-one-upload-to-a-group .rc::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px;
      transform: translate(-50%, -50%); border-radius: 50%; background: rgba(195, 203, 199, 0.3);
    }
    #scene-22-one-upload-to-a-group .rc1 { left: 64px;  top: 22px; }
    #scene-22-one-upload-to-a-group .rc2 { left: 210px; top: 76px; }
    #scene-22-one-upload-to-a-group .rc3 { left: 36px;  top: 196px; }
    #scene-22-one-upload-to-a-group .rc4 { left: 196px; top: 250px; }
    #scene-22-one-upload-to-a-group .glabel {
      position: absolute; left: 1380px; top: 700px; width: 360px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 22px; color: #9aa69f; letter-spacing: 0.07em; text-transform: uppercase;
      opacity: 0; will-change: opacity;
    }

    /* caption beneath the diagram — the honest punchline */
    #scene-22-one-upload-to-a-group .cap {
      position: absolute; left: 0; right: 0; top: 812px; text-align: center;
    }
    #scene-22-one-upload-to-a-group .cap .l1 {
      font-size: 38px; font-weight: 600; color: var(--soft); letter-spacing: 0.01em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-22-one-upload-to-a-group .cap .l2 {
      margin-top: 12px; font-size: 46px; font-weight: 700; color: var(--fg); letter-spacing: 0.004em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-22-one-upload-to-a-group .cap .l2 .eo { color: var(--accent); }
  </style>
</head>
<body>
  <div id="scene-22-one-upload-to-a-group" data-composition-id="scene-22-one-upload-to-a-group" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="phone" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500" data-sfx-volume="0.42">
        <div class="screen"></div>
      </div>
      <div class="plabel">your phone</div>

      <div class="wire" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="4260"></div>
      <div class="arrowhead"></div>
      <div class="msg" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="880" data-sfx-volume="0.42"></div>
      <div class="x1" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5920">&times;1</div>

      <div class="group">
        <div class="rc rc1"></div>
        <div class="rc rc2"></div>
        <div class="rc rc3"></div>
        <div class="rc rc4"></div>
      </div>
      <div class="glabel">a group</div>

      <div class="cap">
        <div class="l1">Send it to a group &mdash;</div>
        <div class="l2" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="7500">your phone uploads it <span class="eo">exactly once</span>.</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-22-one-upload-to-a-group";

    // Host data-start = 222.64 → scene-local = global − 222.64. Chunk first word 223.14 = local 0.50.

    // Entrance crossfade over scene 21's tail (overlap 0–0.5) — empty frame covers the seam,
    // the phone then lands on "one" as scene 21 cuts.
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "And one message" 223.14→223.52 (local 0.50→0.88) — the sender appears, then the one message pops
    tl.fromTo(root + " .phone", { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.50);
    tl.fromTo(root + " .plabel", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.out" }, 0.80);
    tl.fromTo(root + " .msg", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, 0.88);

    // "isn't always headed to just one person" 224.16→225.54 (local 1.52→2.90) — the group, the many,
    // settles in muted on the right: the message is NOT bound for just one
    tl.fromTo(root + " .group .rc",
      { opacity: 0, scale: 0.6 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)", stagger: 0.13 }, 1.52);
    tl.fromTo(root + " .glabel", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.out" }, 2.40);

    // "Send it to a group," 226.90→227.44 (local 4.26→4.80) — the single upload draws across:
    // the green line extends phone→group while the one message rides it (adapted from
    // database-fan-out-to-replicas-draw-on: the source→anchor draw-on phase only, no branch expansion)
    tl.to(root + " .wire", { scaleX: 1, duration: 0.72, ease: "power2.inOut" }, 4.26);
    tl.to(root + " .msg", { x: 868, duration: 0.72, ease: "power2.inOut" }, 4.30);
    tl.fromTo(root + " .arrowhead", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.out" }, 4.86);
    tl.fromTo(root + " .cap .l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.26);

    // "your phone still uploads it" 228.56→229.86 (local 5.92→7.22) — the count on the path:
    // one copy left the phone, exactly once
    tl.fromTo(root + " .x1", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" }, 5.92);

    // "exactly once." 230.14→230.82 (local 7.50→8.18) — the punchline lands, green bloom on the words and the count
    tl.fromTo(root + " .cap .l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.50);
    tl.fromTo(root + " .cap .l2 .eo",
      { textShadow: "0 0 0 rgba(37,211,102,0)" },
      { textShadow: "0 0 26px rgba(37, 211, 102, 0.5)", duration: 0.5, ease: "power2.out" }, 7.50);
    tl.to(root + " .x1", { scale: 1.14, duration: 0.18, ease: "power2.out" }, 7.50);
    tl.to(root + " .x1", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 7.68);
    tl.to(root + " .wire", { boxShadow: "0 0 20px rgba(37, 211, 102, 0.6)", duration: 0.5, ease: "power2.out" }, 7.50);

    // idle — the diagram drifts faintly (finite yoyo)
    tl.to(root + " .stage", { y: -4, duration: 3.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.0);

    window.__timelines["scene-22-one-upload-to-a-group"] = tl;
  </script>
</body>
</html>
