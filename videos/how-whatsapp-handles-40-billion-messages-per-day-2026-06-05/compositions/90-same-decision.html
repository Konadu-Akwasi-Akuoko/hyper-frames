<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 90 — The leverage and the limits were the same decision</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-90-same { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-90-same .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-90-same .pair {
      position: absolute; left: 0; right: 0; top: 392px;
      display: flex; align-items: center; justify-content: center; gap: 48px;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 92px; line-height: 1;
      letter-spacing: -0.028em;
    }
    #scene-90-same .lev { color: var(--accent); opacity: 0; will-change: transform, opacity, text-shadow; }
    #scene-90-same .eq { color: var(--dim); font-weight: 600; opacity: 0; will-change: transform, opacity; }
    #scene-90-same .lim { color: var(--cost); opacity: 0; will-change: transform, opacity, text-shadow; }

    #scene-90-same .same {
      position: absolute; left: 0; right: 0; top: 560px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 58px;
      color: var(--soft); letter-spacing: -0.015em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-90-same .same .one { color: var(--fg); font-weight: 800; will-change: text-shadow; }
  </style>
</head>
<body>
  <div id="scene-90-same" data-composition-id="scene-90-same" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="pair">
        <span class="lev" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">leverage</span>
        <span class="eq">=</span>
        <span class="lim" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="1380" data-sfx-volume="0.35">limits</span>
      </div>

      <div class="same" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2140" data-sfx-volume="0.35">the <span class="one">same decision</span></div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-90-same";

    // Host data-start = 642.68 → scene-local = global − 642.68. Chunk first word "The" 643.18 = local 0.50.

    // Entrance crossfade over scene 89's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "The leverage" 643.18→643.30 (local 0.50→0.62) — the upside
    tl.fromTo(root + " .lev", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 0.50);
    tl.fromTo(root + " .lev", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 28px rgba(37,211,102,0.4)", duration: 0.45, ease: "power2.out" }, 0.7);

    // "and the limits" 643.80→644.06 (local 1.12→1.38) — the cost, and the equals
    tl.fromTo(root + " .eq", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.8)" }, 1.00);
    tl.fromTo(root + " .lim", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 1.38);
    tl.fromTo(root + " .lim", { textShadow: "0 0 0px rgba(240,180,41,0)" }, { textShadow: "0 0 28px rgba(240,180,41,0.4)", duration: 0.45, ease: "power2.out" }, 1.58);

    // "were the same decision." 644.48→645.40 (local 1.80→2.72) — unified
    tl.fromTo(root + " .same", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.14);
    tl.fromTo(root + " .same .one", { textShadow: "0 0 0px rgba(233,237,235,0)" }, { textShadow: "0 0 26px rgba(233,237,235,0.3)", duration: 0.5, ease: "power2.out" }, 2.5);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.0);

    window.__timelines["scene-90-same"] = tl;
  </script>
</body>
</html>
