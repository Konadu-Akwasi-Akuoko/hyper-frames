<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 53 — link a new laptop, and your history doesn't come from the server</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-53-nfs { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-53-nfs .stage { position: absolute; inset: 0; will-change: transform; }

    /* the server on the left — the blind one */
    #scene-53-nfs .server {
      position: absolute; left: 300px; top: 372px; width: 196px; height: 234px;
      background: var(--panel); border: 1.6px solid #2b3a44; border-radius: 13px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-53-nfs .server .slot { position: absolute; left: 22px; right: 22px; height: 26px; border: 1.4px solid #243843; border-radius: 5px; }
    #scene-53-nfs .server .s1 { top: 26px; } #scene-53-nfs .server .s2 { top: 66px; } #scene-53-nfs .server .s3 { top: 106px; }
    #scene-53-nfs .server .dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); right: 34px; }
    #scene-53-nfs .server .slbl {
      position: absolute; left: 0; right: 0; bottom: 20px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 20px;
      color: var(--accent-2); letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* the new laptop on the right being linked */
    #scene-53-nfs .laptop {
      position: absolute; left: 1306px; top: 392px; width: 220px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-53-nfs .laptop .lnm {
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px; color: var(--soft);
    }
    #scene-53-nfs .laptop .lnm .n { color: var(--accent-2); font-weight: 700; }
    #scene-53-nfs .ring {
      position: absolute; left: 1356px; top: 388px; width: 120px; height: 120px; margin: 0;
      border-radius: 50%; border: 2px solid rgba(125,211,252,0.5);
      opacity: 0; will-change: transform, opacity;
    }

    /* the history-attempt arrow from server to laptop */
    #scene-53-nfs .flow { position: absolute; inset: 0; overflow: visible; }
    #scene-53-nfs .flow .fl {
      fill: none; stroke: var(--muted); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 900; stroke-dashoffset: 900; will-change: stroke-dashoffset, opacity;
    }
    #scene-53-nfs .block {
      position: absolute; left: 50%; top: 452px; margin-left: -34px; opacity: 0;
      transform: scale(0.5); transform-origin: center center; will-change: transform, opacity;
    }

    /* caption */
    #scene-53-nfs .cap {
      position: absolute; left: 0; right: 0; top: 712px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 46px;
      color: var(--soft); letter-spacing: -0.01em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-53-nfs .cap .no { color: var(--danger); }
  </style>
</head>
<body>
  <div id="scene-53-nfs" data-composition-id="scene-53-nfs" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="server">
        <div class="slot s1"><span class="dot"></span></div>
        <div class="slot s2"><span class="dot"></span></div>
        <div class="slot s3"><span class="dot"></span></div>
        <div class="slbl">server</div>
      </div>

      <div class="ring"></div>
      <div class="laptop" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="780" data-sfx-volume="0.35">
        <svg viewBox="0 0 48 40" width="120" height="100" fill="none">
          <rect x="9" y="6" width="30" height="20" rx="2.4" stroke="#7dd3fc" stroke-width="2.2"></rect>
          <path d="M4 32 h40 l-3 -6 H7 Z" stroke="#7dd3fc" stroke-width="2.2" stroke-linejoin="round"></path>
        </svg>
        <div class="lnm"><span class="n">new</span> laptop</div>
      </div>

      <svg class="flow" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
        <path class="fl" d="M512 486 H1290 M1276 478 l16 8 l-16 8"></path>
      </svg>

      <svg class="block" viewBox="0 0 48 48" width="68" height="68" fill="none" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2900" data-sfx-volume="0.35">
        <circle cx="24" cy="24" r="20" stroke="#ff6b5d" stroke-width="3" fill="rgba(10,15,13,0.85)"></circle>
        <line x1="15" y1="15" x2="33" y2="33" stroke="#ff6b5d" stroke-width="3.2" stroke-linecap="round"></line>
        <line x1="33" y1="15" x2="15" y2="33" stroke="#ff6b5d" stroke-width="3.2" stroke-linecap="round"></line>
      </svg>

      <div class="cap">your history <span class="no">doesn't come from the server</span></div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-53-nfs";

    // Host data-start = 446.68 → scene-local = global − 446.68. Chunk first word "And" 447.18 = local 0.50.

    // Entrance crossfade over scene 52's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "And when you link a new laptop" 447.18→448.26 (local 0.50→1.58) — the server sits, the new laptop links in
    tl.fromTo(root + " .server", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 0.50);
    tl.fromTo(root + " .laptop", { opacity: 0, x: 14, scale: 0.94 }, { opacity: 1, x: 0, scale: 1, duration: 0.46, ease: "back.out(1.4)" }, 0.86);
    tl.fromTo(root + " .ring", { opacity: 0.7, scale: 0.7 }, { opacity: 0, scale: 1.5, duration: 0.9, ease: "power2.out" }, 0.86);
    tl.fromTo(root + " .ring", { opacity: 0.7, scale: 0.7 }, { opacity: 0, scale: 1.5, duration: 0.9, ease: "power2.out" }, 1.4);

    // "your history" 449.08→449.24 (local 2.40→2.56) — the caption sets up, the arrow reaches out from the server
    tl.fromTo(root + " .cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" }, 2.40);
    tl.fromTo(root + " .flow .fl", { strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.40);

    // "doesn't come from the server" 449.50→450.26 (local 2.82→3.58) — the attempt is blocked, arrow dims
    tl.fromTo(root + " .block", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.2)" }, 2.90);
    tl.to(root + " .flow .fl", { opacity: 0.28, duration: 0.4, ease: "power2.out" }, 2.90);
    tl.fromTo(root + " .cap .no", { textShadow: "0 0 0px rgba(255,107,93,0)" }, { textShadow: "0 0 22px rgba(255, 107, 93, 0.5)", duration: 0.44, ease: "power2.out" }, 2.90);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.8);

    window.__timelines["scene-53-nfs"] = tl;
  </script>
</body>
</html>
