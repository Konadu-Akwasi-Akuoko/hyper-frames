<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 54 — your phone encrypts a slice of recent chat and hands it directly to your laptop</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-54-direct { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-54-direct .stage { position: absolute; inset: 0; will-change: transform; }

    /* the dimmed, bypassed server up top */
    #scene-54-direct .server {
      position: absolute; left: 50%; top: 196px; margin-left: -86px; width: 172px; height: 116px;
      background: rgba(16,22,19,0.5); border: 1.4px solid #243843; border-radius: 11px;
      opacity: 0; will-change: opacity;
    }
    #scene-54-direct .server .slot { position: absolute; left: 18px; right: 18px; height: 20px; border: 1.2px solid #1f2e36; border-radius: 4px; }
    #scene-54-direct .server .s1 { top: 18px; } #scene-54-direct .server .s2 { top: 46px; }
    #scene-54-direct .server .slbl {
      position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 16px;
      color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase;
    }
    #scene-54-direct .server .sslash { position: absolute; inset: 0; overflow: visible; }
    #scene-54-direct .server .sslash line { stroke-dasharray: 210; stroke-dashoffset: 210; will-change: stroke-dashoffset; }

    /* the phone on the left */
    #scene-54-direct .phone {
      position: absolute; left: 320px; top: 432px; width: 160px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-54-direct .phone .pnm { font-family: "Inter", sans-serif; font-weight: 600; font-size: 24px; color: var(--soft); }

    /* the slice of recent chat */
    #scene-54-direct .chat {
      position: absolute; left: 520px; top: 426px; width: 260px;
      display: flex; flex-direction: column; gap: 12px;
      opacity: 0; will-change: opacity;
    }
    #scene-54-direct .chat .bub {
      height: 38px; border-radius: 11px; border: 1.5px solid rgba(37,211,102,0.55);
      background: rgba(37,211,102,0.08); opacity: 0; will-change: transform, opacity;
    }
    #scene-54-direct .chat .b1 { width: 70%; }
    #scene-54-direct .chat .b2 { width: 88%; align-self: flex-end; }
    #scene-54-direct .chat .b3 { width: 60%; }
    #scene-54-direct .chat .slabel {
      position: absolute; left: 0; top: -34px;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 18px;
      color: var(--accent); letter-spacing: 0.06em; opacity: 0; will-change: opacity;
    }

    /* the direct arc path phone → laptop */
    #scene-54-direct .arc { position: absolute; inset: 0; overflow: visible; }
    #scene-54-direct .arc .ap {
      fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round;
      stroke-dasharray: 1100; stroke-dashoffset: 1100; will-change: stroke-dashoffset, opacity; opacity: 0;
    }

    /* the encrypted packet that travels */
    #scene-54-direct .packet {
      position: absolute; left: 612px; top: 588px; width: 64px; height: 48px;
      background: var(--panel); border: 1.6px solid var(--accent); border-radius: 8px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-54-direct .packet .pl { position: absolute; left: 50%; top: 50%; margin-left: -9px; margin-top: -10px; }

    /* the laptop on the right */
    #scene-54-direct .laptop {
      position: absolute; left: 1392px; top: 432px; width: 200px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      opacity: 0; will-change: transform, opacity, filter;
    }
    #scene-54-direct .laptop .lnm { font-family: "Inter", sans-serif; font-weight: 600; font-size: 24px; color: var(--soft); }

    /* the "directly" emphasis */
    #scene-54-direct .dlabel {
      position: absolute; left: 0; right: 0; top: 700px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 52px;
      color: var(--accent); letter-spacing: -0.012em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
  </style>
</head>
<body>
  <div id="scene-54-direct" data-composition-id="scene-54-direct" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="server">
        <div class="slot s1"></div>
        <div class="slot s2"></div>
        <div class="slbl">server</div>
        <svg class="sslash" viewBox="0 0 172 116" width="172" height="116" fill="none">
          <line x1="20" y1="100" x2="152" y2="16" stroke="#ff6b5d" stroke-width="2.6" stroke-linecap="round"></line>
        </svg>
      </div>

      <div class="phone" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500" data-sfx-volume="0.35">
        <svg viewBox="0 0 32 48" width="80" height="120" fill="none">
          <rect x="5" y="3" width="22" height="42" rx="4.4" stroke="#7dd3fc" stroke-width="2.3"></rect>
          <line x1="12.5" y1="40" x2="19.5" y2="40" stroke="#7dd3fc" stroke-width="2.3" stroke-linecap="round"></line>
        </svg>
        <div class="pnm">your phone</div>
      </div>

      <div class="chat">
        <div class="slabel">recent chat</div>
        <div class="bub b1"></div>
        <div class="bub b2"></div>
        <div class="bub b3"></div>
      </div>

      <svg class="arc" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
        <path class="ap" d="M470 540 C760 720 1140 720 1430 540"></path>
      </svg>

      <div class="packet" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3080">
        <svg class="pl" viewBox="0 0 24 24" width="18" height="20" fill="none">
          <rect x="5" y="10" width="14" height="10" rx="2" stroke="#25d366" stroke-width="2" fill="rgba(37,211,102,0.12)"></rect>
          <path d="M7.6 10 v-2.4 a4.4 4.4 0 0 1 8.8 0 v2.4" stroke="#25d366" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </div>

      <div class="laptop" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="4900">
        <svg viewBox="0 0 48 40" width="116" height="96" fill="none">
          <rect x="9" y="6" width="30" height="20" rx="2.4" stroke="#7dd3fc" stroke-width="2.2"></rect>
          <path d="M4 32 h40 l-3 -6 H7 Z" stroke="#7dd3fc" stroke-width="2.2" stroke-linejoin="round"></path>
        </svg>
        <div class="lnm">your laptop</div>
      </div>

      <div class="dlabel">directly</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-54-direct";

    // Host data-start = 450.56 → scene-local = global − 450.56. Chunk first word "Your" 451.06 = local 0.50.

    // Entrance crossfade over scene 53's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // dimmed bypassed server fades in quietly behind
    tl.fromTo(root + " .server", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.50);
    tl.fromTo(root + " .server .sslash line", { strokeDashoffset: 210 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.80);

    // "Your phone" 451.06→451.28 (local 0.50→0.72) — the phone appears
    tl.fromTo(root + " .phone", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 0.50);

    // "encrypts a slice of your recent chat" 451.68→453.16 (local 1.12→2.60) — the chat slice appears, then seals
    tl.fromTo(root + " .chat", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.12);
    tl.fromTo(root + " .chat .b1", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.20);
    tl.fromTo(root + " .chat .b2", { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.36);
    tl.fromTo(root + " .chat .b3", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.52);
    // "slice"/"recent chat" 452.26→453.16 (local 1.70→2.60) — the slice label marks it as recent
    tl.fromTo(root + " .chat .slabel", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 1.70);

    // "and hands it over" 453.64→454.40 (local 3.08→3.84) — the slice seals into a packet and launches along the arc
    tl.fromTo(root + " .chat", { opacity: 1 }, { opacity: 0.25, duration: 0.4, ease: "power2.out" }, 3.08);
    tl.fromTo(root + " .arc .ap", { opacity: 0, strokeDashoffset: 1100 }, { opacity: 1, strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 3.08);
    tl.fromTo(root + " .packet", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2)" }, 3.08);
    // travel the arc: across (x) with a dip then rise (y) — approximated in two hops
    tl.to(root + " .packet", { x: 384, y: 96, duration: 0.6, ease: "sine.in" }, 3.34);
    tl.to(root + " .packet", { x: 800, y: 0, duration: 0.6, ease: "sine.out" }, 3.94);

    // "directly" 454.66 (local 4.10) — the emphasis lands green
    tl.fromTo(root + " .dlabel", { opacity: 0, y: 12, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 4.10);
    tl.fromTo(root + " .dlabel", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 26px rgba(37, 211, 102, 0.5)", duration: 0.44, ease: "power2.out" }, 4.10);

    // "to your laptop" 455.44→455.70 (local 4.88→5.14) — the packet lands, laptop lights up
    tl.to(root + " .packet", { opacity: 0, duration: 0.24, ease: "power2.in" }, 4.86);
    tl.fromTo(root + " .laptop", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.50);
    tl.fromTo(root + " .laptop", { filter: "drop-shadow(0 0 0px rgba(37,211,102,0))" }, { filter: "drop-shadow(0 0 16px rgba(37, 211, 102, 0.5))", duration: 0.4, ease: "power2.out" }, 4.88);
    tl.to(root + " .laptop", { filter: "drop-shadow(0 0 4px rgba(37, 211, 102, 0.22))", duration: 0.5, ease: "power2.inOut" }, 5.4);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 5.2);

    window.__timelines["scene-54-direct"] = tl;
  </script>
</body>
</html>
