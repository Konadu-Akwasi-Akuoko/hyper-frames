<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 57 — they bought big bare-metal boxes and tuned them hard</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-57-boxes { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-57-boxes .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-57-boxes .box {
      position: absolute; top: 256px; width: 252px; height: 440px;
      background: var(--panel); border: 1.8px solid #2b3a44; border-radius: 16px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-57-boxes .b1 { left: 470px; }
    #scene-57-boxes .b2 { left: 834px; }
    #scene-57-boxes .b3 { left: 1198px; }
    #scene-57-boxes .box .slot {
      position: absolute; left: 26px; right: 70px; height: 30px; border: 1.4px solid #243843; border-radius: 6px;
    }
    #scene-57-boxes .box .s1 { top: 30px; } #scene-57-boxes .box .s2 { top: 74px; }
    #scene-57-boxes .box .s3 { top: 118px; } #scene-57-boxes .box .s4 { top: 162px; }
    #scene-57-boxes .box .dot { position: absolute; top: 38px; right: 30px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-2); }

    /* the tuning meter on each box */
    #scene-57-boxes .box .meter {
      position: absolute; right: 26px; top: 30px; width: 22px; height: 176px;
      border: 1.5px solid #243843; border-radius: 6px; overflow: hidden;
    }
    #scene-57-boxes .box .fill {
      position: absolute; left: 2px; right: 2px; bottom: 2px; height: 168px;
      background: linear-gradient(to top, #25d366, #f0b429);
      transform: scaleY(0); transform-origin: bottom center; will-change: transform;
    }
    #scene-57-boxes .box .blbl {
      position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 19px;
      color: var(--accent-2); letter-spacing: 0.12em; text-transform: uppercase;
    }

    #scene-57-boxes .tuned {
      position: absolute; left: 0; right: 0; top: 760px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 60px;
      color: var(--cost); letter-spacing: -0.012em; text-transform: none;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
  </style>
</head>
<body>
  <div id="scene-57-boxes" data-composition-id="scene-57-boxes" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="box b1" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500" data-sfx-volume="0.35">
        <div class="slot s1"></div><div class="slot s2"></div><div class="slot s3"></div><div class="slot s4"></div>
        <div class="dot"></div>
        <div class="meter"><div class="fill f1"></div></div>
        <div class="blbl">box</div>
      </div>

      <div class="box b2">
        <div class="slot s1"></div><div class="slot s2"></div><div class="slot s3"></div><div class="slot s4"></div>
        <div class="dot"></div>
        <div class="meter"><div class="fill f2"></div></div>
        <div class="blbl">box</div>
      </div>

      <div class="box b3">
        <div class="slot s1"></div><div class="slot s2"></div><div class="slot s3"></div><div class="slot s4"></div>
        <div class="dot"></div>
        <div class="meter"><div class="fill f3"></div></div>
        <div class="blbl">box</div>
      </div>

      <div class="tuned">tuned hard</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-57-boxes";

    // Host data-start = 470.12 → scene-local = global − 470.12. Chunk first word "They" 470.62 = local 0.50.

    // Entrance crossfade over scene 56's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "They bought brick bare metal boxes" 470.62→472.10 (local 0.50→1.98) — the big boxes land, one by one
    tl.fromTo(root + " .b1", { opacity: 0, y: 18, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 0.50);
    tl.fromTo(root + " .b2", { opacity: 0, y: 18, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 0.80);
    tl.fromTo(root + " .b3", { opacity: 0, y: 18, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 1.10);

    // "and tuned them hard" 473.00→473.66 (local 2.88→3.54) — the meters crank up to redline
    tl.fromTo(root + " .f1", { scaleY: 0 }, { scaleY: 1, duration: 0.66, ease: "power2.in" }, 2.88);
    tl.fromTo(root + " .f2", { scaleY: 0 }, { scaleY: 1, duration: 0.66, ease: "power2.in" }, 2.98);
    tl.fromTo(root + " .f3", { scaleY: 0 }, { scaleY: 1, duration: 0.66, ease: "power2.in" }, 3.08);
    // "hard" 473.66 (local 3.54) — the label slams in amber
    tl.fromTo(root + " .tuned", { opacity: 0, y: 16, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, 3.54);
    tl.fromTo(root + " .tuned", { textShadow: "0 0 0px rgba(240,180,41,0)" }, { textShadow: "0 0 28px rgba(240, 180, 41, 0.5)", duration: 0.44, ease: "power2.out" }, 3.54);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-57-boxes"] = tl;
  </script>
</body>
</html>
