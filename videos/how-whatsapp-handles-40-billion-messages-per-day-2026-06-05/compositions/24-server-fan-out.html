<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 24 — server-side fan-out, a copy per member</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-24-server-fan-out { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }

    #scene-24-server-fan-out .stage { position: absolute; inset: 0; will-change: transform; }

    /* the branch lines — the one copy's paths fanning out, drawn on per member */
    #scene-24-server-fan-out .wires { position: absolute; inset: 0; }
    #scene-24-server-fan-out .br { fill: none; stroke: rgba(37, 211, 102, 0.5); stroke-width: 2.5; stroke-linecap: round; }

    /* the single source copy at upper-left — the tagged copy carried from scene 23 */
    #scene-24-server-fan-out .source {
      position: absolute; left: 256px; top: 168px; width: 252px; height: 92px;
      border-radius: 13px; background: rgba(37, 211, 102, 0.16);
      border: 1.5px solid var(--accent); box-shadow: 0 0 26px rgba(37, 211, 102, 0.32);
      padding: 22px 22px 0; opacity: 0; will-change: transform, opacity;
    }
    #scene-24-server-fan-out .source .pl { height: 11px; border-radius: 6px; background: rgba(37, 211, 102, 0.6); }
    #scene-24-server-fan-out .source .pl.a { width: 70%; }
    #scene-24-server-fan-out .source .pl.b { width: 42%; margin-top: 13px; opacity: 0.7; }
    #scene-24-server-fan-out .source .gid {
      position: absolute; right: -10px; top: -16px;
      padding: 4px 11px; border-radius: 7px;
      background: rgba(125, 211, 252, 0.14); border: 1px solid rgba(125, 211, 252, 0.45);
      font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--accent-2); letter-spacing: 0.02em;
    }
    #scene-24-server-fan-out .source .slab {
      position: absolute; left: 4px; bottom: -34px;
      font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--muted); letter-spacing: 0.05em;
    }

    /* counter — copies queued, climbs to 5 */
    #scene-24-server-fan-out .counter {
      position: absolute; left: 1306px; top: 120px; width: 280px;
      opacity: 0; will-change: opacity;
    }
    #scene-24-server-fan-out .counter .cnum {
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 50px;
      color: var(--fg); letter-spacing: 0.01em; font-variant-numeric: tabular-nums;
    }
    #scene-24-server-fan-out .counter .clabel {
      margin-top: 2px; font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 20px;
      color: var(--soft); letter-spacing: 0.06em; text-transform: uppercase;
    }

    /* member rows — the looked-up group members (sky-blue entities) */
    #scene-24-server-fan-out .member {
      position: absolute; left: 966px; width: 56px; height: 56px; border-radius: 50%;
      background: rgba(125, 211, 252, 0.10); border: 1.5px solid rgba(125, 211, 252, 0.5);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-24-server-fan-out .member::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
      transform: translate(-50%, -50%); border-radius: 50%; background: rgba(125, 211, 252, 0.45);
    }
    #scene-24-server-fan-out .handle {
      position: absolute; left: 1044px; font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 26px; color: var(--muted); letter-spacing: 0.01em; opacity: 0; will-change: opacity;
    }

    /* the queued green copies — one per member, the multiplication */
    #scene-24-server-fan-out .copy {
      position: absolute; left: 1306px; width: 158px; height: 54px; border-radius: 11px;
      background: rgba(37, 211, 102, 0.14); border: 1.5px solid rgba(37, 211, 102, 0.85);
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.22);
      display: flex; align-items: center; padding: 0 16px; gap: 9px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-24-server-fan-out .copy .bar { height: 9px; border-radius: 5px; background: rgba(37, 211, 102, 0.6); }
    #scene-24-server-fan-out .copy .bar.a { width: 62px; }
    #scene-24-server-fan-out .copy .bar.b { width: 34px; opacity: 0.7; }

    /* faint queue column header */
    #scene-24-server-fan-out .qhead {
      position: absolute; left: 1306px; top: 232px; width: 158px; text-align: left;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 17px;
      color: var(--accent-2); letter-spacing: 0.10em; text-transform: uppercase; opacity: 0;
    }

    /* narration caption */
    #scene-24-server-fan-out .cap {
      position: absolute; left: 0; right: 0; top: 858px; text-align: center;
    }
    #scene-24-server-fan-out .cap .l1 {
      font-size: 37px; font-weight: 500; color: var(--soft); letter-spacing: 0.005em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-24-server-fan-out .cap .l2 {
      margin-top: 12px; font-size: 41px; font-weight: 600; color: var(--fg); letter-spacing: 0.004em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-24-server-fan-out .cap .l2 .em { color: var(--accent); }
  </style>
</head>
<body>
  <div id="scene-24-server-fan-out" data-composition-id="scene-24-server-fan-out" data-width="1920" data-height="1080">
    <div class="stage">
      <svg class="wires" viewBox="0 0 1920 1080" preserveAspectRatio="none" width="1920" height="1080">
        <path class="br br1" d="M500 214 C 720 214 742 300 966 300"></path>
        <path class="br br2" d="M500 214 C 720 214 742 408 966 408"></path>
        <path class="br br3" d="M500 214 C 720 214 742 516 966 516"></path>
        <path class="br br4" d="M500 214 C 720 214 742 624 966 624"></path>
        <path class="br br5" d="M500 214 C 720 214 742 732 966 732"></path>
      </svg>

      <div class="source">
        <div class="pl a"></div>
        <div class="pl b"></div>
        <div class="gid">gid:7f3a&middot;9c</div>
        <div class="slab">the one copy</div>
      </div>

      <div class="counter">
        <div class="cnum">0</div>
        <div class="clabel">copies queued</div>
      </div>

      <div class="qhead">queue</div>

      <!-- member nodes -->
      <div class="member m1" style="top: 272px"></div>
      <div class="member m2" style="top: 380px"></div>
      <div class="member m3" style="top: 488px"></div>
      <div class="member m4" style="top: 596px"></div>
      <div class="member m5" style="top: 704px"></div>

      <div class="handle h1" style="top: 286px">@amara</div>
      <div class="handle h2" style="top: 394px">@kofi</div>
      <div class="handle h3" style="top: 502px">@lena</div>
      <div class="handle h4" style="top: 610px">@diego</div>
      <div class="handle h5" style="top: 718px">@sora</div>

      <!-- queued copies, one per member -->
      <div class="copy c1" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="3340" style="top: 273px"><div class="bar a"></div><div class="bar b"></div></div>
      <div class="copy c2" style="top: 381px"><div class="bar a"></div><div class="bar b"></div></div>
      <div class="copy c3" style="top: 489px"><div class="bar a"></div><div class="bar b"></div></div>
      <div class="copy c4" style="top: 597px"><div class="bar a"></div><div class="bar b"></div></div>
      <div class="copy c5" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4540" data-sfx-volume="0.42" style="top: 705px"><div class="bar a"></div><div class="bar b"></div></div>

      <div class="cap">
        <div class="l1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="760" data-sfx-volume="0.42">It looks up every member &mdash;</div>
        <div class="l2">and queues <span class="em">a separate copy</span> for each one.</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-24-server-fan-out";

    // Host data-start = 238.82 → scene-local = global − 238.82. Chunk first word 239.32 = local 0.50.

    // Prime the branch paths for a deterministic draw-on (getTotalLength is deterministic).
    document.querySelectorAll(root + " .br").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });

    const members = ["1", "2", "3", "4", "5"];
    const cnum = document.querySelector(root + " .counter .cnum");
    const cobj = { n: 0 };

    // Entrance crossfade over scene 23's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "It" 239.32 (local 0.50) — the single source copy is present on the server
    tl.fromTo(root + " .source", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.50);

    // "looks up every member" 239.58→240.95 (local 0.76→2.13) — the roster of members resolves
    tl.fromTo(root + " .cap .l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.76);
    members.forEach((m, i) => {
      const at = 0.86 + i * 0.18;
      tl.fromTo(root + " .member.m" + m, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.5)" }, at);
      tl.fromTo(root + " .handle.h" + m, { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.36, ease: "power2.out" }, at + 0.05);
    });

    // "queues a separate copy for each one" 241.94→243.98 (local 3.12→5.16) — the fan-out fires:
    // each branch draws and a green copy snaps into that member's queue, staggered top-to-bottom
    // (adapted from database-fan-out-to-replicas-draw-on: source anchor held, branches draw one after another)
    tl.fromTo(root + " .cap .l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.12);
    tl.fromTo(root + " .counter", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 3.00);
    tl.fromTo(root + " .qhead", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 3.00);

    members.forEach((m, i) => {
      const at = 3.12 + i * 0.30;
      tl.to(root + " .br" + m, { strokeDashoffset: 0, duration: 0.32, ease: "power2.inOut" }, at);
      tl.fromTo(root + " .copy.c" + m,
        { opacity: 0, scale: 0.85, x: 14 },
        { opacity: 1, scale: 1, x: 0, duration: 0.26, ease: "power2.out" }, at + 0.22);
    });

    // the counter climbs 0→5 as the copies land
    tl.to(cobj, { n: 5, duration: 1.5, ease: "none",
      onUpdate: () => { cnum.textContent = Math.round(cobj.n); } }, 3.12);

    // "each one." 243.74 (local 4.92) — the fan is complete, a soft green bloom across the queued copies
    tl.to(root + " .copy", { boxShadow: "0 0 22px rgba(37, 211, 102, 0.4)", duration: 0.5, ease: "power2.out" }, 4.92);

    // idle — the fan drifts faintly (finite yoyo)
    tl.to(root + " .stage", { y: -4, duration: 3.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.4);

    window.__timelines["scene-24-server-fan-out"] = tl;
  </script>
</body>
</html>
