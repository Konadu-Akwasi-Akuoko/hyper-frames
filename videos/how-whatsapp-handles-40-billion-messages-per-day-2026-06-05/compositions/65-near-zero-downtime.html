<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 65 — that's the near-zero downtime claim</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-65-zero { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-65-zero .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-65-zero .kick {
      position: absolute; left: 0; right: 0; top: 322px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 25px;
      color: var(--muted); letter-spacing: 0.22em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-65-zero .big {
      position: absolute; left: 0; right: 0; top: 380px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 230px; line-height: 1;
      color: var(--accent); letter-spacing: -0.03em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }

    #scene-65-zero .dlbl {
      position: absolute; left: 0; right: 0; top: 668px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 40px;
      color: var(--accent-2); letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-65-zero .claim {
      position: absolute; left: 50%; margin-left: -98px; top: 758px; width: 196px; padding: 8px 0; text-align: center;
      border: 1.7px solid var(--muted); border-radius: 9px;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 22px;
      color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0; transform: scale(1.3); transform-origin: center center; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-65-zero" data-composition-id="scene-65-zero" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="kick">near-zero</div>
      <div class="big" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="1240" data-sfx-volume="0.35">&#8776;&#8201;0</div>
      <div class="dlbl">downtime</div>
      <div class="claim" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2000">the claim</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-65-zero";

    // Host data-start = 513.52 → scene-local = global − 513.52. Chunk first word "That's" 514.02 = local 0.50.

    // Entrance crossfade over scene 64's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "That's the" 514.02→514.22 (local 0.50→0.70) — the kicker
    tl.fromTo(root + " .kick", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.50);

    // "near zero downtime" 514.42→515.52 (local 0.90→2.00) — the big near-zero figure slams in, downtime named
    tl.fromTo(root + " .big", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.46, ease: "back.out(1.6)" }, 0.90);
    tl.fromTo(root + " .big", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 44px rgba(37, 211, 102, 0.45)", duration: 0.5, ease: "power2.out" }, 1.24);
    tl.fromTo(root + " .dlbl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 1.42);

    // "claim" 515.52 (local 2.00) — the claim tag stamps under it
    tl.fromTo(root + " .claim", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.8)" }, 2.00);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-65-zero"] = tl;
  </script>
</body>
</html>
