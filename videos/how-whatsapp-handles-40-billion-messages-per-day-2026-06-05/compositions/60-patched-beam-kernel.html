<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 60 — they patched the BEAM runtime and the FreeBSD kernel themselves, hunting down lock contention</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-60-patch { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-60-patch .stage { position: absolute; inset: 0; will-change: transform; }

    /* the two layers of the stack they own */
    #scene-60-patch .layer {
      position: absolute; left: 50%; margin-left: -460px; width: 920px; height: 132px;
      background: var(--panel); border: 1.7px solid #2b3a44; border-radius: 14px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-60-patch .l-beam { top: 286px; }
    #scene-60-patch .l-kernel { top: 450px; }
    #scene-60-patch .layer .lname {
      position: absolute; left: 38px; top: 50%; transform: translateY(-50%);
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 32px;
      color: var(--accent-2); letter-spacing: 0.04em;
    }
    #scene-60-patch .layer .lsub {
      position: absolute; left: 40px; top: 50%; margin-top: 22px;
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 19px;
      color: var(--muted); letter-spacing: 0.01em;
    }

    /* the patch badge they applied by hand */
    #scene-60-patch .layer .patch {
      position: absolute; right: 34px; top: 50%; margin-top: -34px; width: 68px; height: 68px;
      border-radius: 13px; border: 1.7px solid var(--accent);
      background: rgba(37,211,102,0.07);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-60-patch .layer .ptag {
      position: absolute; right: 116px; top: 50%; margin-top: -13px;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 18px;
      color: var(--accent); letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0; will-change: opacity;
    }

    /* the red lock-contention hotspot on the kernel */
    #scene-60-patch .hot {
      position: absolute; left: 50%; margin-left: 250px; top: 478px; width: 76px; height: 76px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-60-patch .hot .ring {
      position: absolute; inset: 0; border-radius: 50%; border: 2.4px solid var(--danger);
      background: rgba(255,107,93,0.12); will-change: transform, opacity;
    }
    #scene-60-patch .hot .core {
      position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border-radius: 50%; background: var(--danger);
    }

    /* the magnifier that hunts it down */
    #scene-60-patch .mag {
      position: absolute; left: 50%; margin-left: 232px; top: 452px;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-60-patch .cap {
      position: absolute; left: 0; right: 0; top: 706px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 46px;
      color: var(--soft); letter-spacing: -0.012em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-60-patch .cap .lc { color: var(--danger); will-change: text-shadow; }
  </style>
</head>
<body>
  <div id="scene-60-patch" data-composition-id="scene-60-patch" data-width="1920" data-height="1080">
    <div class="stage">

      <!-- BEAM runtime layer -->
      <div class="layer l-beam" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500" data-sfx-volume="0.35">
        <div class="lname">BEAM runtime</div>
        <div class="lsub">the Erlang VM</div>
        <div class="ptag">patched</div>
        <div class="patch">
          <svg viewBox="0 0 40 40" width="38" height="38" fill="none">
            <path d="M26 11 a7 7 0 0 0-9.4 8.2 L9 27 l4 4 7.8-7.6 a7 7 0 0 0 8.2-9.4 L25 19 l-4-4 5-4z" stroke="#25d366" stroke-width="2.2" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <!-- FreeBSD kernel layer -->
      <div class="layer l-kernel" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="2840" data-sfx-volume="0.42">
        <div class="lname">FreeBSD kernel</div>
        <div class="lsub">bare-metal OS</div>
        <div class="ptag">patched</div>
        <div class="patch">
          <svg viewBox="0 0 40 40" width="38" height="38" fill="none">
            <path d="M26 11 a7 7 0 0 0-9.4 8.2 L9 27 l4 4 7.8-7.6 a7 7 0 0 0 8.2-9.4 L25 19 l-4-4 5-4z" stroke="#25d366" stroke-width="2.2" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <!-- the lock-contention hotspot, hunted down -->
      <div class="hot">
        <div class="ring"></div>
        <div class="core"></div>
      </div>

      <!-- the magnifier sweeping in -->
      <svg class="mag" viewBox="0 0 64 64" width="118" height="118" fill="none" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="5420">
        <circle cx="27" cy="27" r="18" stroke="#c3cbc7" stroke-width="3.2" fill="rgba(10,15,13,0.18)"></circle>
        <line x1="40" y1="40" x2="56" y2="56" stroke="#c3cbc7" stroke-width="4.4" stroke-linecap="round"></line>
      </svg>

      <div class="cap" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="6520" data-sfx-volume="0.35">hunting down <span class="lc">lock contention</span></div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-60-patch";

    // Host data-start = 483.20 → scene-local = global − 483.20. Chunk first word "They" 483.70 = local 0.50.

    // Entrance crossfade over scene 59's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "They patched the BEAM runtime" 483.70→484.74 (local 0.50→1.54) — top layer lands, patch applied
    tl.fromTo(root + " .l-beam", { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 0.50);
    tl.fromTo(root + " .l-beam .patch", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.9)" }, 1.10);
    tl.fromTo(root + " .l-beam .ptag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.24);

    // "and the FreeBSD kernel" 485.74→486.70 (local 2.54→3.50) — bottom layer lands, patch applied
    tl.fromTo(root + " .l-kernel", { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 2.54);
    tl.fromTo(root + " .l-kernel .patch", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.9)" }, 3.10);
    tl.fromTo(root + " .l-kernel .ptag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.24);

    // "themselves" 487.12 (local 3.92) — both patches pulse: they did it by hand
    tl.to(root + " .l-beam .patch", { scale: 1.16, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 3.92);
    tl.to(root + " .l-kernel .patch", { scale: 1.16, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 3.98);

    // "hunting down" 488.62→489.10 (local 5.42→5.90) — the magnifier sweeps in across the kernel
    tl.fromTo(root + " .mag", { opacity: 0, x: -660 }, { opacity: 1, x: 0, duration: 0.92, ease: "power2.inOut" }, 5.42);

    // "lock contention" 489.72→490.12 (local 6.52→6.92) — the hotspot is found under the lens, flares red
    tl.fromTo(root + " .hot", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2)" }, 6.52);
    tl.fromTo(root + " .cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 6.40);
    tl.fromTo(root + " .cap .lc", { textShadow: "0 0 0px rgba(255,107,93,0)" }, { textShadow: "0 0 22px rgba(255, 107, 93, 0.5)", duration: 0.42, ease: "power2.out" }, 6.52);
    // the hotspot pulses red — being hunted
    tl.to(root + " .hot .ring", { scale: 1.22, opacity: 0.45, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "center center" }, 6.92);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.8);

    window.__timelines["scene-60-patch"] = tl;
  </script>
</body>
</html>
