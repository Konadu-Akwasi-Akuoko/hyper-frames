<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 06 — long-lived socket</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-06-long-lived-socket { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }

    #scene-06-long-lived-socket .stage { position: absolute; inset: 0; will-change: transform; }

    /* corridor held from scene 05 — same coordinates, the cut reads as continuation */
    #scene-06-long-lived-socket .phone-node {
      position: absolute; left: 250px; top: 370px; width: 112px; height: 200px;
      border: 2px solid var(--border); border-radius: 18px;
      background: rgba(16, 22, 19, 0.6); opacity: 0; will-change: opacity;
    }
    #scene-06-long-lived-socket .server {
      position: absolute; left: 1530px; top: 350px; width: 230px; height: 240px;
      background: var(--panel); border: 1.5px solid #2c3a45; border-radius: 14px;
      box-shadow: 0 0 40px rgba(125, 211, 252, 0.12);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-06-long-lived-socket .node-lbl {
      position: absolute; font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 26px; color: var(--muted); opacity: 0; will-change: opacity;
    }
    #scene-06-long-lived-socket .lbl-phone { left: 250px; top: 590px; width: 112px; text-align: center; }
    #scene-06-long-lived-socket .lbl-server { left: 1530px; top: 622px; width: 230px; text-align: center; }

    #scene-06-long-lived-socket svg.wire { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #scene-06-long-lived-socket svg.wire line.socket {
      stroke: var(--accent-2); stroke-width: 4; stroke-linecap: round; opacity: 0;
      filter: drop-shadow(0 0 8px rgba(125, 211, 252, 0.5));
    }
    #scene-06-long-lived-socket svg.wire path.ghost {
      fill: none; stroke: var(--dim); stroke-width: 2.5; stroke-dasharray: 10 12;
      opacity: 0;
    }

    /* messages riding the held wire */
    #scene-06-long-lived-socket .chip {
      position: absolute; left: 290px; top: 460px; width: 20px; height: 20px;
      border-radius: 50%; background: var(--accent); opacity: 0;
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.45); will-change: transform, opacity;
    }

    /* the uptime counter — the scene's payoff */
    #scene-06-long-lived-socket .uptime {
      position: absolute; left: 0; right: 0; top: 188px; text-align: center;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-06-long-lived-socket .uptime .k {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 24px; color: var(--muted); letter-spacing: 0.18em;
    }
    #scene-06-long-lived-socket .uptime .v {
      margin-top: 8px; font-family: "JetBrains Mono", monospace; font-weight: 500;
      font-size: 84px; color: var(--accent-2); font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px rgba(125, 211, 252, 0.22);
    }

    /* "opened once" token under the wire */
    #scene-06-long-lived-socket .once {
      position: absolute; left: 0; right: 0; top: 520px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500;
      font-size: 30px; color: var(--accent-2); letter-spacing: 0.16em;
      opacity: 0; will-change: transform, opacity;
    }

    /* narration captions */
    #scene-06-long-lived-socket .cap {
      position: absolute; left: 0; right: 0; top: 810px; text-align: center;
    }
    #scene-06-long-lived-socket .cap .l1 {
      font-size: 44px; font-weight: 500; color: var(--fg); opacity: 0; will-change: transform, opacity;
    }
    #scene-06-long-lived-socket .cap .l2 {
      margin-top: 14px; font-size: 40px; font-weight: 600; color: var(--fg);
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-06-long-lived-socket" data-composition-id="scene-06-long-lived-socket" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="phone-node"></div>
      <div class="node-lbl lbl-phone">phone</div>

      <svg class="wire" viewBox="0 0 1920 1080" data-layout-allow-overflow>
        <line class="socket" x1="368" y1="470" x2="1524" y2="470" pathLength="1" />
        <path class="ghost" d="M 370 460 Q 950 330 1520 455" pathLength="1"
              data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="8450" />
      </svg>

      <div class="server" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="7600"></div>
      <div class="node-lbl lbl-server">server</div>

      <div class="chip rest"></div>
      <div class="chip c0"></div>
      <div class="chip c1"></div>
      <div class="chip c2"></div>
      <div class="chip c3"></div>

      <div class="once" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="4520">OPENED&nbsp;ONCE</div>

      <div class="uptime" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="6880">
        <div class="k">SOCKET&nbsp;UPTIME</div>
        <div class="v">00:00:00</div>
      </div>
    </div>

    <div class="cap">
      <div class="l1">A single long-lived socket</div>
      <div class="l2">No reconnecting for every message.</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-06-long-lived-socket";

    // Host data-start = 43.94 → scene-local = global − 43.94.

    // Entrance crossfade — the corridor matches scene 05's coordinates, so the
    // overlap reads as the same canvas persisting, not a new card.
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(root + " .phone-node", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 0.05);
    tl.fromTo(root + " .server", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 0.05);
    tl.fromTo(root + " .socket", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 0.05);
    tl.fromTo(root + " .lbl-phone, " + root + " .lbl-server", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 0.1);

    // the resting message dot from scene 05 persists on the phone (continuity)
    tl.fromTo(root + " .chip.rest", { opacity: 0 }, { opacity: 0.4, duration: 0.4, ease: "sine.out" }, 0.1);

    // "A single long-lived socket" 44.44 (local 0.50)
    tl.fromTo(root + " .cap .l1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.50);
    // "long-lived" 45.30 (local 1.36) — the wire takes a slow, held breath
    tl.to(root + " .socket", { opacity: 0.7, duration: 1.0, ease: "sine.inOut" }, 1.36);
    tl.to(root + " .socket", { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 2.36);

    // an early message rides the wire during "long-lived socket" — the corridor is alive
    tl.fromTo(root + " .c0", { opacity: 0, x: 0 }, { opacity: 1, duration: 0.18, ease: "sine.out" }, 1.5);
    tl.to(root + " .c0", { x: 1200, duration: 1.4, ease: "power1.inOut" }, 1.55);
    tl.to(root + " .c0", { opacity: 0, duration: 0.15, ease: "sine.in" }, 2.85);
    tl.fromTo(root + " .server", { scale: 1 }, { scale: 1.02, duration: 0.12, ease: "power2.out" }, 2.95);
    tl.to(root + " .server", { scale: 1, duration: 0.2, ease: "power2.in" }, 3.07);

    // "opened once" 47.96 (local 4.02) — the mono token slides up under the wire
    tl.fromTo(root + " .once", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.02);

    // "hours." 50.32 (local 6.38) — the uptime counter is born and climbs to hours
    const up = { s: 0 };
    const upEl = () => document.querySelector(root + " .uptime .v");
    const fmt = (n) => {
      n = Math.round(n);
      const h = String(Math.floor(n / 3600)).padStart(2, "0");
      const m = String(Math.floor((n % 3600) / 60)).padStart(2, "0");
      const s = String(n % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    };
    tl.fromTo(root + " .uptime", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 6.38);
    tl.to(up, {
      s: 27732, duration: 3.4, ease: "power2.out",   // 07:42:12 — hours on one socket
      onUpdate: () => { upEl().textContent = fmt(up.s); }
    }, 6.45);

    // messages ride the held wire — no new connections, just traffic
    [[6.45, ".c1"], [7.15, ".c2"], [7.95, ".c3"]].forEach(([t, sel]) => {
      tl.fromTo(root + " " + sel, { opacity: 0, x: 0 }, { opacity: 1, duration: 0.18, ease: "sine.out" }, t);
      tl.to(root + " " + sel, { x: 1200, duration: 1.15, ease: "power1.inOut" }, t + 0.05);
      tl.to(root + " " + sel, { opacity: 0, duration: 0.15, ease: "sine.in" }, t + 1.1);
      // server receive pulse as each message lands
      tl.fromTo(root + " .server", { scale: 1 }, { scale: 1.02, duration: 0.12, ease: "power2.out" }, t + 1.15);
      tl.to(root + " .server", { scale: 1, duration: 0.2, ease: "power2.in" }, t + 1.27);
    });

    // "No reconnecting" 51.86 (local 7.92) — a ghost reconnect arc forms and dies
    tl.fromTo(root + " .ghost",
      { strokeDashoffset: 1, opacity: 0 },
      { strokeDashoffset: 0, opacity: 0.6, duration: 0.45, ease: "power1.out" }, 7.92);
    tl.to(root + " .ghost", { opacity: 0, duration: 0.5, ease: "power2.in" }, 8.45);
    tl.fromTo(root + " .cap .l2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.92);
    tl.to(root + " .cap .l1", { opacity: 0.45, duration: 0.6, ease: "sine.inOut" }, 7.92);

    // idle — stage drifts slightly (finite yoyo)
    tl.to(root + " .stage", { y: -6, duration: 3.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.7);

    window.__timelines["scene-06-long-lived-socket"] = tl;
  </script>
</body>
</html>
