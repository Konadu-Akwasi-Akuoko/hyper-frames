<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 68 — WhatsApp went dark for about three and a half hours</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-68-dark { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-68-dark .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-68-dark .screen {
      position: absolute; left: 50%; margin-left: -102px; top: 232px; width: 204px; height: 224px;
      border-radius: 26px; border: 2.2px solid var(--accent); background: rgba(37,211,102,0.08);
      opacity: 0; will-change: transform, opacity, border-color, background-color;
    }
    #scene-68-dark .screen .sdot {
      position: absolute; left: 50%; top: 74px; margin-left: -11px; width: 22px; height: 22px;
      border-radius: 50%; background: var(--accent); will-change: background-color, box-shadow;
      box-shadow: 0 0 14px rgba(37,211,102,0.6);
    }
    #scene-68-dark .screen .stxt {
      position: absolute; left: 0; right: 0; top: 122px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em;
    }
    #scene-68-dark .screen .live { color: var(--accent); will-change: opacity; }
    #scene-68-dark .screen .off { color: var(--danger); opacity: 0; will-change: opacity; }

    #scene-68-dark .big {
      position: absolute; left: 0; right: 0; top: 506px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 160px; line-height: 1;
      color: var(--danger); letter-spacing: -0.03em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }

    #scene-68-dark .lbl {
      position: absolute; left: 0; right: 0; top: 736px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 30px;
      color: var(--danger); letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-68-dark" data-composition-id="scene-68-dark" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="screen" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500" data-sfx-volume="0.35">
        <div class="sdot"></div>
        <div class="stxt live">LIVE</div>
        <div class="stxt off">OFFLINE</div>
      </div>

      <div class="big" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1750" data-sfx-volume="0.42">&#8776;&#8201;3&frac12; HRS</div>
      <div class="lbl">went dark</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-68-dark";

    // Host data-start = 526.35 → scene-local = global − 526.35. Chunk first word "WhatsApp" 526.85 = local 0.50.

    // Entrance crossfade over scene 67's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "WhatsApp" 526.85 (local 0.50) — the live screen appears
    tl.fromTo(root + " .screen", { opacity: 0, y: 14, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 0.50);

    // "went dark" 527.26→527.52 (local 0.91→1.17) — it powers down: green → dark, LIVE → OFFLINE
    tl.to(root + " .screen", { borderColor: "#5a3a38", backgroundColor: "rgba(10,15,13,0.85)", duration: 0.34, ease: "power2.in" }, 1.10);
    tl.to(root + " .screen .sdot", { backgroundColor: "#ff6b5d", boxShadow: "0 0 12px rgba(255,107,93,0.55)", duration: 0.3, ease: "power2.in" }, 1.10);
    tl.to(root + " .screen .live", { opacity: 0, duration: 0.24, ease: "power2.in" }, 1.10);
    tl.to(root + " .screen .off", { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.18);

    // "for about three and a half hours" 527.84→528.76 (local 1.49→2.41) — the duration of the dark
    tl.fromTo(root + " .big", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.46, ease: "back.out(1.5)" }, 1.75);
    tl.fromTo(root + " .big", { textShadow: "0 0 0px rgba(255,107,93,0)" }, { textShadow: "0 0 38px rgba(255, 107, 93, 0.4)", duration: 0.5, ease: "power2.out" }, 1.95);
    tl.fromTo(root + " .lbl", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.0);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-68-dark"] = tl;
  </script>
</body>
</html>
