<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 85 — Roughly 40 million users for every engineer on the team</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-85-ratio { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-85-ratio .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-85-ratio .kick {
      position: absolute; left: 0; right: 0; top: 320px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px;
      color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-85-ratio .block { position: absolute; top: 408px; width: 440px; text-align: center; }
    #scene-85-ratio .left { left: 320px; opacity: 0; will-change: transform, opacity; }
    #scene-85-ratio .right { left: 1160px; opacity: 0; will-change: transform, opacity; }

    #scene-85-ratio .num {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 150px; line-height: 1;
      letter-spacing: -0.035em;
    }
    #scene-85-ratio .left .num { color: var(--accent); will-change: text-shadow; }
    #scene-85-ratio .right .num { color: var(--soft); }
    #scene-85-ratio .lbl {
      margin-top: 14px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 30px;
      color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase;
    }

    #scene-85-ratio .colon {
      position: absolute; left: 800px; top: 392px; width: 320px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 120px; line-height: 1;
      color: var(--dim);
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-85-ratio" data-composition-id="scene-85-ratio" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="kick">users per engineer</div>

      <div class="block left">
        <div class="num" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="900" data-sfx-volume="0.35">40M</div>
        <div class="lbl">users</div>
      </div>

      <div class="colon" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1760" data-sfx-volume="0.42">:</div>

      <div class="block right">
        <div class="num" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2320" data-sfx-volume="0.42">1</div>
        <div class="lbl">engineer</div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-85-ratio";

    // Host data-start = 615.98 → scene-local = global − 615.98. Chunk first word "Roughly" 616.48 = local 0.50.

    // Entrance crossfade over scene 84's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "Roughly" 616.48 (local 0.50) — the framing kicker
    tl.fromTo(root + " .kick", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.50);

    // "40 million users" 616.88→617.46 (local 0.90→1.48) — the big side
    tl.fromTo(root + " .left", { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 0.90);
    tl.fromTo(root + " .left .num", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 44px rgba(37,211,102,0.4)", duration: 0.5, ease: "power2.out" }, 1.1);

    // "for every" 617.74→618.04 (local 1.76→2.06) — the ratio pivot
    tl.fromTo(root + " .colon", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.8)" }, 1.76);

    // "engineer on the team." 618.30→618.98 (local 2.32→3.00) — the single side
    tl.fromTo(root + " .right", { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 2.32);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.2);

    window.__timelines["scene-85-ratio"] = tl;
  </script>
</body>
</html>
