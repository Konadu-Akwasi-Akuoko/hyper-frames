<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 49 — the sealed envelope assumed one key person, but people have many devices</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-49-multi { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-49-multi .stage { position: absolute; inset: 0; will-change: transform; }

    /* the sealed envelope — callback to the previous scene */
    #scene-49-multi .env {
      position: absolute; left: 286px; top: 392px; width: 196px; height: 138px;
      background: var(--panel); border: 1.5px solid var(--border); border-radius: 12px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-49-multi .env .flap {
      position: absolute; inset: 0; overflow: visible;
    }
    #scene-49-multi .env .lock { position: absolute; left: 50%; top: 44px; margin-left: -21px; }

    /* the assumption arrow */
    #scene-49-multi .arrow { position: absolute; inset: 0; overflow: visible; }
    #scene-49-multi .arrow .al {
      fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round;
      stroke-dasharray: 240; stroke-dashoffset: 240; will-change: stroke-dashoffset;
    }

    /* the one assumed person */
    #scene-49-multi .person {
      position: absolute; left: 760px; top: 348px; width: 120px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-49-multi .person .nm {
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 24px; color: var(--soft);
    }
    #scene-49-multi .pkey { position: absolute; left: 902px; top: 372px; opacity: 0; will-change: transform, opacity, filter; }
    #scene-49-multi .keytag {
      position: absolute; left: 880px; top: 446px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px;
      color: var(--accent); letter-spacing: 0.06em; opacity: 0; will-change: opacity;
    }

    /* the devices the person actually lives on */
    #scene-49-multi .dev {
      position: absolute; top: 600px; display: flex; flex-direction: column; align-items: center; gap: 12px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-49-multi .dphone { left: 776px; }
    #scene-49-multi .dlaptop { left: 580px; }
    #scene-49-multi .dtablet { left: 980px; }

    #scene-49-multi .devtag {
      position: absolute; left: 0; right: 0; top: 776px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 34px;
      color: var(--soft); letter-spacing: 0.002em; opacity: 0; will-change: transform, opacity;
    }
    #scene-49-multi .devtag .n { color: var(--cost); font-weight: 800; }
  </style>
</head>
<body>
  <div id="scene-49-multi" data-composition-id="scene-49-multi" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="env" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="500" data-sfx-volume="0.42">
        <svg class="flap" viewBox="0 0 196 138" width="196" height="138" fill="none">
          <path d="M14 24 L98 78 L182 24" stroke="#1e2722" stroke-width="2"></path>
        </svg>
        <svg class="lock" viewBox="0 0 32 32" width="42" height="42" fill="none">
          <rect x="7" y="14" width="18" height="13" rx="2.6" stroke="#25d366" stroke-width="2.4" fill="rgba(37,211,102,0.08)"></rect>
          <path d="M10.4 14 v-3.4 a5.6 5.6 0 0 1 11.2 0 v3.4" stroke="#25d366" stroke-width="2.4" stroke-linecap="round"></path>
          <circle cx="16" cy="20" r="1.9" fill="#25d366"></circle>
        </svg>
      </div>

      <svg class="arrow" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
        <path class="al" d="M500 460 H700 M686 452 l16 8 l-16 8"></path>
      </svg>

      <div class="person">
        <svg viewBox="0 0 48 48" width="104" height="104" fill="none">
          <circle cx="24" cy="17" r="8.5" stroke="#c3cbc7" stroke-width="2.2"></circle>
          <path d="M9 42 a15 15 0 0 1 30 0" stroke="#c3cbc7" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
        <div class="nm">one person</div>
      </div>

      <svg class="pkey" viewBox="0 0 32 32" width="44" height="44" fill="none" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="2560">
        <circle cx="10.5" cy="10.5" r="6" stroke="#25d366" stroke-width="2.4"></circle>
        <path d="M14.8 14.8 L26 26 M22 22 l3 3 M25 25 l3 3" stroke="#25d366" stroke-width="2.4" stroke-linecap="round"></path>
      </svg>
      <div class="keytag">one key</div>

      <div class="dev dlaptop" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="5360">
        <svg viewBox="0 0 48 40" width="92" height="76" fill="none">
          <rect x="9" y="6" width="30" height="20" rx="2.4" stroke="#7dd3fc" stroke-width="2.2"></rect>
          <path d="M4 32 h40 l-3 -6 H7 Z" stroke="#7dd3fc" stroke-width="2.2" stroke-linejoin="round"></path>
        </svg>
      </div>

      <div class="dev dphone">
        <svg viewBox="0 0 32 48" width="64" height="96" fill="none">
          <rect x="6" y="4" width="20" height="40" rx="4" stroke="#7dd3fc" stroke-width="2.2"></rect>
          <line x1="13" y1="39" x2="19" y2="39" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"></line>
        </svg>
      </div>

      <div class="dev dtablet" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="5620" data-sfx-volume="0.42">
        <svg viewBox="0 0 40 48" width="80" height="96" fill="none">
          <rect x="5" y="5" width="30" height="38" rx="3.4" stroke="#7dd3fc" stroke-width="2.2"></rect>
          <circle cx="20" cy="38.5" r="1.6" fill="#7dd3fc"></circle>
        </svg>
      </div>

      <div class="devtag"><span class="n">more than one</span> device</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-49-multi";

    // Host data-start = 416.98 → scene-local = global − 416.98. Chunk first word "That" 417.48 = local 0.50.

    // Entrance crossfade over scene 48's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "That sealed envelope" 417.48→418.10 (local 0.50→1.12) — the sealed envelope returns
    tl.fromTo(root + " .env", { opacity: 0, y: 14, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 0.50);

    // "assumed" 418.66 (local 1.68) — the arrow points to its one assumption
    tl.fromTo(root + " .arrow .al", { strokeDashoffset: 240 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.68);

    // "one key person" 419.26→419.82 (local 2.28→2.84) — a single person, a single key
    tl.fromTo(root + " .person", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.44, ease: "back.out(1.3)" }, 2.28);
    tl.fromTo(root + " .pkey", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.9)" }, 2.56);
    tl.fromTo(root + " .pkey", { filter: "drop-shadow(0 0 0px rgba(37,211,102,0))" }, { filter: "drop-shadow(0 0 12px rgba(37, 211, 102, 0.5))", duration: 0.4, ease: "power2.out" }, 2.56);
    tl.to(root + " .pkey", { filter: "drop-shadow(0 0 4px rgba(37, 211, 102, 0.22))", duration: 0.5, ease: "power2.inOut" }, 3.0);
    tl.fromTo(root + " .keytag", { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power2.out" }, 2.7);

    // the single phone the assumption fits — present first
    tl.fromTo(root + " .dphone", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.4)" }, 3.0);

    // "and these days people live on more than one device" 421.26→423.26 (local 4.28→6.28)
    // the reality fans out — the one person spreads across many devices
    tl.fromTo(root + " .dlaptop", { opacity: 0, x: 70, y: 14 }, { opacity: 1, x: 0, y: 0, duration: 0.46, ease: "back.out(1.4)" }, 5.36);
    tl.fromTo(root + " .dtablet", { opacity: 0, x: -70, y: 14 }, { opacity: 1, x: 0, y: 0, duration: 0.46, ease: "back.out(1.4)" }, 5.62);
    tl.fromTo(root + " .devtag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.36);
    tl.fromTo(root + " .devtag .n", { textShadow: "0 0 0px rgba(240,180,41,0)" }, { textShadow: "0 0 22px rgba(240, 180, 41, 0.45)", duration: 0.44, ease: "power2.out" }, 6.12);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.6);

    window.__timelines["scene-49-multi"] = tl;
  </script>
</body>
</html>
