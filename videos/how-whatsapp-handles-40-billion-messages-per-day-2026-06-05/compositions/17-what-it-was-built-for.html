<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 17 — what it was built for</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-17-what-it-was-built-for { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }

    #scene-17-what-it-was-built-for .stage { position: absolute; inset: 0; will-change: transform; }

    /* context line — the flip from cost to capability */
    #scene-17-what-it-was-built-for .ctx {
      position: absolute; left: 0; right: 0; top: 336px; text-align: center;
      font-size: 34px; font-weight: 500; color: var(--soft); letter-spacing: 0.01em;
      opacity: 0; will-change: transform, opacity;
    }

    /* hero numeral — the scale it WAS built for (concurrency = sky-blue) */
    #scene-17-what-it-was-built-for .num {
      position: absolute; left: 0; right: 0; top: 430px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 150px; color: var(--accent-2); letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 36px rgba(125, 211, 252, 0.22);
      opacity: 0; will-change: transform, opacity;
    }

    /* the resilience shelf — the number stands ON it: it doesn't fall over */
    #scene-17-what-it-was-built-for .floor {
      position: absolute; left: 660px; top: 612px; width: 600px; height: 3px;
      border-radius: 2px; background: var(--accent-2);
      box-shadow: 0 0 16px rgba(125, 211, 252, 0.4);
      transform-origin: center; opacity: 0; will-change: transform, opacity;
    }

    /* label under the number */
    #scene-17-what-it-was-built-for .sub {
      position: absolute; left: 0; right: 0; top: 648px; text-align: center;
      font-size: 31px; font-weight: 500; color: var(--soft);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-17-what-it-was-built-for .sub .hold { color: var(--fg); font-weight: 600; }

    /* closing statement — the trade, settled */
    #scene-17-what-it-was-built-for .close {
      position: absolute; left: 0; right: 0; top: 762px; text-align: center;
      font-size: 38px; font-weight: 700; color: var(--fg); letter-spacing: 0.005em;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-17-what-it-was-built-for" data-composition-id="scene-17-what-it-was-built-for" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="ctx" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="520" data-sfx-volume="0.42">What it <em>was</em> built for &mdash;</div>

      <div class="num">0</div>

      <div class="floor" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4520" data-sfx-volume="0.42"></div>

      <div class="sub">concurrent processes, <span class="hold">held at once</span> &mdash; without falling over.</div>

      <div class="close" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="5980" data-sfx-volume="0.35">That was the trade they made.</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-17-what-it-was-built-for";
    const numEl = document.querySelector(root + " .num");
    const counter = { v: 0 };

    // Host data-start = 162.54 → scene-local = global − 162.54.

    // Entrance crossfade over scene 16's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "What it was built for —" 163.04 (local 0.50) — the flip to the upside
    tl.fromTo(root + " .ctx", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.50);

    // "holding" 164.78 (local 2.24) — the hero numeral surfaces, then rolls
    tl.fromTo(root + " .num", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 2.24);
    // "millions" 165.46 (local 2.92) — the count snaps up to the figure this video opened on
    tl.to(counter, {
      v: 2000000, duration: 1.55, ease: "steps(26)",
      onUpdate: () => { numEl.textContent = Math.round(counter.v).toLocaleString("en-US"); }
    }, 2.92);

    // "without" 166.64 (local 4.10) — the resilience shelf draws in beneath the number
    tl.fromTo(root + " .floor", { opacity: 0, scaleX: 0.05 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, 4.10);
    // "falling over." 167.36 (local 4.82) — the number gives a firm settle but holds: it does NOT fall
    tl.to(root + " .num", { y: 8, duration: 0.16, ease: "power2.in" }, 4.66);
    tl.to(root + " .num", { y: 0, duration: 0.5, ease: "back.out(2.2)" }, 4.82);
    // label resolves under the locked number
    tl.fromTo(root + " .sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.72);

    // "That was the trade they made." 168.52 (local 5.98) — after a beat, the trade settles
    tl.fromTo(root + " .close", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.98);
    // "trade" 169.18 (local 6.64) — context recedes; the conclusion owns the close
    tl.to(root + " .ctx", { opacity: 0.4, duration: 0.5, ease: "sine.inOut" }, 5.98);

    // idle — the held number breathes faintly (alive under load, finite yoyo)
    tl.to(root + " .stage", { y: -4, duration: 3.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.7);

    window.__timelines["scene-17-what-it-was-built-for"] = tl;
  </script>
</body>
</html>
