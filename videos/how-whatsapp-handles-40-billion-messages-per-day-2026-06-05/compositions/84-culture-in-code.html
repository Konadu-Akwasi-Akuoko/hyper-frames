<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 84 — The architecture is that culture written in code</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-84-code { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-84-code .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-84-code .thesis {
      position: absolute; left: 0; right: 0; top: 392px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 64px; line-height: 1.1;
      color: var(--soft); letter-spacing: -0.018em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-84-code .thesis .arch { color: var(--accent-2); font-weight: 800; will-change: text-shadow; }
    #scene-84-code .thesis .cult { color: var(--accent); font-weight: 800; will-change: text-shadow; }

    #scene-84-code .codebox {
      position: absolute; left: 50%; top: 522px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      padding: 20px 30px; border-radius: 14px; border: 1.4px solid var(--border);
      background: rgba(255,255,255,0.02); white-space: nowrap;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-84-code .codebox .prompt {
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 34px; color: var(--accent);
    }
    #scene-84-code .codebox .txt {
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 34px; color: var(--fg);
      letter-spacing: 0.01em;
    }
    #scene-84-code .codebox .cursor {
      display: inline-block; width: 16px; height: 38px; background: var(--accent);
      border-radius: 2px; margin-left: 2px; will-change: opacity;
    }
  </style>
</head>
<body>
  <div id="scene-84-code" data-composition-id="scene-84-code" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="thesis">the <span class="arch">architecture</span> is that <span class="cult">culture</span></div>

      <div class="codebox" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="2080" data-sfx-volume="0.35">
        <span class="prompt">&rsaquo;</span>
        <span class="txt">written in code</span>
        <span class="cursor"></span>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-84-code";

    // Host data-start = 612.54 → scene-local = global − 612.54. Chunk first word "The" 613.04 = local 0.50.

    // Entrance crossfade over scene 83's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "The architecture" 613.04→613.20 (local 0.50→0.66) — thesis + architecture highlight
    tl.fromTo(root + " .thesis", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" }, 0.50);
    tl.fromTo(root + " .thesis .arch", { textShadow: "0 0 0px rgba(125,211,252,0)" }, { textShadow: "0 0 26px rgba(125,211,252,0.5)", duration: 0.4, ease: "power2.out" }, 0.66);

    // "is that culture" 613.88→614.20 (local 1.34→1.66) — culture highlight
    tl.fromTo(root + " .thesis .cult", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 26px rgba(37,211,102,0.55)", duration: 0.4, ease: "power2.out" }, 1.66);

    // "written in code." 614.62→615.10 (local 2.08→2.56) — the code line
    tl.fromTo(root + " .codebox", { opacity: 0, y: 14, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" }, 2.08);

    // cursor blink
    tl.fromTo(root + " .codebox .cursor", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "steps(1)", repeat: 3, yoyo: true }, 2.6);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.8);

    window.__timelines["scene-84-code"] = tl;
  </script>
</body>
</html>
