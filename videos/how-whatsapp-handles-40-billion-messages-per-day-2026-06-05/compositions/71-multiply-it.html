<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 71 — now, multiply it</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-71-mult { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-71-mult .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-71-mult .eq {
      position: absolute; left: 0; right: 0; top: 452px; height: 176px;
      display: flex; align-items: center; justify-content: center; gap: 44px;
    }
    #scene-71-mult .one {
      width: 64px; height: 64px; border-radius: 14px;
      border: 2px solid var(--accent); background: rgba(37,211,102,0.14);
      box-shadow: 0 0 18px rgba(37,211,102,0.4);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-71-mult .mult {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 110px; line-height: 1;
      color: var(--cost); letter-spacing: -0.02em;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
    #scene-71-mult .grid {
      display: grid; grid-template-columns: repeat(6, 34px); grid-auto-rows: 34px; gap: 10px;
    }
    #scene-71-mult .grid .cell {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1.6px solid rgba(37,211,102,0.5); background: rgba(37,211,102,0.1);
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-71-mult" data-composition-id="scene-71-mult" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="eq">
        <div class="one" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="500" data-sfx-volume="0.42"></div>
        <div class="mult" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="1060" data-sfx-volume="0.35">&times;</div>
        <div class="grid" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1660" data-sfx-volume="0.35">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-71-mult";

    // Host data-start = 541.88 → scene-local = global − 541.88. Chunk first word "Now" 542.38 = local 0.50.

    // Entrance crossfade over scene 70's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "Now," 542.38 (local 0.50) — the single unit
    tl.fromTo(root + " .one", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.50);

    // "multiply" 542.94 (local 1.06) — the operator slams in
    tl.fromTo(root + " .mult", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.5)" }, 1.06);
    tl.fromTo(root + " .mult", { textShadow: "0 0 0px rgba(240,180,41,0)" }, { textShadow: "0 0 30px rgba(240,180,41,0.45)", duration: 0.4, ease: "power2.out" }, 1.18);

    // "it." 543.54 (local 1.66) — the unit blooms into a grid of many
    tl.fromTo(root + " .grid .cell", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.6)", stagger: { each: 0.018, from: "center", grid: [4, 6] } }, 1.66);

    window.__timelines["scene-71-mult"] = tl;
  </script>
</body>
</html>
