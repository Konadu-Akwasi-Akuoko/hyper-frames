<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 41 — end-to-end encryption on by default, April 2016</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-41-enc-default { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-41-enc-default .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-41-enc-default .date {
      position: absolute; left: 0; right: 0; top: 244px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 27px;
      color: var(--muted); letter-spacing: 0.3em; text-transform: uppercase;
      opacity: 0; will-change: transform, opacity;
    }

    /* the settings row — encryption, flipped on by default */
    #scene-41-enc-default .card {
      position: absolute; left: 530px; top: 426px; width: 860px; height: 120px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; justify-content: space-between; padding: 0 42px;
      opacity: 0; will-change: transform, opacity, box-shadow;
    }
    #scene-41-enc-default .row-left { display: flex; align-items: center; gap: 24px; }
    #scene-41-enc-default .row-left .lock { display: block; will-change: filter; }
    #scene-41-enc-default .row-left .label {
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 38px;
      color: var(--fg); letter-spacing: -0.006em;
    }
    #scene-41-enc-default .toggle { position: relative; width: 104px; height: 58px; flex: none; }
    #scene-41-enc-default .track { position: absolute; inset: 0; border-radius: 29px; background: var(--dim); }
    #scene-41-enc-default .knob {
      position: absolute; top: 6px; left: 6px; width: 46px; height: 46px; border-radius: 50%;
      background: var(--muted); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      will-change: transform, background-color;
    }

    #scene-41-enc-default .cap {
      position: absolute; left: 0; right: 0; top: 664px; text-align: center;
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 38px;
      color: var(--soft); letter-spacing: 0.001em;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-41-enc-default .cap .big { color: var(--accent); font-weight: 700; will-change: filter; }
  </style>
</head>
<body>
  <div id="scene-41-enc-default" data-composition-id="scene-41-enc-default" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="date" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="500">April 2016</div>

      <div class="card" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2320" data-sfx-volume="0.35">
        <div class="row-left">
          <svg class="lock" viewBox="0 0 32 32" width="46" height="46" fill="none">
            <rect x="7" y="14" width="18" height="13" rx="2.6" stroke="#25d366" stroke-width="2.2"></rect>
            <path d="M10.4 14 v-3.4 a5.6 5.6 0 0 1 11.2 0 v3.4" stroke="#25d366" stroke-width="2.2" stroke-linecap="round"></path>
            <circle cx="16" cy="20" r="1.9" fill="#25d366"></circle>
          </svg>
          <div class="label">End-to-end encryption</div>
        </div>
        <div class="toggle">
          <div class="track"></div>
          <div class="knob" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3580"></div>
        </div>
      </div>

      <div class="cap">on by default, for over <span class="big">a billion</span> users</div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-41-enc-default";

    // Host data-start = 364.04 → scene-local = global − 364.04. Chunk first word "And" 364.54 = local 0.50.

    // Entrance crossfade over scene 40's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "And by April 2016" 364.54→365.78 (local 0.50→1.74) — the next date on the timeline
    tl.fromTo(root + " .date", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.50);

    // "end-to-end encryption" 366.36→367.30 (local 2.32→3.26) — the settings row settles in
    tl.fromTo(root + " .card", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 2.32);

    // "was on" 367.36→367.76 (local 3.32→3.72) — the toggle flips ON, green
    tl.to(root + " .track", { backgroundColor: "#25d366", duration: 0.28, ease: "power2.out" }, 3.58);
    tl.to(root + " .knob", { x: 46, backgroundColor: "#eafff3", duration: 0.32, ease: "back.out(2.2)" }, 3.58);
    tl.fromTo(root + " .card", { boxShadow: "0 18px 48px rgba(0,0,0,0.4)" }, { boxShadow: "0 18px 48px rgba(0,0,0,0.4), 0 0 26px rgba(37,211,102,0.32)", duration: 0.4, ease: "power2.out" }, 3.58);
    tl.fromTo(root + " .lock", { filter: "drop-shadow(0 0 0px rgba(37,211,102,0))" }, { filter: "drop-shadow(0 0 12px rgba(37, 211, 102, 0.6))", duration: 0.4, ease: "power2.out" }, 3.58);
    tl.to(root + " .lock", { filter: "drop-shadow(0 0 4px rgba(37, 211, 102, 0.25))", duration: 0.6, ease: "power2.inOut" }, 4.1);

    // "by default, for over a billion users" 368.02→370.08 (local 3.98→6.04) — the scale lands
    tl.fromTo(root + " .cap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.98);
    // "a billion" 369.08 (local 5.04) — the count blooms (text-shadow, not scale — inline emphasis)
    tl.fromTo(root + " .cap .big", { textShadow: "0 0 0px rgba(37,211,102,0)" }, { textShadow: "0 0 26px rgba(37, 211, 102, 0.45)", duration: 0.45, ease: "power2.out" }, 5.04);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-41-enc-default"] = tl;
  </script>
</body>
</html>
