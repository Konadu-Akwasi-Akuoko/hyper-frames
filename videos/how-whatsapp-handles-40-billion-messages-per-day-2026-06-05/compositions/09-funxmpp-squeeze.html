<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 09 — FunXMPP squeeze</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-09-funxmpp-squeeze { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }

    #scene-09-funxmpp-squeeze .stage { position: absolute; inset: 0; will-change: transform; }

    /* protocol title */
    #scene-09-funxmpp-squeeze .title {
      position: absolute; left: 0; right: 0; top: 110px; text-align: center;
      font-size: 66px; font-weight: 700; color: var(--fg);
      opacity: 0; will-change: transform, opacity;
    }

    /* the message chip — green returns after two amber scenes */
    #scene-09-funxmpp-squeeze .chip {
      position: absolute; left: 120px; top: 415px; width: 96px; height: 30px;
      border-radius: 15px 15px 4px 15px; background: var(--accent);
      box-shadow: 0 0 18px rgba(37, 211, 102, 0.4);
      opacity: 0; will-change: transform, opacity;
    }

    /* verbose XML panel — squeezes left on "FunXMPP" */
    #scene-09-funxmpp-squeeze .xml-wrap {
      position: absolute; left: 260px; top: 310px; width: 1180px; height: 240px;
      background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 34px 40px; transform-origin: left center;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-09-funxmpp-squeeze .xml-wrap .ln {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 28px; line-height: 1.55; color: var(--soft); white-space: pre;
      opacity: 0; will-change: opacity;
    }
    #scene-09-funxmpp-squeeze .xml-wrap .ln .attr { color: var(--muted); }

    /* the arrow between husk and tokens */
    #scene-09-funxmpp-squeeze .arrow {
      position: absolute; left: 660px; top: 396px;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 56px; color: var(--muted);
      opacity: 0; will-change: transform, opacity;
    }

    /* binary token row — these bytes ARE the message, so they earn the green */
    #scene-09-funxmpp-squeeze .toks {
      position: absolute; left: 790px; top: 388px; display: flex; gap: 16px;
    }
    #scene-09-funxmpp-squeeze .tok {
      font-family: "JetBrains Mono", monospace; font-weight: 500;
      font-size: 34px; color: var(--accent); padding: 14px 18px;
      background: rgba(37, 211, 102, 0.08);
      border: 1px solid rgba(37, 211, 102, 0.4); border-radius: 8px;
      text-shadow: 0 0 14px rgba(37, 211, 102, 0.35);
      opacity: 0; will-change: transform, opacity;
    }

    /* tag → byte mapping rows */
    #scene-09-funxmpp-squeeze .map {
      position: absolute; left: 0; right: 0; top: 620px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    #scene-09-funxmpp-squeeze .map .mrow {
      display: flex; align-items: center; gap: 26px;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 27px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-09-funxmpp-squeeze .map .mtag { color: var(--soft); width: 360px; text-align: right; }
    #scene-09-funxmpp-squeeze .map .marr { color: var(--dim); }
    #scene-09-funxmpp-squeeze .map .mbyte {
      color: var(--accent); width: 360px;
      font-weight: 500;
    }

    /* size-delta payoff */
    #scene-09-funxmpp-squeeze .delta {
      position: absolute; left: 0; right: 0; top: 850px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 34px; color: var(--muted);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-09-funxmpp-squeeze .delta .small { color: var(--accent); font-weight: 500; }

    /* opening narration caption */
    #scene-09-funxmpp-squeeze .cap {
      position: absolute; left: 0; right: 0; top: 880px; text-align: center;
      font-size: 42px; font-weight: 500; color: var(--soft);
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-09-funxmpp-squeeze" data-composition-id="scene-09-funxmpp-squeeze" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="title" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="8550">FunXMPP</div>

      <div class="chip" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1300"></div>

      <div class="xml-wrap" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2900">
        <div class="ln">&lt;message <span class="attr">to=</span>"+1555&hellip;" <span class="attr">type=</span>"chat"</div>
        <div class="ln">         <span class="attr">id=</span>"A1B2-9F" <span class="attr">t=</span>"1369&hellip;"&gt;</div>
        <div class="ln">  &lt;body&gt;hello&lt;/body&gt;</div>
        <div class="ln">&lt;/message&gt;</div>
      </div>

      <div class="arrow" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5400">&rarr;</div>

      <div class="toks" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="5700">
        <div class="tok">F8</div>
        <div class="tok">05</div>
        <div class="tok">B7</div>
        <div class="tok">2A</div>
        <div class="tok">9C</div>
      </div>

      <div class="map">
        <div class="mrow m1" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="11450" data-sfx-volume="0.42">
          <div class="mtag">&lt;message&hellip;&gt;</div><div class="marr">&rarr;</div><div class="mbyte">F8</div>
        </div>
        <div class="mrow m2">
          <div class="mtag">type="chat"</div><div class="marr">&rarr;</div><div class="mbyte">05</div>
        </div>
        <div class="mrow m3">
          <div class="mtag">&lt;body&gt;</div><div class="marr">&rarr;</div><div class="mbyte">B7</div>
        </div>
      </div>

      <div class="delta" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="14600">
        1.2&nbsp;KB &rarr; <span class="small">41&nbsp;B</span> &nbsp;&middot;&nbsp; bandwidth + battery saved
      </div>
    </div>

    <div class="cap">Before the message even leaves&hellip;</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-09-funxmpp-squeeze";

    // Host data-start = 79.3 → scene-local = global − 79.3.

    // Entrance crossfade over scene 08's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "Before" 79.8 (local 0.50)
    tl.fromTo(root + " .cap", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.50);

    // "message" 80.46 (local 1.16) — the green chip is back after two amber scenes
    tl.fromTo(root + " .chip",
      { opacity: 0, scale: 0.4 },
      { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 1.16);

    // "leaves," 81.46 (local 2.16) — the message's contents under X-ray: XML panel wipes in
    tl.fromTo(root + " .xml-wrap",
      { opacity: 0, scaleX: 0.04 },
      { opacity: 1, scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 2.16);
    // code lines fade up line by line behind the wipe
    tl.fromTo(root + " .xml-wrap .ln", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.out", stagger: 0.16 }, 2.7);

    // "squeezed down" 83.37 (local 4.07) — the panel physically crushes leftward,
    // glyphs distorting as the verbose form collapses into a slim husk
    tl.to(root + " .xml-wrap", { scaleX: 0.28, duration: 1.1, ease: "power2.inOut" }, 4.07);
    tl.to(root + " .xml-wrap .ln", { opacity: 0.25, duration: 0.9, ease: "sine.inOut" }, 4.17);

    // arrow lands as the crush completes
    tl.fromTo(root + " .arrow", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 5.10);

    // "compact binary protocol" — "compact" 84.78 (local 5.48): tokens ignite one by one
    tl.fromTo(root + " .tok",
      { opacity: 0, x: 40, scale: 0.7 },
      { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(1.5)", stagger: 0.22 }, 5.48);

    // the tokens are now the message — the chip hands off and dims
    tl.to(root + " .chip", { opacity: 0.35, duration: 0.8, ease: "sine.inOut" }, 6.6);

    // "FunXMPP" 87.58–88.96 (local 8.28) — the protocol gets its name, green bloom
    tl.fromTo(root + " .title",
      { opacity: 0, y: -18 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.28);
    tl.to(root + " .title", { textShadow: "0 0 28px rgba(37, 211, 102, 0.35)", duration: 0.45, ease: "power2.out" }, 8.9);
    // opening caption recedes once the name owns the frame
    tl.to(root + " .cap", { opacity: 0.4, duration: 0.6, ease: "sine.inOut" }, 8.28);

    // "verbose tags" 90.54 (local 11.24) — the tag→byte mapping rows cascade in
    tl.fromTo(root + " .m1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.24);
    // "single" 91.78 (local 12.48)
    tl.fromTo(root + " .m2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 12.48);
    // "tokens" 92.42 (local 13.12)
    tl.fromTo(root + " .m3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.12);
    // mapping rows replace the caption zone — caption clears fully
    tl.to(root + " .cap", { opacity: 0, duration: 0.5, ease: "sine.in" }, 11.24);

    // "bandwidth" 93.68 (local 14.38) — the size-delta payoff
    tl.fromTo(root + " .delta", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 14.38);

    // idle — stage drifts slightly (finite yoyo)
    tl.to(root + " .stage", { y: -6, duration: 3.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.7);

    window.__timelines["scene-09-funxmpp-squeeze"] = tl;
  </script>
</body>
</html>
