<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 38 — what the server knows about you</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-38-server-knows { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-38-server-knows .stage { position: absolute; inset: 0; will-change: transform; }

    /* the dossier owner — a compact server box, fixed left of center */
    #scene-38-server-knows .server {
      position: absolute; left: 280px; top: 430px; width: 170px; height: 220px;
      background: var(--panel); border: 1px solid rgba(125, 211, 252, 0.28);
      border-radius: 14px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      opacity: 0; will-change: transform, opacity, box-shadow;
    }
    #scene-38-server-knows .srack { display: block; }
    #scene-38-server-knows .slabel {
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 20px;
      color: var(--muted); letter-spacing: 0.24em;
    }

    /* the leader wires fanning from the server's right edge */
    #scene-38-server-knows .wires { position: absolute; inset: 0; overflow: visible; }
    #scene-38-server-knows .wire {
      fill: none; stroke: var(--accent-2); stroke-width: 2; stroke-opacity: 0.65;
      stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300;
    }

    /* the three records, staggered — not a tidy legend grid */
    #scene-38-server-knows .chip {
      position: absolute; display: flex; align-items: center; gap: 22px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 30px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-38-server-knows .chip .ico { flex: none; display: block; will-change: filter; }
    #scene-38-server-knows .chip .txt {
      font-family: "Inter", sans-serif; font-weight: 500; font-size: 34px;
      color: var(--fg); letter-spacing: -0.004em; white-space: nowrap;
    }
    #scene-38-server-knows .chip .txt .sky { color: var(--accent-2); }

    #scene-38-server-knows .c1 { left: 600px; top: 270px; }
    #scene-38-server-knows .c2 { left: 700px; top: 498px; }
    #scene-38-server-knows .c3 { left: 600px; top: 720px; }
  </style>
</head>
<body>
  <div id="scene-38-server-knows" data-composition-id="scene-38-server-knows" data-width="1920" data-height="1080">
    <div class="stage">

      <svg class="wires" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
        <path class="wire w1" d="M450 540 C 510 470, 545 360, 596 318"></path>
        <path class="wire w2" d="M450 540 C 540 541, 612 542, 696 542"></path>
        <path class="wire w3" d="M450 540 C 510 612, 545 720, 596 762"></path>
      </svg>

      <div class="server" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="250">
        <svg class="srack" viewBox="0 0 48 56" width="74" height="86" fill="none">
          <rect x="6" y="6" width="36" height="44" rx="4" stroke="#7dd3fc" stroke-width="2.2"></rect>
          <line x1="6" y1="20.7" x2="42" y2="20.7" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"></line>
          <line x1="6" y1="35.3" x2="42" y2="35.3" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"></line>
          <circle cx="12.5" cy="13.3" r="2" fill="#7dd3fc"></circle>
          <circle cx="12.5" cy="28" r="2" fill="#7dd3fc"></circle>
          <circle cx="12.5" cy="42.6" r="2" fill="#7dd3fc"></circle>
        </svg>
        <div class="slabel">SERVER</div>
      </div>

      <div class="chip c1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="700" data-sfx-volume="0.35">
        <svg class="ico" viewBox="0 0 24 24" width="30" height="30" fill="none">
          <path d="M12 2.5 C7.86 2.5 4.5 5.86 4.5 10 c0 5.2 7.5 11.5 7.5 11.5 s7.5-6.3 7.5-11.5 C19.5 5.86 16.14 2.5 12 2.5 Z" stroke="#7dd3fc" stroke-width="1.7" stroke-linejoin="round"></path>
          <circle cx="12" cy="10" r="3" stroke="#7dd3fc" stroke-width="1.7"></circle>
        </svg>
        <div class="txt">Where you live</div>
      </div>

      <div class="chip c2" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="2120" data-sfx-volume="0.35">
        <svg class="ico" viewBox="0 0 24 24" width="30" height="30" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#7dd3fc" stroke-width="1.7"></circle>
          <path d="M12 6.8 V12 l3.6 2.6" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <div class="txt">When you reconnect</div>
      </div>

      <div class="chip c3" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="3560">
        <svg class="ico" viewBox="0 0 24 24" width="30" height="30" fill="none">
          <path d="M12 3 L21 8 L12 13 L3 8 Z" stroke="#7dd3fc" stroke-width="1.7" stroke-linejoin="round"></path>
          <path d="M3 12 L12 17 L21 12" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M3 16 L12 21 L21 16" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <div class="txt">Which <span class="sky">queue</span> holds your <span class="sky">backlog</span></div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-38-server-knows";

    // Host data-start = 347.14 → scene-local = global − 347.14. Chunk first word "Where" 347.64 = local 0.50.

    // Entrance crossfade over scene 37's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // the server settles first — the dossier owner, carried over from scene 37
    tl.fromTo(root + " .server", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.5)" }, 0.10);

    // BEAT 1 — "Where you live" 347.64→348.38 (local 0.50→1.24) — wire draws, the record snaps in
    tl.fromTo(root + " .w1", { strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.inOut" }, 0.50);
    tl.fromTo(root + " .c1", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.32, ease: "back.out(1.3)" }, 0.70);

    // BEAT 2 — "when you reconnect" 349.08→350.04 (local 1.94→2.90)
    tl.fromTo(root + " .w2", { strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.inOut" }, 1.94);
    tl.fromTo(root + " .c2", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.32, ease: "back.out(1.3)" }, 2.14);

    // BEAT 3 — "which queue is holding your backlog" 350.54→352.20 (local 3.40→5.06)
    tl.fromTo(root + " .w3", { strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.inOut" }, 3.40);
    tl.fromTo(root + " .c3", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.32, ease: "back.out(1.3)" }, 3.60);
    // "backlog" 351.70 (local 4.56) — the held data glows, the server's grip on it tightens
    tl.fromTo(root + " .c3 .ico", { filter: "drop-shadow(0 0 0px rgba(125,211,252,0))" }, { filter: "drop-shadow(0 0 12px rgba(125, 211, 252, 0.6))", duration: 0.4, ease: "power2.out" }, 4.56);
    tl.to(root + " .c3 .ico", { filter: "drop-shadow(0 0 4px rgba(125, 211, 252, 0.25))", duration: 0.6, ease: "power2.inOut" }, 5.06);
    // the server pulses as the third record lands — it holds all of it
    tl.fromTo(root + " .server", { boxShadow: "0 18px 48px rgba(0,0,0,0.4)" }, { boxShadow: "0 18px 48px rgba(0,0,0,0.4), 0 0 26px rgba(125,211,252,0.32)", duration: 0.5, ease: "power2.out" }, 3.60);

    // idle — barely-there drift
    tl.to(root + " .stage", { y: -3, duration: 2.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.6);

    window.__timelines["scene-38-server-knows"] = tl;
  </script>
</body>
</html>
