<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 86 — the per-user process, the supervisor, the in-RAM lookup, the blind pipe</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0d; --panel: #101613; --border: #1e2722;
      --fg: #e9edeb; --soft: #c3cbc7; --muted: #79857f; --dim: #39443f;
      --accent: #25d366; --accent-2: #7dd3fc; --read: #53bdeb; --cost: #f0b429; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-86-recap { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
    #scene-86-recap .stage { position: absolute; inset: 0; will-change: transform; }

    #scene-86-recap .list { position: absolute; left: 600px; top: 300px; width: 760px; }
    #scene-86-recap .item {
      display: flex; align-items: center; gap: 26px; height: 78px; margin-bottom: 30px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-86-recap .ic {
      flex: 0 0 auto; width: 66px; height: 66px; border-radius: 15px;
      display: flex; align-items: center; justify-content: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 34px; line-height: 1;
      border: 1.8px solid;
    }
    #scene-86-recap .sky .ic { border-color: var(--accent-2); background: rgba(125,211,252,0.09); color: var(--accent-2); }
    #scene-86-recap .grn .ic { border-color: var(--accent); background: rgba(37,211,102,0.09); color: var(--accent); }

    #scene-86-recap .tx { display: flex; flex-direction: column; gap: 4px; }
    #scene-86-recap .nm {
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 46px; color: var(--fg); letter-spacing: -0.012em;
    }
    #scene-86-recap .sub {
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 24px; color: var(--muted); letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="scene-86-recap" data-composition-id="scene-86-recap" data-width="1920" data-height="1080">
    <div class="stage">

      <div class="list">
        <div class="item i1 sky" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="680" data-sfx-volume="0.42">
          <div class="ic">&#9737;</div>
          <div class="tx"><span class="nm">the per-user process</span><span class="sub">one per connection</span></div>
        </div>
        <div class="item i2 grn" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2460" data-sfx-volume="0.42">
          <div class="ic">&#8635;</div>
          <div class="tx"><span class="nm">the supervisor</span><span class="sub">restarts what breaks</span></div>
        </div>
        <div class="item i3 sky" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5440" data-sfx-volume="0.42">
          <div class="ic">&#8801;</div>
          <div class="tx"><span class="nm">the in-RAM lookup</span><span class="sub">memory-speed routing</span></div>
        </div>
        <div class="item i4 grn" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="6620" data-sfx-volume="0.42">
          <div class="ic">&#8594;</div>
          <div class="tx"><span class="nm">the blind pipe</span><span class="sub">dumb + fast</span></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const root = "#scene-86-recap";

    // Host data-start = 619.72 → scene-local = global − 619.72. Chunk first word "The" 620.22 = local 0.50.

    // Entrance crossfade over scene 85's tail (overlap 0–0.5)
    tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "The per-user process," 620.22→620.86 (local 0.50→1.14)
    tl.fromTo(root + " .i1", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 0.68);

    // "the supervisor that restarts what breaks," 622.06→623.50 (local 2.34→3.78)
    tl.fromTo(root + " .i2", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 2.46);

    // "the in-RAM lookup," 625.16→625.78 (local 5.44→6.06)
    tl.fromTo(root + " .i3", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 5.44);

    // "the blind pipe," 626.34→626.88 (local 6.62→7.16)
    tl.fromTo(root + " .i4", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 6.62);

    window.__timelines["scene-86-recap"] = tl;
  </script>
</body>
</html>
