<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template id="scene-10-template">
      <div data-composition-id="scene-10-reframe" data-width="1920" data-height="1080">
        <style>
          [data-composition-id="scene-10-reframe"] {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #0b0d12;
            color: #e8eaed;
            font-family: "Inter", system-ui, sans-serif;
            overflow: hidden;
          }
          [data-composition-id="scene-10-reframe"] .glow {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(45% 50% at 28% 40%, rgba(255, 181, 71, 0.10), transparent 70%),
              radial-gradient(45% 50% at 72% 70%, rgba(255, 107, 93, 0.08), transparent 70%);
            pointer-events: none;
          }
          [data-composition-id="scene-10-reframe"] .stack {
            position: absolute;
            inset: 140px 160px 200px 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
          }
          [data-composition-id="scene-10-reframe"] .open {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
            align-items: center;
          }
          [data-composition-id="scene-10-reframe"] .cb-wrap {
            position: relative;
            width: 240px;
            height: 240px;
            background: #11141b;
            border: 2px solid #1f242c;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          [data-composition-id="scene-10-reframe"] .cb-wrap .cb {
            position: relative;
            width: 130px;
            height: 130px;
            border: 5px solid #3a4150;
            border-radius: 10px;
            background: #0b0d12;
          }
          [data-composition-id="scene-10-reframe"] .cb-wrap .cb svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .cb-wrap .meter {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            height: 4px;
            background: #1f242c;
            border-radius: 2px;
            overflow: hidden;
          }
          [data-composition-id="scene-10-reframe"] .cb-wrap .meter .fill {
            position: absolute;
            inset: 0;
            background: #7dd87d;
            transform-origin: left center;
            transform: scaleX(0);
          }
          [data-composition-id="scene-10-reframe"] .open .text {
            font: 800 88px/1 "Inter", sans-serif;
            letter-spacing: -0.02em;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .open .text em {
            color: #ffb547;
            font-style: italic;
          }
          [data-composition-id="scene-10-reframe"] .open .text .tag {
            display: inline-block;
            padding: 4px 14px;
            background: #11141b;
            border: 1px solid #1f242c;
            border-radius: 6px;
            font: 600 32px/1 "JetBrains Mono", monospace;
            color: #67e8f9;
            margin-left: 8px;
            transform: translateY(-12px);
          }
          [data-composition-id="scene-10-reframe"] .body {
            font: 500 38px/1.45 "Inter", sans-serif;
            color: #7a8493;
            max-width: 1500px;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .body b {
            color: #e8eaed;
            font-weight: 600;
          }
          [data-composition-id="scene-10-reframe"] .punct {
            display: flex;
            flex-direction: column;
            gap: 6px;
          }
          [data-composition-id="scene-10-reframe"] .punct .p1 {
            font: 800 120px/1 "Inter", sans-serif;
            letter-spacing: -0.02em;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .punct .p1 em {
            color: #ffb547;
            font-style: italic;
          }
          [data-composition-id="scene-10-reframe"] .punct .dot {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: #ffb547;
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: baseline;
            transform: scale(0);
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 {
            font: 800 120px/1 "Inter", sans-serif;
            letter-spacing: -0.02em;
            opacity: 0;
            position: relative;
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 em {
            color: #ff6b5d;
            font-style: italic;
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 .cursor {
            display: inline-block;
            width: 4px;
            height: 100px;
            background: #ffb547;
            vertical-align: middle;
            margin-left: 6px;
            opacity: 0;
          }
        </style>

        <div class="glow"></div>

        <div class="stack">
          <div class="open">
            <div class="cb-wrap" id="s10-cbwrap">
              <div class="cb" id="s10-cb">
                <svg viewBox="0 0 100 100" id="s10-check">
                  <path
                    d="M22 52 L44 72 L80 28"
                    fill="none"
                    stroke="#7dd87d"
                    stroke-width="10"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-dasharray="120"
                    stroke-dashoffset="120"
                  />
                </svg>
              </div>
              <div class="meter"><div class="fill" id="s10-meter"></div></div>
            </div>
            <div class="text" id="s10-h">
              the next time you click<br />
              <em>"I'm not a robot,"</em> <span class="tag">remember.</span>
            </div>
          </div>

          <div class="body" id="s10-body">
            the box doesn't know whether you are human.<br />
            the system behind it <b>watched how you got there</b> · how fast you clicked ·
            what <b>cookies</b> you carried · and what the page <b>rendered like under your cursor</b>.
          </div>

          <div class="punct">
            <div class="p1" id="s10-p1">the checkbox is the <em>punctuation</em><span class="dot" id="s10-dot"></span></div>
            <div class="p2" id="s10-p2">the sentence was <em>already written</em><span class="cursor" id="s10-cur"></span></div>
          </div>
        </div>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
              '[data-composition-id="scene-10-reframe"]',
              { opacity: 0 },
              { opacity: 1, duration: 0.5, ease: "power2.out" },
              0,
            );

            // 0.90s — "The next time you click"
            tl.fromTo(
              "#s10-cbwrap",
              { opacity: 0, y: 30, scale: 0.96 },
              { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" },
              0.5,
            );
            tl.fromTo("#s10-cb", { borderColor: "#3a4150" }, { borderColor: "#7dd87d", duration: 0.4 }, 1.4);
            tl.to(
              "#s10-check",
              { opacity: 1, duration: 0.05 },
              1.4,
            );
            tl.to(
              "#s10-check path",
              { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
              1.4,
            );
            tl.fromTo(
              "#s10-meter",
              { scaleX: 0 },
              { scaleX: 1, duration: 1.2, ease: "power2.out" },
              1.8,
            );
            tl.fromTo(
              "#s10-h",
              { opacity: 0, x: -20 },
              { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
              0.75,
            );

            // 3.54s — "remember." pulse
            tl.fromTo(
              "#s10-h .tag",
              { scale: 0.6, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" },
              3.45,
            );

            // 5-12 — body fades in
            tl.fromTo("#s10-body", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.0);

            // 15.23-16.92 — "The checkbox is the punctuation."
            tl.fromTo("#s10-p1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 14.9);
            tl.fromTo(
              "#s10-dot",
              { scale: 0 },
              { scale: 1, duration: 0.4, ease: "back.out(2.5)", overwrite: "auto" },
              16.6,
            );
            tl.to(
              "#s10-dot",
              { scale: 1.3, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out", overwrite: "auto" },
              17.05,
            );

            // 17.5-18.82 — "The sentence was already written."
            tl.fromTo("#s10-p2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 17.3);
            tl.fromTo(
              "#s10-cur",
              { opacity: 0 },
              { opacity: 1, duration: 0.05, overwrite: "auto" },
              18.6,
            );
            tl.to(
              "#s10-cur",
              { opacity: 0, duration: 0.3, repeat: 1, yoyo: true, ease: "steps(1)", overwrite: "auto" },
              18.75,
            );

            // ambient: checkbox subtle exhale
            tl.to(
              "#s10-cbwrap",
              { y: -8, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 },
              3.2,
            );

            window.__timelines["scene-10-reframe"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
