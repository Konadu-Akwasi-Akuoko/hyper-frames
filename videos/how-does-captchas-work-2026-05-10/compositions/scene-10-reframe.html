<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template id="scene-10-template">
      <div data-composition-id="scene-10-reframe" data-width="1920" data-height="1080">
        <style>
          [data-composition-id="scene-10-reframe"] {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #0b0d12;
            color: #e8eaed;
            font-family: "Inter", system-ui, sans-serif;
            overflow: hidden;
          }
          [data-composition-id="scene-10-reframe"] .glow {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(45% 50% at 28% 40%, rgba(255, 181, 71, 0.10), transparent 70%),
              radial-gradient(45% 50% at 72% 70%, rgba(255, 107, 93, 0.08), transparent 70%);
            pointer-events: none;
          }
          [data-composition-id="scene-10-reframe"] .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
              linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(60% 60% at 50% 50%, #000 35%, transparent 80%);
            pointer-events: none;
          }
          [data-composition-id="scene-10-reframe"] .stack {
            position: absolute;
            inset: 110px 160px 110px 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-origin: 50% 50%;
          }
          [data-composition-id="scene-10-reframe"] .open {
            display: grid;
            grid-template-columns: 580px 1fr;
            gap: 60px;
            align-items: center;
          }
          [data-composition-id="scene-10-reframe"] .card {
            position: relative;
            width: 560px;
            height: 320px;
            background: #11141b;
            border: 1px solid #1f242c;
            border-radius: 18px;
            overflow: hidden;
            opacity: 0;
            box-shadow:
              0 0 60px rgba(255, 181, 71, 0.35),
              inset 0 0 24px rgba(103, 232, 249, 0.12);
          }
          [data-composition-id="scene-10-reframe"] .card video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
          }
          [data-composition-id="scene-10-reframe"] .card .card-scan {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 56px;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(
              180deg,
              rgba(255, 181, 71, 0) 0%,
              rgba(255, 181, 71, 0.05) 50%,
              rgba(255, 181, 71, 0.18) 80%,
              rgba(255, 181, 71, 0.40) 100%
            );
            mix-blend-mode: screen;
            z-index: 3;
          }
          [data-composition-id="scene-10-reframe"] .card .card-beam {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            pointer-events: none;
            opacity: 0;
            z-index: 4;
            overflow: visible;
          }
          [data-composition-id="scene-10-reframe"] .card .card-beam rect {
            vector-effect: non-scaling-stroke;
          }
          [data-composition-id="scene-10-reframe"] .card .corners {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
          }
          [data-composition-id="scene-10-reframe"] .card .corners path {
            fill: none;
            stroke: #ffb547;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
          }
          [data-composition-id="scene-10-reframe"] .card .rec {
            position: absolute;
            left: 14px;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font: 600 14px/1 "JetBrains Mono", monospace;
            color: #e8eaed;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            opacity: 0;
            z-index: 6;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
          }
          [data-composition-id="scene-10-reframe"] .card .rec .pip {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff6b5d;
            box-shadow: 0 0 6px #ff6b5d;
          }
          [data-composition-id="scene-10-reframe"] .card .rec .tc {
            color: #ffb547;
            font-variant-numeric: tabular-nums;
          }
          [data-composition-id="scene-10-reframe"] .open .text {
            position: relative;
            font: 800 88px/1 "Inter", sans-serif;
            letter-spacing: -0.02em;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .open .text em {
            color: #ffb547;
            font-style: italic;
            position: relative;
          }
          [data-composition-id="scene-10-reframe"] .open .text .ul {
            position: absolute;
            left: 0;
            bottom: -6px;
            height: 4px;
            width: 100%;
            background: #ffb547;
            transform-origin: left center;
            transform: scaleX(0);
            border-radius: 2px;
          }
          [data-composition-id="scene-10-reframe"] .open .text .tag {
            display: inline-block;
            padding: 4px 14px;
            background: #11141b;
            border: 1px solid #1f242c;
            border-radius: 6px;
            font: 600 32px/1 "JetBrains Mono", monospace;
            color: #67e8f9;
            margin-left: 8px;
            transform: translateY(-12px);
          }
          [data-composition-id="scene-10-reframe"] .telemetry {
            position: relative;
            background: #0e1117;
            border: 1px solid #1f242c;
            border-radius: 12px;
            padding: 22px 28px;
            opacity: 0;
            max-width: 1500px;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .t-head {
            font: 500 18px/1 "JetBrains Mono", monospace;
            color: #7a8493;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: 14px;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .rows {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 36px;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .row {
            display: grid;
            grid-template-columns: 1fr auto 18px;
            align-items: center;
            gap: 18px;
            font: 500 22px/1 "JetBrains Mono", monospace;
            color: #7a8493;
            letter-spacing: 0.04em;
            padding: 7px 0;
            border-bottom: 1px dashed #1f242c;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .row .v {
            color: #e8eaed;
            font-variant-numeric: tabular-nums;
            text-align: right;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .row .st {
            color: #7dd87d;
            font-size: 20px;
            text-align: center;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .row.warn .st {
            color: #ffb547;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .verdict {
            margin-top: 14px;
            font: 700 26px/1 "JetBrains Mono", monospace;
            color: #ffb547;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .telemetry .verdict .caret {
            display: inline-block;
            width: 10px;
            height: 22px;
            background: #ffb547;
            vertical-align: -3px;
            margin-left: 4px;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .punct {
            display: flex;
            flex-direction: column;
            gap: 6px;
          }
          [data-composition-id="scene-10-reframe"] .punct .p1 {
            position: relative;
            font: 800 96px/1 "Inter", sans-serif;
            letter-spacing: -0.02em;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .punct .p1 em {
            color: #ffb547;
            font-style: italic;
          }
          [data-composition-id="scene-10-reframe"] .punct .dot-wrap {
            position: relative;
            display: inline-block;
            margin-left: 8px;
            vertical-align: baseline;
          }
          [data-composition-id="scene-10-reframe"] .punct .dot {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: #ffb547;
            border-radius: 50%;
            transform: scale(0);
          }
          [data-composition-id="scene-10-reframe"] .punct .dot-ring {
            position: absolute;
            left: 14px;
            top: 14px;
            width: 28px;
            height: 28px;
            margin: -14px 0 0 -14px;
            border: 2px solid #ffb547;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 {
            position: relative;
            font: 800 96px/1 "Inter", sans-serif;
            letter-spacing: -0.02em;
            opacity: 0;
            white-space: nowrap;
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 em {
            color: #ff6b5d;
            font-style: italic;
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 .cursor {
            display: inline-block;
            width: 4px;
            height: 78px;
            background: #ffb547;
            vertical-align: middle;
            margin-left: 6px;
            opacity: 0;
          }
          [data-composition-id="scene-10-reframe"] .punct .p2 .ul {
            position: absolute;
            left: 0;
            bottom: -6px;
            height: 4px;
            width: 100%;
            background: #ffb547;
            transform-origin: left center;
            transform: scaleX(0);
            border-radius: 2px;
            opacity: 0.85;
          }
        </style>

        <div class="glow"></div>
        <div class="grid-bg"></div>

        <div class="stack" id="s10-stack">
          <div class="open">
            <div class="card" id="s10-card">
              <video
                id="s10-vid"
                class="clip"
                src="../assets/captcha-real.mp4"
                data-start="0.5"
                data-duration="19.0"
                data-track-index="2"
                muted
                playsinline
                crossorigin="anonymous"
              ></video>
              <div class="card-scan" id="s10-cardscan"></div>
              <svg class="card-beam" id="s10-cardbeam" data-layout-allow-overflow preserveAspectRatio="none">
                <rect class="b6" pathLength="100" fill="none" stroke-width="2"   stroke="#ffb547" stroke-dasharray="16 84"   stroke-dashoffset="0" opacity="0.06" rx="18" ry="18"/>
                <rect class="b5" pathLength="100" fill="none" stroke-width="2"   stroke="#ff9a30" stroke-dasharray="10 90"   stroke-dashoffset="0" opacity="0.12" rx="18" ry="18"/>
                <rect class="b4" pathLength="100" fill="none" stroke-width="1.6" stroke="#ffb547" stroke-dasharray="6 94"    stroke-dashoffset="0" opacity="0.22" rx="18" ry="18"/>
                <rect class="b3" pathLength="100" fill="none" stroke-width="1.4" stroke="#ffb547" stroke-dasharray="3.5 96.5" stroke-dashoffset="0" opacity="0.40" rx="18" ry="18"/>
                <rect class="b2" pathLength="100" fill="none" stroke-width="1.2" stroke="#ffd57a" stroke-dasharray="2 98"    stroke-dashoffset="0" opacity="0.65" rx="18" ry="18"/>
                <rect class="b1" pathLength="100" fill="none" stroke-width="1.0" stroke="#fff5d0" stroke-dasharray="1 99"    stroke-dashoffset="0" opacity="1.00" rx="18" ry="18"/>
              </svg>
              <svg class="corners" viewBox="0 0 560 320">
                <path d="M 6 22 L 6 6 L 22 6"/>
                <path d="M 538 6 L 554 6 L 554 22"/>
                <path d="M 554 298 L 554 314 L 538 314"/>
                <path d="M 22 314 L 6 314 L 6 298"/>
              </svg>
              <div class="rec" id="s10-rec">
                <span class="pip"></span>
                <span>rec</span>
                <span class="tc" id="s10-tc">00:00.0</span>
              </div>
            </div>
            <div class="text" id="s10-h">
              the next time you click<br />
              <em>"I'm not a robot,"<span class="ul" id="s10-rob-ul"></span></em>
              <span class="tag">remember.</span>
            </div>
          </div>

          <div class="telemetry" id="s10-tel">
            <div class="t-head">&gt; inspect.visitor &nbsp;·&nbsp; 7f3a-2c91</div>
            <div class="rows">
              <div class="row" id="s10-r1"><span>mouse.path</span><span class="v">312 samples</span><span class="st">●</span></div>
              <div class="row" id="s10-r2"><span>cursor.dwell</span><span class="v">1.84s</span><span class="st">●</span></div>
              <div class="row" id="s10-r3"><span>cookie.gclid</span><span class="v">•••••••• carried</span><span class="st">●</span></div>
              <div class="row" id="s10-r4"><span>fingerprint.fonts</span><span class="v">47 loaded</span><span class="st">●</span></div>
              <div class="row warn" id="s10-r5"><span>scroll.delta</span><span class="v">0 px</span><span class="st">⚠</span></div>
              <div class="row" id="s10-r6"><span>viewport.render</span><span class="v">1920×1080</span><span class="st">●</span></div>
              <div class="row" id="s10-r7"><span>referrer.chain</span><span class="v">3 hops</span><span class="st">●</span></div>
              <div class="row" id="s10-r8"><span>trust.score</span><span class="v"><span id="s10-tsv">0.00</span> <span id="s10-tsm">▯▯▯▯▯▯▯▯▯▯</span></span><span class="st">●</span></div>
            </div>
            <div class="verdict" id="s10-verdict">&gt; <span id="s10-verdict-t"></span><span class="caret" id="s10-verdict-c"></span></div>
          </div>

          <div class="punct">
            <div class="p1" id="s10-p1">the checkbox is the <em>punctuation</em><span class="dot-wrap"><span class="dot" id="s10-dot"></span><span class="dot-ring" id="s10-dot-r1"></span><span class="dot-ring" id="s10-dot-r2"></span><span class="dot-ring" id="s10-dot-r3"></span></span></div>
            <div class="p2" id="s10-p2">the sentence was <em>already written</em><span class="cursor" id="s10-cur"></span><span class="ul" id="s10-p2-ul"></span></div>
          </div>
        </div>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            // Composition fade-in
            tl.fromTo(
              '[data-composition-id="scene-10-reframe"]',
              { opacity: 0 },
              { opacity: 1, duration: 0.5, ease: "power2.out" },
              0,
            );

            // 0.5s — card appears (synced with video clip data-start)
            tl.fromTo(
              "#s10-card",
              { opacity: 0, y: 30, scale: 0.96 },
              { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" },
              0.5,
            );
            // Corner brackets draw in
            tl.to(
              "#s10-card .corners path",
              { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.08 },
              0.7,
            );
            // REC strip blinks on
            tl.fromTo("#s10-rec", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 1.0);
            // REC pip heartbeat — 1.2s cycle, finite repeat through scene end
            const recCycle = 1.2;
            const recRepeats = Math.ceil((19.94 - 1.0) / recCycle) - 1;
            tl.to(
              "#s10-rec .pip",
              { opacity: 0.25, duration: recCycle / 2, ease: "sine.inOut", yoyo: true, repeat: recRepeats },
              1.0,
            );
            // Timecode counter — counts 0.0 → 6.0 (the meaningful capture window), then holds
            const tcObj = { v: 0 };
            tl.to(
              tcObj,
              {
                v: 6.0,
                duration: 6.0,
                ease: "none",
                onUpdate: function () {
                  const el = document.getElementById("s10-tc");
                  if (!el) return;
                  const s = Math.max(0, tcObj.v);
                  const m = Math.floor(s / 60);
                  const r = (s - m * 60).toFixed(1);
                  el.textContent = String(m).padStart(2, "0") + ":" + r.padStart(4, "0");
                },
              },
              0.5,
            );

            // Perimeter beam — loops over card edge. Set viewBox + rect dims to match
            // the card frame (568 × 328 incl. -4px inset).
            (function () {
              const beam = document.getElementById("s10-cardbeam");
              if (!beam) return;
              const W = 568, H = 328;
              beam.setAttribute("viewBox", `0 0 ${W} ${H}`);
              beam.querySelectorAll("rect").forEach((r) => {
                r.setAttribute("x", "2");
                r.setAttribute("y", "2");
                r.setAttribute("width", String(W - 4));
                r.setAttribute("height", String(H - 4));
              });
            })();
            tl.to("#s10-cardbeam", { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.6);
            // Beam cycle: 4s per loop, finite repeats from t=0.6 to scene end.
            const beamCycle = 4.0;
            const beamRepeats = Math.ceil((19.94 - 0.6) / beamCycle) - 1;
            tl.fromTo(
              "#s10-cardbeam rect",
              { attr: { "stroke-dashoffset": 0 } },
              {
                attr: { "stroke-dashoffset": -100 },
                duration: beamCycle,
                ease: "none",
                repeat: beamRepeats,
                immediateRender: false,
              },
              0.6,
            );

            // Card scanline crackle — sweep every 2s, finite repeats.
            const scanCycle = 2.0;
            const scanRepeats = Math.ceil((19.94 - 0.6) / scanCycle) - 1;
            tl.set("#s10-cardscan", { y: -56, opacity: 0 });
            tl.to(
              "#s10-cardscan",
              {
                keyframes: [
                  { opacity: 0.4, y: -56, duration: 0 },
                  { y: 320, duration: scanCycle * 0.7, ease: "power1.inOut" },
                  { opacity: 0, duration: scanCycle * 0.3, ease: "power1.in" },
                ],
                repeat: scanRepeats,
              },
              0.6,
            );

            // 0.90s — title text fades in
            tl.fromTo(
              "#s10-h",
              { opacity: 0, x: -20 },
              { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
              0.9,
            );

            // 2.12s — "I'm not a robot" amber underline sweeps in
            tl.to(
              "#s10-rob-ul",
              { scaleX: 1, duration: 0.45, ease: "power2.out" },
              2.12,
            );

            // 3.16s — "remember." tag pulse
            tl.fromTo(
              "#s10-h .tag",
              { scale: 0.6, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" },
              3.16,
            );

            // 4.70s — telemetry panel slides in after the 1160ms hold
            tl.fromTo(
              "#s10-tel",
              { opacity: 0, y: 24 },
              { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
              4.70,
            );
            // 8 rows drop in with 90ms stagger
            tl.fromTo(
              "#s10-tel .row",
              { opacity: 0, x: 24 },
              { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.09 },
              4.80,
            );

            // trust.score meter fills 0.00 → 0.91 over 0.8s starting after the last row lands
            const trust = { v: 0 };
            tl.to(
              trust,
              {
                v: 0.91,
                duration: 0.8,
                ease: "power2.out",
                onUpdate: function () {
                  const tv = document.getElementById("s10-tsv");
                  const tm = document.getElementById("s10-tsm");
                  if (!tv || !tm) return;
                  tv.textContent = trust.v.toFixed(2);
                  const filled = Math.min(10, Math.round(trust.v * 10));
                  tm.textContent = "▮".repeat(filled) + "▯".repeat(10 - filled);
                },
              },
              6.20,
            );

            // 11.0s — VERDICT line types out, matching narration "rendered like under your cursor"
            const verdictText = "verdict · human-likely";
            const v = { i: 0 };
            tl.fromTo("#s10-verdict", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 10.9);
            tl.to(
              v,
              {
                i: verdictText.length,
                duration: 1.2,
                ease: "none",
                onUpdate: function () {
                  const el = document.getElementById("s10-verdict-t");
                  if (el) el.textContent = verdictText.slice(0, Math.round(v.i));
                },
              },
              11.0,
            );
            // Caret blinks during typing then settles
            tl.set("#s10-verdict-c", { opacity: 1 }, 11.0);
            tl.to(
              "#s10-verdict-c",
              { opacity: 0, duration: 0.25, yoyo: true, repeat: 6, ease: "steps(1)" },
              11.0,
            );
            tl.to("#s10-verdict-c", { opacity: 0, duration: 0.1 }, 12.6);

            // 14.9s — "the checkbox is the punctuation" enters
            tl.fromTo("#s10-p1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 14.9);

            // 16.18s — punctuation dot scale + concentric ring expansion (mirror scene 1 ripple)
            tl.fromTo(
              "#s10-dot",
              { scale: 0 },
              { scale: 1, duration: 0.4, ease: "back.out(2.5)", overwrite: "auto" },
              16.18,
            );
            tl.to(
              "#s10-dot",
              { scale: 1.3, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out", overwrite: "auto" },
              16.6,
            );
            ["#s10-dot-r1", "#s10-dot-r2", "#s10-dot-r3"].forEach((sel, i) => {
              tl.fromTo(
                sel,
                { opacity: 0.7, scale: 0.4 },
                { opacity: 0, scale: 3.4, duration: 1.0, ease: "power2.out", immediateRender: false },
                16.18 + i * 0.18,
              );
            });

            // 17.3s — "the sentence was already written" enters
            tl.fromTo("#s10-p2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 17.3);

            // 18.18s — underline sweep beneath "already written" line
            tl.set("#s10-p2-ul", { opacity: 0.85 }, 18.18);
            tl.to(
              "#s10-p2-ul",
              { scaleX: 1, duration: 0.5, ease: "power2.out" },
              18.18,
            );

            // 18.50s — cursor blink on the period
            tl.fromTo(
              "#s10-cur",
              { opacity: 0 },
              { opacity: 1, duration: 0.05, overwrite: "auto" },
              18.50,
            );
            tl.to(
              "#s10-cur",
              { opacity: 0, duration: 0.3, repeat: 1, yoyo: true, ease: "steps(1)", overwrite: "auto" },
              18.65,
            );

            // Ambient: slow Ken-Burns dolly on the whole stack — adds life through the long body section.
            // Runs across the full scene; last tween ends at 19.94 to satisfy Key Rule #7.
            tl.fromTo(
              "#s10-stack",
              { scale: 1, x: 0 },
              { scale: 1.02, x: -8, duration: 19.94, ease: "sine.inOut" },
              0,
            );

            window.__timelines["scene-10-reframe"] = tl;
