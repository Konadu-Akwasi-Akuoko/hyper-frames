        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
              '[data-composition-id="scene-08-behavioral"]',
              { opacity: 0 },
              { opacity: 1, duration: 0.5, ease: "power2.out" },
              0,
            );

            // STAGE A — 0-15s
            tl.fromTo("#s8-a", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0.1);
            tl.fromTo("#s8-a-eb", { opacity: 0, y: 12 }, { opacity: 0.9, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
            // 8.04 — fake cookies/VPN/mouse signals
            tl.fromTo(
              "#s8-a-sigs .pill",
              { opacity: 0, y: 20 },
              { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.18 },
              7.6,
            );
            // 12.13 — visible test had stopped being the test
            tl.fromTo(
              "#s8-a-strike",
              { opacity: 0, y: 30 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
              11.4,
            );
            tl.fromTo(
              "#s8-a-em",
              { opacity: 0, y: 30 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
              12.0,
            );
            // strike line
            const strikeNode = document.querySelector("#s8-a-strike");
            tl.to(
              "#s8-a-strike",
              {
                "--strike": 1,
                duration: 0.55,
                ease: "expo.out",
                onUpdate: function () {
                  // animate the ::after via style mutation isn't supported in JS for pseudo; use a CSS variable.
                },
              },
              13.0,
            );
            // Animate the strike pseudo via JS-set style on the parent
            tl.add(() => {
              const sheet = (document.querySelector("style") || {}).sheet;
            }, 12.5);
            tl.to("#s8-a", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14.7);

            // STAGE B — 14.5-37s — v3 + score + peers
            tl.fromTo("#s8-b", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 14.3);
            // 15.26 — 2017 + version three
            tl.fromTo("#s8-b-eb", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 14.8);
            tl.fromTo("#s8-b .right .h", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 15.0);
            // gauge appears
            tl.fromTo(
              "#s8-b .gauge-wrap",
              { opacity: 0, x: 60, scale: 0.96 },
              { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "expo.out" },
              19.0,
            );
            // 22.48 — zero to one — sweep the marker from 0 to 0.92
            const score = { v: 0 };
            tl.to(
              score,
              {
                v: 0.92,
                duration: 3.5,
                ease: "power2.out",
                onUpdate: function () {
                  const mk = document.getElementById("s8-b-mk");
                  const mv = document.getElementById("s8-b-mv");
                  if (mk) mk.style.left = (score.v * 100) + "%";
                  if (mv) mv.textContent = score.v.toFixed(2);
                },
              },
              22.2,
            );
            tl.fromTo("#s8-b-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 22.2);

            // 28.8 — how they move, type, look — signals fill in
            const sigVals = [
              { id: "s8-sig-1", val: "smooth · accel" },
              { id: "s8-sig-2", val: "120 wpm · steady" },
              { id: "s8-sig-3", val: "macOS · 16-pro" },
              { id: "s8-sig-4", val: "9c4·a1f" },
              { id: "s8-sig-5", val: "google · 14d" },
              { id: "s8-sig-6", val: "residential · ok" },
              { id: "s8-sig-7", val: "search → site" },
              { id: "s8-sig-8", val: "varied · human" },
            ];
            sigVals.forEach((s, i) => {
              tl.to(
                "#" + s.id,
                {
                  duration: 0.15,
                  onComplete: function () {
                    const el = document.getElementById(s.id);
                    if (el) el.textContent = s.val;
                  },
                },
                28.4 + i * 0.18,
              );
              tl.fromTo("#" + s.id, { opacity: 0.3, color: "#ffb547" }, { opacity: 1, color: "#e8eaed", duration: 0.3 }, 28.4 + i * 0.18);
            });

            // 33.90 — hCaptcha / Cloudflare Turnstile peers
            tl.fromTo("#s8-b-pe1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 33.7);
            tl.fromTo("#s8-b-pe2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 34.5);

            // 37.6 — "AI mimics now" — score collapses to fake-high values
