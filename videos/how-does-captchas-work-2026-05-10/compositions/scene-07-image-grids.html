        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
              '[data-composition-id="scene-07-grids"]',
              { opacity: 0 },
              { opacity: 1, duration: 0.5, ease: "power2.out" },
              0,
            );

            // STAGE A — 0-19s
            tl.fromTo("#s7-a", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0.1);
            tl.fromTo("#s7-a-eb", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.3);
            tl.fromTo(
              "#s7-a-yr",
              { opacity: 0, scale: 0.85, y: 30 },
              { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.4)" },
              0.4,
            );
            tl.fromTo(
              "#s7-a-head",
              { opacity: 0, y: 30 },
              { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
              3.7,
            );
            tl.fromTo(
              "#s7-a-panel",
              { opacity: 0, x: 40, scale: 0.96 },
              { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "expo.out" },
              5.5,
            );
            // 9.52 — 3x3 grid (cells stagger in)
            tl.fromTo(
              "#s7-a-grid .cell",
              { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", stagger: { each: 0.05, from: "start" } },
              8.6,
            );
            // Prompts and check sequences:
            // 12.38 crosswalks
            tl.fromTo("#s7-a-p1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 12.2);
            tl.to("#s7-a-grid .cell.cw .check", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.06 }, 12.3);
            tl.to("#s7-a-grid .cell.cw", { borderColor: "#4285f4", duration: 0.3 }, 12.3);
            // 14.96 lights
            tl.fromTo("#s7-a-p2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 14.8);
            tl.to(
              "#s7-a-pmt-text",
              { opacity: 0, duration: 0.12, onComplete: () => { const el = document.getElementById("s7-a-pmt-text"); if (el) el.textContent = "Select all squares with traffic lights"; }, overwrite: "auto" },
              14.8,
            );
            tl.to("#s7-a-pmt-text", { opacity: 1, duration: 0.15, overwrite: "auto" }, 14.96);
            tl.to("#s7-a-grid .cell.tl .check", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.06 }, 14.95);
            tl.to("#s7-a-grid .cell.tl", { borderColor: "#4285f4", duration: 0.3 }, 14.95);
            // 17.24 hydrants
            tl.fromTo("#s7-a-p3", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 17.0);
            tl.to(
              "#s7-a-pmt-text",
              { opacity: 0, duration: 0.12, onComplete: () => { const el = document.getElementById("s7-a-pmt-text"); if (el) el.textContent = "Select all squares with fire hydrants"; }, overwrite: "auto" },
              17.0,
            );
            tl.to("#s7-a-pmt-text", { opacity: 1, duration: 0.15, overwrite: "auto" }, 17.16);
            tl.to("#s7-a-grid .cell.fh .check", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.06 }, 17.15);
            tl.to("#s7-a-grid .cell.fh", { borderColor: "#4285f4", duration: 0.3 }, 17.15);
            tl.to("#s7-a", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19.5);

            // STAGE B — 19.5-39s
            tl.fromTo("#s7-b", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 19.3);
            // 21.74 trained recognition
            tl.fromTo("#s7-b-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 19.8);
            tl.fromTo("#s7-b-n1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, 22.0);
            const labels = { v: 0 };
            tl.to(
              labels,
              {
                v: 1_200_000_000,
                duration: 4,
                ease: "power2.out",
                onUpdate: function () {
                  const el = document.getElementById("s7-b-n1-n");
                  if (!el) return;
                  const v = labels.v;
                  if (v < 1e6) el.textContent = (Math.round(v / 1e3) | 0) + " K";
                  else if (v < 1e9) el.textContent = (v / 1e6).toFixed(1) + " M";

                },
              },

            tl.fromTo(

            // 50.34 14k photographs — count up

            tl.fromTo("#s7-c-bars", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 52.0);
            // animate bars and counters one at a time (hardcoded selectors — bundler can't handle template-literal selectors)
            function animateRow(fillSel, pctSel, pct, t) {
              tl.fromTo(fillSel, { scaleX: 0 }, { scaleX: pct / 100, duration: 0.7, ease: "expo.out" }, t);
              const ctr = { v: 0 };
