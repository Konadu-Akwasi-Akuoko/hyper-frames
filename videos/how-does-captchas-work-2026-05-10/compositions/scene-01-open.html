<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template id="scene-01-template">
      <div data-composition-id="scene-01-open" data-width="1920" data-height="1080">
        <style>
          [data-composition-id="scene-01-open"] {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #0b0d12;
            font-family: "Inter", system-ui, sans-serif;
            color: #e8eaed;
            overflow: hidden;
          }
          [data-composition-id="scene-01-open"] .glow {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(60% 50% at 30% 45%, rgba(255, 181, 71, 0.10), transparent 70%),
              radial-gradient(40% 40% at 78% 75%, rgba(103, 232, 249, 0.06), transparent 70%);
            pointer-events: none;
          }
          [data-composition-id="scene-01-open"] .grid {
            position: absolute;
            inset: 0;
            background-image:
              linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(closest-side, #000 50%, transparent 90%);
          }
          [data-composition-id="scene-01-open"] .ghost {
            position: absolute;
            top: 70px;
            right: -40px;
            font: 900 360px/0.9 "Inter", sans-serif;
            color: #11141b;
            letter-spacing: -0.02em;
            user-select: none;
          }
          [data-composition-id="scene-01-open"] .stage {
            position: absolute;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%);
            width: 920px;
            padding: 36px 44px;
            background: #11141b;
            border: 2px solid #1f242c;
            border-radius: 18px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 32px;
          }
          [data-composition-id="scene-01-open"] .stage::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 18px;
            background: radial-gradient(120% 80% at 0% 0%, rgba(255, 181, 71, 0.18), transparent 60%);
            pointer-events: none;
            opacity: 0.4;
          }
          [data-composition-id="scene-01-open"] .beam {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            pointer-events: none;
            opacity: 0;
            overflow: visible;
          }
          [data-composition-id="scene-01-open"] .beam rect {
            vector-effect: non-scaling-stroke;
          }
          [data-composition-id="scene-01-open"] .cb {
            position: relative;
            width: 96px;
            height: 96px;
            border: 4px solid #3a4150;
            border-radius: 8px;
            background: #0b0d12;
            flex-shrink: 0;
          }
          [data-composition-id="scene-01-open"] .cb svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
          }
          [data-composition-id="scene-01-open"] .cb .ring {
            position: absolute;
            inset: -20px;
            border: 3px solid #7dd87d;
            border-radius: 16px;
            opacity: 0;
          }
          [data-composition-id="scene-01-open"] .label {
            font: 700 60px/1.05 "Inter", sans-serif;
            letter-spacing: -0.01em;
          }
          [data-composition-id="scene-01-open"] .privacy {
            position: absolute;
            right: 36px;
            bottom: 18px;
            font: 400 18px/1 "Inter", sans-serif;
            color: #7a8493;
          }
          [data-composition-id="scene-01-open"] .brandmark {
            position: absolute;
            right: 36px;
            top: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            font: 500 16px/1 "JetBrains Mono", monospace;
            color: #7a8493;
            letter-spacing: 0.1em;
          }
          [data-composition-id="scene-01-open"] .brandmark::before {
            content: "";
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #67e8f9;
            border-right-color: transparent;
            display: inline-block;
          }
          [data-composition-id="scene-01-open"] .cursor {
            position: absolute;
            left: 1140px;
            top: 720px;
            width: 36px;
            height: 36px;
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.55));
          }
          [data-composition-id="scene-01-open"] .ripple {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid #7dd87d;
            left: 50%;
            top: 52%;
            margin: -100px 0 0 -100px;
            transform: translate(-300px, 0) scale(0.2);
            opacity: 0;
            pointer-events: none;
          }
          [data-composition-id="scene-01-open"] .footer {
            position: absolute;
            left: 160px;
            bottom: 110px;
            display: flex;
            gap: 36px;
          }
          [data-composition-id="scene-01-open"] .stat {
            display: flex;
            flex-direction: column;
            gap: 6px;
          }
          [data-composition-id="scene-01-open"] .stat .n {
            font: 700 64px/0.9 "JetBrains Mono", monospace;
            font-variant-numeric: tabular-nums;
            color: #ffb547;
            letter-spacing: -0.02em;
          }
          [data-composition-id="scene-01-open"] .stat .u {
            font: 500 18px/1 "JetBrains Mono", monospace;
            color: #7a8493;
            letter-spacing: 0.18em;
            text-transform: uppercase;
          }
          [data-composition-id="scene-01-open"] .targets {
            position: absolute;
            left: 160px;
            top: 240px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
          }
          [data-composition-id="scene-01-open"] .target {
            font: 400 44px/1 "Inter", sans-serif;
            color: #7a8493;
          }
          [data-composition-id="scene-01-open"] .target b {
            color: #e8eaed;
            font-weight: 600;
          }
          [data-composition-id="scene-01-open"] .rule {
            position: absolute;
            left: 160px;
            right: 160px;
            top: 200px;
            height: 1px;
            background: #1f242c;
            transform-origin: left center;
            transform: scaleX(0);
          }
        </style>

        <div class="glow"></div>
        <div class="grid" id="s1-grid"></div>
        <div class="ghost" id="s1-ghost">check.</div>
        <div class="rule" id="s1-rule"></div>

        <div class="stage" id="s1-stage" data-sfx-on-anchor="card-tap" data-sfx-asset="Mister Horse Free SFX/Tap _ Knock/Single Tap 07.wav" data-sfx-at-scene-ms="1000">
          <svg class="beam" id="s1-beam" preserveAspectRatio="none">
            <rect class="b6" pathLength="100" fill="none" stroke-width="2"   stroke="#ffb547" stroke-dasharray="16 84"   stroke-dashoffset="0" opacity="0.06"/>
            <rect class="b5" pathLength="100" fill="none" stroke-width="2"   stroke="#ff9a30" stroke-dasharray="10 90"   stroke-dashoffset="0" opacity="0.12"/>
            <rect class="b4" pathLength="100" fill="none" stroke-width="1.6" stroke="#ffb547" stroke-dasharray="6 94"    stroke-dashoffset="0" opacity="0.22"/>
            <rect class="b3" pathLength="100" fill="none" stroke-width="1.4" stroke="#ffb547" stroke-dasharray="3.5 96.5" stroke-dashoffset="0" opacity="0.40"/>
            <rect class="b2" pathLength="100" fill="none" stroke-width="1.2" stroke="#ffd57a" stroke-dasharray="2 98"    stroke-dashoffset="0" opacity="0.65"/>
            <rect class="b1" pathLength="100" fill="none" stroke-width="1.0" stroke="#fff5d0" stroke-dasharray="1 99"    stroke-dashoffset="0" opacity="1.00"/>
          </svg>
          <div class="brandmark">reCAPTCHA</div>
          <div class="cb" id="s1-cb" data-sfx-on-anchor="card-tap" data-sfx-asset="Mister Horse Free SFX/Tap _ Knock/Single Tap 07.wav" data-sfx-at-scene-ms="2850">
            <div class="ring" id="s1-ring"></div>
            <svg viewBox="0 0 100 100" id="s1-check">
              <path
                d="M22 52 L44 72 L80 28"
                fill="none"
                stroke="#7dd87d"
                stroke-width="10"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-dasharray="120"
                stroke-dashoffset="120"
              />
            </svg>
          </div>
          <div class="label" id="s1-label" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Beep/Single UI Beep 12.wav" data-sfx-at-scene-ms="1720">I'm not a robot</div>
          <div class="privacy">Privacy &nbsp;·&nbsp; Terms</div>
        </div>

        <div class="ripple" id="s1-ripple"></div>

        <svg class="cursor" id="s1-cursor" viewBox="0 0 36 36">
          <path
            d="M4 2 L4 28 L11 22 L15 32 L19 30 L15 20 L24 20 Z"
            fill="#ffffff"
            stroke="#0b0d12"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>

        <div class="footer">
          <div class="stat" id="s1-stat-1">
            <span class="n">0</span><span class="u">checkbox clicks · per day</span>
          </div>
        </div>

        <div class="targets" id="s1-targets">
          <!-- Targets stagger in at 7.30 / 8.35 / 9.40s (start 7.30, each: 1.05, duration 0.55, ease expo.out).
               Perceptual landing ≈ start + 50% of the fade window. -->
          <div class="target" data-sfx-on-anchor="pop" data-sfx-asset="Mister Horse Free SFX/Pop/Hollow Pop 06.wav" data-sfx-at-scene-ms="7575"><b>signup forms</b> &nbsp;·&nbsp; every one</div>
          <div class="target" data-sfx-on-anchor="pop" data-sfx-asset="Mister Horse Free SFX/Pop/Hollow Pop 06.wav" data-sfx-at-scene-ms="8625"><b>logins</b> &nbsp;·&nbsp; every site</div>
          <div class="target" data-sfx-on-anchor="pop" data-sfx-asset="Mister Horse Free SFX/Pop/Hollow Pop 06.wav" data-sfx-at-scene-ms="9675"><b>ticket queues</b> &nbsp;·&nbsp; every drop</div>
        </div>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
              '[data-composition-id="scene-01-open"]',
              { opacity: 0 },
              { opacity: 1, duration: 0.45, ease: "power2.out" },
              0,
            );

            // 0.6s — "checkbox" anchor: rule sweeps right
            tl.fromTo(
              "#s1-rule",
              { scaleX: 0 },
              { scaleX: 1, duration: 0.8, ease: "expo.out" },
              0.4,
            );

            // 0.4-0.9s: stage card lifts in
            tl.fromTo(
              "#s1-stage",
              { y: 70, opacity: 0, scale: 0.96 },
              { y: 0, opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
              0.35,
            );
            tl.fromTo(
              "#s1-ghost",
              { opacity: 0, x: 80 },
              { opacity: 1, x: 0, duration: 1.2, ease: "power2.out" },
              0.4,
            );
            // 1.62s — "I'm not a robot" anchor: label punches in
            tl.fromTo(
              "#s1-label",
              { opacity: 0, x: 30, letterSpacing: "0.06em" },
              { opacity: 1, x: 0, letterSpacing: "-0.01em", duration: 0.55, ease: "power3.out" },
              1.5,
            );

            // 2.0-2.6s: cursor flies in toward checkbox
            tl.fromTo(
              "#s1-cursor",
              { opacity: 0, x: 0, y: 0 },
              { opacity: 1, duration: 0.2, ease: "none" },
              1.95,
            );
            tl.to(
              "#s1-cursor",
              { x: -540, y: -160, duration: 0.85, ease: "power2.inOut", overwrite: "auto" },
              2.15,
            );

            // 2.85s: click — checkmark draws, ripple, ring pulses
            tl.to(
              "#s1-cursor",
              { scale: 0.85, duration: 0.08, ease: "power2.in", transformOrigin: "20% 20%", yoyo: true, repeat: 1 },
              2.85,
            );
            tl.to("#s1-cb", { borderColor: "#7dd87d", duration: 0.2, ease: "power2.out" }, 2.95);
            tl.fromTo(
              "#s1-check",
              { opacity: 0 },
              { opacity: 1, duration: 0.05, ease: "none" },
              2.95,
            );
            tl.to(
              "#s1-check path",
              { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
              2.95,
            );
            tl.fromTo(
              "#s1-ring",
              { opacity: 0.9, scale: 0.4 },
              { opacity: 0, scale: 1.6, duration: 0.7, ease: "power2.out", immediateRender: false },
              2.95,
            );
            tl.fromTo(
              "#s1-ripple",
              { opacity: 0.6, scale: 0.2 },
              { opacity: 0, scale: 1.8, duration: 0.9, ease: "power2.out", immediateRender: false },
              2.95,
            );

            // 4.1s — pause "in." → stage exhales slightly
            tl.to(
              "#s1-stage",
              { y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 },
              3.4,
            );

            // 4.86-7.0s — "hundreds of millions of times a day"
            // Cursor drifts away
            tl.to(
              "#s1-cursor",
              { x: -440, y: -60, opacity: 0.35, duration: 1.6, ease: "sine.inOut" },
              4.4,
            );

            // counter animates from 0 to ~412 (representing "hundreds of millions")
            const counter = { v: 0 };
            tl.to(
              counter,
              {
                v: 380,
                duration: 1.6,
                ease: "power2.out",
                onUpdate: function () {
                  const el = document.querySelector("#s1-stat-1 .n");
                  if (el) el.textContent = Math.round(counter.v) + "M+";
                },
              },
              5.0,
            );
            tl.fromTo(
              "#s1-stat-1",
              { opacity: 0, y: 30 },
              { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
              4.9,
            );

            // 6.0s — perimeter beam appears around the reCAPTCHA card and
            // traces it counter-clockwise for the rest of the scene.
            //
            // Active window 6.0 → 14.14 = 8.14s. The beam does exactly 2
            // full CCW loops (stroke-dashoffset 0 → 200 with pathLength=100),
            // so the bright head lands back on its start pixel right at scene
            // end. SVG <rect> path direction is CW from top-left, so positive
            // dashoffset shifts the dash backwards along the path = visual CCW.
            (function () {
              const stage = document.getElementById("s1-stage");
              const beam = document.getElementById("s1-beam");
              if (!stage || !beam) return;
              const w = stage.offsetWidth;
              const h = stage.offsetHeight;
              beam.setAttribute("viewBox", `-4 -4 ${w + 8} ${h + 8}`);
              beam.querySelectorAll("rect").forEach((r) => {
                r.setAttribute("x", "-2");
                r.setAttribute("y", "-2");
                r.setAttribute("width", String(w + 4));
                r.setAttribute("height", String(h + 4));
                r.setAttribute("rx", "22");
                r.setAttribute("ry", "22");
              });
            })();

            tl.to(
              "#s1-beam",
              { opacity: 1, duration: 0.9, ease: "power2.out" },
              6.0,
            );
            tl.fromTo(
              "#s1-beam rect",
              { attr: { "stroke-dashoffset": 0 } },
              { attr: { "stroke-dashoffset": 200 }, duration: 8.14, ease: "none", immediateRender: false },
              6.0,
            );

            // 7.5-11s: three target labels stagger in on "signup, login, ticket queue"
            tl.fromTo(
              "#s1-targets .target",
              { opacity: 0, x: -40 },
              {
                opacity: 1,
                x: 0,
                duration: 0.55,
                ease: "expo.out",
                stagger: { each: 1.05, from: 0 },
              },
              7.3,
            );

            // Ambient: ghost type drifts slowly through the scene
            tl.to(
              "#s1-ghost",
              { x: -40, duration: 12, ease: "sine.inOut", overwrite: "auto" },
              1.6,
            );
            tl.to(
              "#s1-grid",
              { opacity: 0.7, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 },
              1.0,
            );

            window.__timelines["scene-01-open"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
