<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d12;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #0b0d12;
      }
      /* Stack all scene-clip composition hosts in the same 1920x1080 frame.
         Hosts use id^="sc" (sc1, sc2, …). The inner composition root
         (the sub-comp's own <div data-composition-id="…">) keeps its own
         relative positioning — we just stop the hosts from stacking in flow. */
      #root > [id^="sc"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="387.7"
      data-width="1920"
      data-height="1080"
    >
      <!-- Voiceover -->
      <audio
        id="vo"
        class="clip"
        data-start="0"
        data-duration="387.63"
        data-track-index="0"
        data-volume="1"
        src="audio/voiceover.mp3"
        crossorigin="anonymous"
      ></audio>

      <!-- Scene 1: open (0 → 14.14) -->
      <div
        id="sc1"
        data-composition-id="scene-01-open"
        data-composition-src="compositions/scene-01-open.html"
        data-start="0"
        data-duration="14.14"
        data-track-index="1"
      ></div>

      <!-- Scene 2: subversion (13.64 → 36.84) -->
      <div
        id="sc2"
        data-composition-id="scene-02-subversion"
        data-composition-src="compositions/scene-02-subversion.html"
        data-start="13.64"
        data-duration="23.20"
        data-track-index="2"
      ></div>

      <!-- Scene 3: stakes (36.34 → 63.06) -->
      <div

      ></div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
