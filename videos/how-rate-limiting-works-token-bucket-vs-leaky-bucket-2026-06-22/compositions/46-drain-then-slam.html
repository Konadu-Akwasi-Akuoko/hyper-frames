<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 46 — idle until the counter drains to zero, then ten at once</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-46 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    /* phase 1 — idle, the counter drains to zero (left) */
    #scene-46 .e1 { position: absolute; left: 230px; top: 250px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); opacity: 0; }
    #scene-46 .e1 .bar { display: inline-block; width: 40px; height: 2px; background: var(--accent-2); vertical-align: middle; margin-right: 12px; }
    #scene-46 .gauge { position: absolute; left: 230px; top: 320px; width: 92px; height: 400px;
      border: 2.5px solid var(--accent-2); border-radius: 10px; opacity: 0; overflow: hidden; }
    #scene-46 .gfill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
      background: linear-gradient(to top, rgba(103,232,249,0.34), rgba(103,232,249,0.14)); }
    #scene-46 .count { position: absolute; left: 360px; top: 408px; width: 240px;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 150px; color: var(--accent-2); font-variant-numeric: tabular-nums; line-height: 1; opacity: 0; }
    #scene-46 .countlbl { position: absolute; left: 364px; top: 600px; width: 320px;
      font-family: "Inter"; font-weight: 400; font-size: 26px; color: var(--muted); opacity: 0; }

    /* phase 2 — ten at the same instant (right) */
    #scene-46 .e2 { position: absolute; left: 1020px; top: 280px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); opacity: 0; }
    #scene-46 #slam { position: absolute; left: 1020px; top: 360px; width: 600px; height: 300px; }
    #scene-46 .rq { position: absolute; width: 76px; height: 76px; border-radius: 50%;
      background: rgba(103,232,249,0.16); border: 2px solid var(--accent-2); opacity: 0; }
    #scene-46 .ring { position: absolute; left: 996px; top: 336px; width: 648px; height: 348px; border-radius: 20px;
      border: 2.5px solid var(--accent); opacity: 0; box-shadow: 0 0 30px rgba(255,181,71,0.35); }
    #scene-46 .ringlbl { position: absolute; left: 1020px; top: 700px; width: 620px;
      font-family: "Inter"; font-weight: 600; font-size: 30px; color: var(--accent); opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-46" data-composition-id="scene-46" data-width="1920" data-height="1080">
    <div class="e1"><span class="bar"></span>idle &middot; the counter drains</div>
    <div class="gauge"><div class="gfill"></div></div>
    <div class="count" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3140">10</div>
    <div class="countlbl">decays down to zero</div>

    <div class="e2">&times;10 at the same instant</div>
    <div id="slam" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4680"></div>
    <div class="ring" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="6120"></div>
    <div class="ringlbl">all ten arrive at once</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ten request circles, tight 2x5 grid (they will all arrive in ONE frame).
    const s = document.getElementById("slam");
    const nodes = [];
    for (let i = 0; i < 10; i++) {
      const col = i % 5, row = Math.floor(i / 5);
      const n = document.createElement("div"); n.className = "rq";
      n.style.left = (col * 116) + "px"; n.style.top = (row * 116) + "px";
      s.appendChild(n); nodes.push(n);
    }

    const cEl = () => document.querySelector("#scene-46 .count");

    // GRAPHICS crossfade (continuous from scene 45).
    tl.fromTo("#scene-46", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // "Let it sit idle" (396.39; local 1.08) — the counter at 10, gauge full, idle.
    tl.fromTo(".e1", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4 }, 0.6);
    tl.fromTo(".gauge, .count", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.7);

    // "the counter drains to zero" (397.83->398.55; local 2.52->3.24) — drain 10->0, gauge shrinks in sync.
    const cnt = { v: 10 };
    const upd = () => { cEl().textContent = Math.round(cnt.v); };
    tl.to(cnt, { v: 0, duration: 0.62, ease: "steps(10)", snap: { v: 1 }, onUpdate: upd }, 2.52);
    tl.to(".gfill", { height: "0%", duration: 0.62, ease: "steps(10)" }, 2.52);
    tl.fromTo(".countlbl", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 2.6);
    // hold at zero so "zero" lands on a still frame.

    // "then throw ten requests" (399.43->399.69; local 4.12->4.38) — phase break, then ALL TEN at once.
    tl.fromTo(".e2", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35 }, 4.12);
    // the simultaneous slam: every node, same start, zero stagger.
    tl.fromTo(nodes, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.38);

    // "at the same instance" (401.03; local 5.72) — the amber simultaneity ring flashes.
    tl.fromTo(".ring", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 50%" }, 5.72);
    tl.fromTo(".ringlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.85);

    window.__timelines["scene-46"] = tl;
  </script>
</body>
</html>
