<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 67 — forget the scheduled counter; this gate just watches the clock</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-67 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-67 .eyebrow { position: absolute; top: 330px; width: 620px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; }
    #scene-67 .ebL { left: 250px; color: var(--muted); }
    #scene-67 .ebR { left: 1050px; color: var(--accent-2); }

    /* LEFT — the discarded scheduled-reset counter */
    #scene-67 .oldcard { position: absolute; left: 290px; top: 420px; width: 540px; opacity: 0; text-align: center; }
    #scene-67 .saw { stroke: var(--muted); stroke-width: 3; fill: none; }
    #scene-67 .oldlbl { font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 26px; color: var(--muted); margin-top: 18px; }
    #scene-67 .strike { position: absolute; left: 300px; top: 500px; width: 520px; height: 3px; background: var(--danger); transform: scaleX(0); transform-origin: 0% 50%; }

    /* RIGHT — the clock-watching gate */
    #scene-67 .clockwrap { position: absolute; left: 1140px; top: 412px; width: 240px; height: 240px; opacity: 0; }
    #scene-67 .clk { stroke: var(--accent-2); fill: none; }
    #scene-67 .hand { stroke: var(--accent-2); stroke-width: 5; stroke-linecap: round; }
    #scene-67 .hub { fill: var(--accent-2); }
    #scene-67 .clocklbl { position: absolute; left: 1050px; top: 686px; width: 620px; text-align: center;
      font-family: "Inter"; font-weight: 700; font-size: 38px; color: var(--accent-2); opacity: 0; }

    #scene-67 .divider { position: absolute; left: 959px; top: 380px; width: 1px; height: 320px; background: var(--dim); opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-67" data-composition-id="scene-67" data-width="1920" data-height="1080">
    <div class="eyebrow ebL">fixed window</div>
    <div class="oldcard">
      <svg width="300" height="120" viewBox="0 0 300 120">
        <polyline class="saw" points="6,110 80,18 80,110 154,18 154,110 228,18 228,110 296,18" />
      </svg>
      <div class="oldlbl">counter resets on a schedule</div>
    </div>
    <div class="strike" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2240"></div>

    <div class="divider"></div>

    <div class="eyebrow ebR">rolling window</div>
    <div class="clockwrap" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="4500">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle class="clk" cx="120" cy="120" r="100" stroke-width="3" />
        <line class="clk" x1="120" y1="28" x2="120" y2="44" stroke-width="3" />
        <line class="clk" x1="120" y1="196" x2="120" y2="212" stroke-width="3" />
        <line class="clk" x1="28" y1="120" x2="44" y2="120" stroke-width="3" />
        <line class="clk" x1="196" y1="120" x2="212" y2="120" stroke-width="3" />
        <line class="hand" x1="120" y1="120" x2="120" y2="46" />
        <circle class="hub" cx="120" cy="120" r="7" />
      </svg>
    </div>
    <div class="clocklbl" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="5420">just watches the clock</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade.
    tl.fromTo("#scene-67", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".ebL", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, 0.4);
    tl.fromTo(".oldcard", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 0.5);

    // "forget the counter" (543.17; local 1.34) — the old counter dims out of relevance.
    tl.to([".oldcard .saw", ".oldlbl"], { opacity: 0.4, duration: 0.4 }, 1.34);

    // "that resets on a schedule" (544.07; local 2.24) — a red strike draws across it.
    tl.fromTo(".strike", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 2.24);

    // "but rather" (546.17; local 4.34) — the divider + the clock-watching gate fade in.
    tl.fromTo(".divider", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.34);
    tl.fromTo(".ebR", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, 4.34);
    tl.fromTo(".clockwrap", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 4.5);

    // "this gate just watches the clock" (547.25->547.87; local 5.42->6.04) — label lands, hand sweeps continuously.
    tl.fromTo(".clocklbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.42);
    tl.fromTo(".hand", { rotation: 0, svgOrigin: "120 120" }, { rotation: 300, duration: 2.6, ease: "none" }, 6.04);

    window.__timelines["scene-67"] = tl;
  </script>
</body>
</html>
