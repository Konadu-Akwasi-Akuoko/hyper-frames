<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 01 — cold open: 429 toast over face</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent; /* FACE mode — the face layer shows through */
      font-family: "Inter", sans-serif;
    }
    #scene-01-cold-open {
      position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
    }
    /* Centering wrapper — static, so GSAP can animate .toast's y without
       clobbering the translateX centering (gsap_css_transform_conflict). */
    #scene-01-cold-open .toast-wrap {
      position: absolute; left: 50%; top: 70%; transform: translateX(-50%);
    }
    /* The 429 toast — the real artifact the viewer remembers seeing. */
    #scene-01-cold-open .toast {
      width: 660px; padding: 26px 30px 26px 34px;
      background: rgba(17, 20, 27, 0.92);  /* --panel @ 0.92 so face reads faintly behind */
      border: 1px solid var(--border);
      border-left: 4px solid var(--danger);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.02) inset;
      opacity: 0;             /* entrance invariant — hidden at t=0 */
      backdrop-filter: blur(2px);
    }
    #scene-01-cold-open .toast .head {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    #scene-01-cold-open .toast .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--danger); box-shadow: 0 0 14px rgba(255,107,93,0.8);
      flex: 0 0 auto;
    }
    #scene-01-cold-open .toast .tag {
      font-family: "JetBrains Mono", monospace; font-weight: 500;
      font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--danger);
    }
    #scene-01-cold-open .toast .l1 {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 30px; color: var(--fg); line-height: 1.35; opacity: 0;
    }
    #scene-01-cold-open .toast .l2 {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 24px; color: var(--muted); line-height: 1.4; margin-top: 8px; opacity: 0;
    }
    #scene-01-cold-open .toast .caret {
      display: inline-block; width: 11px; height: 26px; margin-left: 4px;
      background: var(--danger); vertical-align: middle; opacity: 0;
    }
  </style>
</head>
<body>
  <div id="scene-01-cold-open" data-composition-id="scene-01-cold-open" data-width="1920" data-height="1080">
    <div class="toast-wrap">
      <div class="toast" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2440">
        <div class="head">
          <span class="dot"></span>
          <span class="tag">Rate limited</span>
        </div>
        <div class="l1">You're doing that too much.</div>
        <div class="l2">Try again in a minute.<span class="caret"></span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // FACE mode: no scene background; the face take fills the frame from t=0 (it is the
    // continuous layer, exempt from the entrance invariant). Only the toast is authored.

    // Toast chip slides up + fades in on the breath after "message." (global 1.94s; scene
    // data-start=0 so scene-local == global). Measured per-line reveal adapts the cited
    // motion-ref's typewriter cadence to a robust deterministic form.
    tl.fromTo(".toast",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.94);

    // Line 1 reveals as the quote is spoken — "You're doing that too much." (2.49–3.88)
    tl.fromTo(".l1",
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.49);

    // Caret appears then blinks (finite) between the lines, then line 2 — "Try again in a minute." (4.34–5.92)
    tl.to(".caret", { opacity: 1, duration: 0.1 }, 3.9);
    tl.to(".caret", { opacity: 0.15, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.05);
    tl.fromTo(".l2",
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.34);

    // Tiny settle drift on the whole chip so it never sits perfectly still.
    tl.to(".toast", { y: -4, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.0);

    window.__timelines["scene-01-cold-open"] = tl;
  </script>
</body>
</html>
