<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 10 — DynamoDB outage cascade</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-10 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-10 .eyebrow { position: absolute; left: 180px; top: 150px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); opacity: 0; }
    #scene-10 .eyebrow .bar { display: inline-block; width: 44px; height: 2px; background: var(--danger); vertical-align: middle; margin-right: 14px; }

    #scene-10 .card { position: absolute; border: 1.5px solid var(--border); border-radius: 18px; background: var(--panel);
      display: flex; flex-direction: column; align-items: center; padding: 36px 30px; opacity: 0; }
    #scene-10 .card .chip { background: #f4f5f7; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 22px 30px; }
    #scene-10 .card .chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #scene-10 .card .sname { font-family: "Inter"; font-weight: 500; color: var(--fg); margin-top: 22px; }
    #scene-10 .card .pill { margin-top: 18px; display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 18px; border: 1.5px solid var(--ok); border-radius: 999px; color: var(--ok);
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; }
    #scene-10 .card .pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(125,216,125,0.7); }

    #scene-10 .dynamo { left: 180px; top: 300px; width: 470px; height: 460px; }
    #scene-10 .dynamo .chip { width: 240px; height: 120px; }
    #scene-10 .dynamo .sname { font-size: 30px; }
    #scene-10 .dynamo .stats { margin-top: 26px; text-align: center; }
    #scene-10 .dynamo .stat { font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 21px; color: var(--muted); margin-top: 10px; opacity: 0; font-variant-numeric: tabular-nums; }
    #scene-10 .dynamo .stat b { color: var(--danger); font-weight: 500; }

    #scene-10 .netflix { left: 760px; top: 350px; width: 360px; height: 360px; }
    #scene-10 .reddit  { left: 1200px; top: 350px; width: 360px; height: 360px; }
    #scene-10 .netflix .chip, #scene-10 .reddit .chip { width: 200px; height: 110px; }
    #scene-10 .netflix .sname, #scene-10 .reddit .sname { font-size: 26px; }
    #scene-10 .victim-note { margin-top: 16px; font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: 0.1em; color: var(--dim); }

    /* connective cascade arrows (DynamoDB -> Netflix/Reddit) */
    #scene-10 .cascade { position: absolute; left: 650px; top: 520px; width: 120px; height: 2px;
      background: repeating-linear-gradient(to right, rgba(255,107,93,0.5) 0 8px, transparent 8px 18px); opacity: 0; }

    /* "dark" red vignette pulse */
    #scene-10 .vignette { position: absolute; inset: 0; opacity: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(255,107,93,0.22) 100%); }
  </style>
</head>
<body>
  <div id="scene-10" data-composition-id="scene-10" data-width="1920" data-height="1080">
    <div class="eyebrow"><span class="bar"></span>Outage &middot; 2015</div>

    <div class="card dynamo" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="4380">
      <div class="chip"><img src="assets/icons/aws-dynamodb.svg" alt="DynamoDB" /></div>
      <div class="sname">Amazon DynamoDB</div>
      <div class="pill"><span class="dot"></span><span class="ptext">Healthy</span></div>
      <div class="stats">
        <div class="stat s1"><b>~5h</b> &nbsp;downtime</div>
        <div class="stat s2"><b>&gt;50%</b> &nbsp;of requests failing</div>
      </div>
    </div>

    <div class="cascade"></div>

    <div class="card netflix" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="10200">
      <div class="chip"><img src="assets/icons/netflix.svg" alt="Netflix" /></div>
      <div class="sname">Netflix</div>
      <div class="pill"><span class="dot"></span><span class="ptext">Healthy</span></div>
    </div>

    <div class="card reddit" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="11060">
      <div class="chip"><img src="assets/icons/reddit-icon.svg" alt="Reddit" /></div>
      <div class="sname">Reddit</div>
      <div class="pill"><span class="dot"></span><span class="ptext">Healthy</span></div>
    </div>

    <div class="vignette" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="11500"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade cover (lands in 91.72->92.42 pause).
    tl.fromTo("#scene-10", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".eyebrow", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.55);

    // Cards enter healthy. ("In 2015, one of these..." local 0.7-1.6)
    tl.fromTo(".dynamo", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.7);
    tl.fromTo(".netflix", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
    tl.fromTo(".reddit", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.35);
    // "DynamoDB" named (global 95.56; local 3.64) — focus pulse on the root card.
    tl.fromTo(".dynamo", { boxShadow: "0 0 0 rgba(255,181,71,0)" }, { boxShadow: "0 0 40px rgba(255,181,71,0.18)", duration: 0.3, yoyo: true, repeat: 1 }, 3.64);

    // flip helper: a service card goes DOWN (pill green->red, logo desaturates, card reddens, shudder).
    function flip(card, t) {
      tl.to(card + " .pill", { borderColor: "#ff6b5d", color: "#ff6b5d", duration: 0.25 }, t);
      tl.to(card + " .pill .dot", { backgroundColor: "#ff6b5d", boxShadow: "0 0 10px rgba(255,107,93,0.85)", duration: 0.25 }, t);
      tl.set(card + " .ptext", { innerText: "Down" }, t + 0.05);
      tl.to(card + " .chip img", { filter: "grayscale(1)", opacity: 0.4, duration: 0.3 }, t);
      tl.to(card + " .chip", { opacity: 0.5, duration: 0.3 }, t);
      tl.to(card, { borderColor: "rgba(255,107,93,0.5)", duration: 0.3 }, t);
      tl.fromTo(card, { x: 0 }, { x: 6, duration: 0.05, yoyo: true, repeat: 3 }, t);
    }

    // DynamoDB goes down on "down" (global 96.30; local 4.38).
    flip(".dynamo", 4.38);
    // stats type on: "~5h" at "five hours" (97.40; local 5.48); ">50% failing" at "more than half" (99.06; local 7.14).
    tl.fromTo(".dynamo .s1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 5.48);
    tl.fromTo(".dynamo .s2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 7.14);

    // cascade spreads: arrow draws, then Netflix dims at "Netflix" (102.12; local 10.20),
    // Reddit at "Reddit" (102.98; local 11.06).
    tl.to(".cascade", { opacity: 1, duration: 0.4 }, 9.6);
    flip(".netflix", 10.20);
    flip(".reddit", 11.06);

    // "dark" (global 103.42; local 11.50) — red vignette bloom punctuates the cascade.
    tl.fromTo(".vignette", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 11.50);
    tl.to(".vignette", { opacity: 0.45, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.85);

    window.__timelines["scene-10"] = tl;
  </script>
</body>
</html>
