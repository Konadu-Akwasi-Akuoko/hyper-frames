<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 06 — the gate holds the flood</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-06 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    /* Eyebrows (swap flood -> gate) */
    #scene-06 .eb { position: absolute; left: 140px; top: 110px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; }
    #scene-06 .eb .bar { display: inline-block; width: 46px; height: 2px; vertical-align: middle; margin-right: 16px; }
    #scene-06 .eb-flood { color: var(--danger); opacity: 0; }
    #scene-06 .eb-flood .bar { background: var(--danger); }
    #scene-06 .eb-gate { color: var(--accent); opacity: 0; }
    #scene-06 .eb-gate .bar { background: var(--accent); }

    /* Incoming-flood rate ghost */
    #scene-06 .rate-ghost {
      position: absolute; left: 140px; top: 180px; opacity: 0;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 30px;
      color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
    }

    /* Flood particles (z1) */
    #scene-06 .flood { position: absolute; inset: 0; z-index: 1; }
    #scene-06 .p {
      position: absolute; left: 0; height: 5px; width: 32px; border-radius: 3px;
      background: linear-gradient(90deg, rgba(255,107,93,0) 0%, rgba(255,107,93,0.92) 100%);
      box-shadow: 0 0 8px rgba(255,107,93,0.4);
    }

    /* Protected zone — opaque panel right of the gate (z2). Occludes the flood once the gate holds. */
    #scene-06 .protected {
      position: absolute; left: 1220px; top: 0; right: 0; bottom: 0; z-index: 2;
      background: var(--bg); opacity: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #scene-06 .protected .srv {
      width: 220px; height: 150px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--panel);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    #scene-06 .protected .srv .t { font-family: "Inter"; font-weight: 500; font-size: 26px; color: var(--muted); }
    #scene-06 .protected .srv .s { font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-2); }

    /* THE GATE — amber pillar (rhymes with scene 02): grille of rails + central bolt (z3) */
    #scene-06 .gate {
      position: absolute; left: 1150px; top: 270px; width: 140px; height: 540px; z-index: 3;
      border: 2px solid var(--accent); border-radius: 16px; opacity: 0;
      background:
        repeating-linear-gradient(180deg, rgba(255,181,71,0.30) 0 4px, transparent 4px 54px),
        linear-gradient(180deg, rgba(255,181,71,0.12), rgba(255,181,71,0.03));
      box-shadow: 0 0 40px rgba(255,181,71,0.14);
    }
    #scene-06 .gate .bolt {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 50px; height: 50px; border-radius: 50%; border: 2.5px solid var(--accent); background: var(--bg);
      box-shadow: 0 0 18px rgba(255,181,71,0.4);
    }
    #scene-06 .gate .bolt::after { content: ""; position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: 4px; height: 26px; background: var(--accent); border-radius: 2px; }
    #scene-06 .gate-label {
      position: absolute; left: 1090px; top: 826px; width: 260px; text-align: center; z-index: 4;
      font-family: "Inter"; font-weight: 700; font-size: 34px; color: var(--accent); letter-spacing: 0.04em; opacity: 0;
    }

    /* "enough is enough." — the gate's verdict (z4) */
    #scene-06 .stamp {
      position: absolute; left: 0; right: 0; top: 880px; text-align: center; z-index: 4;
      font-family: "Inter"; font-weight: 900; font-size: 76px; color: var(--fg); letter-spacing: 0.005em; opacity: 0;
    }
  </style>
</head>
<body>
  <div id="scene-06" data-composition-id="scene-06" data-width="1920" data-height="1080">
    <div class="flood"></div>

    <div class="protected"><div class="srv"><span class="t">Server</span><span class="s">protected</span></div></div>

    <div class="gate" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="7000">
      <div class="bolt"></div>
    </div>
    <div class="gate-label" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="11770">The gate</div>

    <div class="eb eb-flood"><span class="bar"></span>The flood</div>
    <div class="eb eb-gate"><span class="bar"></span>The gate</div>
    <div class="rate-ghost" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1000">&#8776; 398,000,000 req/s &#8594;</div>

    <div class="stamp" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="14080">enough is enough.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Build the red flood deterministically (index-derived y / size / opacity — no RNG).
    const flood = document.querySelector("#scene-06 .flood");
    const N = 90;
    for (let i = 0; i < N; i++) {
      const d = document.createElement("div");
      d.className = "p";
      const top = 200 + ((i * 53) % 680);
      d.style.top = top + "px";
      d.style.width = (26 + (i % 5) * 5) + "px";
      d.style.height = (4 + (i % 3)) + "px";
      d.style.opacity = (0.5 + (i % 3) * 0.16).toFixed(2);
      flood.appendChild(d);
    }

    // GRAPHICS crossfade cover (lands in 50.92->51.78 pause).
    tl.fromTo("#scene-06", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // Phase 1 — the flood is already overwhelming. ("No server farm could handle that", local 0.5)
    tl.fromTo(".eb-flood", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.6);
    tl.fromTo(".rate-ghost", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
    // The stream: every particle crosses left->right, staggered + repeating = a dense continuous flood.
    gsap.set("#scene-06 .p", { x: -60 });
    tl.fromTo("#scene-06 .p", { x: -60 }, { x: 1980, duration: 1.2, ease: "none", repeat: 13, stagger: { each: 0.03 } }, 0.5);

    // Phase 2 — "Now, the only thing standing..." (global 57.58; local 6.30): the gate rises and the
    // protected zone appears, so the flood now dies against the gate (occluded right of it).
    tl.to(".eb-flood", { opacity: 0, duration: 0.4 }, 6.30);
    tl.fromTo(".gate", { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.7, ease: "back.out(1.4)" }, 6.30);
    tl.to(".protected", { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.55);
    tl.fromTo(".eb-gate", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.05);
    // The gate is alive and holding — a steady amber breathing glow (finite).
    tl.to(".gate", { boxShadow: "0 0 64px rgba(255,181,71,0.34)", duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 4 }, 7.2);

    // "gate" named (global 62.60; local 11.32) — label fades up.
    tl.fromTo(".gate-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 11.32);

    // "enough is enough." (global 64.96; local 13.68) — the verdict stamps in with an overshoot.
    tl.fromTo(".stamp", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1.0, duration: 0.4, ease: "back.out(2.2)" }, 13.68);

    window.__timelines["scene-06"] = tl;
  </script>
</body>
</html>
