<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 29 — leaky bucket: a hole in the bottom</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-29 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-29 .eyebrow { position: absolute; left: 0; right: 0; top: 120px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); opacity: 0; }

    /* two-kinds stepper */
    #scene-29 .stepper { position: absolute; left: 0; right: 0; top: 186px; display: flex; align-items: center; justify-content: center; gap: 0; opacity: 0; }
    #scene-29 .stepper .s { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 20px; }
    #scene-29 .stepper .s.on { background: var(--accent-2); color: var(--bg); box-shadow: 0 0 16px rgba(103,232,249,0.5); }
    #scene-29 .stepper .s.off { border: 1.5px solid var(--dim); color: var(--dim); }
    #scene-29 .stepper .seg { width: 70px; height: 2px; background: var(--dim); margin: 0 6px; }

    /* left text */
    #scene-29 .kind { position: absolute; left: 220px; top: 432px; font-family: "Inter"; font-weight: 700; font-size: 64px; color: var(--accent-2); opacity: 0; }
    #scene-29 .kdesc { position: absolute; left: 222px; top: 516px; width: 420px; font-family: "Inter"; font-weight: 400; font-size: 28px; line-height: 1.4; color: var(--muted); opacity: 0; }

    /* bucket SVG */
    #scene-29 svg.bk { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #scene-29 svg.bk .wall { fill: none; stroke: var(--accent-2); stroke-width: 4; stroke-linecap: round; }
    #scene-29 svg.bk .rim { fill: rgba(103,232,249,0.04); stroke: var(--accent-2); stroke-width: 4; opacity: 0; }
    #scene-29 svg.bk .stream { fill: none; stroke: var(--accent-2); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 6 12; opacity: 0; }
    #scene-29 svg.bk .holeglow { fill: var(--accent-2); opacity: 0; }

    #scene-29 .holelbl { position: absolute; left: 1110px; top: 632px; font-family: "Inter"; font-weight: 500; font-size: 26px; color: var(--accent-2); opacity: 0; }
    #scene-29 .holelbl small { display: block; font-weight: 400; font-size: 20px; color: var(--muted); }
    #scene-29 .holeline { position: absolute; left: 1024px; top: 662px; width: 80px; height: 2px; background: var(--accent-2); transform-origin: left center; transform: scaleX(0); }
  </style>
</head>
<body>
  <div id="scene-29" data-composition-id="scene-29" data-width="1920" data-height="1080">
    <div class="eyebrow">Approach 02 &middot; Leaky bucket</div>
    <div class="stepper" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3010">
      <div class="s on">01</div><div class="seg"></div><div class="s off">02</div>
    </div>

    <div class="kind">Kind 01</div>
    <div class="kdesc">a literal bucket &mdash; with a hole in the bottom</div>

    <svg class="bk" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <ellipse class="rim" cx="980" cy="342" rx="104" ry="16" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="6740" />
      <ellipse class="holeglow" cx="980" cy="662" rx="46" ry="12" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="7420" />
      <path class="wall wallL" d="M 876 342 L 876 652 Q 876 662 886 662 L 944 662" />
      <path class="wall wallR" d="M 1084 342 L 1084 652 Q 1084 662 1074 662 L 1016 662" />
      <path class="stream" d="M 980 668 L 980 780" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="8420" />
    </svg>

    <div class="holeline"></div>
    <div class="holelbl">the hole<small>it leaks out the bottom</small></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade (covers the face revealed in scene 28; lands in 267.94->268.68 pause).
    tl.fromTo("#scene-29", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);

    // "there are actually two kinds" (270.74; local 2.56) — the fork stepper.
    tl.fromTo(".stepper", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.56);

    // "a literal bucket" (274.52; local 6.34) — the cyan bucket outline draws on.
    tl.fromTo(".kind", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45 }, 6.0);
    tl.fromTo(".rim", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.34);
    tl.set(".wallL", { strokeDasharray: 420, strokeDashoffset: 420 }, 0);
    tl.set(".wallR", { strokeDasharray: 420, strokeDashoffset: 420 }, 0);
    tl.to(".wallL", { strokeDashoffset: 0, duration: 0.7, ease: "power1.inOut" }, 6.34);
    tl.to(".wallR", { strokeDashoffset: 0, duration: 0.7, ease: "power1.inOut" }, 6.34);
    tl.fromTo(".kdesc", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.7);

    // "with a hole" (275.20; local 7.02) — the gap at the base highlights.
    tl.fromTo(".holeglow", { opacity: 0, scale: 0.6 }, { opacity: 0.5, scale: 1, duration: 0.4, transformOrigin: "50% 50%" }, 7.02);
    tl.to(".holeglow", { opacity: 0.22, duration: 0.5 }, 7.5);
    tl.fromTo(".holeline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 7.02);
    tl.fromTo(".holelbl", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4 }, 7.2);

    // "in the bottom" (276.10; local 7.92) — the drain stream traces downward.
    tl.fromTo(".stream", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power1.in", transformOrigin: "50% 0%" }, 7.92);

    window.__timelines["scene-29"] = tl;
  </script>
</body>
</html>
