<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 82 — FACE: one more thing before you go, guys</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    /* FACE beat: opaque cover that fades to reveal the seek-driven face-layer beneath. */
    #scene-82 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  </style>
</head>
<body>
  <div id="scene-82" data-composition-id="scene-82" data-width="1920" data-height="1080" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="950"></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Cover scene 81's trailing text (opaque crossfade in over the 0.5s overlap).
    tl.fromTo("#scene-82", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 0);

    // "One more thing before you go, guys." (655.07; local 0.50) — fade the cover away, presenter takes the frame.
    tl.to("#scene-82", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 0.5);

    window.__timelines["scene-82"] = tl;
  </script>
</body>
</html>
