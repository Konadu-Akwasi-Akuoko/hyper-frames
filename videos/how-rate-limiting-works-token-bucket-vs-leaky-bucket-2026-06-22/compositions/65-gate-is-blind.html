<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 65 — the gate never flinches: two separate windows, blind across the line</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-65 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-65 .eyebrow { position: absolute; left: 0; right: 0; top: 140px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); opacity: 0; }

    #scene-65 .gate { position: absolute; left: 0; right: 0; top: 226px; text-align: center; opacity: 0; }
    #scene-65 .gate .gbox { display: inline-block; padding: 14px 34px; border-radius: 12px;
      background: rgba(125,216,125,0.1); border: 1.5px solid rgba(125,216,125,0.45);
      font-family: "Inter"; font-weight: 600; font-size: 30px; color: var(--ok); }

    #scene-65 .card { position: absolute; top: 440px; width: 540px; height: 250px;
      background: var(--panel); border: 1.5px solid var(--border); border-radius: 16px; opacity: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #scene-65 .c1 { left: 320px; } #scene-65 .c2 { left: 1060px; }
    #scene-65 .card .hd { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    #scene-65 .card .big { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 72px; color: var(--fg); font-variant-numeric: tabular-nums; margin: 10px 0; }
    #scene-65 .card .ok { font-family: "Inter"; font-weight: 600; font-size: 28px; color: var(--ok); opacity: 0; }

    #scene-65 .boundary { position: absolute; left: 958px; top: 420px; width: 3px; height: 290px; background: var(--dim); opacity: 0; }

    #scene-65 .sightline { position: absolute; left: 700px; top: 562px; width: 520px; height: 0; border-top: 2px dashed var(--muted); opacity: 0; }
    #scene-65 .xmark { position: absolute; left: 905px; top: 506px; width: 110px; text-align: center;
      font-family: "Inter"; font-weight: 900; font-size: 96px; color: var(--danger); opacity: 0; text-shadow: 0 0 36px rgba(255,107,93,0.4); }
    #scene-65 .blind { position: absolute; left: 0; right: 0; top: 716px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px; color: var(--danger); opacity: 0; }
  </style>
</head>
<body>
  <div id="scene-65" data-composition-id="scene-65" data-width="1920" data-height="1080">
    <div class="eyebrow">the gate's view</div>
    <div class="gate" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="4000"><span class="gbox">&#10003; gate: both windows within budget</span></div>

    <div class="card c1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="740"><div class="hd">window 1</div><div class="big">10 / 10</div><div class="ok">&#10003; within budget</div></div>
    <div class="card c2" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="2360"><div class="hd">window 2</div><div class="big">10 / 10</div><div class="ok">&#10003; within budget</div></div>

    <div class="boundary"></div>
    <div class="sightline"></div>
    <div class="xmark" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="9500">&#10005;</div>
    <div class="blind">can't see across the line</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade.
    tl.fromTo("#scene-65", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".eyebrow", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, 0.3);

    // "two full budgets" (524.63; local 0.74) — window 1 ledger card slides in, ✓ pops.
    tl.fromTo(".c1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.74);
    tl.fromTo(".c1 .ok", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.3);

    // "back to back" (526.25; local 2.36) — window 2 ledger card slides in, ✓ pops; the boundary line between.
    tl.fromTo(".c2", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.36);
    tl.fromTo(".boundary", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.5);
    tl.fromTo(".c2 .ok", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 2.9);

    // "the gate never flinches" (527.89->528.19; local 4.00->4.30) — the gate approves, holds steady (blind).
    tl.fromTo(".gate", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.0);

    // "files them as two separate windows" (531.09; local 7.20) — the two headers highlight as filed apart.
    tl.fromTo([".c1 .hd", ".c2 .hd"], { color: "#7a8493" }, { color: "#e8eaed", duration: 0.35, yoyo: true, repeat: 1 }, 7.20);

    // "can't see across the line" (532.63->534.49; local 8.74->10.60) — the sightline dies at the boundary, red ✗.
    tl.fromTo(".sightline", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, 8.74);
    tl.fromTo(".xmark", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 9.5);
    tl.to(".boundary", { backgroundColor: "#ff6b5d", duration: 0.3 }, 9.5);
    tl.fromTo(".blind", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 10.0);

    window.__timelines["scene-65"] = tl;
  </script>
</body>
</html>
