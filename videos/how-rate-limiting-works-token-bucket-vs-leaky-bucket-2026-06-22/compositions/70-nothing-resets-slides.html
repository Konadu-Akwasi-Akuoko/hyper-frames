<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 70 — the clever part: nothing ever resets, the window just slides</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-70 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-70 .eyebrow { position: absolute; left: 0; right: 0; top: 180px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); opacity: 0; }

    #scene-70 .chip { position: absolute; left: 760px; top: 300px; width: 400px; text-align: center; opacity: 0; }
    #scene-70 .chip .box { display: inline-block; padding: 14px 34px; border-radius: 12px;
      background: var(--panel); border: 1.5px solid var(--border);
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 38px; color: var(--dim); }
    #scene-70 .resetstrike { position: absolute; left: 800px; top: 333px; width: 320px; height: 3px; background: var(--danger); transform: scaleX(0); transform-origin: 0% 50%; }
    #scene-70 .never { position: absolute; left: 760px; top: 392px; width: 400px; text-align: center; opacity: 0;
      font-family: "Inter"; font-weight: 700; font-size: 40px; color: var(--danger); }

    /* sliding window on a mini axis */
    #scene-70 .axis { position: absolute; left: 510px; top: 569px; width: 900px; height: 2px; background: var(--dim); opacity: 0; }
    #scene-70 .slideband { position: absolute; left: 540px; top: 542px; width: 300px; height: 56px;
      background: rgba(103,232,249,0.16); border: 1.5px solid var(--accent-2); border-radius: 8px; opacity: 0; }
    #scene-70 .slidelbl { position: absolute; left: 0; right: 0; top: 640px; text-align: center; opacity: 0;
      font-family: "Inter"; font-weight: 700; font-size: 40px; color: var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-70" data-composition-id="scene-70" data-width="1920" data-height="1080">
    <div class="eyebrow">the clever part</div>

    <div class="chip"><span class="box">&#8635; reset</span></div>
    <div class="resetstrike" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1760"></div>
    <div class="never">never happens</div>

    <div class="axis"></div>
    <div class="slideband" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="4280"></div>
    <div class="slidelbl">the window just slides &rarr;</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade.
    tl.fromTo("#scene-70", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".eyebrow", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, 0.3);
    tl.fromTo(".chip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 0.5);

    // "nothing ever resets" (569.41->570.49; local 1.76->2.84) — the reset is struck out, "never happens".
    tl.fromTo(".resetstrike", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 1.76);
    tl.to(".chip .box", { opacity: 0.45, duration: 0.4 }, 1.9);
    tl.fromTo(".never", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.2);

    // "the window will just slide" (571.19->571.93; local 3.54->4.28) — the band slides smoothly along the axis.
    tl.fromTo(".axis", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 3.3);
    tl.fromTo(".slideband", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.35 }, 3.4);
    tl.fromTo(".slidelbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 3.54);
    tl.to(".slideband", { x: 300, duration: 1.5, ease: "power1.inOut" }, 4.28);

    window.__timelines["scene-70"] = tl;
  </script>
</body>
</html>
