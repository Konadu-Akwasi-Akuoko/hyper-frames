<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 27 — token bucket maxim</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-27 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }

    #scene-27 .line { font-family: "Inter"; font-weight: 900; font-size: 92px; line-height: 1.1; color: var(--fg); text-align: center; }
    #scene-27 .l1 { opacity: 0; }
    #scene-27 .l2 { opacity: 0; }
    #scene-27 .g { color: var(--fg); }
    #scene-27 .r1 { color: var(--fg); }
    #scene-27 .r2 { color: var(--fg); font-size: 104px; }

    #scene-27 .rule { width: 0px; height: 3px; background: var(--dim); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="scene-27" data-composition-id="scene-27" data-width="1920" data-height="1080">
    <div class="line l1" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1000">The token bucket <span class="g" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="1710">forgives a burst.</span></div>
    <div class="rule"></div>
    <div class="line l2" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3340">It <span class="r1">won't</span> let you <span class="r2" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4120">sustain one.</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade (covers the hidden face; lands in 257.64->258.56 pause).
    tl.fromTo("#scene-27", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

    // clause 1 — "The token bucket forgives a burst" (258.56; local 0.5).
    tl.fromTo(".l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
    // "forgives a burst" blooms green (259.42; local 1.36).
    tl.to(".g", { color: "#7dd87d", textShadow: "0 0 28px rgba(125,216,125,0.45)", duration: 0.35 }, 1.36);

    tl.fromTo(".rule", { width: 0 }, { width: 220, duration: 0.4, ease: "power2.out" }, 2.4);

    // clause 2 — "It just won't let you sustain one" (260.90; local 2.84).
    tl.fromTo(".l2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.84);
    // "won't" snaps red (261.22; local 3.16).
    tl.to(".r1", { color: "#ff6b5d", textShadow: "0 0 24px rgba(255,107,93,0.4)", duration: 0.25 }, 3.16);
    // "sustain one" lands as the punch (261.88; local 3.82).
    tl.to(".r2", { color: "#ff6b5d", textShadow: "0 0 30px rgba(255,107,93,0.5)", duration: 0.3 }, 3.82);
    tl.fromTo(".l2", { scale: 1 }, { scale: 1.03, duration: 0.16, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 3.82);

    window.__timelines["scene-27"] = tl;
  </script>
</body>
</html>
