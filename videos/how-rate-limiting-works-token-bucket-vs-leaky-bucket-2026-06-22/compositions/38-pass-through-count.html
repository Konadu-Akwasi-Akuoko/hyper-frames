<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 38 — straight to the server, counter up by one</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-38 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-38 .eyebrow { position: absolute; left: 200px; top: 110px;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); opacity: 0; }
    #scene-38 .eyebrow .bar { display: inline-block; width: 44px; height: 2px; background: var(--accent-2); vertical-align: middle; margin-right: 14px; }

    #scene-38 svg.scene { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #scene-38 .bouncer { opacity: 0; }
    #scene-38 .door { opacity: 0; }
    #scene-38 .clicker { opacity: 0; }
    #scene-38 .server { opacity: 0; }
    #scene-38 .srv-flash { fill: var(--ok); opacity: 0; }

    #scene-38 .dot { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-2);
      box-shadow: 0 0 10px rgba(103,232,249,0.6); opacity: 0; }
    #scene-38 #flow { position: absolute; inset: 0; }

    #scene-38 .srv-lbl { position: absolute; left: 1300px; top: 416px; width: 320px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); opacity: 0; }

    #scene-38 .bigcount { position: absolute; left: 760px; top: 540px; width: 440px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 150px; color: var(--accent-2); font-variant-numeric: tabular-nums; line-height: 1; opacity: 0; }
    #scene-38 .count-lbl { position: absolute; left: 760px; top: 720px; width: 440px; text-align: center;
      font-family: "Inter"; font-weight: 400; font-size: 28px; color: var(--muted); opacity: 0; }

    #scene-38 .flowlbl { position: absolute; top: 196px; font-family: "Inter"; font-weight: 400; font-size: 26px; color: var(--muted); opacity: 0; }
    #scene-38 .flowlbl.f1 { left: 220px; }
    #scene-38 .flowlbl.f2 { left: 1200px; top: 150px; width: 520px; text-align: center; font-size: 24px; color: var(--ok); }
  </style>
</head>
<body>
  <div id="scene-38" data-composition-id="scene-38" data-width="1920" data-height="1080">
    <div class="eyebrow"><span class="bar"></span>Kind 02 &middot; the meter</div>

    <div class="flowlbl f1">every request &mdash;</div>
    <div class="flowlbl f2">straight to the server, instantly</div>

    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <!-- top flow lane: door (gate) -> server -->
      <g class="door">
        <rect x="800" y="210" width="210" height="250" rx="6" fill="none" stroke="#7a8493" stroke-width="4" />
        <rect x="818" y="228" width="174" height="214" rx="4" fill="rgba(103,232,249,0.05)" />
        <rect x="818" y="228" width="26" height="214" fill="rgba(103,232,249,0.16)" />
      </g>
      <g class="server" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="4050">
        <rect x="1300" y="248" width="320" height="160" rx="12" fill="#11141b" stroke="#67e8f9" stroke-width="2.5" />
        <rect class="srv-flash" x="1300" y="248" width="320" height="160" rx="12" />
        <rect x="1330" y="284" width="260" height="10" rx="5" fill="#1f242c" />
        <rect x="1330" y="312" width="200" height="10" rx="5" fill="#1f242c" />
        <rect x="1330" y="340" width="230" height="10" rx="5" fill="#1f242c" />
      </g>

      <!-- bottom register: the bouncer (continuity from scene 37) -->
      <g class="bouncer">
        <rect x="374" y="740" width="48" height="100" rx="8" fill="#5a6470" />
        <rect x="438" y="740" width="48" height="100" rx="8" fill="#5a6470" />
        <rect x="358" y="542" width="144" height="210" rx="10" fill="#7a8493" />
        <rect x="322" y="508" width="216" height="54" rx="27" fill="#7a8493" />
        <rect x="336" y="596" width="188" height="40" rx="20" fill="#5a6470" />
        <circle cx="430" cy="444" r="44" fill="#7a8493" />
        <rect x="390" y="434" width="80" height="15" rx="4" fill="#11141b" />
        <circle cx="478" cy="462" r="6" fill="#5a6470" />
      </g>
      <!-- the clicker in hand -->
      <g class="clicker" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="4050">
        <rect x="540" y="600" width="92" height="116" rx="13" fill="#11141b" stroke="#7a8493" stroke-width="2" />
        <circle cx="586" cy="594" r="10" fill="#5a6470" />
        <rect x="556" y="620" width="60" height="42" rx="6" fill="#0b0d12" stroke="rgba(103,232,249,0.4)" stroke-width="1.5" />
      </g>
    </svg>

    <div class="srv-lbl">server</div>

    <div id="flow" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1380"></div>

    <div class="bigcount" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="6970">0</div>
    <div class="count-lbl">the bouncer's count &mdash; +1 per request</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // request dots: spawn left, travel through the door to the server.
    const flow = document.getElementById("flow");
    const dots = [];
    for (let i = 0; i < 3; i++) {
      const d = document.createElement("div"); d.className = "dot";
      d.style.left = "220px"; d.style.top = "315px";
      flow.appendChild(d); dots.push(d);
    }

    const bigEl = () => document.querySelector("#scene-38 .bigcount");
    const cnt = { v: 0 };
    const upd = () => { bigEl().textContent = Math.round(cnt.v); };

    // GRAPHICS crossfade (from scene 37 PIP; lands in 332.72->333.44 pause).
    tl.fromTo("#scene-38", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".eyebrow", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4 }, 0.3);
    tl.fromTo(".bouncer, .clicker", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.4);
    tl.fromTo(".door", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.5);
    tl.fromTo(".server, .srv-lbl", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.6);
    tl.fromTo(".bigcount, .count-lbl", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.7);

    // dot journeys — spawn, travel through door to server, flash green on arrival.
    const arrivals = [4.05, 5.45, 6.75];   // counter ticks land here (last ~ "up by one" 7.14)
    const spawns = [1.28, 4.55, 5.85];     // first keyed to "arrived" 1.28
    dots.forEach((d, i) => {
      const t0 = spawns[i], tArr = arrivals[i];
      if (i === 0) tl.fromTo(".flowlbl.f1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, t0);
      tl.fromTo(d, { opacity: 0, left: 220, top: 315 }, { opacity: 1, duration: 0.18 }, t0);
      tl.to(d, { left: 1420, duration: tArr - t0 - 0.1, ease: "none" }, t0 + 0.1);   // straight through to server
      tl.to(d, { opacity: 0, duration: 0.2 }, tArr);                                  // absorbed by server
      // server flash + counter tick on arrival
      tl.fromTo(".srv-flash", { opacity: 0.35 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, tArr);
      tl.to(cnt, { v: i + 1, duration: 0.22, ease: "none", snap: { v: 1 }, onUpdate: upd }, tArr);
      tl.to(".bigcount", { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, tArr);
      tl.to(".clicker", { scale: 1.08, duration: 0.1, yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, tArr);
    });

    // "instantly" reaches the server (first arrival) — the f2 label.
    tl.fromTo(".flowlbl.f2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.1);

    window.__timelines["scene-38"] = tl;
  </script>
</body>
</html>
