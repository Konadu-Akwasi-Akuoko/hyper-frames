<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Scene 21 — empty bucket throws 429</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --muted: #7a8493; --dim: #3a4150;
      --accent: #ffb547; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
    #scene-21 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    #scene-21 .eyebrow { position: absolute; left: 0; right: 0; top: 130px; text-align: center;
      font-family: "Inter"; font-weight: 500; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); opacity: 0; }

    #scene-21 .req { position: absolute; left: 150px; top: 500px; padding: 20px 34px; border-radius: 12px;
      border: 1.5px solid var(--border); background: var(--panel); opacity: 0;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 26px; color: var(--fg); }

    /* empty bucket (outline only, no token fill) */
    #scene-21 .bucket { position: absolute; left: 700px; top: 360px; opacity: 0; }
    #scene-21 .bucket .rim { width: 170px; height: 22px; border-radius: 50%; border: 3px solid var(--accent); background: transparent; }
    #scene-21 .bucket .body { width: 152px; height: 300px; margin: -11px auto 0;
      border: 3px solid var(--accent); border-top: none; border-radius: 0 0 26px 26px; background: rgba(255,181,71,0.02); }
    #scene-21 .counter { position: absolute; left: 700px; top: 300px; width: 174px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 40px; color: var(--dim); font-variant-numeric: tabular-nums; opacity: 0; }
    #scene-21 .emptylbl { position: absolute; left: 700px; top: 678px; width: 174px; text-align: center;
      font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--danger); opacity: 0; }

    /* refill drip cue */
    #scene-21 .drip { position: absolute; left: 778px; top: 250px; width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 12px rgba(255,181,71,0.6); opacity: 0; }
    #scene-21 .comeback { position: absolute; left: 620px; top: 760px; width: 340px; text-align: center;
      font-family: "Inter"; font-weight: 400; font-size: 22px; color: var(--muted); opacity: 0; }

    /* 429 toast — callback to scene 01 cold open (human-voice refusal chip) */
    #scene-21 .toast { position: absolute; left: 1230px; top: 470px; display: flex; align-items: center; gap: 18px;
      padding: 22px 32px; border-radius: 14px; border: 2px solid var(--danger); background: var(--panel); opacity: 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    #scene-21 .toast .code { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 40px; color: var(--danger); }
    #scene-21 .toast .msg { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 26px; color: var(--fg); }
    #scene-21 .toast .bar { width: 2px; height: 46px; background: var(--danger); opacity: 0.5; }

    /* flow connectors */
    #scene-21 .flow { position: absolute; top: 532px; height: 2px;
      background: repeating-linear-gradient(to right, var(--dim) 0 7px, transparent 7px 14px); transform-origin: left center; transform: scaleX(0); }
    #scene-21 .flow.f1 { left: 430px; width: 250px; }
  </style>
</head>
<body>
  <div id="scene-21" data-composition-id="scene-21" data-width="1920" data-height="1080">
    <div class="eyebrow">Token bucket &middot; request denied</div>

    <div class="req" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2200">request</div>
    <div class="flow f1"></div>

    <div class="counter">0</div>
    <div class="bucket">
      <div class="rim"></div>
      <div class="body"></div>
    </div>
    <div class="emptylbl">empty</div>
    <div class="drip" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="9000"></div>
    <div class="comeback">come back once the tap drips a new one</div>

    <div class="toast" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="3930">
      <div class="code">429</div>
      <div class="bar"></div>
      <div class="msg">too many requests</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // GRAPHICS crossfade (mirror of scene 20; lands in 198.74->199.23 pause).
    tl.fromTo("#scene-21", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
    tl.fromTo(".eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);

    // "If the bucket is empty" (199.23/200.08; local 0.5/1.35) — the empty bucket + 0 counter.
    tl.fromTo(".bucket", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.5);
    tl.fromTo(".counter", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
    tl.fromTo(".emptylbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.35);

    // request arrives from the left.
    tl.fromTo(".req", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.7);
    tl.fromTo(".flow.f1", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.0);

    // "four two nine" (202.66; local 3.93) — request lunges, hits empty, recoils; 429 toast slams in.
    tl.to(".req", { x: 120, duration: 0.18, ease: "power2.in" }, 3.6);
    tl.to(".req", { x: -16, borderColor: "#ff6b5d", color: "#ff6b5d", duration: 0.35, ease: "back.out(2.2)" }, 3.8);
    tl.fromTo(".toast", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", transformOrigin: "50% 50%" }, 3.93);
    tl.to(".toast", { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 4.25);
    // empty bucket rim flashes danger briefly
    tl.to(".bucket .rim", { borderColor: "#ff6b5d", duration: 0.2, yoyo: true, repeat: 1 }, 3.93);

    // "come back once the tap has dripped a new one" (207.30; local 8.57) — a fresh drip descends.
    tl.fromTo(".drip", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.15 }, 8.3);
    tl.to(".drip", { y: 120, duration: 0.7, ease: "elastic.out(1, 0.5)" }, 8.45);
    tl.fromTo(".comeback", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 8.45);

    window.__timelines["scene-21"] = tl;
  </script>
</body>
</html>
