<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TEXT RENDERING NOBODY SEES IT</title>
  <link rel="stylesheet" href="file:///Users/akwasikonaduakuoko/Projects/WebDev/hyper-frames/.claude/skills/thumbnail-creator/templates/styles.css">
</head>
<body>
  <div class="thumbnail vertical">
    <div class="thumbnail-text" style="font-size: 170px;">
      <span class="thumbnail-row">TEXT</span>
      <span class="thumbnail-row"><span class="accent">RENDERING</span></span>
      <span class="thumbnail-row kicker"><span class="accent">NOBODY</span> SEES IT</span>
      <span class="thumbnail-row"></span>
      <span class="thumbnail-row"></span>
    </div>
    <div class="thumbnail-icon">
      <svg viewBox="0 0 24 24" class="" xmlns="http://www.w3.org/2000/svg"><polyline points="4 7 4 4 20 4 20 7" stroke="#FFB627" /><line x1="9" x2="15" y1="20" y2="20" /><line x1="12" x2="12" y1="4" y2="20" /></svg>
    </div>
    <div class="grid-overlay" aria-hidden="true">
      <div class="grid-cell">1</div>
      <div class="grid-cell">2</div>
      <div class="grid-cell">3</div>
      <div class="grid-cell">4</div>
      <div class="grid-cell">5</div>
      <div class="grid-cell">6</div>
      <div class="grid-cell">7</div>
      <div class="grid-cell">8</div>
      <div class="grid-cell">9</div>
      <div class="grid-cell">10</div>
      <div class="grid-cell">11</div>
      <div class="grid-cell">12</div>
      <div class="grid-safe-area"></div>
      <div class="grid-duration-badge"></div>
    </div>
  </div>
  <script>
    if (location.search.includes('grid')) {
      document.querySelector('.thumbnail').classList.add('with-grid');
    }
  </script>
</body>
</html>
