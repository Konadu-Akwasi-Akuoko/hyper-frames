<!DOCTYPE html>

<head>

<link rel="stylesheet" href="_shared.css">
<style>
  /* THE WORST LANGUAGE won — Gigachad (portrait; bleed right, brow visible) */
  .face-wrap { right: -20px; bottom: 0; height: 820px; }
  .face { height: 820px; }
  .face-glow { right: 40px; bottom: 150px; width: 500px; height: 500px;
               background: radial-gradient(circle, rgba(175,185,205,0.6) 0%, rgba(160,170,190,0.22) 40%, rgba(150,160,180,0) 66%); }

  .copy { left: 64px; top: 120px; transform: none; width: 600px; }

  .l2 { font-size: 96px; margin-bottom: 16px; }
  .l3 { font-size: 176px; display: flex; align-items: center; gap: 30px; }  /* won hero */
  .js-chip { width: 124px; height: 124px; font-size: 70px; padding: 0 12px 8px 0; }

  /* annotation in the navy gap, arrow into his smug face */
  .annot-text { position: absolute; left: 546px; top: 250px; font-size: 60px;
                transform: rotate(-8deg); z-index: 4; }
  .annot-arrow { position: absolute; left: 678px; top: 318px; z-index: 4; }
</style>
</head>
<body>
  <div class="thumb dbg">
    <div class="grid"></div>
    <div class="face-wrap">
      <div class="face-glow"></div>
      <img class="face" src="file:///Users/akwasikonaduakuoko/Projects/WebDev/hyper-frames/videos/javascript-the-king-programming-languages-2026-05-15/thumbnails/cutouts/gigachad.png" alt="">
    </div>

    <div class="annot annot-text hand">awful</div>
    <div class="annot annot-arrow">
      <svg width="160" height="110" viewBox="0 0 160 110" fill="none">
        <path d="M8 20 C 60 16, 116 40, 150 92" stroke="#ff5c52" stroke-width="7" stroke-linecap="round"/>
        <path d="M150 92 L 124 88 M150 92 L 146 64" stroke="#ff5c52" stroke-width="7" stroke-linecap="round"/>

      <div class="line l2">LANGUAGE</div>
      <div class="line l3"><span class="hand coral">won</span> <span class="js-chip">JS</span></div>
