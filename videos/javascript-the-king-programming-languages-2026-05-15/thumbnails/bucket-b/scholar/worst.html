<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  /* THE WORST LANGUAGE won — Gigachad (portrait; bleed right, crop up to face) */
  .face-wrap { right: -20px; bottom: -70px; height: 880px; }
  .face { height: 880px; }
  .face-glow { right: 40px; bottom: 220px; width: 520px; height: 520px;
               background: radial-gradient(circle, rgba(255,182,39,0.5) 0%, rgba(235,170,70,0.2) 40%, rgba(230,165,90,0) 66%); }

  .copy { left: 88px; top: 118px; transform: none; width: 600px; }
  .l1 { font-size: 88px; }
  .l2 { font-size: 88px; margin-bottom: 14px; }
  .l3 { font-size: 188px; line-height: 0.9; }  /* won hero, chip drops below */
  .l4 { margin-top: 6px; }
  .js-chip { width: 116px; height: 116px; font-size: 66px; padding: 0 11px 7px 0; }

  /* single bold diagonal arrow from "won" up into his smug face */
  .annot-arrow { position: absolute; left: 486px; top: 226px; z-index: 4; }
</style>
</head>
<body>
  <div class="thumb">
    <div class="grid"></div>
    <div class="face-wrap">
      <div class="face-glow"></div>
      <img class="face" src="file:///Users/akwasikonaduakuoko/Projects/WebDev/hyper-frames/videos/javascript-the-king-programming-languages-2026-05-15/thumbnails/cutouts/defringed/gigachad.png" alt="">
    </div>
    <div class="face-fade"></div>
    <div class="vignette"></div>

    <div class="annot annot-arrow">
      <svg width="392" height="180" viewBox="0 0 392 180" fill="none">
        <path d="M10 168 C 120 146, 270 100, 374 22" stroke="#FFB627" stroke-width="11" stroke-linecap="round"/>
        <path d="M374 22 L 340 28 M374 22 L 372 58" stroke="#FFB627" stroke-width="11" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="copy">
      <div class="line l1">THE WORST</div>
      <div class="line l2">LANGUAGE</div>
      <div class="line l3"><span class="hand coral">won</span></div>
      <div class="line l4"><span class="js-chip">JS</span></div>
    </div>

    <div class="grid-debug">
      <span class="gcell" style="left:322px;top:6px">320</span>
      <span class="gcell" style="left:642px;top:6px">640</span>
      <span class="gcell" style="left:962px;top:6px">960</span>
      <span class="gcell" style="left:6px;top:244px">240</span>
      <span class="gcell" style="left:6px;top:484px">480</span>
    </div>
  </div>
</body>
</html>
