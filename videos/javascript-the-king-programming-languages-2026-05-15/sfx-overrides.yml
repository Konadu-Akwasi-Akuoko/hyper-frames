# Per-video SFX cue palette for "JavaScript: The King of Programming Languages".
# Each cue is pinned to ONE asset so the score reads as one coherent piece
# (cross-scene timbral consistency — the same cue family always sounds the same).
# Editor pass only needs to place `data-sfx-on-anchor=<cue>` + a timing ref;
# the asset resolves deterministically from here.
cues:
  # Scene-transition / large-motion swoosh.
  whoosh:
    default_lead_ms: -150
    default_volume: 0.5
    filter:
      path: Whooshes/Transition Woosh.mp3

  # Discrete arrival — a label/number/badge snapping into place.
  ui-tick:
    default_lead_ms: -50
    default_volume: 0.6
    filter:
      path: Mister Horse Free SFX/Click/Mechanical Keyboard Click 16.wav

  # Soft, playful arrival — lighter than tick.
  pop:
    default_lead_ms: -50
    default_volume: 0.6
    filter:
      path: Mister Horse Free SFX/Pop/Hollow Pop 06.wav

  # Weight / finality — the line that lands, a hard impact.
  boom:
    default_lead_ms: 0
    default_volume: 0.85
    filter:
      path: Mister Horse Free SFX/Blast/Sci-fi Pulse Gun Blast 07.wav

  # Build-to-payoff tension into a reveal.
  riser:
    default_lead_ms: null
    default_volume: 0.55
    filter:
      path: Whooshes/Buildup Swoosh.mp3

  # Notification / beep — a message, a confirmation.
  msg-ding:
    default_lead_ms: -50
    default_volume: 0.55
    filter:
      path: Mister Horse Free SFX/Beep/Single UI Beep 05.wav

  # Small UI tap — a row/chip appearing, a click.
  card-tap:
    default_lead_ms: -50
    default_volume: 0.6
    filter:
      path: Mister Horse Free SFX/Click/Mechanical Keyboard Click 03.wav

  # Soft blip — secondary small reveals (distinct from `pop`).
  card-blip:
    default_lead_ms: -50
    default_volume: 0.5
    filter:
      path: Mister Horse Free SFX/Pop/Hollow Pop 05.wav

  # Mechanical relay ticking (kept from the scene-01 hook).
  relay-ticking:
    default_lead_ms: 0
    default_volume: 0.75
    filter:
      path: custom_sfx/RelayClicks_Rewind.wav
