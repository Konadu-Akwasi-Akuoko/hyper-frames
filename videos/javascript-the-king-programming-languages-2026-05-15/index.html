<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #11141b;
        --border: #1f242c;
        --fg: #e8eaed;
        --soft: #c2c9d4;
        --muted: #7a8493;
        --dim: #3a4150;
        --accent: #f7df1e;
        --accent-2: #67e8f9;
        --danger: #ff6b5d;
        --ok: #7dd87d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Inter", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="530.617"
      data-width="1920"
      data-height="1080"
    >
      <!-- Persistent background for the whole video. Sits behind every scene
           (track-index 0). Spans the full audio length. -->
      <div
        id="substrate-layer"
        data-composition-id="substrate"
        data-composition-src="compositions/substrate.html"
        data-start="0"
        data-duration="530.617"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 0"
      ></div>

      <!-- Voiceover — the timing source of truth for every scene. -->
      <audio
        id="voiceover"
        src="audio/voiceover.mp3"
        data-start="0"
        data-duration="530.617"
        data-track-index="9"
        data-volume="1"
      ></audio>

      <!-- Scene 1 — the hook (HN quote → reframe → payoff). Ends ~24.3s. -->
      <div
        id="scene-01"
        data-composition-id="scene-01-hook"
        data-composition-src="compositions/scene-01-hook.html"
        data-start="0"
        data-duration="24.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- Scene 2 — Birth of JavaScript: chapter question → May 1995 language gap → Brendan Eich 10 days → naming parade. -->
      <div
        id="scene-02"
        data-composition-id="scene-02-birth"
        data-composition-src="compositions/scene-02-birth.html"
        data-start="24.4"
        data-duration="57.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- Scene 3 — Name game: bashrc aliases → Java≠JS → self-correction → designed to be available. -->
      <div
        id="scene-03"
        data-composition-id="scene-03-name"
        data-composition-src="compositions/scene-03-name-game.html"
        data-start="82.0"
        data-duration="48.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- Scene 4 — Server question: "how the HELL did JS get to the server?" + 14-year exclusion + browser trap. -->
      <div
        id="scene-04"
        data-composition-id="scene-04-server-question"
        data-composition-src="compositions/scene-04-server-question.html"
        data-start="130.0"
        data-duration="20.68"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- Scene 5 — Ryan Dahl: November 2009, Apache choking, he chose JavaScript, blocking I/O reason. -->
      <div
        id="scene-05"
        data-composition-id="scene-05-ryan-dahl"
        data-composition-src="compositions/scene-05-ryan-dahl.html"
        data-start="150.68"
        data-duration="56.32"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- Scene 6 — Node.js: EventMachine/Twisted fail, JS blank-slate advantage, V8+event-loop formula, standing ovation. -->
      <div
        id="scene-06"
        data-composition-id="scene-06-node"
        data-composition-src="compositions/scene-06-node.html"
        data-start="207.0"
        data-duration="50.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- Later scenes mount here at track-index >= 1 and z-index >= 1. -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
