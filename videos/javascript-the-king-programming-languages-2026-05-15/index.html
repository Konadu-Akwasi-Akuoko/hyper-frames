<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #11141b;
        --border: #1f242c;
        --fg: #e8eaed;
        --soft: #c2c9d4;
        --muted: #7a8493;
        --dim: #3a4150;
        --accent: #f7df1e;
        --accent-2: #67e8f9;
        --danger: #ff6b5d;
        --ok: #7dd87d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Inter", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="530.617"
      data-width="1920"
      data-height="1080"
    >
      <!-- Voiceover — the timing source of truth for every scene. -->
      <audio
        id="voiceover"
        src="audio/voiceover.mp3"
        data-start="0"
        data-duration="530.617"
        data-track-index="9"
        data-volume="1"
      ></audio>

      <!-- greenfield: no scenes authored yet. frontier = 0. -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
