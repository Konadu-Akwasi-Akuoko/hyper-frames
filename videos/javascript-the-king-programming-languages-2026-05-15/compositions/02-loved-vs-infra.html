<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 02 — never loved, but runs the world</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-02 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    /* Stage column — concession on top, power claim below; reflows on the pivot. */
    #scene-02 .stage {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 1500px; text-align: center;
    }

    /* The concession — a deliberate step down to soft. */
    #scene-02 .concession {
      font-size: 64px; font-weight: 500; line-height: 1.22; color: var(--soft);
      letter-spacing: -0.5px; will-change: transform, opacity;
    }
    #scene-02 .concession .js { color: var(--accent); font-weight: 700; }
    #scene-02 .concession .loved {
      position: relative; color: var(--muted);
    }
    /* hand-free strike — a thin rule swept across "loved" on its word. */
    #scene-02 .concession .loved .strike {
      position: absolute; left: -4%; top: 54%; width: 0%; height: 6px;
      background: var(--danger); border-radius: 3px; transform-origin: left center;
      box-shadow: 0 0 12px rgba(255,107,93,0.6);
    }

    /* The pivot word, large and centered between the two states. */
    #scene-02 .pivot {
      margin: 30px 0 26px;
      font-size: 40px; font-weight: 700; color: var(--muted);
      letter-spacing: 6px; text-transform: uppercase; opacity: 0;
      will-change: transform, opacity;
    }

    /* The power claim — brighter, larger, owns the frame. */
    #scene-02 .claim {
      font-size: 88px; font-weight: 800; line-height: 1.12; color: var(--fg);
      letter-spacing: -1.5px; will-change: transform, opacity;
    }
    #scene-02 .claim .infra {
      position: relative; display: inline-block; color: var(--fg);
      will-change: transform, text-shadow;
    }
    /* accent-2 underline sweep — clearly-visible emphasis, distinct from the danger strike. */
    #scene-02 .claim .infra .uline {
      position: absolute; left: 0; bottom: -10px; width: 0%; height: 7px;
      background: var(--accent-2); border-radius: 4px; transform-origin: left center;
      box-shadow: 0 0 16px rgba(103,232,249,0.55);
    }
    #scene-02 .claim .yr {
      font-family: "JetBrains Mono", monospace; font-weight: 600;
      font-size: 64px; color: var(--accent-2); font-variant-numeric: tabular-nums;
    }

    #scene-02 .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
  </style>
</head>
<body>
  <div id="scene-02" data-composition-id="scene-02" data-width="1920" data-height="1080">
    <div class="stage"
         data-sfx-on-anchor="whoosh"
         data-sfx-asset="Anime SFX/Camera Whoosh 01.mp3"
         data-sfx-at-scene-ms="220">
      <div class="concession">
        <span class="w"><span class="js">JavaScript</span></span>
        <span class="w">has</span> <span class="w">never</span> <span class="w">been</span>
        <span class="w">the</span> <span class="w">most</span>
        <span class="w loved">loved<span class="strike"></span></span>
        <span class="w">language.</span>
      </div>
      <div class="pivot">but</div>
      <div class="claim">
        <span class="w">in</span> <span class="w yr">2026</span><span class="w">,</span>
        <span class="w">it</span> <span class="w">still</span> <span class="w">runs</span>
        <span class="w">the</span> <span class="w">world's</span>
        <span class="w"><span class="infra"
          data-sfx-on-anchor="ui-tick"
          data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav"
          data-sfx-at-scene-ms="9380">infrastructure.<span class="uline"></span></span></span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local time = global - data_start(11.16). Entrance at local 0 (overlap w/ scene 01).
    tl.fromTo("#scene-02 .stage",
      { opacity: 0, y: 22 },
      { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);

    // Concession reveals word-by-word, soft. Globals: You 11.66, JavaScript 12.36,
    // has 12.90, never 13.14, been 13.42, the 13.60, most 13.84, loved 14.34, language 14.78.
    const conc = [
      0.50,  // JavaScript (12.36 - hmm "You see" folded; first visible word group)
      1.74,  // has
      1.98,  // never
      2.26,  // been
      2.44,  // the
      2.68,  // most
      3.18,  // loved
      3.62   // language
    ];
    gsap.utils.toArray("#scene-02 .concession .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, conc[i]);
    });
    // "loved" gets struck through on its word (14.34 -> local 3.18).
    tl.to("#scene-02 .concession .loved .strike",
      { width: "108%", duration: 0.4, ease: "power2.inOut" }, 3.30);

    // Pivot "but" (16.06 -> local 4.90). The concession lifts + dims to make room.
    tl.to("#scene-02 .pivot", { opacity: 1, duration: 0.35, ease: "power2.out" }, 4.90);
    tl.to("#scene-02 .concession",
      { y: -14, opacity: 0.5, color: "#7a8493", duration: 0.5, ease: "power2.inOut" }, 4.90);
    // Mute "JavaScript" with the line so dimmed accent-yellow doesn't read as muddy olive.
    tl.to("#scene-02 .concession .js",
      { color: "#7a8493", fontWeight: 500, duration: 0.5, ease: "power2.inOut" }, 4.90);

    // Power claim rises bright. Globals: in 16.42, 2026 16.60, it 18.58, still 17.94,
    // runs 19.00, the 19.36, world's 19.52, infrastructure 19.98.
    const claim = [
      5.26,  // in
      5.44,  // 2026
      6.10,  // , (rides 2026)
      7.42,  // it
      6.78,  // still
      7.84,  // runs
      8.20,  // the
      8.36,  // world's
      8.82   // infrastructure
    ];
    gsap.utils.toArray("#scene-02 .claim .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, claim[i]);
    });
    // "infrastructure" lands the claim (19.98 -> local 8.82): bright bloom + accent-2 underline sweep.
    tl.to("#scene-02 .claim .infra",
      { textShadow: "0 0 40px rgba(232,234,237,0.85)", duration: 0.4, ease: "power2.out" }, 8.86);
    tl.to("#scene-02 .claim .infra .uline",
      { width: "100%", duration: 0.46, ease: "power3.out" }, 8.92);

    // Constant subtle life — the whole stage drifts a hair.
    tl.to("#scene-02 .stage",
      { y: "+=7", duration: 5.5, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.2);

    window.__timelines["scene-02"] = tl;
  </script>
</body>
</html>
