<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 02 — never loved, runs the world</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-02 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    /* "world's infrastructure" — a faint rack of data columns along the floor that rises on the payoff. */
    #scene-02 .infra { position:absolute; left:0; right:0; bottom:0; height:360px; display:flex; align-items:flex-end; justify-content:center; gap:14px; opacity:0; }
    #scene-02 .infra .bar { width:26px; background:linear-gradient(180deg, rgba(103,232,249,0.20), rgba(103,232,249,0.02)); border-radius:4px 4px 0 0; transform:scaleY(0.12); transform-origin:bottom; will-change:transform; }
    #scene-02 .floor { position:absolute; left:0; right:0; bottom:300px; height:1px; background:linear-gradient(90deg, transparent, rgba(122,132,147,0.35), transparent); opacity:0; }

    #scene-02 .stack { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:1500px; text-align:center; }

    #scene-02 .concession { font-size:58px; font-weight:500; line-height:1.3; color:var(--soft); opacity:0; will-change:transform,opacity; }
    #scene-02 .concession .loved { color:var(--muted); position:relative; }
    #scene-02 .concession .loved .strike { position:absolute; left:-4px; right:-4px; top:56%; height:4px; width:0; background:var(--danger); border-radius:2px; will-change:width; }

    #scene-02 .pivot { display:flex; align-items:center; justify-content:center; gap:18px; margin:26px 0; opacity:0; will-change:opacity; }
    #scene-02 .pivot .rule { height:1px; width:120px; background:var(--border); }
    #scene-02 .pivot .yr { font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:600; color:var(--muted); letter-spacing:1px; font-variant-numeric:tabular-nums; }

    #scene-02 .payoff { display:flex; align-items:center; justify-content:center; gap:30px; }
    #scene-02 .js { width:96px; height:96px; flex:none; opacity:0; will-change:transform,opacity; filter:drop-shadow(0 8px 28px rgba(0,0,0,0.5)); }
    #scene-02 .payoff .ptext { font-size:78px; font-weight:800; line-height:1.12; color:var(--fg); text-align:left; opacity:0; will-change:transform,opacity; }
    #scene-02 .payoff .ptext .infra-w { color:var(--accent); }
  </style>
</head>
<body>
  <div id="scene-02" data-composition-id="scene-02" data-width="1920" data-height="1080">
    <div class="floor"></div>
    <div class="infra"></div>

    <div class="stack">
      <div class="concession" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="600">JavaScript has never been the most <span class="loved">loved<span class="strike"></span></span> language</div>
      <div class="pivot"><span class="rule"></span><span class="yr" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5840">2026</span><span class="rule"></span></div>
      <div class="payoff">
        <img class="js" src="../assets/icons/javascript.svg" alt="JavaScript" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="8200">
        <div class="ptext">it runs the world's<br><span class="infra-w" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="9120">infrastructure</span>.</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(11.16). Entrance at local 0 (overlap w/ scene 01).
    // Word beats: loved 3.18 / 2026 5.44 / runs 7.84 / infrastructure 8.82.

    // build the infra rack columns (deterministic heights, no Math.random).
    const infra = document.querySelector("#scene-02 .infra");
    const H = [0.45,0.62,0.38,0.78,0.55,0.9,0.5,0.7,0.42,0.84,0.6,0.95,0.52,0.74,0.4,0.66,0.58,0.88,0.46,0.8];
    H.forEach(h => { const b=document.createElement("div"); b.className="bar"; b.style.height=(h*300)+"px"; infra.appendChild(b); });

    // Concession line lifts in across the entrance overlap.
    tl.fromTo("#scene-02 .concession", { opacity:0, y:22 }, { opacity:1, y:0, duration:0.6, ease:"power3.out" }, 0);
    // "loved" gets struck through + dims on its word (3.18).
    tl.fromTo("#scene-02 .concession .loved .strike", { width:0 }, { width:0, duration:0.01 }, 0); // ensure 0 base
    tl.to("#scene-02 .concession .loved .strike", { width:"calc(100% + 8px)", duration:0.4, ease:"power2.out" }, 3.18);
    tl.to("#scene-02 .concession .loved", { color:"#5a626e", duration:0.4 }, 3.2);

    // Pivot rule + year stamp at "but in 2026" (4.90 / 5.44).
    tl.fromTo("#scene-02 .pivot", { opacity:0, scaleX:0.6 }, { opacity:1, scaleX:1, duration:0.5, ease:"power2.out" }, 4.90);
    tl.fromTo("#scene-02 .pivot .yr", { color:"#7a8493" }, { color:"#e8eaed", duration:0.4 }, 5.44);

    // Payoff: JS logo + line rise in on "runs" (7.84).
    tl.fromTo("#scene-02 .js", { opacity:0, scale:0.7, rotateZ:-8 }, { opacity:1, scale:1, rotateZ:0, duration:0.6, ease:"back.out(1.7)" }, 7.6);
    tl.fromTo("#scene-02 .payoff .ptext", { opacity:0, x:20 }, { opacity:1, x:0, duration:0.55, ease:"power3.out" }, 7.8);

    // "infrastructure" lands: floor + rack rise, JS logo glows accent (8.82).
    tl.fromTo("#scene-02 .floor", { opacity:0 }, { opacity:1, duration:0.5 }, 8.6);
    tl.fromTo("#scene-02 .infra", { opacity:0 }, { opacity:0.85, duration:0.7 }, 8.7);
    tl.to("#scene-02 .infra .bar", { scaleY:1, duration:0.7, ease:"power2.out", stagger:{ each:0.02, from:"center" } }, 8.82);
    tl.fromTo("#scene-02 .payoff .ptext .infra-w", { textShadow:"0 0 0 rgba(247,223,30,0)" }, { textShadow:"0 0 30px rgba(247,223,30,0.5)", duration:0.5, ease:"power2.out" }, 8.82);
    tl.to("#scene-02 .js", { filter:"drop-shadow(0 0 26px rgba(247,223,30,0.55))", duration:0.5 }, 8.82);

    // constant subtle life on the logo.
    tl.to("#scene-02 .js", { y:"-=6", duration:4.5, ease:"sine.inOut", repeat:1, yoyo:true }, 8.1);

    window.__timelines["scene-02"] = tl;
  </script>
</body>
</html>
