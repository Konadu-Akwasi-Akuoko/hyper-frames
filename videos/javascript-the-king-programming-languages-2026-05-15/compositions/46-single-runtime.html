<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 46 — wrapped Chromium and Node.js into a single runtime</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-46 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-46 .cap { position:absolute; left:50%; top:188px; transform:translateX(-50%); width:1420px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-46 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-46 .cap .rt { color:var(--accent-2); font-weight:800; will-change:text-shadow; }

    /* the runtime container outline — drawn on as it wraps both */
    #scene-46 .wires { position:absolute; inset:0; width:1920px; height:1080px; }
    #scene-46 .wires .box { fill:rgba(103,232,249,0.03); stroke:var(--accent-2); stroke-width:3; will-change:stroke; }

    /* the runtime nameplate tab on the top edge */
    #scene-46 .tab { position:absolute; left:50%; top:438px; transform:translateX(-50%); font-family:"JetBrains Mono",ui-monospace,monospace; font-size:23px; font-weight:700; letter-spacing:0.5px; color:var(--accent-2); background:var(--bg); border:1px solid rgba(103,232,249,0.45); border-radius:999px; padding:7px 22px; opacity:0; will-change:transform,opacity; white-space:nowrap; }

    /* the two engines being wrapped */
    #scene-46 .eng { position:absolute; top:524px; display:flex; flex-direction:column; align-items:center; gap:16px; opacity:0; will-change:transform,opacity; }
    #scene-46 .eng img { width:104px; height:104px; object-fit:contain; }
    #scene-46 .eng .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:22px; font-weight:700; color:var(--soft); }
    #scene-46 #e-chromium { left:760px; width:104px; }
    #scene-46 #e-node { left:1056px; width:104px; }
    #scene-46 .plus { position:absolute; left:944px; top:560px; font-size:46px; font-weight:300; color:var(--muted); opacity:0; will-change:opacity; }
  </style>
</head>
<body>
  <div id="scene-46" data-composition-id="scene-46" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">wrapped</span> <span class="w">Chromium</span> <span class="w">and</span>
      <span class="w">Node.js</span> <span class="w">into</span> <span class="w">a</span>
      <span class="w rt">single</span> <span class="w rt">runtime.</span>
    </div>

    <svg class="wires" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <path class="box" d="M666 460 H1254 A26 26 0 0 1 1280 486 V714 A26 26 0 0 1 1254 740 H666 A26 26 0 0 1 640 714 V486 A26 26 0 0 1 666 460 Z"/>
    </svg>

    <div class="tab" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3160">single runtime</div>

    <div class="eng" id="e-chromium" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="820">
      <img src="../assets/icons/chrome.svg" alt="Chromium">
      <span class="lbl">Chromium</span>
    </div>
    <span class="plus">+</span>
    <div class="eng" id="e-node" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1680">
      <img src="../assets/icons/nodejs.svg" alt="Node.js">
      <span class="lbl">Node.js</span>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(298.46).
    // wrapped 0.50 / Chromium 0.82 / and 1.54 / Node.js 1.68 / into 2.26 / a 2.48 / single 2.70 / runtime 3.16.

    // "wrapped Chromium and Node.js into a single runtime."
    const cw = [0.50, 0.82, 1.54, 1.68, 2.26, 2.48, 2.70, 3.16];
    gsap.utils.toArray("#scene-46 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // the container outline starts hidden (drawn on during the wrap).
    const box = document.querySelector("#scene-46 .box");
    const bl = box ? box.getTotalLength() : 1900;
    gsap.set(box, { strokeDasharray:bl, strokeDashoffset:bl, opacity:0 });

    // "Chromium" — the first engine lands, loose and left of home (x:-46).
    tl.fromTo("#scene-46 #e-chromium", { opacity:0, x:-46, scale:0.9 }, { opacity:1, x:-46, scale:1, duration:0.45, ease:"back.out(1.6)" }, 0.82);
    // "Node.js" — the second engine lands, loose and right (x:46).
    tl.fromTo("#scene-46 #e-node", { opacity:0, x:46, scale:0.9 }, { opacity:1, x:46, scale:1, duration:0.45, ease:"back.out(1.6)" }, 1.68);

    // "into a single runtime" — the container draws around both; they pull into home; the "+" appears.
    tl.to(box, { opacity:1, duration:0.01 }, 2.20);
    tl.to(box, { strokeDashoffset:0, duration:0.95, ease:"power2.inOut" }, 2.26);
    tl.to("#scene-46 #e-chromium", { x:0, duration:0.55, ease:"power2.inOut" }, 2.40);
    tl.to("#scene-46 #e-node", { x:0, duration:0.55, ease:"power2.inOut" }, 2.40);
    tl.fromTo("#scene-46 .plus", { opacity:0 }, { opacity:1, duration:0.3 }, 2.62);
    tl.to("#scene-46 .box", { stroke:"#67e8f9", duration:0.4 }, 3.00);
    // "runtime." — the nameplate snaps onto the top edge.
    tl.fromTo("#scene-46 .tab", { opacity:0, y:8, scale:0.85 }, { opacity:1, y:0, scale:1, duration:0.45, ease:"back.out(1.8)" }, 3.16);

    // Subtle life — the wrapped engines breathe once formed.
    tl.to("#scene-46 #e-chromium, #scene-46 #e-node, #scene-46 .plus", { y:"-=5", duration:1.6, ease:"sine.inOut", repeat:1, yoyo:true }, 3.6);

    // Seam clear — fade out across the trailing overlap with scene 47 (local 3.90-4.38).
    tl.to("#scene-46 .cap, #scene-46 .wires, #scene-46 .tab, #scene-46 #e-chromium, #scene-46 #e-node, #scene-46 .plus", { opacity:0, duration:0.34, ease:"power2.inOut" }, 3.90);

    window.__timelines["scene-46"] = tl;
  </script>
</body>
</html>
