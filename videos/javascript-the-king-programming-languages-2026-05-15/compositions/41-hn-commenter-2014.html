<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 41 — a Hacker News commenter, 2014, used exactly that verb</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    @font-face {
      font-family:"Excalifont";
      src:url("../fonts/Excalifont-Regular.woff2") format("woff2");
      font-weight:400; font-display:block;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-41 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-41 .head { position:absolute; left:50%; top:15%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }

    /* the comment card — Hacker News in its native habitat */
    #scene-41 .card { position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); width:920px; background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; opacity:0; will-change:transform,opacity; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
    #scene-41 .card .bar { height:6px; background:#fb651e; opacity:0.9; }
    #scene-41 .card .inner { padding:34px 44px 38px; }

    #scene-41 .chead { display:flex; align-items:center; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:24px; }
    #scene-41 .chead .hn { width:42px; height:42px; border-radius:8px; flex:none; display:block; box-shadow:0 4px 16px rgba(251,101,30,0.35); will-change:transform; }
    #scene-41 .chead .brand { font-size:26px; font-weight:600; color:var(--soft); letter-spacing:0.2px; }

    #scene-41 .cmeta { display:flex; align-items:center; gap:10px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:20px; color:var(--muted); margin-bottom:22px; opacity:0; will-change:opacity; }
    #scene-41 .cmeta .up { color:var(--dim); }
    #scene-41 .cmeta .yr { color:var(--soft); will-change:color,text-shadow; }

    /* the verbatim comment — human voice, so Excalifont */
    #scene-41 .cbody { font-family:"Excalifont","Inter",sans-serif; font-size:42px; line-height:1.46; color:var(--soft); opacity:0; will-change:opacity; }

    /* the spotlighted verb — a marker sweep wipes in behind it */
    #scene-41 .vb { position:relative; display:inline-block; padding:0 5px; }
    #scene-41 .vb .swipe { position:absolute; inset:2px 0 4px; background:rgba(103,232,249,0.24); border-radius:6px; transform:scaleX(0); transform-origin:left center; will-change:transform; }
    #scene-41 .vb .txt { position:relative; color:var(--soft); will-change:color,text-shadow; }

    /* the hand annotation — also Excalifont */
    #scene-41 .note { font-family:"Excalifont","Inter",sans-serif; font-size:30px; color:var(--accent-2); margin-top:26px; opacity:0; will-change:transform,opacity; }
  </style>
</head>
<body>
  <div id="scene-41" data-composition-id="scene-41" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">And there&rsquo;s the line.</div>

    <div class="card" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="900">
      <div class="bar"></div>
      <div class="inner">
        <div class="chead">
          <svg class="hn" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="#fb651e" d="M0 0h256v256H0z"/><path fill="#fff" d="M119.374 144.746L75.433 62.432h20.081l25.848 52.092q.597 1.392 1.392 2.883t1.391 3.082q.398.596.597 1.094q.199.496.398.894a66 66 0 0 1 1.79 3.877q.795 1.89 1.39 3.48q1.591-3.381 3.48-7.257q1.89-3.878 3.877-8.053l26.246-52.092h18.69l-44.34 83.308v53.087h-16.9z"/></svg>
          <span class="brand">Hacker News</span>
        </div>

        <div class="cmeta"><span class="up">&#9650;</span> throwaway42 &middot; 2 points &middot; <span class="yr">2014</span></div>

        <div class="cbody">We allowed this awful language to <span class="vb" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="5600"><span class="swipe"></span><span class="txt">escape</span></span> the browser and infiltrate our servers in the form of Node.js.</div>

        <div class="note" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="6200">&uarr; exactly that verb</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(270.12).
    // And 0.50 / there's 0.68 / the-line 1.06 / A 1.96 / Hacker 2.00 / News 2.32 / commenter 2.54 / writing 3.46 / in 3.84 / 2014 4.02 / used 5.28 / exactly 5.60 / that 6.20 / verb 6.44.

    // "And there's the line."
    tl.fromTo("#scene-41 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the comment card rises into view — there's the line, in its native thread.
    tl.fromTo("#scene-41 .card", { opacity:0, y:40, scale:0.97 }, { opacity:1, y:0, scale:1, duration:0.6, ease:"power3.out" }, 0.90);
    tl.fromTo("#scene-41 .cbody", { opacity:0 }, { opacity:1, duration:0.5, ease:"power2.out" }, 1.20);

    // "A Hacker News commenter" — the mark gives a recognition tick; the meta byline fades up.
    tl.fromTo("#scene-41 .chead .hn", { scale:0.7, rotateZ:-8 }, { scale:1, rotateZ:0, duration:0.42, ease:"back.out(2.2)" }, 2.00);
    tl.fromTo("#scene-41 .cmeta", { opacity:0 }, { opacity:1, duration:0.4 }, 2.54);

    // "writing in 2014" — the year brightens.
    tl.fromTo("#scene-41 .cmeta .yr", { color:"#c2c9d4", textShadow:"0 0 0 rgba(103,232,249,0)" }, { color:"#67e8f9", textShadow:"0 0 16px rgba(103,232,249,0.45)", duration:0.4, ease:"power2.out" }, 4.02);

    // "used exactly that verb" — the marker sweeps in behind "escape", the word lights cyan.
    tl.to("#scene-41 .vb .swipe", { scaleX:1, duration:0.5, ease:"power2.out" }, 5.60);
    tl.to("#scene-41 .vb .txt", { color:"#67e8f9", textShadow:"0 0 20px rgba(103,232,249,0.5)", duration:0.4, ease:"power2.out" }, 5.74);
    // the hand annotation stamps in under the line.
    tl.fromTo("#scene-41 .note", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.45, ease:"back.out(1.8)" }, 6.20);

    // constant life — the card breathes a hair.
    tl.to("#scene-41 .card", { y:"-=6", duration:3.4, ease:"sine.inOut", repeat:1, yoyo:true }, 1.6);

    // Seam clear — fade foreground out across the trailing overlap with scene 42 (local 6.85-7.19).
    tl.to("#scene-41 .head, #scene-41 .card", { opacity:0, duration:0.32, ease:"power2.inOut" }, 6.86);

    window.__timelines["scene-41"] = tl;
  </script>
</body>
</html>
