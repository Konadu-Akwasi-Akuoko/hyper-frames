      font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 700; letter-spacing: 1px;
      color: var(--accent-2); border: 1px solid rgba(103,232,249,0.4); border-radius: 999px; padding: 10px 28px;
      background: rgba(103,232,249,0.05);

<body>
  <div id="scene-41" data-composition-id="scene-41" data-width="1920" data-height="1080">

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(270.12).
    // "And there's the line. A Hacker News commenter, writing in 2014, used exactly that verb."
    const cw = [0.50, 0.68, 0.89, 1.06, 1.96, 2.00, 2.32, 2.54, 3.46, 3.84, 4.02, 5.28, 5.60, 6.20, 6.44];
    gsap.utils.toArray("#scene-41 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, cw[i]);

    // "Hacker News" — the mark and wordmark land (Hacker 2.00, News 2.32).
    tl.fromTo("#scene-41 .brand .mark",
      { opacity: 0, scale: 0.7, rotateZ: -8 },
      { opacity: 1, scale: 1, rotateZ: 0, duration: 0.5, ease: "back.out(2)" }, 2.00);
    tl.fromTo("#scene-41 .brand .nm",
      { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 2.20);

    // "2014" — the year badge stamps in (2014 4.02).
    tl.fromTo("#scene-41 .year",
      { opacity: 0, y: 16, scale: 0.9 },
      { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 4.02);

    // "that verb" — the caption emphasis blooms (that 6.20, verb 6.44).
    tl.fromTo("#scene-41 .cap .vb",
      { textShadow: "0 0 0 rgba(247,223,30,0)" },
      { textShadow: "0 0 24px rgba(247,223,30,0.5)", duration: 0.4, ease: "power2.out" }, 6.48);

    // Subtle life — the mark breathes.
    tl.to("#scene-41 .brand .mark", { y: "-=6", duration: 2.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.0);

    // Seam clear — fade out across the trailing overlap with scene 42 (local 6.69-7.19).
    tl.to("#scene-41 .cap, #scene-41 .lockup",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 6.69);

    window.__timelines["scene-41"] = tl;
