<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 68 — a terror reign by JavaScript, the world's most dominant language</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-68 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-68 .cap {
      position: absolute; left: 50%; top: 158px; transform: translateX(-50%);
      width: 1460px; text-align: center;
      font-size: 46px; font-weight: 600; color: var(--soft); letter-spacing: -0.8px;
    }
    #scene-68 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-68 .cap .k { color: var(--accent); font-weight: 800; }
    #scene-68 .cap .t { color: var(--danger); font-weight: 800; will-change: text-shadow; }

    /* the crowned JavaScript */
    #scene-68 .throne {
      position: absolute; left: 50%; top: 560px; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    #scene-68 .crown { width: 150px; height: 84px; opacity: 0; will-change: transform, opacity; }
    #scene-68 .crown path { fill: var(--accent); }
    #scene-68 .crown circle { fill: #fff6c2; }
    #scene-68 .js {
      width: 158px; height: 158px; border-radius: 26px; opacity: 0; will-change: transform, opacity, filter;
    }
    #scene-68 .badge {
      margin-top: 16px;
      font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 800; color: var(--accent);
      padding: 10px 26px; border-radius: 999px; border: 1px solid rgba(247,223,30,0.5); background: rgba(247,223,30,0.08);
      display: flex; align-items: center; gap: 12px; opacity: 0; will-change: transform, opacity;
    }
    #scene-68 .badge .hash { color: #fff6c2; }

    /* the dethroned former rulers */
    #scene-68 .fallen {
      position: absolute; left: 50%; top: 884px; transform: translateX(-50%);
      display: flex; align-items: flex-end; gap: 48px; opacity: 0; will-change: opacity;
    }
    #scene-68 .fallen .f { display: flex; flex-direction: column; align-items: center; gap: 8px; filter: grayscale(0.8) brightness(0.6); }
    #scene-68 .fallen .f img { width: 52px; height: 52px; }
    #scene-68 .fallen .f span { font-family: "JetBrains Mono", monospace; font-size: 15px; color: var(--muted); }
    #scene-68 .fallen .lbl {
      position: absolute; left: 50%; top: -34px; transform: translateX(-50%);
      font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 700; color: var(--dim); letter-spacing: 1px; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="scene-68" data-composition-id="scene-68" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">And</span> <span class="w">that</span> <span class="w">was</span> <span class="w">the</span>
      <span class="w">beginning</span> <span class="w">of</span> <span class="w">a</span> <span class="w t">terror</span>
      <span class="w t">reign</span> <span class="w">by</span> <span class="w k">JavaScript,</span> <span class="w">as</span>
      <span class="w">the</span> <span class="w">world&rsquo;s</span> <span class="w k">most</span> <span class="w k">dominant</span>
      <span class="w">language.</span>
    </div>

    <div class="throne">
      <svg class="crown" viewBox="0 0 150 84" aria-hidden="true" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="3200">
        <path d="M12 78 L24 28 L52 56 L75 18 L98 56 L126 28 L138 78 Z"/>
        <circle cx="24" cy="24" r="7"/>
        <circle cx="75" cy="13" r="8"/>
        <circle cx="126" cy="24" r="7"/>
      </svg>
      <img class="js" src="../assets/icons/javascript.svg" alt="JavaScript" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1560">
      <div class="badge" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="5840"><span class="hash">#1</span> world&rsquo;s most dominant</div>
    </div>

    <div class="fallen">
      <span class="lbl">the former rulers</span>
      <div class="f"><img src="../assets/icons/perl.svg" alt="Perl"><span>Perl</span></div>
      <div class="f"><img src="../assets/icons/php.svg" alt="PHP"><span>PHP</span></div>
      <div class="f"><img src="../assets/icons/python.svg" alt="Python"><span>Python</span></div>
      <div class="f"><img src="../assets/icons/ruby.svg" alt="Ruby"><span>Ruby</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(381.43).
    // "And that was the beginning of a terror reign by JavaScript, as the world's most dominant language."
    // (beginning 1.56, terror 2.76, reign 3.20, JavaScript 4.06, world's 5.50, most 5.84, dominant 6.06, language 6.66).
    const cw = [0.50, 0.72, 1.30, 1.44, 1.56, 2.40, 2.62, 2.76, 3.20, 3.84, 4.06, 5.24, 5.41, 5.50, 5.84, 6.06, 6.66];
    gsap.utils.toArray("#scene-68 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, cw[i]);
    });

    // "the beginning" — the JS logo rises onto the throne (beginning 1.56).
    tl.fromTo("#scene-68 .js",
      { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 1.56);

    // the former rulers gather below, dimmed (of a 2.40).
    tl.to("#scene-68 .fallen", { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.20);

    // "terror reign" — the menace words bloom danger-red (terror 2.76).
    tl.fromTo("#scene-68 .cap .t",
      { textShadow: "0 0 0 rgba(255,107,93,0)" },
      { textShadow: "0 0 22px rgba(255,107,93,0.55)", duration: 0.4, ease: "power2.out" }, 2.80);

    // "reign" — the crown descends onto JavaScript and the logo ignites royal-yellow (reign 3.20).
    tl.fromTo("#scene-68 .crown",
      { opacity: 0, y: -46, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 3.20);
    tl.to("#scene-68 .js",
      { filter: "drop-shadow(0 0 30px rgba(247,223,30,0.5))", duration: 0.5, ease: "power2.out" }, 3.40);

    // "world's most dominant" — the #1 badge lands (most 5.84).
    tl.fromTo("#scene-68 .badge",
      { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 5.84);

    // Subtle life — the crowned logo holds with a faint breath.
    tl.to("#scene-68 .throne", { y: "-=5", duration: 1.4, ease: "sine.inOut" }, 6.6);

    // Seam clear — fade out across the trailing overlap with scene 69 (local 7.20-7.70).
    tl.to("#scene-68 .cap, #scene-68 .throne, #scene-68 .fallen",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 7.20);

    window.__timelines["scene-68"] = tl;
  </script>
</body>
</html>
