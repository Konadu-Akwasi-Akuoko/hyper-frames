<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 09 — Mocha to LiveScript to JavaScript</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-09 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-09 .lineage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; }

    #scene-09 .node { position:relative; opacity:0; will-change:transform,opacity; }
    #scene-09 .node .pill { padding:26px 46px; border:1px solid var(--border); border-radius:16px; background:var(--panel);
      font-size:48px; font-weight:800; color:var(--fg); letter-spacing:-0.5px; box-shadow:0 22px 56px rgba(0,0,0,0.45); white-space:nowrap; }
    #scene-09 .node .date { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:22px; white-space:nowrap;
      font-family:"JetBrains Mono",monospace; font-size:24px; color:var(--muted); letter-spacing:1px; }
    #scene-09 .node .dot { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:18px;
      width:11px; height:11px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 14px rgba(103,232,249,0.6); opacity:0; }

    /* dashed blueprint connectors */
    #scene-09 .conn { width:150px; height:0; border-top:3px dashed var(--dim); transform:scaleX(0); transform-origin:left center; will-change:transform; margin:0 6px; }

    /* the final name that stuck */
    #scene-09 .node.final .pill { border-color:rgba(247,223,30,0.55); color:var(--accent); }
  </style>
</head>
<body>
  <div id="scene-09" data-composition-id="scene-09" data-width="1920" data-height="1080">
    <div class="lineage">
      <div class="node n1" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1580">
        <span class="dot"></span>
        <div class="pill">Mocha</div>
        <div class="date">MAY 1995</div>
      </div>
      <div class="conn c1" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3300"></div>
      <div class="node n2" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="6180">
        <span class="dot"></span>
        <div class="pill">LiveScript</div>
        <div class="date">SEP 1995</div>
      </div>
      <div class="conn c2" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="8000"></div>
      <div class="node n3 final" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="11020">
        <span class="dot"></span>
        <div class="pill">JavaScript</div>
        <div class="date">DEC 1995</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(70.18).
    // Mocha 1.58 / Sept-1995 3.00 / LiveScript 6.18 / December 7.72 / JavaScript 11.02.

    // node 1 — Mocha.
    tl.fromTo("#scene-09 .n1", { opacity:0, y:24, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(1.6)" }, 1.58);
    tl.fromTo("#scene-09 .n1 .dot", { opacity:0, scale:0 }, { opacity:1, scale:1, duration:0.3, ease:"back.out(2)" }, 1.7);

    // connector draws toward LiveScript (September 1995).
    tl.fromTo("#scene-09 .c1", { scaleX:0 }, { scaleX:1, duration:0.55, ease:"power2.inOut" }, 3.00);

    // node 2 — LiveScript.
    tl.fromTo("#scene-09 .n2", { opacity:0, y:24, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(1.6)" }, 6.18);
    tl.fromTo("#scene-09 .n2 .dot", { opacity:0, scale:0 }, { opacity:1, scale:1, duration:0.3, ease:"back.out(2)" }, 6.3);

    // connector draws toward JavaScript (December).
    tl.fromTo("#scene-09 .c2", { scaleX:0 }, { scaleX:1, duration:0.55, ease:"power2.inOut" }, 7.72);

    // node 3 — JavaScript, the name that stuck.
    tl.fromTo("#scene-09 .n3", { opacity:0, y:24, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.7)" }, 11.02);
    tl.fromTo("#scene-09 .n3 .dot", { opacity:0, scale:0 }, { opacity:1, scale:1, duration:0.3, ease:"back.out(2)" }, 11.14);
    tl.fromTo("#scene-09 .n3 .pill", { boxShadow:"0 22px 56px rgba(0,0,0,0.45)" }, { boxShadow:"0 22px 56px rgba(0,0,0,0.45), 0 0 44px rgba(247,223,30,0.28)", duration:0.5 }, 11.02);
    // the earlier names recede a touch — JavaScript is what remained.
    tl.to("#scene-09 .n1, #scene-09 .n2", { opacity:0.5, duration:0.6 }, 11.2);
    // a soft idle pulse on the final pill so it keeps breathing.
    tl.to("#scene-09 .n3 .pill", { scale:1.015, duration:1.6, ease:"sine.inOut", repeat:2, yoyo:true }, 11.7);
    window.__timelines["scene-09"] = tl;
  </script>
</body>
</html>
