<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 34 — he took V8, the JS engine powering Google Chrome</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-34 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-34 .head { position:absolute; left:50%; top:18%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-34 .head .v { color:var(--accent-2); font-weight:800; }

    #scene-34 .stage { position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:0; }

    /* V8 — the engine he took (hero) */
    #scene-34 .v8 { width:320px; height:240px; background:var(--panel); border:1px solid rgba(103,232,249,0.4); border-radius:20px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; opacity:0; will-change:transform,opacity,box-shadow; box-shadow:0 26px 70px rgba(0,0,0,0.46); }
    #scene-34 .v8 .asset { width:96px; height:96px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
    #scene-34 .v8 .asset img { width:96px; height:96px; object-fit:contain; display:block; }
    #scene-34 .v8 .nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:30px; font-weight:800; color:var(--soft); }
    #scene-34 .v8 .sub { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; color:var(--muted); }

    /* the "powers" connector */
    #scene-34 .powers { width:160px; display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; will-change:opacity; }
    #scene-34 .powers .pl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--muted); }
    #scene-34 .powers .pr { position:relative; width:120px; height:2px; background:repeating-linear-gradient(90deg, var(--accent-2) 0 8px, transparent 8px 16px); }
    #scene-34 .powers .pr .ar { position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:10px solid var(--accent-2); }

    /* Google Chrome — what V8 powered */
    #scene-34 .chrome { width:240px; height:240px; background:var(--panel); border:1px solid var(--border); border-radius:20px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; opacity:0; will-change:transform,opacity,box-shadow; box-shadow:0 26px 70px rgba(0,0,0,0.46); }
    #scene-34 .chrome .asset { width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    #scene-34 .chrome .asset img { width:104px; height:104px; object-fit:contain; display:block; }
    #scene-34 .chrome .nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:22px; font-weight:700; color:var(--soft); }
  </style>
</head>
<body>
  <div id="scene-34" data-composition-id="scene-34" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">He took <span class="v">V8</span>.</div>

    <div class="stage">
      <div class="v8" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="800">
        <div class="asset" data-asset data-asset-class="logo" data-asset-referent="V8 JavaScript engine logo"
             data-asset-desc="The V8 engine logo mark (the red/blue hexagonal V8 badge), sized for a 96px rounded square on a dark panel. V8 is the hero of this scene — the engine Ryan Dahl took.">
          <img src="../assets/icons/v8-engine-logo.svg" alt="V8 JavaScript engine logo" width="96" height="96">
        </div>
        <div class="nm">V8</div>
        <div class="sub">JavaScript engine</div>
      </div>

      <div class="powers" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="3060">
        <span class="pl">powers</span>
        <span class="pr"><span class="ar"></span></span>
      </div>

      <div class="chrome" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="3440">
        <div class="asset" data-asset data-asset-class="logo" data-asset-referent="Google Chrome logo"
             data-asset-desc="The Google Chrome browser logo (the multi-colour ring with the blue centre), sized for a 104px circle on a dark panel. Shows what V8 powered.">
          <img src="../assets/icons/chrome.svg" alt="Google Chrome logo" width="104" height="104">
        </div>
        <div class="nm">Google Chrome</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(238.78).
    // He 0.50 / V8 0.80 / JavaScript 2.10 / engine 2.60 / powering 3.06 / Google 3.44 / Chrome 3.78.

    // "He took V8."
    tl.fromTo("#scene-34 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // V8 — the engine, hero entrance.
    tl.fromTo("#scene-34 .v8", { opacity:0, scale:0.85, y:14 }, { opacity:1, scale:1, y:0, duration:0.55, ease:"back.out(1.7)" }, 0.80);
    tl.fromTo("#scene-34 .v8", { boxShadow:"0 26px 70px rgba(0,0,0,0.46)" }, { boxShadow:"0 26px 70px rgba(0,0,0,0.46), 0 0 36px rgba(103,232,249,0.26)", duration:0.5 }, 2.10);

    // "powering Google Chrome" — the connector draws, Chrome reveals, V8 pulses power into it.
    tl.fromTo("#scene-34 .powers", { opacity:0, x:-10 }, { opacity:1, x:0, duration:0.4, ease:"power2.out" }, 3.06);
    tl.fromTo("#scene-34 .chrome", { opacity:0, scale:0.9, x:18 }, { opacity:1, scale:1, x:0, duration:0.5, ease:"power3.out" }, 3.44);
    tl.fromTo("#scene-34 .chrome", { boxShadow:"0 26px 70px rgba(0,0,0,0.46)" }, { boxShadow:"0 26px 70px rgba(0,0,0,0.46), 0 0 30px rgba(103,232,249,0.2)", duration:0.45, yoyo:true, repeat:1 }, 3.78);

    // idle: the V8 panel breathes its glow.
    tl.to("#scene-34 .v8", { boxShadow:"0 26px 70px rgba(0,0,0,0.46), 0 0 46px rgba(103,232,249,0.34)", duration:0.9, ease:"sine.inOut", repeat:1, yoyo:true }, 4.0);
    window.__timelines["scene-34"] = tl;
  </script>
</body>
</html>
