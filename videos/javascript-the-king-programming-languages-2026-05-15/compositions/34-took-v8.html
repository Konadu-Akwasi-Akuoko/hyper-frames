<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 34 — he took V8, the engine powering Chrome</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-34 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-34 .cap {
      position: absolute; left: 50%; top: 224px; transform: translateX(-50%);
      width: 1480px; text-align: center;
      font-size: 50px; font-weight: 600; color: var(--soft); letter-spacing: -1px;
    }
    #scene-34 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-34 .cap .v8w { color: var(--accent); font-weight: 800; will-change: text-shadow; }

    #scene-34 .rig {
      position: absolute; left: 50%; top: 600px; transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: 0;
    }

    /* the V8 engine chip */
    #scene-34 .v8 {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 22px;
      padding: 40px 56px;
      opacity: 0; will-change: transform, opacity, box-shadow;
    }
    #scene-34 .v8 .big {
      font-family: "JetBrains Mono", monospace; font-size: 88px; font-weight: 800; color: var(--accent); letter-spacing: -2px;
      line-height: 1; will-change: text-shadow;
    }
    #scene-34 .v8 .sub { font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }

    /* the power flow from V8 to Chrome */
    #scene-34 .flow {
      width: 240px; height: 70px; margin: 0 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      opacity: 0; will-change: opacity;
    }
    #scene-34 .flow .lab {
      font-size: 22px; font-weight: 700; color: var(--muted); letter-spacing: 1px; white-space: nowrap;
    }
    #scene-34 .flow .bar {
      position: relative; width: 220px; height: 8px; background: var(--dim); border-radius: 4px;
    }
    #scene-34 .flow .spark {
      position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%);
      width: 40px; height: 18px; border-radius: 9px;
      background: var(--accent); box-shadow: 0 0 22px rgba(247,223,30,0.7);
    }

    /* Google Chrome */
    #scene-34 .chrome {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-34 .chrome img { width: 184px; height: 184px; will-change: filter; }
    #scene-34 .chrome .nm { font-size: 38px; font-weight: 800; color: var(--fg); letter-spacing: -0.5px; }
  </style>
</head>
<body>
  <div id="scene-34" data-composition-id="scene-34" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">He</span> <span class="w">took</span> <span class="w v8w">V8</span>
      <span class="w">&mdash; the</span> <span class="w">JavaScript</span> <span class="w">engine</span>
      <span class="w">powering</span> <span class="w">Google</span> <span class="w">Chrome.</span>
    </div>

    <div class="rig">
      <div class="v8" data-sfx-on-anchor="card-tap" data-sfx-asset="Mister Horse Free SFX/Click/Mechanical Keyboard Click 01.wav" data-sfx-at-scene-ms="1050" data-sfx-volume="0.35">
        <span class="big">V8</span>
        <span class="sub">JavaScript engine</span>
      </div>
      <div class="flow" data-sfx-on-anchor="whoosh" data-sfx-asset="Anime SFX/Camera Whoosh 01.mp3" data-sfx-at-scene-ms="3800" data-sfx-volume="0.42"><span class="lab">powers</span><span class="bar"><span class="spark"></span></span></div>
      <div class="chrome">
        <img src="assets/icons/chrome.svg" alt="Google Chrome">
        <span class="nm">Google Chrome</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(238.78).
    // "He took V8 — the JavaScript engine powering Google Chrome." (He 0.50 ... Chrome 3.78).
    const cw = [0.50, 0.66, 0.80, 1.94, 2.10, 2.60, 3.06, 3.44, 3.78];
    gsap.utils.toArray("#scene-34 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, cw[i]);
    });

    // "took V8" — the engine chip lands first (V8 0.80).
    tl.fromTo("#scene-34 .v8",
      { opacity: 0, x: -40, scale: 0.94 },
      { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.80);
    tl.fromTo("#scene-34 .v8 .big",
      { textShadow: "0 0 0 rgba(247,223,30,0)" },
      { textShadow: "0 0 30px rgba(247,223,30,0.45)", duration: 0.45, ease: "power2.out" }, 1.1);

    // Chrome arrives as the thing V8 powers (Google 3.44).
    tl.fromTo("#scene-34 .chrome",
      { opacity: 0, x: 40, scale: 0.94 },
      { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 3.10);

    // "powering" — the flow lights up and a spark charges from V8 into Chrome (powering 3.06).
    tl.fromTo("#scene-34 .flow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 3.00);
    tl.fromTo("#scene-34 .flow .spark",
      { left: "0%", opacity: 0 },
      { left: "100%", opacity: 1, duration: 0.7, ease: "power2.inOut" }, 3.10);
    // Chrome lights up as the power lands (Chrome 3.78).
    tl.fromTo("#scene-34 .chrome img",
      { filter: "drop-shadow(0 0 0 rgba(103,232,249,0))" },
      { filter: "drop-shadow(0 0 26px rgba(103,232,249,0.4))", duration: 0.4, ease: "power2.out" }, 3.78);

    // Subtle life — V8 hums.
    tl.to("#scene-34 .v8", { y: "-=5", duration: 2.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.0);

    // Seam clear — fade out across the trailing overlap with scene 35 (local 4.26-4.76).
    tl.to("#scene-34 .cap, #scene-34 .rig",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 4.26);

    window.__timelines["scene-34"] = tl;
  </script>
</body>
</html>
