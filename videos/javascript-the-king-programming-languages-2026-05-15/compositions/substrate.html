<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"gridColor","type":"color","label":"Grid dot color","default":"#232a35"},
    {"id":"gridOpacity","type":"number","label":"Grid layer opacity","default":0.6},
    {"id":"glowColor","type":"color","label":"Ambient glow color","default":"#f5efe2"},
    {"id":"glowOpacity","type":"number","label":"Ambient glow peak opacity","default":0.05},
    {"id":"glowX","type":"number","label":"Glow center X (%)","default":50},
    {"id":"glowY","type":"number","label":"Glow center Y (%)","default":36},
    {"id":"vignetteAlpha","type":"number","label":"Vignette edge darkness (0-1)","default":0.5}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Substrate</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d12;
      }

      #substrate {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d12;
      }

      /* Base canvas — warm near-black */
      .sub-base {
        position: absolute;
        inset: 0;
        background: #0b0d12;
      }

      /* Engineering dot grid. Oversized by 60px so the drift never exposes an edge.
         One tile is 48px; the timeline translates by exactly one tile for a
         seamless loop (position +48,+48 is visually identical to 0,0). */
      .sub-grid {
        position: absolute;
        inset: -60px;
        background-image: radial-gradient(
          circle,
          var(--grid-color, #232a35) 1.2px,
          transparent 1.7px
        );
        background-size: 48px 48px;
        will-change: transform;
      }

      /* Single breathing ambient glow — radial only (no linear gradient banding
         on H.264). Scales/breathes around its own center. */
      .sub-glow {
        position: absolute;
        inset: 0;
        transform-origin: var(--glow-x, 50%) var(--glow-y, 36%);
        background: radial-gradient(
          ellipse 62% 52% at var(--glow-x, 50%) var(--glow-y, 36%),
          var(--glow-rgba, rgba(245, 239, 226, 0.05)),
          transparent 70%
        );
        will-change: transform, opacity;
      }

      /* Vignette — registry component (vignette), tuned softer for editorial restraint */
      #hf-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 90;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          var(--vignette-color, rgba(0, 0, 0, 0.5)) 100%
        );
      }
    </style>
  </head>
  <body>
    <div
      id="substrate"
      data-composition-id="substrate"
      data-width="1920"
      data-height="1080"
      data-layout-allow-overflow
    >
      <div class="sub-base"></div>
      <div class="sub-grid"></div>
      <div class="sub-glow"></div>
      <div id="hf-vignette"></div>

      <script>
        // Full video length (audio_duration_secs from transcript.json). If the
        // video's runtime changes, update this and the host data-duration in index.html.
        const DURATION = 530.617;

        const DEFAULTS = {
          gridColor: "#232a35",
          gridOpacity: 0.6,
          glowColor: "#f5efe2",
          glowOpacity: 0.05,
          glowX: 50,
          glowY: 36,
          vignetteAlpha: 0.5,
        };
        const v = Object.assign(
          {},
          DEFAULTS,
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {},
        );

        function hexToRgba(hex, alpha) {
          const h = hex.replace("#", "");
          const r = parseInt(h.substring(0, 2), 16);
          const g = parseInt(h.substring(2, 4), 16);
          const b = parseInt(h.substring(4, 6), 16);
          return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
        }

        const root = document.getElementById("substrate");
        const grid = root.querySelector(".sub-grid");
        const glow = root.querySelector(".sub-glow");

        grid.style.setProperty("--grid-color", v.gridColor);
        grid.style.opacity = v.gridOpacity;

        glow.style.setProperty("--glow-x", v.glowX + "%");
        glow.style.setProperty("--glow-y", v.glowY + "%");
        glow.style.setProperty("--glow-rgba", hexToRgba(v.glowColor, v.glowOpacity));

        document
          .getElementById("hf-vignette")
          .style.setProperty("--vignette-color", "rgba(0, 0, 0, " + v.vignetteAlpha + ")");

        const tl = gsap.timeline({ paused: true });

        // Grid parallax drift — one full tile, linear, seamless loop. Finite repeats.
        const driftCycle = 26;
        const driftReps = Math.ceil(DURATION / driftCycle) - 1;
        tl.fromTo(
          grid,
          { x: 0, y: 0 },
          { x: 48, y: 48, duration: driftCycle, ease: "none", repeat: driftReps },
          0,
        );

        // Ambient glow breathe — scale + opacity, sine yoyo. Finite repeats.
        const breatheCycle = 7;
        const breatheReps = Math.ceil(DURATION / breatheCycle) - 1;
        tl.fromTo(
          glow,
          { scale: 1, opacity: 0.7 },
          {
            scale: 1.07,
            opacity: 1,
            duration: breatheCycle,
            ease: "sine.inOut",
            yoyo: true,
            repeat: breatheReps,
          },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["substrate"] = tl;
      </script>
    </div>
  </body>
</html>
