<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Substrate — persistent background</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --accent: #f7df1e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: var(--bg);
      font-family: "Inter", system-ui, sans-serif;
    }
    #substrate { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

    /* A single colorless luminance breath — warm-white, near-zero saturation,
       so it reads as a slow lift of light, never a hue. Lives beneath the grid. */
    #substrate .breath {
      position: absolute; inset: 0; pointer-events: none;
      opacity: 0.55; /* base; the timeline breathes it */
      filter: blur(40px); will-change: transform, opacity;
      background: radial-gradient(ellipse 70% 65% at 50% 44%,
        rgba(255,250,244,0.06) 0%, rgba(255,250,244,0) 65%);
    }

    /* A hair of texture — faint grid as ONE ingredient, not the gesture. */
    #substrate .grid {
      position: absolute; inset: 0; opacity: 0.5;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, transparent 85%);
    }

    /* Vignette so foreground content always wins contrast. */
    #substrate .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 75% 75% at 50% 48%, transparent 55%, rgba(0,0,0,0.55) 100%);
    }
  </style>
</head>
<body>
  <div id="substrate" data-composition-id="substrate" data-width="1920" data-height="1080">
    <div class="breath"></div>
    <div class="grid"></div>
    <div class="vignette"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Slow colorless breath across the whole runtime (finite yoyo, never repeat:-1).
    // Opacity and scale use deliberately different periods so they beat against each
    // other and never read as a mechanical pulse.
    // Opacity: 40s half-cycle * 14 = 560s ; scale: 52s * 11 = 572s — both cover the 530.617s VO.
    tl.to("#substrate .breath", { opacity: 1, duration: 40, ease: "sine.inOut", repeat: 13, yoyo: true }, 0);
    tl.to("#substrate .breath", { scale: 1.1, duration: 52, ease: "sine.inOut", repeat: 10, yoyo: true }, 0);

    window.__timelines["substrate"] = tl;
  </script>
</body>
</html>
