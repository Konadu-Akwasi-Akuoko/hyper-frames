<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 42 — the full Hacker News quote, pulled out (… in the form of Node.js)</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d; }
    @font-face {
      font-family:"Excalifont";
      src:url("../fonts/Excalifont-Regular.woff2") format("woff2");
      font-weight:400; font-display:block;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-42 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    /* the pulled quote — lifted out of the thread, weighty and large */
    #scene-42 .pull { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1520px; }
    #scene-42 .qmark { position:absolute; left:-30px; top:-118px; font-family:"Excalifont","Inter",sans-serif; font-size:200px; line-height:1; color:var(--dim); opacity:0; will-change:transform,opacity; }

    #scene-42 .quote { font-family:"Excalifont","Inter",sans-serif; font-size:54px; line-height:1.5; color:var(--soft); letter-spacing:0.2px; }
    #scene-42 .quote .ln { opacity:0; will-change:transform,opacity; }
    #scene-42 .quote .lnc { display:flex; align-items:center; gap:22px; }
    #scene-42 .quote .esc, #scene-42 .quote .inf { color:var(--soft); will-change:color,text-shadow; }
    #scene-42 .quote .node { color:var(--soft); font-weight:400; will-change:color,text-shadow; }
    #scene-42 .quote .nlogo { width:66px; height:66px; object-fit:contain; opacity:0; will-change:transform,opacity; filter:drop-shadow(0 0 0 rgba(125,216,125,0)); }

    /* the pulled-quote attribution dash */
    #scene-42 .attrib { margin-top:48px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:25px; color:var(--muted); letter-spacing:0.3px; opacity:0; will-change:transform,opacity; }
    #scene-42 .attrib .yr { color:var(--soft); font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div id="scene-42" data-composition-id="scene-42" data-width="1920" data-height="1080">
    <div class="pull">
      <div class="qmark" data-layout-allow-overflow>&ldquo;</div>
      <div class="quote">
        <div class="ln l1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">We allowed this awful language to <span class="esc">escape</span> the browser</div>
        <div class="ln l2" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3670">and <span class="inf">infiltrate</span> our servers</div>
        <div class="ln l3 lnc" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="5130">in the form of <span class="node">Node.js.</span><img class="nlogo" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="6000" src="../assets/icons/nodejs.svg" alt="Node.js"></div>
      </div>
      <div class="attrib">&mdash; Hacker News &middot; <span class="yr">2014</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(276.81).
    // We 0.50 / allowed 0.79 / escape 2.39 / browser 2.83 / and 3.67 / infiltrate 3.93 / servers 4.75 / in 5.13 / form 5.37 / Node.js 5.99.

    // the big quote mark settles in first.
    tl.fromTo("#scene-42 .qmark", { opacity:0, y:14, scale:0.9 }, { opacity:0.85, y:0, scale:1, duration:0.6, ease:"back.out(1.6)" }, 0.10);

    // clause 1 — "We allowed this awful language to escape the browser"
    tl.fromTo("#scene-42 .l1", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);
    // "escape" flicks danger-red on its word (the menace verb; 2.39).
    tl.to("#scene-42 .quote .esc", { color:"#ff6b5d", textShadow:"0 0 24px rgba(255,107,93,0.5)", duration:0.32, ease:"power2.out" }, 2.41);

    // clause 2 — "and infiltrate our servers"
    tl.fromTo("#scene-42 .l2", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 3.67);
    // "infiltrate" flicks danger-red (3.93).
    tl.to("#scene-42 .quote .inf", { color:"#ff6b5d", textShadow:"0 0 24px rgba(255,107,93,0.5)", duration:0.32, ease:"power2.out" }, 3.95);

    // clause 3 — "in the form of Node.js." — the payoff line slides in.
    tl.fromTo("#scene-42 .l3", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 5.13);
    // "Node.js" resolves green and its logo punches in — the thing he feared is the hero (5.99).
    tl.to("#scene-42 .quote .node", { color:"#7dd87d", textShadow:"0 0 26px rgba(125,216,125,0.45)", duration:0.4, ease:"power2.out" }, 6.00);
    tl.fromTo("#scene-42 .nlogo", { opacity:0, scale:0.5, rotateZ:-10 }, { opacity:1, scale:1, rotateZ:0, duration:0.46, ease:"back.out(2)" }, 6.00);
    tl.to("#scene-42 .nlogo", { filter:"drop-shadow(0 0 16px rgba(125,216,125,0.55))", duration:0.4 }, 6.10);

    // attribution dash fades up after the line lands.
    tl.fromTo("#scene-42 .attrib", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 6.40);

    // constant life — the pulled quote breathes; the Node logo bobs.
    tl.to("#scene-42 .pull", { y:"-=6", duration:5, ease:"sine.inOut", repeat:1, yoyo:true }, 1.2);
    tl.to("#scene-42 .nlogo", { y:-6, duration:0.9, ease:"sine.inOut", repeat:1, yoyo:true }, 6.6);

    // Seam clear — fade foreground out across the trailing overlap with scene 43 (local 6.97-7.45).
    tl.to("#scene-42 .pull", { opacity:0, duration:0.34, ease:"power2.inOut" }, 6.98);

    window.__timelines["scene-42"] = tl;
  </script>
</body>
</html>
