<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 17 — for 14 years the server ran Perl, PHP, Python, Ruby</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-17 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-17 .head { position:absolute; left:50%; top:21%; transform:translateX(-50%); font-size:54px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-17 .head .yr { color:var(--fg); font-weight:800; }
    #scene-17 .sub { position:absolute; left:50%; top:33%; transform:translateX(-50%); font-size:30px; font-weight:500; color:var(--muted); white-space:nowrap; opacity:0; will-change:transform,opacity; }

    #scene-17 .rail { position:absolute; left:50%; top:60%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:0; }
    #scene-17 .line { position:absolute; left:40px; right:40px; top:50%; height:2px; background:var(--border); transform:scaleX(0); transform-origin:left center; will-change:transform; }

    #scene-17 .tile { position:relative; width:158px; height:178px; background:var(--panel); border:1px solid var(--border); border-radius:16px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; opacity:0; will-change:transform,opacity;
      box-shadow:0 22px 60px rgba(0,0,0,0.42); }
    #scene-17 .tile img { width:78px; height:78px; object-fit:contain; }
    #scene-17 .tile .nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:23px; font-weight:600; color:var(--soft); }

    #scene-17 .gap { width:78px; display:flex; align-items:center; justify-content:center; }
    #scene-17 .gap .chev { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:30px; color:var(--dim); opacity:0; will-change:transform,opacity; }
  </style>
</head>
<body>
  <div id="scene-17" data-composition-id="scene-17" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">For <span class="yr">14 years</span>, it didn&rsquo;t.</div>
    <div class="sub">The server ran&hellip;</div>

    <div class="rail">
      <div class="line" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3500"></div>
      <div class="tile t1" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3960"><img src="../assets/icons/perl.svg" alt="Perl"><span class="nm">Perl</span></div>
      <div class="gap g1"><span class="chev">&rarr;</span></div>
      <div class="tile t2" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="5200"><img src="../assets/icons/php.svg" alt="PHP"><span class="nm">PHP</span></div>
      <div class="gap g2"><span class="chev">&rarr;</span></div>
      <div class="tile t3" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="6480"><img src="../assets/icons/python.svg" alt="Python"><span class="nm">Python</span></div>
      <div class="gap g3"><span class="chev">&rarr;</span></div>
      <div class="tile t4" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="7640"><img src="../assets/icons/ruby.svg" alt="Ruby"><span class="nm">Ruby</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(135.88).
    // For 0.50 / 14-years 0.66 / it-didn't 2.19 / server-ran 3.36 / Perl 3.96 / PHP 5.20 / Python 6.48 / Ruby 7.64.

    // "For 14 years, it didn't."
    tl.fromTo("#scene-17 .head", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.50);
    tl.fromTo("#scene-17 .head .yr", { textShadow:"0 0 0 rgba(232,234,237,0)" }, { textShadow:"0 0 24px rgba(232,234,237,0.32)", duration:0.4 }, 0.66);

    // "The server ran…" — the rail draws in.
    tl.fromTo("#scene-17 .sub", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 3.36);
    tl.to("#scene-17 .line", { scaleX:1, duration:0.6, ease:"power2.out" }, 3.50);

    // the four server languages march in, in sequence.
    tl.fromTo("#scene-17 .t1", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.6)" }, 3.96);
    tl.fromTo("#scene-17 .g1 .chev", { opacity:0, x:-8 }, { opacity:1, x:0, duration:0.3 }, 5.00);
    tl.fromTo("#scene-17 .t2", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.6)" }, 5.20);
    tl.fromTo("#scene-17 .g2 .chev", { opacity:0, x:-8 }, { opacity:1, x:0, duration:0.3 }, 6.28);
    tl.fromTo("#scene-17 .t3", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.6)" }, 6.48);
    tl.fromTo("#scene-17 .g3 .chev", { opacity:0, x:-8 }, { opacity:1, x:0, duration:0.3 }, 7.44);
    tl.fromTo("#scene-17 .t4", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.6)" }, 7.64);

    // idle: the tiles breathe faintly (rail keeps its centering transform untouched).
    tl.to("#scene-17 .tile", { y:"-=4", duration:2.4, ease:"sine.inOut", repeat:1, yoyo:true, stagger:0.12 }, 8.1);
    window.__timelines["scene-17"] = tl;
  </script>
</body>
</html>
