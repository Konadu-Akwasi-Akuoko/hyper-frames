<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 17 — for 14 years, it didn't</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-17 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-17 .stage {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 1400px; text-align: center;
    }

    /* stat hero */
    #scene-17 .stat { display: flex; align-items: baseline; justify-content: center; gap: 24px; }
    #scene-17 .stat .num {
      font-size: 184px; font-weight: 900; color: var(--accent); line-height: 0.9;
      letter-spacing: -6px; font-variant-numeric: tabular-nums;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
    #scene-17 .stat .unit {
      font-size: 92px; font-weight: 800; color: var(--accent-2); letter-spacing: -1px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-17 .sub {
      font-size: 42px; font-weight: 500; color: var(--soft); margin-top: 14px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-17 .sub b { color: var(--fg); font-weight: 700; }

    #scene-17 .ranlabel {
      font-family: "JetBrains Mono", monospace; font-size: 28px; color: var(--muted);
      letter-spacing: 2px; text-transform: uppercase; margin: 52px 0 30px;
      opacity: 0; will-change: transform, opacity;
    }

    #scene-17 .rack { display: flex; justify-content: center; gap: 26px; }
    #scene-17 .chip {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      padding: 26px 40px; min-width: 200px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-17 .chip img { width: 64px; height: 64px; }
    #scene-17 .chip .nm { font-size: 34px; font-weight: 700; color: var(--soft); }
  </style>
</head>
<body>
  <div id="scene-17" data-composition-id="scene-17" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="stat">
        <span class="num" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="910" data-sfx-volume="0.42">14</span><span class="unit">YEARS</span>
      </div>
      <div class="sub">it didn&rsquo;t. JavaScript stayed in the <b>browser</b>.</div>

      <div class="ranlabel">Meanwhile, the server ran&hellip;</div>
      <div class="rack">
        <div class="chip c-perl" data-sfx-on-anchor="card-tap" data-sfx-asset="Mister Horse Free SFX/Click/Mechanical Keyboard Click 01.wav" data-sfx-at-scene-ms="4170" data-sfx-volume="0.35"><img src="assets/icons/perl.svg" alt="Perl"><span class="nm">Perl</span></div>
        <div class="chip c-php"><img src="assets/icons/php.svg" alt="PHP"><span class="nm">PHP</span></div>
        <div class="chip c-python"><img src="assets/icons/python.svg" alt="Python"><span class="nm">Python</span></div>
        <div class="chip c-ruby" data-sfx-on-anchor="pop" data-sfx-asset="Mister Horse Free SFX/Pop/Echoing Pop 01.wav" data-sfx-at-scene-ms="7850"><img src="assets/icons/ruby.svg" alt="Ruby"><span class="nm">Ruby</span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(135.88).
    // "For 14 years" — the stat punches in (14 136.54 -> 0.66).
    tl.fromTo("#scene-17 .stat .num",
      { opacity: 0, scale: 1.4, y: 10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.66);
    tl.fromTo("#scene-17 .stat .unit",
      { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 1.00);

    // "it didn't. JavaScript stayed in the browser" (it 137.96 -> 2.08).
    tl.fromTo("#scene-17 .sub",
      { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 2.08);

    // "The server ran" — the roster label (The 139.10 -> 3.22).
    tl.fromTo("#scene-17 .ranlabel",
      { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.22);

    // The four server languages cascade on their names:
    // Perl 139.84(3.96), PHP 141.08(5.20), Python 142.36(6.48), Ruby 143.52(7.64).
    const chips = [3.96, 5.20, 6.48, 7.64];
    gsap.utils.toArray("#scene-17 .chip").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 24, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, chips[i]);
    });

    // Subtle life — the rack drifts a hair.
    tl.to("#scene-17 .rack", { y: "-=5", duration: 3.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 5.4);

    // Seam clear — stage fades across the trailing overlap with scene 18 (local 8.10-8.60).
    tl.to("#scene-17 .stage", { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 8.10);

    window.__timelines["scene-17"] = tl;
  </script>
</body>
</html>
