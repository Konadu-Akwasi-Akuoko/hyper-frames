<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 31 — the only programmers on Earth</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-31 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-31 .head { position:absolute; left:50%; top:18%; transform:translateX(-50%); font-size:50px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-31 .head .on { color:var(--accent-2); font-weight:800; }

    #scene-31 .globe { position:absolute; left:50%; top:60%; transform:translate(-50%,-50%); width:380px; height:380px; opacity:0; will-change:transform,opacity; }
    #scene-31 .globe svg { position:absolute; inset:0; width:380px; height:380px; }
    #scene-31 .globe .wire { fill:none; stroke:var(--dim); stroke-width:1.4; }
    #scene-31 .globe .rim { fill:rgba(103,232,249,0.02); stroke:var(--border); stroke-width:2; }
    #scene-31 .globe .ddot { fill:#3a4150; }

    #scene-31 .beacon { position:absolute; left:62%; top:40%; transform:translate(-50%,-50%); width:18px; height:18px; opacity:0; will-change:transform,opacity; }
    #scene-31 .beacon .core { position:absolute; inset:0; border-radius:50%; background:var(--accent-2); box-shadow:0 0 16px rgba(103,232,249,0.8); }
    #scene-31 .beacon .ring { position:absolute; left:50%; top:50%; width:18px; height:18px; transform:translate(-50%,-50%); border-radius:50%; border:2px solid rgba(103,232,249,0.6); will-change:transform,opacity; }

    #scene-31 .blabel { position:absolute; left:62%; top:40%; transform:translate(18px,-150%); display:flex; align-items:center; padding:6px 14px; border-radius:999px;
      background:rgba(103,232,249,0.12); border:1px solid rgba(103,232,249,0.45); opacity:0; white-space:nowrap; will-change:transform,opacity; }
    #scene-31 .blabel .bn { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:20px; font-weight:700; color:var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-31" data-composition-id="scene-31" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">The <span class="on">only</span> programmers on Earth.</div>

    <div class="globe">
      <svg viewBox="0 0 400 400" preserveAspectRatio="none">
        <circle class="rim" cx="200" cy="200" r="180"/>
        <ellipse class="wire" cx="200" cy="200" rx="180" ry="50"/>
        <ellipse class="wire" cx="200" cy="140" rx="150" ry="40"/>
        <ellipse class="wire" cx="200" cy="260" rx="150" ry="40"/>
        <ellipse class="wire" cx="200" cy="200" rx="64" ry="180"/>
        <ellipse class="wire" cx="200" cy="200" rx="140" ry="180"/>
      </svg>
      <div class="beacon" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="2080"><span class="ring"></span><span class="core"></span></div>
      <div class="blabel" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2820"><span class="bn">JS devs</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(228.18).
    // and 0.50 / developers 1.12 / only 2.08 / programmers 2.38 / Earth 3.08.

    // scatter the world's programmers as faint dots (deterministic, hand-placed).
    const dim = [[140,118],[262,108],[108,210],[300,222],[160,300],[252,300],[90,162],[312,164],[180,236],[232,205],[128,266],[284,264],[210,96],[150,180]];
    const svg = document.querySelector("#scene-31 .globe svg");
    if (svg) dim.forEach(([x,y]) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",5); c.setAttribute("class","ddot");
      svg.appendChild(c);
    });

    // "The only programmers on Earth."
    tl.fromTo("#scene-31 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the globe fades up, the world's programmers stipple in dim.
    tl.fromTo("#scene-31 .globe", { opacity:0, scale:0.9 }, { opacity:1, scale:1, duration:0.6, ease:"power3.out" }, 0.70);
    tl.fromTo("#scene-31 .ddot", { opacity:0 }, { opacity:1, duration:0.4, ease:"power1.out", stagger:0.03 }, 1.10);

    // "only" — one beacon lights, the rest stay dim.
    tl.fromTo("#scene-31 .beacon", { opacity:0, scale:0.4 }, { opacity:1, scale:1, duration:0.4, ease:"back.out(2.4)" }, 2.08);
    tl.fromTo("#scene-31 .beacon .ring", { scale:1, opacity:0.6 }, { scale:3.4, opacity:0, duration:1.0, ease:"power2.out", repeat:1 }, 2.20);

    // "on Earth" — the JS-devs label.
    tl.fromTo("#scene-31 .blabel", { opacity:0, y:6 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 2.82);

    // idle: the beacon core breathes.
    tl.to("#scene-31 .beacon .core", { boxShadow:"0 0 26px rgba(103,232,249,1)", duration:0.6, ease:"sine.inOut", repeat:1, yoyo:true }, 3.2);
    window.__timelines["scene-31"] = tl;
  </script>
</body>
</html>
