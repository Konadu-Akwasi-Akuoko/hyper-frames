<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 31 — the only programmers on Earth</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-31 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-31 .cap {
      position: absolute; left: 50%; top: 232px; transform: translateX(-50%);
      width: 1500px; text-align: center;
      font-size: 54px; font-weight: 600; color: var(--soft); letter-spacing: -1px;
    }
    #scene-31 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-31 .cap .only { color: var(--accent); font-weight: 800; will-change: text-shadow; }

    /* the field of all programmers on Earth */
    #scene-31 .field {
      position: absolute; left: 50%; top: 620px; transform: translate(-50%, -50%);
      display: grid; grid-template-columns: repeat(11, 56px); grid-auto-rows: 56px; gap: 20px;
      justify-content: center;
    }
    #scene-31 .dot {
      width: 56px; height: 56px; border-radius: 50%;
      background: #1a1f29; border: 1px solid #232a35;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-31 .dot.me {
      background: rgba(247,223,30,0.16); border: 2px solid var(--accent);
      will-change: transform, box-shadow, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-31" data-composition-id="scene-31" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">JavaScript</span> <span class="w">developers</span> <span class="w">were</span>
      <span class="w">the</span> <span class="w only">only</span> <span class="w">programmers</span>
      <span class="w">on</span> <span class="w">Earth.</span>
    </div>

    <div class="field"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Build the field: 44 programmer dots; one of them (the JS dev) is "me".
    const ME = 27;
    const field = document.querySelector("#scene-31 .field");
    for (let i = 0; i < 44; i++) {
      const d = document.createElement("div");
      d.className = "dot" + (i === ME ? " me" : "");
      field.appendChild(d);
    }

    // Scene-local = global - data_start(228.18).
    // "JavaScript developers were the only programmers on Earth." (JavaScript 0.70 ... Earth 3.08).
    const cw = [0.70, 1.12, 1.70, 1.85, 2.08, 2.38, 2.82, 3.08];
    gsap.utils.toArray("#scene-31 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, cw[i]);
    });

    // The whole population settles in — every programmer on Earth.
    const dots = gsap.utils.toArray("#scene-31 .dot:not(.me)");
    dots.forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.50 + i * 0.012);
    });
    tl.fromTo("#scene-31 .dot.me", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.90);

    // "only" — the field dims to grey and the single JS dev lights up alone (only 2.08).
    tl.to("#scene-31 .dot:not(.me)", { opacity: 0.28, duration: 0.4, ease: "power2.out" }, 2.08);
    tl.to("#scene-31 .dot.me",
      { scale: 1.4, boxShadow: "0 0 30px rgba(247,223,30,0.55)", duration: 0.4, ease: "back.out(2)" }, 2.10);
    tl.fromTo("#scene-31 .cap .only",
      { textShadow: "0 0 0 rgba(247,223,30,0)" },
      { textShadow: "0 0 26px rgba(247,223,30,0.5)", duration: 0.4, ease: "power2.out" }, 2.12);

    // "Earth" — the lone dev pulses once more, held alone (Earth 3.08).
    tl.to("#scene-31 .dot.me",
      { scale: 1.5, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.08);

    // Seam clear — fade out across the trailing overlap with scene 32 (local 3.20-3.70).
    tl.to("#scene-31 .cap, #scene-31 .field",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 3.20);

    window.__timelines["scene-31"] = tl;
  </script>
</body>
</html>
