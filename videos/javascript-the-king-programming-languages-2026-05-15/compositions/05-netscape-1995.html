<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 05 — Netscape, May 1995</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-05 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-05 .row {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center; gap: 90px;
    }

    /* Netscape logo — the referent mark, on a soft platform glow. */
    #scene-05 .logo-wrap {
      position: relative; flex: none; width: 420px; height: 420px;
      display: flex; align-items: center; justify-content: center;
    }
    #scene-05 .logo-wrap .platform {
      position: absolute; inset: -12%;
      background: radial-gradient(circle, rgba(103,232,249,0.20) 0%, rgba(103,232,249,0) 66%);
      border-radius: 50%; opacity: 0; will-change: opacity, transform;
    }
    #scene-05 .logo-wrap img {
      width: 404px; height: 404px; object-fit: contain;
      opacity: 0; will-change: transform, opacity;
      filter: drop-shadow(0 20px 50px rgba(0,0,0,0.6));
    }

    #scene-05 .text { flex: none; width: 820px; }
    #scene-05 .date {
      font-family: "JetBrains Mono", monospace; font-weight: 600;
      font-size: 38px; color: var(--accent-2); letter-spacing: 4px;
      font-variant-numeric: tabular-nums; margin-bottom: 18px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-05 .who {
      font-size: 92px; font-weight: 800; color: var(--fg); letter-spacing: -1.5px;
      line-height: 1.0; margin-bottom: 22px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-05 .need {
      font-size: 46px; font-weight: 500; color: var(--soft); line-height: 1.3;
    }
    #scene-05 .need .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-05 .need .browser { display: inline-block; color: var(--fg); font-weight: 700; will-change: text-shadow; }
  </style>
</head>
<body>
  <div id="scene-05" data-composition-id="scene-05" data-width="1920" data-height="1080">
    <div class="row">
      <div class="logo-wrap">
        <div class="platform"></div>
        <img src="assets/images/netscape-logo.png" alt="Netscape"
             data-sfx-on-anchor="pop"
             data-sfx-asset="Mister Horse Free SFX/Pop/Echoing Pop 01.wav"
             data-sfx-at-scene-ms="2800">
      </div>
      <div class="text">
        <div class="date">MAY 1995</div>
        <div class="who">Netscape</div>
        <div class="need">
          <span class="w">needed</span> <span class="w">a</span> <span class="w">scripting</span>
          <span class="w">language</span> <span class="w">for</span> <span class="w">the</span>
          <span class="w"><span class="browser">browser.</span></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(30.48). Entrance at local 0 (overlap w/ scene 04).
    // Date "MAY 1995" stamps in as "In May 1995" is said (31.12 -> local 0.64).
    tl.fromTo("#scene-05 .date",
      { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.55);

    // Netscape logo + name land on the spoken word "Netscape" (33.08 -> local 2.60).
    tl.fromTo("#scene-05 .logo-wrap .platform",
      { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 2.40);
    tl.fromTo("#scene-05 .logo-wrap img",
      { opacity: 0, x: -40, scale: 0.85, rotateZ: -6 },
      { opacity: 1, x: 0, scale: 1, rotateZ: 0, duration: 0.7, ease: "back.out(1.5)" }, 2.45);
    tl.fromTo("#scene-05 .who",
      { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.60);

    // Need-line reveals: needed 33.70(3.22) a 3.60 scripting 3.72 language 4.28 for 4.72 the 4.84 browser 4.96
    const need = [3.22, 3.60, 3.72, 4.28, 4.72, 4.84, 4.96];
    gsap.utils.toArray("#scene-05 .need .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, need[i]);
    });
    // "browser" — JS's birthplace — blooms on its word (35.44 -> local 4.96).
    tl.to("#scene-05 .need .browser",
      { textShadow: "0 0 38px rgba(232,234,237,0.85)", duration: 0.4, ease: "power2.out" }, 5.02);

    // Constant subtle life — the logo breathes, the platform pulses.
    tl.to("#scene-05 .logo-wrap img", { rotateZ: 2, duration: 3.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.2);
    tl.to("#scene-05 .logo-wrap .platform", { scale: 1.06, duration: 2.8, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.2);

    window.__timelines["scene-05"] = tl;
  </script>
</body>
</html>
