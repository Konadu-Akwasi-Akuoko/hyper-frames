<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 60 — They scrapped it and rebuilt native, iOS and Android separately</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --html5:#e34f26; --android:#3ddc84;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-60 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-60 .cap { position:absolute; left:50%; top:170px; transform:translateX(-50%); width:1500px; text-align:center; font-size:48px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-60 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-60 .cap .sc { color:var(--danger); font-weight:800; }
    #scene-60 .cap .nv { color:var(--accent-2); font-weight:800; }
    #scene-60 .cap .sp { color:var(--danger); font-weight:800; will-change:text-shadow; }

    #scene-60 .stage { position:absolute; left:50%; top:644px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:22px; }

    /* the scrapped HTML5 shield (callback to sc58) */
    #scene-60 .scrap { position:relative; width:96px; height:108px; display:flex; align-items:center; justify-content:center; }
    #scene-60 .shield { width:92px; height:104px; opacity:0; will-change:transform,opacity,filter; }
    #scene-60 .shield svg { width:100%; height:100%; }
    /* strike is a sibling so the shield's grayscale filter never desaturates it */
    #scene-60 .scrap .strike { position:absolute; top:50px; left:50%; width:120px; margin-left:-60px; height:6px; border-radius:3px; background:var(--danger); box-shadow:0 0 12px rgba(255,107,93,0.6); transform:scaleX(0); transform-origin:left center; will-change:transform; }

    #scene-60 .arrow { display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0; will-change:opacity; }
    #scene-60 .arrow .dn { font-size:30px; color:var(--dim); line-height:1; }
    #scene-60 .arrow .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; font-weight:700; color:var(--accent-2); letter-spacing:0.3px; }

    /* the two separate native builds */
    #scene-60 .natives { display:flex; align-items:stretch; gap:0; }
    #scene-60 .card { width:280px; padding:26px 30px; border-radius:16px; background:var(--panel); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:16px; opacity:0; will-change:transform,opacity; }
    #scene-60 .card img { width:76px; height:76px; }
    #scene-60 .card.ios img { filter:invert(1); }
    #scene-60 .card .name { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:26px; font-weight:800; color:var(--soft); }
    #scene-60 .card .sub { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:16px; color:var(--muted); }

    /* the separator that makes "separately" land — two builds, apart (cost thread → sc61) */
    #scene-60 .divider { width:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; flex:none; opacity:0; will-change:opacity; }
    #scene-60 .divider .line { width:3px; height:78px; border-radius:2px; background:var(--dim); }
    #scene-60 .divider .tag { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; font-weight:800; color:var(--danger); letter-spacing:0.5px; white-space:nowrap; }
    #scene-60 .divider .tag.b { font-size:14px; font-weight:700; color:var(--muted); }
  </style>
</head>
<body>
  <div id="scene-60" data-composition-id="scene-60" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">They</span> <span class="w sc">scrapped</span> <span class="w">it</span>
      <span class="w">and</span> <span class="w">rebuilt</span> <span class="w nv">native</span>
      &mdash; <span class="w">iOS</span> <span class="w">and</span> <span class="w">Android,</span>
      <span class="w sp">separately.</span>
    </div>

    <div class="stage">
      <div class="scrap" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1300">
        <div class="shield">
          <svg viewBox="0 0 32 34"><path fill="#e34f26" d="M3 1 L29 1 L26.7 27 L16 31 L5.3 27 Z"/><path fill="#f06b42" d="M16 3 L16 29 L24.8 26 L26.8 3 Z"/><text x="16" y="22" font-family="JetBrains Mono, monospace" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">5</text></svg>
        </div>
        <span class="strike"></span>
      </div>
      <div class="arrow">
        <span class="dn">&darr;</span>
        <span class="lbl">rebuilt native</span>
      </div>
      <div class="natives">
        <div class="card ios" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="4180">
          <img src="../assets/icons/apple.svg" alt="iOS">
          <span class="name">iOS</span>
          <span class="sub">native build</span>
        </div>
        <div class="divider" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="5590">
          <span class="tag">&times;2</span>
          <div class="line"></div>
          <span class="tag b">apart</span>
        </div>
        <div class="card android" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="4880">
          <img src="../assets/icons/android.svg" alt="Android">
          <span class="name">Android</span>
          <span class="sub">native build</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(345.48).
    // They 0.50 / scrapped 0.70 / it 1.14 / and 1.70 / rebuilt 1.88 / native 2.72 / iOS 4.18 / and 4.68 / Android 4.88 / separately 5.59.
    const cw = [0.50, 0.70, 1.14, 1.70, 1.88, 2.72, 4.18, 4.68, 4.88, 5.59];
    gsap.utils.toArray("#scene-60 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // the HTML5 shield carries in (They 0.50).
    tl.fromTo("#scene-60 .shield", { opacity:0, scale:0.9 }, { opacity:1, scale:1, duration:0.3, ease:"power2.out" }, 0.45);

    // "scrapped it" — the red strike slashes across (scrapped 0.70), then the shield is tossed away, greying out (it 1.14).
    tl.to("#scene-60 .scrap .strike", { scaleX:1, duration:0.4, ease:"power2.inOut" }, 0.74);
    tl.to("#scene-60 .shield", { filter:"grayscale(1) brightness(0.55)", duration:0.5, ease:"power2.out" }, 1.18);
    tl.to("#scene-60 .shield", { y:18, rotation:-14, opacity:0.34, duration:0.6, ease:"power2.in" }, 1.30);
    tl.to("#scene-60 .scrap .strike", { opacity:0.34, duration:0.5 }, 1.30);

    // "rebuilt native" — the rebuild arrow (rebuilt 1.88).
    tl.fromTo("#scene-60 .arrow", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 1.86);
    tl.fromTo("#scene-60 .cap .nv", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 22px rgba(103,232,249,0.5)", duration:0.4, ease:"power2.out" }, 2.74);

    // "iOS" — the iOS native card rises (iOS 4.18).
    tl.fromTo("#scene-60 .card.ios", { opacity:0, x:-24, y:16 }, { opacity:1, x:0, y:0, duration:0.45, ease:"back.out(1.5)" }, 4.16);
    // "Android" — the Android native card rises (Android 4.88).
    tl.fromTo("#scene-60 .card.android", { opacity:0, x:24, y:16 }, { opacity:1, x:0, y:0, duration:0.45, ease:"back.out(1.5)" }, 4.86);

    // "separately" — the divider lands between them: two builds, apart (separately 5.59).
    tl.fromTo("#scene-60 .divider", { opacity:0 }, { opacity:1, duration:0.4, ease:"power2.out" }, 5.55);
    tl.fromTo("#scene-60 .cap .sp", { textShadow:"0 0 0 rgba(255,107,93,0)" }, { textShadow:"0 0 22px rgba(255,107,93,0.5)", duration:0.4, ease:"power2.out" }, 5.61);

    // Subtle life — the two cards hold with a faint offset breath.
    tl.to("#scene-60 .card.ios", { y:"-=4", duration:1.4, ease:"sine.inOut", repeat:1, yoyo:true }, 5.6);

    // Seam clear — fade out across the trailing overlap with scene 61 (local 6.26-6.76).
    tl.to("#scene-60 .cap, #scene-60 .stage", { opacity:0, duration:0.34, ease:"power2.inOut" }, 6.26);

    window.__timelines["scene-60"] = tl;
  </script>
</body>
</html>
