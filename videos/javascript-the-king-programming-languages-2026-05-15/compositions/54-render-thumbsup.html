<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 54 — just to render a thumbs-up</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --chrome:#4a8cff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-54 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-54 .cap { position:absolute; left:50%; top:188px; transform:translateX(-50%); width:1320px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-54 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-54 .cap .tu { color:var(--accent-2); font-weight:800; will-change:text-shadow; }

    #scene-54 .rig { position:absolute; left:50%; top:610px; transform:translate(-50%,-50%); display:flex; align-items:center; gap:52px; }

    /* the heavy render pipeline — five stages of machinery */
    #scene-54 .pipe { display:flex; flex-direction:column; gap:11px; padding:24px 26px; border-radius:16px; background:var(--panel); border:1px solid var(--border); box-shadow:0 22px 60px rgba(0,0,0,0.46); opacity:0; will-change:transform,opacity; }
    #scene-54 .pipe .stg { display:flex; align-items:center; gap:14px; width:344px; opacity:0; will-change:transform,opacity; }
    #scene-54 .pipe .stg .dot { width:13px; height:13px; border-radius:50%; background:var(--dim); flex:none; will-change:background,box-shadow; }
    #scene-54 .pipe .stg .nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; color:var(--muted); will-change:color; }
    #scene-54 .pipe .stg .mb { margin-left:auto; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:15px; color:var(--dim); }

    /* the renders-to arrow */
    #scene-54 .arrow { display:flex; flex-direction:column; align-items:center; gap:7px; opacity:0; will-change:opacity; }
    #scene-54 .arrow .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:16px; font-weight:700; letter-spacing:1px; color:var(--muted); }
    #scene-54 .arrow .ar { font-size:44px; font-weight:300; color:var(--chrome); line-height:1; }

    /* the entire output: one thumbs-up */
    #scene-54 .out { display:flex; flex-direction:column; align-items:center; gap:14px; }
    #scene-54 .out .thumb { font-size:150px; line-height:1; opacity:0; will-change:transform,opacity; }
    #scene-54 .out .olbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; font-weight:700; color:var(--soft); opacity:0; white-space:nowrap; will-change:opacity; }
    #scene-54 .out .olbl b { color:var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-54" data-composition-id="scene-54" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">just</span> <span class="w">to</span> <span class="w">render</span>
      <span class="w">a</span> <span class="w tu">thumbs-up.</span>
    </div>

    <div class="rig">
      <div class="pipe" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="900">
        <div class="stg"><span class="dot"></span><span class="nm">Chromium runtime</span><span class="mb">~140 MB</span></div>
        <div class="stg"><span class="dot"></span><span class="nm">Blink layout</span><span class="mb">~22 MB</span></div>
        <div class="stg"><span class="dot"></span><span class="nm">V8 JavaScript</span><span class="mb">~18 MB</span></div>
        <div class="stg"><span class="dot"></span><span class="nm">GPU compositor</span><span class="mb">~12 MB</span></div>
        <div class="stg"><span class="dot"></span><span class="nm">Skia rasterizer</span><span class="mb">~9 MB</span></div>
      </div>

      <div class="arrow">
        <span class="lbl">renders</span>
        <span class="ar">&rarr;</span>
      </div>

      <div class="out">
        <span class="thumb" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="1260">&#128077;</span>
        <span class="olbl">output: <b>one</b> thumbs-up</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(327.56).
    // just 0.50 / to 0.68 / render 0.76 / a 1.07 / thumbs 1.26 / up 1.62.

    // "just to render a thumbs-up."
    const cw = [0.50, 0.68, 0.76, 1.07, 1.26];
    gsap.utils.toArray("#scene-54 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // the pipeline card carries in.
    tl.fromTo("#scene-54 .pipe", { opacity:0, x:-26, scale:0.96 }, { opacity:1, x:0, scale:1, duration:0.42, ease:"power3.out" }, 0.40);

    // "render" — the five heavy stages tick alight in rapid sequence (render 0.76).
    gsap.utils.toArray("#scene-54 .pipe .stg").forEach((el, i) => {
      const t = 0.78 + i * 0.07;
      tl.fromTo(el, { opacity:0, x:-10 }, { opacity:1, x:0, duration:0.22, ease:"power2.out" }, t);
      tl.to(el.querySelector(".dot"), { background:"#7dd87d", boxShadow:"0 0 12px rgba(125,216,125,0.7)", duration:0.22 }, t + 0.04);
      tl.to(el.querySelector(".nm"), { color:"#c2c9d4", duration:0.22 }, t + 0.04);
    });
    tl.fromTo("#scene-54 .arrow", { opacity:0 }, { opacity:1, duration:0.3 }, 1.14);

    // "a thumbs-up" — the entire output: one tiny emoji, dwarfed by all that machinery (thumbs 1.26).
    tl.fromTo("#scene-54 .out .thumb", { opacity:0, scale:0.3 }, { opacity:1, scale:1, duration:0.46, ease:"back.out(2)" }, 1.26);
    tl.fromTo("#scene-54 .out .olbl", { opacity:0 }, { opacity:1, duration:0.3 }, 1.62);
    tl.fromTo("#scene-54 .cap .tu", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 24px rgba(103,232,249,0.55)", duration:0.4, ease:"power2.out" }, 1.30);

    // the thumb gives one little comedic bob.
    tl.to("#scene-54 .out .thumb", { y:"-=9", duration:0.5, ease:"sine.inOut", repeat:1, yoyo:true }, 1.85);

    // Seam clear — fade out across the trailing overlap with scene 55 (local 2.20-2.58).
    tl.to("#scene-54 .cap, #scene-54 .rig", { opacity:0, duration:0.32, ease:"power2.inOut" }, 2.20);

    window.__timelines["scene-54"] = tl;
  </script>
</body>
</html>
