<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 10 — more aliases than your bashrc</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-10 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-10 .term { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1080px;
      background:#0c0f15; border:1px solid var(--border); border-radius:14px; overflow:hidden; opacity:0;
      will-change:transform,opacity; box-shadow:0 40px 110px rgba(0,0,0,0.6); }
    #scene-10 .bar { height:56px; display:flex; align-items:center; gap:14px; padding:0 22px; background:#11141b; border-bottom:1px solid var(--border); }
    #scene-10 .bar .dot { width:13px; height:13px; border-radius:50%; background:var(--dim); }
    #scene-10 .bar .title { margin-left:14px; font-family:"JetBrains Mono",monospace; font-size:21px; color:var(--muted); }
    #scene-10 .body { padding:40px 46px 46px; font-family:"JetBrains Mono",monospace; font-size:32px; line-height:1.85; }
    #scene-10 .line { opacity:0; will-change:transform,opacity; white-space:nowrap; }
    #scene-10 .prompt .sig { color:var(--accent-2); }
    #scene-10 .prompt .cmd { color:var(--soft); }
    #scene-10 .alias .kw { color:var(--muted); }
    #scene-10 .alias .an { color:var(--accent-2); }
    #scene-10 .alias .eq { color:var(--dim); }
    #scene-10 .alias .val { color:var(--soft); }
    #scene-10 .comment { color:var(--muted); margin-top:14px; }
    #scene-10 .comment .mk { color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <div id="scene-10" data-composition-id="scene-10" data-width="1920" data-height="1080">
    <div class="term" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="600">
      <div class="bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">bash — ~/.bashrc</span>
      </div>
      <div class="body">
        <div class="line prompt"><span class="sig">$</span> <span class="cmd">cat ~/.bashrc</span></div>
        <div class="line alias"><span class="kw">alias</span> <span class="an" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2780">mocha</span><span class="eq">=</span><span class="val">'javascript'</span></div>
        <div class="line alias"><span class="kw">alias</span> <span class="an" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3460">livescript</span><span class="eq">=</span><span class="val">'javascript'</span></div>
        <div class="line alias"><span class="kw">alias</span> <span class="an" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4080">jscript</span><span class="eq">=</span><span class="val">'javascript'</span></div>
        <div class="line alias"><span class="kw">alias</span> <span class="an" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4660">ecmascript</span><span class="eq">=</span><span class="val">'javascript'</span></div>
        <div class="line comment"># the name itself? <span class="mk" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="7260">a marketing move</span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(82.22).
    // point 0.50 / aliases 2.78 / bashrc 4.08 / file 4.82 / name 6.10 / marketing-move 7.26.

    // terminal appears + the cat command.
    tl.fromTo("#scene-10 .term", { opacity:0, y:34, scale:0.98 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"power3.out" }, 0.50);
    tl.fromTo("#scene-10 .prompt", { opacity:0 }, { opacity:1, duration:0.35 }, 0.95);

    // the aliases pile up — one name after another, all pointing at javascript.
    const aliases = gsap.utils.toArray("#scene-10 .alias");
    const at = [2.78, 3.46, 4.08, 4.66];
    aliases.forEach((el,i)=>{
      tl.fromTo(el, { opacity:0, x:-16 }, { opacity:1, x:0, duration:0.34, ease:"power2.out" }, at[i]);
    });

    // "but the name was a marketing move" — the comment lands, the punchline highlights.
    tl.fromTo("#scene-10 .comment", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 6.10);
    tl.fromTo("#scene-10 .comment .mk", { textShadow:"0 0 0 rgba(247,223,30,0)" }, { textShadow:"0 0 26px rgba(247,223,30,0.5)", duration:0.45, ease:"power2.out" }, 7.26);

    // idle: a blinking-cursor-ish breath on the terminal.
    tl.to("#scene-10 .term", { boxShadow:"0 40px 110px rgba(0,0,0,0.6), 0 0 36px rgba(103,232,249,0.06)", duration:1.6, ease:"sine.inOut", repeat:2, yoyo:true }, 5.0);
    window.__timelines["scene-10"] = tl;
  </script>
</body>
</html>
