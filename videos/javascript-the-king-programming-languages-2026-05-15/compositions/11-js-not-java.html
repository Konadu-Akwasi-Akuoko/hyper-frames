<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 11 — nothing to do with Java</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; }
    @font-face { font-family:"Excalifont"; src:url("../fonts/Excalifont-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-11 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-11 .split { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:120px; }
    #scene-11 .side { width:360px; display:flex; flex-direction:column; align-items:center; gap:34px; opacity:0; will-change:transform,opacity; }
    #scene-11 .side .logo { width:230px; height:230px; display:flex; align-items:center; justify-content:center; }
    #scene-11 .side .logo img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 16px 40px rgba(0,0,0,0.5)); }
    #scene-11 .side .nm { font-size:40px; font-weight:700; color:var(--soft); }
    /* the verbatim "awful language" scare-quote — human voice, Excalifont */
    #scene-11 .scare { font-family:"Excalifont","Inter",sans-serif; font-size:34px; color:var(--danger); opacity:0; will-change:transform,opacity; }

    #scene-11 .neq { font-size:150px; font-weight:300; color:var(--muted); opacity:0; will-change:transform,opacity; line-height:1; }
  </style>
</head>
<body>
  <div id="scene-11" data-composition-id="scene-11" data-width="1920" data-height="1080">
    <div class="split">
      <div class="side js" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="600">
        <div class="logo"><img src="../assets/icons/javascript.svg" alt="JavaScript"></div>
        <div class="nm">JavaScript</div>
        <div class="scare" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="1580">&ldquo;awful language&rdquo;</div>
      </div>
      <div class="neq" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3420">&ne;</div>
      <div class="side java" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="5020">
        <div class="logo"><img src="../assets/icons/java.svg" alt="Java"></div>
        <div class="nm">Java</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(90.56).
    // This 0.50 / awful-language 1.58 / nothing 3.42 / to-do-with 4.11 / Java 5.02.

    // JS appears (this "awful language").
    tl.fromTo("#scene-11 .side.js", { opacity:0, x:-40, scale:0.9 }, { opacity:1, x:0, scale:1, duration:0.55, ease:"back.out(1.4)" }, 0.50);
    // the verbatim scare-quote scribbles in (callback to the HN line).
    tl.fromTo("#scene-11 .scare", { opacity:0, scale:0.7, rotate:-6 }, { opacity:1, scale:1, rotate:-3, duration:0.45, ease:"back.out(2)" }, 1.58);

    // the "≠" snaps in (nothing to do with).
    tl.fromTo("#scene-11 .neq", { opacity:0, scale:1.8 }, { opacity:1, scale:1, duration:0.45, ease:"back.out(1.8)" }, 3.42);
    tl.to("#scene-11 .neq", { color:"#ff6b5d", textShadow:"0 0 30px rgba(255,107,93,0.4)", duration:0.4 }, 5.02);

    // Java appears on the other side (… with Java).
    tl.fromTo("#scene-11 .side.java", { opacity:0, x:40, scale:0.9 }, { opacity:1, x:0, scale:1, duration:0.55, ease:"back.out(1.4)" }, 5.02);

    // idle: the two logos breathe slightly out of phase.
    tl.to("#scene-11 .side.js .logo", { y:"-=6", duration:2.6, ease:"sine.inOut", repeat:2, yoyo:true }, 1.4);
    tl.to("#scene-11 .side.java .logo", { y:"-=6", duration:2.6, ease:"sine.inOut", repeat:2, yoyo:true }, 5.6);
    window.__timelines["scene-11"] = tl;
  </script>
</body>
</html>
