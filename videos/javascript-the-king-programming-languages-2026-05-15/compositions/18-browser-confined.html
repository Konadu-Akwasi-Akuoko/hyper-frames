<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 18 — JS lived in the browser, thought it would die there</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; }
    @font-face { font-family:"Excalifont"; src:url("../fonts/Excalifont-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-18 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-18 .head { position:absolute; left:50%; top:18%; transform:translateX(-50%); font-size:52px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-18 .head .br { color:var(--fg); font-weight:800; }

    #scene-18 .world { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:460px; height:380px; background:var(--panel);
      border:1px solid var(--border); border-radius:16px; overflow:hidden; opacity:0; will-change:transform,opacity,filter; box-shadow:0 28px 74px rgba(0,0,0,0.46); }
    #scene-18 .world .titlebar { height:46px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
    #scene-18 .world .titlebar .t { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; color:var(--muted); letter-spacing:0.5px; }
    #scene-18 .world .room { height:calc(380px - 46px); display:flex; align-items:center; justify-content:center; }
    #scene-18 .world .room img { width:152px; height:152px; object-fit:contain; filter:drop-shadow(0 14px 34px rgba(247,223,30,0.2)); }

    #scene-18 .sub { position:absolute; left:50%; top:84%; transform:translateX(-50%); font-size:34px; font-weight:500; color:var(--muted); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-18 .sub .die { color:var(--danger); font-weight:700; }
  </style>
</head>
<body>
  <div id="scene-18" data-composition-id="scene-18" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">JavaScript lived inside the <span class="br">browser</span>.</div>

    <div class="world" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="5480">
      <div class="titlebar" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1880"><span class="t">the browser</span></div>
      <div class="room"><img src="../assets/icons/javascript.svg" alt="JavaScript"></div>
    </div>

    <div class="sub">most people thought it would <span class="die">die</span> there.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(143.98).
    // JavaScript 0.50 / lived 1.88 / browser 3.06 / most-thought 4.34 / die-there 5.48.

    // "JavaScript lived inside the browser."
    tl.fromTo("#scene-18 .head", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.50);

    // the browser — its whole world.
    tl.fromTo("#scene-18 .world", { opacity:0, y:26, scale:0.94 }, { opacity:1, y:0, scale:1, duration:0.6, ease:"power3.out" }, 1.88);
    tl.fromTo("#scene-18 .head .br", { textShadow:"0 0 0 rgba(232,234,237,0)" }, { textShadow:"0 0 22px rgba(232,234,237,0.3)", duration:0.4 }, 3.06);

    // "most people thought…"
    tl.fromTo("#scene-18 .sub", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 4.34);

    // "…it would die there." — the world greys out and dims.
    tl.fromTo("#scene-18 .world",
      { filter:"grayscale(0) brightness(1)" },
      { filter:"grayscale(1) brightness(0.6)", opacity:0.5, scale:0.985, duration:0.7, ease:"power2.inOut" }, 5.48);

    // idle (before death): the trapped logo breathes.
    tl.to("#scene-18 .world .room img", { scale:1.04, duration:1.6, ease:"sine.inOut", repeat:1, yoyo:true }, 2.6);
    window.__timelines["scene-18"] = tl;
  </script>
</body>
</html>
