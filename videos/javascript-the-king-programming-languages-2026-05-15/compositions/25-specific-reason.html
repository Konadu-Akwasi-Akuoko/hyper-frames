<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 25 — but he chose it for a very specific reason</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-25 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-25 .line { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:66px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-25 .line .pre, #scene-25 .line .post { will-change:color; }
    #scene-25 .line .key { position:relative; display:inline-block; color:var(--soft); font-weight:800; will-change:transform,color; }
    #scene-25 .line .key .ul { position:absolute; left:0; right:0; bottom:-12px; height:5px; border-radius:3px; background:var(--accent-2); transform:scaleX(0); transform-origin:left center; will-change:transform; }
  </style>
</head>
<body>
  <div id="scene-25" data-composition-id="scene-25" data-width="1920" data-height="1080">
    <div class="line" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500"><span class="pre">But he chose it for a </span><span class="key" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="2320">very specific reason<span class="ul"></span></span><span class="post">.</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(193.58).
    // But-he-chose 1.32 / specific 2.32 / reason 2.72.

    // the line lands.
    tl.fromTo("#scene-25 .line", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.6, ease:"power3.out" }, 0.50);

    // "a very specific reason" — focus pull: the rest recedes, the key words sharpen.
    tl.to("#scene-25 .line .pre", { color:"#5a626e", duration:0.45 }, 2.32);
    tl.to("#scene-25 .line .post", { color:"#5a626e", duration:0.45 }, 2.32);
    tl.fromTo("#scene-25 .line .key", { color:"#c2c9d4", textShadow:"0 0 0 rgba(103,232,249,0)" }, { color:"#67e8f9", textShadow:"0 0 26px rgba(103,232,249,0.45)", duration:0.45, ease:"power2.out" }, 2.32);
    tl.to("#scene-25 .line .key .ul", { scaleX:1, duration:0.5, ease:"power2.out" }, 2.40);
    window.__timelines["scene-25"] = tl;
  </script>
</body>
</html>
