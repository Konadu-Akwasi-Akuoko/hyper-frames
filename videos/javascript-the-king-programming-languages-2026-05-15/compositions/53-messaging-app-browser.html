<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 53 — your messaging app now ships an entire browser</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --chrome:#4a8cff; --electron:#9feaf9;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-53 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-53 .cap { position:absolute; left:50%; top:170px; transform:translateX(-50%); width:1480px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-53 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-53 .cap .ch { color:var(--electron); font-weight:800; }
    #scene-53 .cap .br { color:var(--chrome); font-weight:800; will-change:text-shadow; }

    /* the sarcastic credit — thanks to Cheng's Electron */
    #scene-53 .credit { position:absolute; left:50%; top:336px; transform:translateX(-50%); display:flex; align-items:center; gap:11px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; font-weight:600; color:var(--muted); opacity:0; will-change:transform,opacity; }
    #scene-53 .credit img { width:26px; height:26px; object-fit:contain; }

    /* the enormous browser the chat app secretly carries — balloons up from behind */
    #scene-53 .engine { position:absolute; left:432px; top:402px; width:1056px; height:336px; border-radius:18px; overflow:hidden; background:#0d1018; border:1px solid rgba(74,140,255,0.5); box-shadow:0 30px 90px rgba(0,0,0,0.55); opacity:0; transform-origin:50% 100%; will-change:transform,opacity; z-index:1; }
    #scene-53 .engine .tabs { display:flex; align-items:flex-end; gap:8px; padding:12px 16px 0; background:#0a0c12; }
    #scene-53 .engine .tab { padding:9px 22px; border-radius:8px 8px 0 0; background:#141925; border:1px solid rgba(74,140,255,0.3); border-bottom:none; font-size:17px; color:var(--chrome); font-family:"JetBrains Mono",ui-monospace,monospace; font-weight:600; }
    #scene-53 .engine .addr { display:flex; align-items:center; gap:12px; padding:14px 20px; background:#141925; border-bottom:1px solid var(--border); }
    #scene-53 .engine .addr .dots { display:flex; gap:7px; }
    #scene-53 .engine .addr .dots b { width:10px; height:10px; border-radius:50%; background:var(--dim); }
    #scene-53 .engine .addr .url { flex:1; height:30px; border-radius:15px; background:#0a0c12; border:1px solid var(--border); display:flex; align-items:center; padding:0 16px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:15px; color:var(--muted); }
    #scene-53 .engine .view { height:150px; display:flex; align-items:center; justify-content:center; gap:16px; }
    #scene-53 .engine .view .vtag { padding:10px 24px; border-radius:999px; background:rgba(74,140,255,0.14); border:1px solid rgba(74,140,255,0.5); font-family:"JetBrains Mono",ui-monospace,monospace; font-size:21px; font-weight:700; color:var(--chrome); }
    #scene-53 .engine .view .vsz { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:17px; color:var(--muted); }

    /* the tiny messaging app sitting in front of its monstrous payload */
    #scene-53 .app { position:absolute; left:824px; top:632px; width:272px; border-radius:16px; overflow:hidden; background:var(--panel); border:1px solid var(--border); box-shadow:0 22px 56px rgba(0,0,0,0.6); opacity:0; will-change:transform,opacity; z-index:3; }
    #scene-53 .app .top { display:flex; align-items:center; gap:10px; padding:12px 15px; background:#0f1219; border-bottom:1px solid var(--border); }
    #scene-53 .app .top img { width:24px; height:24px; object-fit:contain; }
    #scene-53 .app .top span { font-size:17px; font-weight:700; color:var(--soft); }
    #scene-53 .app .msgs { padding:16px 15px; display:flex; flex-direction:column; gap:11px; }
    #scene-53 .app .b { max-width:78%; padding:10px 14px; border-radius:14px; font-size:16px; color:var(--soft); }
    #scene-53 .app .b.them { background:#1b2130; align-self:flex-start; }
    #scene-53 .app .b.me { background:rgba(74,140,255,0.25); align-self:flex-end; color:#dce8ff; }
    #scene-53 .applbl { position:absolute; left:824px; top:828px; width:272px; text-align:center; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; font-weight:700; color:var(--muted); opacity:0; will-change:opacity; z-index:3; }
  </style>
</head>
<body>
  <div id="scene-53" data-composition-id="scene-53" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">Thanks</span> <span class="w">to</span> <span class="w ch">Cheng,</span>
      <span class="w">your</span> <span class="w">messaging</span> <span class="w">app</span>
      <span class="w">now</span> <span class="w">ships</span> <span class="w">an</span>
      <span class="w">entire</span> <span class="w br">browser</span>
    </div>

    <div class="credit"><img src="../assets/icons/electron.svg" alt="Electron"> built on Cheng&rsquo;s Electron</div>

    <div class="engine">
      <div class="tabs"><div class="tab">Chromium</div></div>
      <div class="addr">
        <div class="dots"><b></b><b></b><b></b></div>
        <div class="url">chrome://gpu &middot; blink &middot; v8 &middot; renderer &middot; compositor</div>
      </div>
      <div class="view">
        <div class="vtag">an entire browser engine</div>
        <div class="vsz">~200&nbsp;MB, every install</div>
      </div>
    </div>

    <div class="app" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1960">
      <div class="top"><img src="../assets/icons/slack.svg" alt="Slack"><span>your messaging app</span></div>
      <div class="msgs">
        <div class="b them">nice work 🎉</div>
        <div class="b me">👍</div>
      </div>
    </div>
    <div class="applbl">just a chat window</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(323.38).
    // Thanks 0.50 / to 0.78 / Cheng 0.92 / your 1.86 / messaging 1.96 / app 2.32 / now 2.48 / ships 2.70 / an 2.96 / entire 3.14 / browser 3.72.

    // "Thanks to Cheng, your messaging app now ships an entire browser"
    const cw = [0.50, 0.78, 0.92, 1.86, 1.96, 2.32, 2.48, 2.70, 2.96, 3.14, 3.72];
    gsap.utils.toArray("#scene-53 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // "Thanks to Cheng" — the sarcastic Electron credit fades in (Cheng 0.92).
    tl.fromTo("#scene-53 .credit", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 0.95);

    // "your messaging app" — the tiny familiar chat app pops in (messaging 1.96).
    tl.fromTo("#scene-53 .app", { opacity:0, y:18, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(1.5)" }, 1.96);
    tl.fromTo("#scene-53 .applbl", { opacity:0 }, { opacity:1, duration:0.3 }, 2.34);

    // "ships an entire browser" — the monstrous browser balloons up from behind the chat app, dwarfing it (ships 2.70 → browser 3.72).
    tl.fromTo("#scene-53 .engine",
      { opacity:0, scale:0.16 },
      { opacity:1, scale:1, duration:0.92, ease:"power3.out" }, 2.70);
    tl.to("#scene-53 .engine", { boxShadow:"0 30px 90px rgba(0,0,0,0.55), 0 0 60px rgba(74,140,255,0.32)", duration:0.5, ease:"power2.out" }, 3.58);
    tl.fromTo("#scene-53 .cap .br", { textShadow:"0 0 0 rgba(74,140,255,0)" }, { textShadow:"0 0 26px rgba(74,140,255,0.55)", duration:0.4, ease:"power2.out" }, 3.72);

    // Subtle life — the oversized engine looms; the little app holds its ground.
    tl.to("#scene-53 .engine", { y:"-=5", duration:1.5, ease:"sine.inOut" }, 3.9);
    tl.to("#scene-53 .app", { y:"-=3", duration:1.6, ease:"sine.inOut", repeat:1, yoyo:true }, 2.6);

    // Seam clear — fade out across the trailing overlap with scene 54 (local 4.34-4.68).
    tl.to("#scene-53 .cap, #scene-53 .credit, #scene-53 .engine, #scene-53 .app, #scene-53 .applbl", { opacity:0, duration:0.32, ease:"power2.inOut" }, 4.34);

    window.__timelines["scene-53"] = tl;
  </script>
</body>
</html>
