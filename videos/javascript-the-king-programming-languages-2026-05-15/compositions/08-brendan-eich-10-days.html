<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 08 — Brendan Eich, 10 days</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-08 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    /* Brendan Eich — the "who", a full-height side cutout (asset box until filled). */
    #scene-08 .asset-box {
      position: absolute; left: 150px; top: 160px; width: 540px; height: 760px;
      border-radius: 18px; overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-08 .asset-box img {
      width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%;
      filter: grayscale(0.35) contrast(1.05);
    }
    /* Subject-toned wash so the portrait sits in the palette, not on top of it. */
    #scene-08 .asset-box::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(247,223,30,0.10), rgba(11,13,18,0.55));
      mix-blend-mode: multiply; pointer-events: none;
    }

    #scene-08 .info {
      position: absolute; left: 770px; top: 50%; transform: translateY(-50%); width: 980px;
    }
    #scene-08 .name {
      font-size: 78px; font-weight: 800; color: var(--fg); letter-spacing: -1.5px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-08 .meta {
      font-family: "JetBrains Mono", monospace; font-size: 28px; color: var(--muted);
      letter-spacing: 1px; margin-top: 8px; opacity: 0; will-change: transform, opacity;
    }
    #scene-08 .rule { height: 3px; width: 0; background: var(--border); margin: 36px 0 30px; }
    #scene-08 .deadline-label {
      font-size: 34px; font-weight: 500; color: var(--soft); margin-bottom: 6px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-08 .stat {
      display: flex; align-items: baseline; gap: 28px;
    }
    #scene-08 .stat .num {
      font-size: 220px; font-weight: 900; color: var(--fg); line-height: 0.9;
      letter-spacing: -6px; font-variant-numeric: tabular-nums;
      opacity: 0; will-change: transform, opacity, text-shadow;
    }
    #scene-08 .stat .unit {
      font-size: 96px; font-weight: 800; color: var(--accent-2); letter-spacing: -1px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-08 .ship {
      font-size: 38px; font-weight: 500; color: var(--soft); margin-top: 24px;
    }
    #scene-08 .ship .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-08 .ship .proto { color: var(--fg); font-weight: 700; }
  </style>
</head>
<body>
  <div id="scene-08" data-composition-id="scene-08" data-width="1920" data-height="1080">
    <div class="asset-box"
         data-asset="brendan-eich" data-asset-class="photo" data-asset-kind="image"
         data-asset-referent="Brendan Eich"
         data-asset-desc="Brendan Eich, creator of JavaScript, portrait facing right toward the text"
         data-asset-treatment="cutout,duotone" data-asset-placement="left-full-height">
      <img src="assets/images/brendan-eich.png" alt="Brendan Eich, creator of JavaScript">
    </div>

    <div class="info">
      <div class="name">Brendan Eich</div>
      <div class="meta">33 · ENGINEER · NETSCAPE</div>
      <div class="rule"></div>
      <div class="deadline-label">His deadline to build it:</div>
      <div class="stat">
        <span class="num" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="8080" data-sfx-volume="0.42">10</span><span class="unit">DAYS</span>
      </div>
      <div class="ship">
        <span class="w">He</span> <span class="w">shipped</span> <span class="w">a</span>
        <span class="w">working</span> <span class="w"><span class="proto">prototype</span></span>
        <span class="w">in</span> <span class="w">ten.</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(57.92). Entrance at local 0.
    tl.fromTo("#scene-08 .asset-box",
      { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0);

    // "Brendan Eich" name on its word (Brendan 62.06 -> 4.14).
    tl.fromTo("#scene-08 .name",
      { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.14);
    tl.fromTo("#scene-08 .meta",
      { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.55);

    // Rule + deadline label as "gave him a deadline" lands (deadline 64.80 -> 6.88).
    tl.to("#scene-08 .rule", { width: 360, duration: 0.5, ease: "power3.out" }, 6.40);
    tl.fromTo("#scene-08 .deadline-label",
      { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.60);

    // "10 DAYS" punches in on the spoken "10 days" (10 65.88 -> 7.96).
    tl.fromTo("#scene-08 .stat .num",
      { opacity: 0, scale: 1.5, y: 10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(2.2)" }, 7.80);
    tl.fromTo("#scene-08 .stat .unit",
      { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 8.10);

    // Ship line: He 67.22(9.30) shipped 67.62(9.70) a 9.92 working 68.06(10.14) prototype 68.44(10.52) in 69.10(11.18) ten 69.28(11.36)
    const ship = [9.30, 9.70, 9.92, 10.14, 10.52, 11.18, 11.36];
    gsap.utils.toArray("#scene-08 .ship .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, ship[i]);
    });
    // The stat re-pulses on the second "ten" (11.36) — the deadline was actually met.
    tl.to("#scene-08 .stat .num",
      { textShadow: "0 0 50px rgba(232,234,237,0.7)", duration: 0.4, ease: "power2.out" }, 11.40);
    tl.to("#scene-08 .stat .num",
      { textShadow: "0 0 0 rgba(232,234,237,0)", duration: 0.8, ease: "power2.in" }, 11.90);

    // Subtle life — the portrait + stat drift a hair.
    tl.to("#scene-08 .asset-box", { y: "-=6", duration: 4.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.4);
    tl.to("#scene-08 .stat", { y: "-=4", duration: 3.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 8.8);

    window.__timelines["scene-08"] = tl;
  </script>
</body>
</html>
