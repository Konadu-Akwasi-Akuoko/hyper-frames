<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 87 — 66%, the single most-used language on the planet.</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-87 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-87 .cap {
      position: absolute; left: 50%; top: 150px; transform: translateX(-50%);
      width: 1480px; text-align: center; line-height: 1.25;
      font-size: 46px; font-weight: 600; color: var(--soft); letter-spacing: -0.8px;
    }
    #scene-87 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-87 .cap .pct { color: var(--accent); font-weight: 800; }
    #scene-87 .cap .mu { color: var(--accent); font-weight: 800; }
    #scene-87 .cap .pl { color: var(--accent-2); font-weight: 800; }

    #scene-87 .gauge {
      position: absolute; left: 50%; top: 580px; transform: translate(-50%, -50%);
      width: 360px; height: 360px;
    }
    #scene-87 .gauge svg { position: absolute; inset: 0; width: 360px; height: 360px; }
    #scene-87 .gauge .track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 22; }
    #scene-87 .gauge .val { fill: none; stroke: var(--accent); stroke-width: 22; stroke-linecap: round; will-change: stroke-dashoffset; }
    #scene-87 .gauge .ctr {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    #scene-87 .gauge .ctr .pn { font-family: "JetBrains Mono", monospace; font-size: 108px; font-weight: 900; color: var(--accent); line-height: 0.9; letter-spacing: -3px; opacity: 0; will-change: transform, opacity; }

    #scene-87 .glabel {
      position: absolute; left: 50%; top: 800px; transform: translateX(-50%);
      font-family: "JetBrains Mono", monospace; font-size: 28px; font-weight: 800; color: var(--fg);
      letter-spacing: -0.3px; opacity: 0; will-change: transform, opacity; white-space: nowrap;
    }
    #scene-87 .globe {
      position: absolute; left: 50%; top: 868px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px;
      font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; color: var(--accent-2);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-87 .globe svg { width: 40px; height: 40px; }
    #scene-87 .globe svg .gl { fill: none; stroke: var(--accent-2); stroke-width: 2; }
  </style>
</head>
<body>
  <div id="scene-87" data-composition-id="scene-87" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w pct">66%</span><span class="w pct">,</span>
      <span class="w">the</span> <span class="w mu">single</span> <span class="w mu">most-used</span> <span class="w mu">language</span>
      <span class="w">on</span> <span class="w">the</span> <span class="w pl">planet.</span>
    </div>

    <div class="gauge" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="550">
      <svg viewBox="0 0 360 360">
        <circle class="track" cx="180" cy="180" r="140"></circle>
        <circle class="val" cx="180" cy="180" r="140" transform="rotate(-90 180 180)"></circle>
      </svg>
      <div class="ctr"><span class="pn" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1500">0%</span></div>
    </div>

    <div class="glabel">the single most-used language</div>
    <div class="globe" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="3900">
      <svg viewBox="0 0 40 40">
        <circle class="gl" cx="20" cy="20" r="17"></circle>
        <ellipse class="gl" cx="20" cy="20" rx="7" ry="17"></ellipse>
        <line class="gl" x1="3" y1="20" x2="37" y2="20"></line>
        <line class="gl" x1="6" y1="11" x2="34" y2="11"></line>
        <line class="gl" x1="6" y1="29" x2="34" y2="29"></line>
      </svg>
      <span>on the planet</span>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(500.25).
    // "66%, the single most-used language on the planet."
    // (66% 0.50, single 2.36, most-used 2.78, language 3.42, planet 4.04).
    const cw = [0.50, 0.66, 2.18, 2.36, 2.78, 3.42, 3.76, 3.88, 4.04];
    gsap.utils.toArray("#scene-87 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" }, cw[i]);
    });

    // "66%" — the radial gauge sweeps to 66% while the number counts up to meet it (66% 0.50).
    // r=140 -> C = 2*pi*140 = 879.65; 66% shown -> offset = C*(1-0.66) = 299.08.
    gsap.set("#scene-87 .gauge .val", { strokeDasharray: 879.65, strokeDashoffset: 879.65 });
    tl.to("#scene-87 .gauge .val", { strokeDashoffset: 299.08, duration: 0.95, ease: "power2.out" }, 0.55);
    tl.fromTo("#scene-87 .gauge .ctr .pn",
      { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.55);
    const counter = { v: 0 };
    const pnEl = document.querySelector("#scene-87 .gauge .ctr .pn");
    tl.to(counter, {
      v: 66, duration: 0.95, ease: "power2.out",
      onUpdate: () => { pnEl.textContent = Math.round(counter.v) + "%"; }
    }, 0.55);

    // "the single most-used language" — the label settles under the gauge (single 2.36).
    tl.fromTo("#scene-87 .glabel",
      { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.40);

    // "on the planet" — the globe rolls in (planet 4.04).
    tl.fromTo("#scene-87 .globe",
      { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.5)" }, 3.90);

    // Seam clear — fade out across the trailing overlap with scene 88 (local 4.80-5.30).
    tl.to("#scene-87 .cap, #scene-87 .gauge, #scene-87 .glabel, #scene-87 .globe",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 4.80);

    window.__timelines["scene-87"] = tl;
  </script>
</body>
</html>
