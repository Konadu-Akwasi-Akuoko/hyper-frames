<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 24 — framework churn, the second a shinier one trends</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-24 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-24 .head { position:absolute; left:50%; top:19%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-24 .head .ab { color:var(--danger); font-weight:800; }

    #scene-24 .stage { position:absolute; left:50%; top:57%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:120px; }

    /* the cycling "now using" stack card */
    #scene-24 .card { width:330px; height:300px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:26px; display:flex; flex-direction:column; align-items:center; gap:6px; opacity:0; will-change:transform,opacity; box-shadow:0 26px 70px rgba(0,0,0,0.46); }
    #scene-24 .card .klabel { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:21px; color:var(--muted); align-self:flex-start; }
    #scene-24 .card .slot { position:relative; flex:1; width:100%; }
    #scene-24 .card .fw { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; opacity:0; will-change:transform,opacity; }
    #scene-24 .card .fw img { width:100px; height:100px; object-fit:contain; }
    #scene-24 .card .fw .fn { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:25px; font-weight:600; color:var(--soft); }

    /* the driver: a shinier one trending on Twitter */
    #scene-24 .trend { display:flex; flex-direction:column; align-items:center; gap:16px; opacity:0; will-change:transform,opacity; }
    #scene-24 .trend .xbox { width:110px; height:110px; border-radius:18px; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; box-shadow:0 18px 48px rgba(0,0,0,0.42); }
    #scene-24 .trend .xbox .asset { width:74px; height:74px; display:flex; align-items:center; justify-content:center; }
    #scene-24 .trend .xbox .asset img { width:74px; height:74px; filter:brightness(0) invert(1); }
    #scene-24 .trend .tr { display:flex; align-items:center; gap:9px; font-size:25px; font-weight:700; color:var(--accent); }
    #scene-24 .trend .tr .up { color:var(--ok); }
    #scene-24 .trend .sub { font-size:21px; color:var(--muted); }

    /* connector from trend back to the chasing card */
    #scene-24 .chase { position:absolute; left:50%; top:57%; transform:translate(-50%,-50%); width:120px; height:8px; opacity:0; will-change:opacity; display:flex; align-items:center; }
    #scene-24 .chase .ln { flex:1; height:2px; background:repeating-linear-gradient(90deg, var(--dim) 0 8px, transparent 8px 16px); }
    #scene-24 .chase .ar { width:0; height:0; border-top:7px solid transparent; border-bottom:7px solid transparent; border-right:12px solid var(--dim); }
  </style>
</head>
<body>
  <div id="scene-24" data-composition-id="scene-24" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">&hellip;as fast as you <span class="ab">abandon</span> a JS framework.</div>

    <div class="stage">
      <div class="card" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1960">
        <div class="klabel">now using</div>
        <div class="slot">
          <div class="fw fw-react"><img src="../assets/icons/react.svg" alt="React"><span class="fn">React</span></div>
          <div class="fw fw-angular" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3500"><img src="../assets/icons/angular.svg" alt="Angular"><span class="fn">Angular</span></div>
          <div class="fw fw-next" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4900"><img src="../assets/icons/nextjs.svg" alt="Next.js"><span class="fn">Next.js</span></div>
        </div>
      </div>

      <div class="trend" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="6500">
        <div class="xbox" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="7780">
          <div class="asset" data-asset data-asset-class="logo" data-asset-referent="X (formerly Twitter) logo"
               data-asset-desc="The X / Twitter monochrome logo mark, white on transparent, sized for a 74px square. Drives the 'trending on Twitter' punchline.">
            <img src="../assets/icons/x-twitter-logo.svg" alt="X (Twitter)">
          </div>
        </div>
        <div class="tr"><span class="up">&uarr;</span> #1 trending</div>
        <div class="sub">a shinier one</div>
      </div>
    </div>

    <div class="chase"><span class="ln"></span><span class="ar"></span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(184.80).
    // which-is-to-say 0.50 / switched-stacks 1.96 / fast 3.32 / abandon 4.06 / framework 5.06 / shinier 6.50 / trends 7.14 / Twitter 7.78.

    // the aside.
    tl.fromTo("#scene-24 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // "switched stacks" — the stack card appears, on React.
    tl.fromTo("#scene-24 .card", { opacity:0, y:24, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 1.96);
    tl.fromTo("#scene-24 .fw-react", { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.35, ease:"back.out(1.8)" }, 2.20);

    // "as fast as you abandon" — React out, Angular in.
    tl.to("#scene-24 .fw-react", { opacity:0, scale:0.6, y:-14, rotate:-7, duration:0.28, ease:"power2.in" }, 3.50);
    tl.fromTo("#scene-24 .fw-angular", { opacity:0, scale:0.7, y:14 }, { opacity:1, scale:1, y:0, duration:0.32, ease:"back.out(1.8)" }, 3.78);

    // "a JS framework" — Angular out, Next.js in.
    tl.to("#scene-24 .fw-angular", { opacity:0, scale:0.6, y:-14, rotate:7, duration:0.28, ease:"power2.in" }, 4.90);
    tl.fromTo("#scene-24 .fw-next", { opacity:0, scale:0.7, y:14 }, { opacity:1, scale:1, y:0, duration:0.32, ease:"back.out(1.8)" }, 5.18);

    // "the second a shinier one trends on Twitter" — the driver reveals, the card chases it.
    tl.fromTo("#scene-24 .trend", { opacity:0, x:34, scale:0.9 }, { opacity:1, x:0, scale:1, duration:0.5, ease:"back.out(1.6)" }, 6.50);
    tl.fromTo("#scene-24 .chase", { opacity:0 }, { opacity:1, duration:0.35 }, 7.14);
    // the card's framework flickers toward the new shiny thing.
    tl.to("#scene-24 .fw-next", { opacity:0.35, duration:0.3, ease:"sine.inOut", repeat:3, yoyo:true }, 7.30);
    tl.fromTo("#scene-24 .trend .xbox", { boxShadow:"0 18px 48px rgba(0,0,0,0.42)" }, { boxShadow:"0 18px 48px rgba(0,0,0,0.42), 0 0 40px rgba(103,232,249,0.28)", duration:0.5 }, 7.78);
    window.__timelines["scene-24"] = tl;
  </script>
</body>
</html>
