<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 37 — a standing ovation, first in conference history</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-37 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-37 .head { position:absolute; left:50%; top:13%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-37 .head .so { color:var(--accent-2); font-weight:800; }

    /* the ovation — hero reaction image */
    #scene-37 .photo { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); width:900px; height:460px; border-radius:22px; overflow:hidden;
      background:#0d1016; border:1px solid var(--border); opacity:0; will-change:transform,opacity; box-shadow:0 34px 90px rgba(0,0,0,0.5); }
    #scene-37 .photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block; }

    /* the record badge */
    #scene-37 .badge { position:absolute; left:calc(50% + 318px); top:calc(56% - 196px); transform:translate(-50%,-50%); display:flex; align-items:center; gap:14px;
      padding:13px 20px 13px 14px; border-radius:999px; background:var(--panel); border:1px solid rgba(247,223,30,0.45); opacity:0; will-change:transform,opacity; box-shadow:0 16px 44px rgba(0,0,0,0.5); }
    #scene-37 .badge .medal { width:46px; height:46px; border-radius:50%; background:rgba(247,223,30,0.14); border:1.5px solid rgba(247,223,30,0.6);
      display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:20px; font-weight:800; color:var(--accent); flex:none; }
    #scene-37 .badge .bx { display:flex; flex-direction:column; gap:1px; }
    #scene-37 .badge .bt { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; font-weight:700; color:var(--soft); white-space:nowrap; }
    #scene-37 .badge .bs { font-size:15px; color:var(--muted); white-space:nowrap; }
  </style>
</head>
<body>
  <div id="scene-37" data-composition-id="scene-37" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">The room rose for a <span class="so">standing ovation</span>.</div>

    <div class="photo">
      <img src="../assets/images/standing-ovation.png"
           alt="conference audience on its feet giving a standing ovation, arms raised"
           data-asset data-asset-class="reaction" data-asset-referent="a conference audience rising to give a standing ovation"
           data-asset-emotion="triumphant, awed applause"
           data-asset-desc="A wide shot of a tech-conference audience on its feet, clapping — a standing ovation, seen from the stage or side. Warm, energetic, slightly dramatic lighting. Fills a 900x460 landscape hero box. This is the JSConf-2009-style Node.js ovation moment."
           data-asset-src="assets/images/standing-ovation.png">
    </div>

    <div class="badge" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3080">
      <span class="medal">1st</span>
      <span class="bx">
        <span class="bt">first standing ovation</span>
        <span class="bs">in the conference's history</span>
      </span>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(250.56).
    // The 0.50 / audience 0.64 / standing 1.42 / ovation 1.76 / first 3.08 / conference's 3.86 / history 4.66.

    // "The room rose for a standing ovation."
    tl.fromTo("#scene-37 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // "standing ovation" — the image rises into place (the room standing up).
    tl.fromTo("#scene-37 .photo", { opacity:0, y:66, scale:0.97 }, { opacity:1, y:0, scale:1, duration:0.7, ease:"power3.out" }, 1.42);

    // "the first in the conference's history" — the record badge stamps in.
    tl.fromTo("#scene-37 .badge", { opacity:0, scale:0.7, rotate:-8 }, { opacity:1, scale:1, rotate:0, duration:0.45, ease:"back.out(2)" }, 3.08);
    tl.fromTo("#scene-37 .badge .medal", { boxShadow:"0 0 0 rgba(247,223,30,0)" }, { boxShadow:"0 0 22px rgba(247,223,30,0.4)", duration:0.5 }, 4.66);

    // idle: the hero image breathes a touch.
    tl.to("#scene-37 .photo", { y:-6, duration:1.2, ease:"sine.inOut", repeat:1, yoyo:true }, 4.0);
    window.__timelines["scene-37"] = tl;
  </script>
</body>
</html>
