<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 14 — Mocha, no LiveScript, JavaScript</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    @font-face { font-family:"Excalifont"; src:url("../fonts/Excalifont-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-14 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-14 .wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1100px; }
    #scene-14 .head { font-size:46px; font-weight:500; color:var(--soft); opacity:0; will-change:transform,opacity; margin-bottom:44px; }
    #scene-14 .names { display:flex; flex-direction:column; gap:20px; }
    #scene-14 .slot { position:relative; display:flex; align-items:center; gap:34px; opacity:0; will-change:transform,opacity; }
    #scene-14 .slot .word { position:relative; font-size:78px; font-weight:800; color:var(--soft); letter-spacing:-1px; }
    #scene-14 .slot .word .strike { position:absolute; left:-8px; right:-8px; top:54%; height:6px; width:0; background:var(--muted); border-radius:3px; will-change:width; }
    #scene-14 .slot .note { font-family:"Excalifont","Inter",sans-serif; font-size:34px; color:var(--muted); opacity:0; will-change:transform,opacity; }
    #scene-14 .slot.final .word { color:var(--accent); }
  </style>
</head>
<body>
  <div id="scene-14" data-composition-id="scene-14" data-width="1920" data-height="1080">
    <div class="wrap">
      <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="1760">Every browser shipped with&hellip;</div>
      <div class="names">
        <div class="slot s1" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3140"><span class="word">Mocha<span class="strike" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4480"></span></span><span class="note">hey, no&hellip;</span></div>
        <div class="slot s2"><span class="word">LiveScript<span class="strike" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5640"></span></span><span class="note">sorry, guys&hellip;</span></div>
        <div class="slot final s3" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="6960"><span class="word">JavaScript</span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(110.78).
    // shipped-with 1.76 / Mocha 3.14 / LiveScript 4.48 / sorry-guys 5.64 / JavaScript 6.96.

    tl.fromTo("#scene-14 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 1.76);

    // Mocha lands.
    tl.fromTo("#scene-14 .s1", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.4, ease:"back.out(1.5)" }, 3.14);

    // "hey, no" — Mocha struck, LiveScript appears.
    tl.to("#scene-14 .s1 .strike", { width:"calc(100% + 16px)", duration:0.3, ease:"power2.out" }, 4.48);
    tl.to("#scene-14 .s1 .word", { color:"#5a626e", duration:0.3 }, 4.5);
    tl.fromTo("#scene-14 .s1 .note", { opacity:0, x:-10, rotate:-4 }, { opacity:1, x:0, rotate:-3, duration:0.35, ease:"back.out(2)" }, 4.5);
    tl.fromTo("#scene-14 .s2", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.4, ease:"back.out(1.5)" }, 4.62);

    // "sorry, guys" — LiveScript struck.
    tl.to("#scene-14 .s2 .strike", { width:"calc(100% + 16px)", duration:0.3, ease:"power2.out" }, 5.64);
    tl.to("#scene-14 .s2 .word", { color:"#5a626e", duration:0.3 }, 5.66);
    tl.fromTo("#scene-14 .s2 .note", { opacity:0, x:-10, rotate:3 }, { opacity:1, x:0, rotate:2, duration:0.35, ease:"back.out(2)" }, 5.66);

    // JavaScript — the one that stuck.
    tl.fromTo("#scene-14 .s3", { opacity:0, y:20, scale:0.95 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(1.7)" }, 6.96);
    tl.fromTo("#scene-14 .s3 .word", { textShadow:"0 0 0 rgba(247,223,30,0)" }, { textShadow:"0 0 32px rgba(247,223,30,0.45)", duration:0.5 }, 7.0);
    window.__timelines["scene-14"] = tl;
  </script>
</body>
</html>
