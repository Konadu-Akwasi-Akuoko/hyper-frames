<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 03 — so how did that happen?</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-03 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    /* A giant faint ghost question-mark behind the line — decorative depth, not chrome. */
    #scene-03 .ghost {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -54%);
      font-size: 1180px; line-height: 0.8; font-weight: 900; color: var(--dim);
      opacity: 0; will-change: transform, opacity;
    }
    /* A soft spotlight pool that lifts the foreground out of the void. */
    #scene-03 .pool {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 1400px; height: 700px; opacity: 0;
      background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(247,223,30,0.06) 0%, rgba(247,223,30,0) 70%);
      will-change: opacity;
    }

    #scene-03 .line {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center; white-space: nowrap;
      font-size: 118px; font-weight: 800; color: var(--fg); letter-spacing: -2px;
    }
    #scene-03 .line .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-03 .line .happen { display: inline-block; will-change: transform, text-shadow; }
    #scene-03 .line .qm { color: var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-03" data-composition-id="scene-03" data-width="1920" data-height="1080">
    <div class="pool"></div>
    <div class="ghost" data-layout-allow-overflow>?</div>
    <div class="line">
      <span class="w">So</span> <span class="w">how</span> <span class="w">did</span>
      <span class="w">that</span> <span class="w"><span class="happen">happen<span class="qm"
          data-sfx-on-anchor="ui-tick"
          data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav"
          data-sfx-at-scene-ms="2050">?</span></span></span>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(21.20). Entrance at local 0 (overlap w/ scene 02).
    tl.fromTo("#scene-03 .pool", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
    tl.fromTo("#scene-03 .ghost",
      { opacity: 0, scale: 0.92, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0);

    // Words land: So 21.70(0.50), how 21.86(0.66), did 22.58(1.38), that 22.74(1.54), happen 22.92(1.72).
    const w = [0.50, 0.66, 1.38, 1.54, 1.72];
    gsap.utils.toArray("#scene-03 .line .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.36, ease: "back.out(1.4)" }, w[i]);
    });
    // "happen?" is the emphatic long word (22.92-24.30): bloom on its word.
    tl.to("#scene-03 .line .happen",
      { textShadow: "0 0 44px rgba(232,234,237,0.7)", duration: 0.45, ease: "power2.out" }, 1.80);
    tl.fromTo("#scene-03 .line .qm",
      { scale: 1 }, { scale: 1.18, duration: 0.5, ease: "back.out(2.4)" }, 1.90);

    // Subtle life — the ghost breathes and the line drifts a hair.
    tl.to("#scene-03 .ghost", { y: "+=16", duration: 4, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.0);
    tl.to("#scene-03 .line", { y: "-=5", duration: 3.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.4);

    window.__timelines["scene-03"] = tl;
  </script>
</body>
</html>
