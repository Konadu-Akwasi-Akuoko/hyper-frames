<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 03 — so how did that happen?</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-03 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-03 .wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; }
    #scene-03 .q { font-size:120px; font-weight:900; line-height:1.05; color:var(--fg); letter-spacing:-1.5px; }
    #scene-03 .q .w { display:inline-block; opacity:0; will-change:transform,opacity; margin:0 0.12em; }
    #scene-03 .q .happen { color:var(--accent-2); position:relative; }
    /* a hand-question underline sweeps under "happen". */
    #scene-03 .uline { display:block; height:8px; width:0; margin:22px auto 0; border-radius:6px;
      background:linear-gradient(90deg, rgba(103,232,249,0.0), rgba(103,232,249,0.9), rgba(103,232,249,0.0)); will-change:width; }
  </style>
</head>
<body>
  <div id="scene-03" data-composition-id="scene-03" data-width="1920" data-height="1080">
    <div class="wrap">
      <div class="q" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1000">
        <span class="w">So</span> <span class="w">how</span> <span class="w">did</span>
        <span class="w">that</span> <span class="w happen">happen?</span>
      </div>
      <span class="uline" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2300"></span>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(21.20). Words: So 0.50 / how 0.66 / did 1.38 / that 1.54 / happen 1.72.
    const t = [0.50, 0.66, 1.38, 1.54, 1.72];
    gsap.utils.toArray("#scene-03 .q .w").forEach((el,i)=>{
      tl.fromTo(el, { opacity:0, y:34, rotateZ:-2 }, { opacity:1, y:0, rotateZ:0, duration:0.4, ease:"back.out(1.5)" }, t[i]);
    });
    // underline sweeps under "happen?" and the word lifts a touch.
    tl.fromTo("#scene-03 .uline", { width:0 }, { width:360, duration:0.5, ease:"power3.out" }, 1.85);
    tl.to("#scene-03 .q .happen", { textShadow:"0 0 28px rgba(103,232,249,0.5)", duration:0.4 }, 1.80);
    // subtle idle drift on the whole question.
    tl.to("#scene-03 .wrap", { y:"-=6", duration:2.4, ease:"sine.inOut", repeat:1, yoyo:true }, 2.1);
    window.__timelines["scene-03"] = tl;
  </script>
</body>
</html>
