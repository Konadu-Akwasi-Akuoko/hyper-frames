<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 61 — Two codebases, twice the cost</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --android:#3ddc84; --ios:#d8dde6;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-61 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-61 .cap { position:absolute; left:50%; top:196px; transform:translateX(-50%); width:1320px; text-align:center; font-size:54px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-61 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-61 .cap .cost { color:var(--danger); font-weight:800; will-change:text-shadow; }

    /* the duplicated-work stack sits behind the cost hero — two offset identical code cards */
    #scene-61 .stack { position:absolute; left:50%; top:636px; transform:translate(-50%,-50%); width:560px; height:340px; }
    #scene-61 .ghost { position:absolute; width:300px; height:248px; border-radius:16px; background:var(--panel); border:1px solid var(--border); overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.5); opacity:0; will-change:transform,opacity; }
    #scene-61 .ghost.a { left:14px; top:14px; }
    #scene-61 .ghost.b { left:246px; top:78px; }
    #scene-61 .ghost .bar { height:36px; display:flex; align-items:center; gap:9px; padding:0 16px; border-bottom:1px solid var(--border); }
    #scene-61 .ghost .bar i { width:10px; height:10px; border-radius:50%; background:var(--dim); display:inline-block; }
    #scene-61 .ghost .bar .tab { margin-left:auto; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:15px; font-weight:700; }
    #scene-61 .ghost.a .bar .tab { color:var(--ios); }
    #scene-61 .ghost.b .bar .tab { color:var(--android); }
    #scene-61 .ghost .body { padding:17px 18px; display:flex; flex-direction:column; gap:10px; }
    #scene-61 .ghost .ln { height:10px; border-radius:4px; background:#232a35; }
    #scene-61 .ghost .ln.k { background:#2b3a4a; }
    #scene-61 .ghost .ln.w60 { width:60%; } #scene-61 .ghost .ln.w85 { width:85%; }
    #scene-61 .ghost .ln.w45 { width:45%; } #scene-61 .ghost .ln.w72 { width:72%; }

    /* the cost multiplier — the hero, slams over the duplicated stack */
    #scene-61 .hero { position:absolute; left:50%; top:632px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0; will-change:transform,opacity; z-index:3; }
    #scene-61 .hero .mult { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:204px; font-weight:900; color:var(--danger); line-height:0.92; text-shadow:0 0 60px rgba(255,107,93,0.5); }
    #scene-61 .hero .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; font-weight:800; color:var(--danger); letter-spacing:6px; opacity:0; will-change:opacity; }
  </style>
</head>
<body>
  <div id="scene-61" data-composition-id="scene-61" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">Two</span> <span class="w">codebases,</span>
      <span class="w cost">twice</span> <span class="w">the</span> <span class="w cost">cost.</span>
    </div>

    <div class="stack">
      <div class="ghost a">
        <div class="bar"><i></i><i></i><i></i><span class="tab">iOS</span></div>
        <div class="body"><div class="ln k w45"></div><div class="ln w85"></div><div class="ln w72"></div><div class="ln k w60"></div></div>
      </div>
      <div class="ghost b">
        <div class="bar"><i></i><i></i><i></i><span class="tab">Android</span></div>
        <div class="body"><div class="ln k w45"></div><div class="ln w85"></div><div class="ln w72"></div><div class="ln k w60"></div></div>
      </div>
    </div>

    <div class="hero" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1280">
      <span class="mult">&times;2</span>
      <span class="lbl">THE&nbsp;COST</span>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(351.74).
    // Two 0.50 / codebases 0.72 / twice 1.28 / the 1.52 / cost 1.66.
    const cw = [0.50, 0.72, 1.28, 1.52, 1.66];
    gsap.utils.toArray("#scene-61 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.26, ease:"power2.out" }, cw[i]);
    });

    // "Two codebases" — the same work, duplicated: the second card photocopies out from behind the first (Two 0.50 / codebases 0.72).
    tl.fromTo("#scene-61 .ghost.a", { opacity:0, y:14, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"power3.out" }, 0.50);
    tl.fromTo("#scene-61 .ghost.b", { opacity:0, x:-34, y:-20, scale:0.96 }, { opacity:0.92, x:0, y:0, scale:1, duration:0.44, ease:"power3.out" }, 0.74);

    // "twice the cost" — the ×2 cost hero slams over the duplicated stack (twice 1.28).
    tl.fromTo("#scene-61 .hero", { opacity:0, scale:0.55 }, { opacity:1, scale:1, duration:0.4, ease:"back.out(1.9)" }, 1.30);
    tl.to("#scene-61 .ghost", { filter:"brightness(0.68)", duration:0.4, ease:"power2.out" }, 1.34);
    // "cost" — the label resolves under the figure and the caption words bloom (cost 1.66).
    tl.fromTo("#scene-61 .hero .lbl", { opacity:0, y:6 }, { opacity:1, y:0, duration:0.3, ease:"power2.out" }, 1.66);
    tl.fromTo("#scene-61 .cap .cost", { textShadow:"0 0 0 rgba(255,107,93,0)" }, { textShadow:"0 0 22px rgba(255,107,93,0.5)", duration:0.4, ease:"power2.out" }, 1.66);

    // Subtle life — the cost figure holds with a faint pulse.
    tl.to("#scene-61 .hero", { scale:1.035, duration:0.55, ease:"sine.inOut", repeat:1, yoyo:true }, 1.82);

    // Seam clear — fade out across the trailing overlap with scene 62 (local 2.14-2.50).
    tl.to("#scene-61 .cap, #scene-61 .stack, #scene-61 .hero", { opacity:0, duration:0.34, ease:"power2.inOut" }, 2.14);

    window.__timelines["scene-61"] = tl;
  </script>
</body>
</html>
