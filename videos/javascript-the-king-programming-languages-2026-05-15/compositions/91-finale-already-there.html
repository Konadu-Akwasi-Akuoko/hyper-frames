<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 91 — Not because it has won. Because it was already there. And it was built for mobility.</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-91 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-91 .finale {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 1560px; display: flex; flex-direction: column; align-items: center; gap: 40px; text-align: center;
    }
    #scene-91 .l1 {
      position: relative; font-size: 46px; font-weight: 600; color: var(--muted); letter-spacing: -0.5px;
    }
    #scene-91 .l1 .strikeline {
      position: absolute; left: -10px; right: -10px; top: 52%; height: 5px; border-radius: 3px;
      background: var(--danger); transform: scaleX(0); transform-origin: left center; will-change: transform;
    }
    #scene-91 .l2 {
      font-size: 104px; font-weight: 800; color: var(--accent); letter-spacing: -2.5px; line-height: 1.02;
      text-shadow: 0 0 50px rgba(247,223,30,0.22);
    }
    #scene-91 .l3 {
      font-size: 40px; font-weight: 700; color: var(--accent-2); letter-spacing: -0.4px;
    }
    #scene-91 .finale .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
  </style>
</head>
<body>
  <div id="scene-91" data-composition-id="scene-91" data-width="1920" data-height="1080">
    <div class="finale">
      <div class="l1">
        <span class="w">not</span> <span class="w">because</span> <span class="w">it</span> <span class="w">has</span> <span class="w">won</span><span class="strikeline"></span>
      </div>
      <div class="l2" data-sfx-on-anchor="riser" data-sfx-asset="Whooshes/Deep Woosh.wav" data-sfx-at-scene-ms="3820" data-sfx-volume="0.30" data-sfx-hook="true">
        <span class="w">it</span> <span class="w">was</span> <span class="w">already</span> <span class="w">there.</span>
      </div>
      <div class="l3">
        <span class="w">and</span> <span class="w">it</span> <span class="w">was</span> <span class="w">built</span> <span class="w">for</span> <span class="w">mobility.</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(523.33).
    // "not because it has won. because it was already there. and it was built for mobility."
    // (won 1.54, already 3.44, there 3.78, built 4.72, mobility 5.32).
    const cw = [
      0.50, 0.68, 1.16, 1.34, 1.54,           // l1: not because it has won
      2.30, 2.94, 3.18, 3.44, 3.78,           // l2: because(->it) it was already there
      4.22, 4.34, 4.50, 4.72, 5.16, 5.32,     // l3: and it was built for mobility
    ];
    gsap.utils.toArray("#scene-91 .finale .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, cw[i]);
    });

    // "won" — the false reason gets struck out (won 1.54).
    tl.to("#scene-91 .l1 .strikeline", { scaleX: 1, duration: 0.36, ease: "power2.inOut" }, 1.70);
    tl.to("#scene-91 .l1", { color: "#3a4150", duration: 0.4, ease: "power2.out" }, 2.0);

    // "it was already there" — the thesis lands and holds, glowing (there 3.78). THE hook.
    tl.fromTo("#scene-91 .l2",
      { scale: 0.96 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 3.30);
    tl.to("#scene-91 .l2", { textShadow: "0 0 80px rgba(247,223,30,0.45)",
      duration: 1.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.9);

    // Final exit (last scene of the video) — the words recede gently to black (local 6.50).
    tl.to("#scene-91 .finale", { opacity: 0, scale: 0.965, duration: 0.7, ease: "power2.inOut" }, 6.50);

    window.__timelines["scene-91"] = tl;
  </script>
</body>
</html>
