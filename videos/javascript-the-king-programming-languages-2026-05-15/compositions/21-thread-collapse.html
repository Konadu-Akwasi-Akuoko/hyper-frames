<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 21 — thread-per-request collapse</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-21 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-21 .head { position:absolute; left:50%; top:16%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-21 .head .th { color:var(--accent-2); font-weight:800; }
    #scene-21 .sub { position:absolute; left:50%; top:84%; transform:translateX(-50%); font-size:38px; font-weight:700; color:var(--danger); white-space:nowrap; opacity:0; will-change:transform,opacity; }

    /* the stage: thread tower + memory gauge, baseline-aligned */
    #scene-21 .stage { position:absolute; left:50%; top:60%; transform:translate(-50%,-50%); display:flex; align-items:flex-end; gap:80px; }

    #scene-21 .tower { display:flex; flex-direction:column-reverse; gap:9px; align-items:center; will-change:transform; }
    #scene-21 .thread { width:208px; height:30px; background:var(--panel); border:1px solid var(--border); border-radius:7px;
      display:flex; align-items:center; gap:10px; padding:0 14px; opacity:0; will-change:transform,opacity; }
    #scene-21 .thread .chip { width:11px; height:11px; border-radius:3px; background:var(--accent-2); opacity:0.8; flex:none; }
    #scene-21 .thread .tl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--muted); }

    #scene-21 .memwrap { display:flex; flex-direction:column; align-items:center; gap:14px; }
    #scene-21 .mem { width:48px; height:330px; background:#0d1016; border:1px solid var(--border); border-radius:11px; position:relative; overflow:hidden; }
    #scene-21 .mem .memfill { position:absolute; left:0; right:0; bottom:0; height:0; background:var(--accent-2); will-change:height,background-color; }
    #scene-21 .memwrap .ml { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; color:var(--muted); }
  </style>
</head>
<body>
  <div id="scene-21" data-composition-id="scene-21" data-width="1920" data-height="1080">
    <div class="head">Every request opened a new <span class="th">thread</span>.</div>

    <div class="stage">
      <div class="tower" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="5120">
        <div class="thread" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1900"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2580"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3260"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3940"><span class="chip"></span><span class="tl">thread</span></div>
        <div class="thread"><span class="chip"></span><span class="tl">thread</span></div>
      </div>
      <div class="memwrap">
        <div class="mem"><div class="memfill"></div></div>
        <div class="ml">memory</div>
      </div>
    </div>

    <div class="sub">the server collapsed.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(164.96).
    // Every-request 0.50 / thread 1.90 / every-thread 2.78 / memory 3.64 / collapsed 5.12 / users 6.33 / once 7.30.

    // the mechanic.
    tl.fromTo("#scene-21 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // each request stacks a new thread; the tower grows.
    tl.fromTo("#scene-21 .thread", { opacity:0, y:16, scale:0.92 }, { opacity:1, y:0, scale:1, duration:0.32, ease:"back.out(1.6)", stagger:0.34 }, 1.90);

    // "every thread ate memory" — the gauge climbs with the stack.
    tl.to("#scene-21 .mem .memfill", { height:"88%", duration:2.5, ease:"none" }, 1.95);

    // "the server collapsed" — the tower topples, memory pins red.
    tl.to("#scene-21 .mem .memfill", { height:"100%", backgroundColor:"#ff6b5d", duration:0.4, ease:"power2.in" }, 5.12);
    tl.to("#scene-21 .thread", {
      x: (i) => (i % 2 ? -1 : 1) * (34 + i * 9),
      y: (i) => 70 + i * 12,
      rotation: (i) => (i % 2 ? -1 : 1) * (8 + i * 3),
      opacity: 0.16, duration: 0.75, ease: "power2.in", stagger: 0.025
    }, 5.12);
    tl.fromTo("#scene-21 .sub", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 5.40);

    // idle (pre-collapse): the top thread jitters under strain.
    tl.to("#scene-21 .thread:first-child", { x:"+=3", duration:0.12, yoyo:true, repeat:5 }, 4.4);
    window.__timelines["scene-21"] = tl;
  </script>
</body>
</html>
