<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 21 — thread-per-request collapse</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-21 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-21 .stage {
      position: absolute; left: 50%; top: 466px; transform: translate(-50%, -50%);
      width: 1180px; display: flex; align-items: flex-end; justify-content: center; gap: 90px;
    }

    /* the thread tower */
    #scene-21 .tower {
      display: flex; flex-direction: column-reverse; gap: 12px; width: 540px;
      will-change: transform;
    }
    #scene-21 .card {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; padding: 0 24px; border-radius: 10px;
      background: var(--panel); border: 1px solid var(--border);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-21 .card .lab {
      display: flex; align-items: center; gap: 12px;
      font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--soft);
    }
    #scene-21 .card .lab .d { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-2); }
    #scene-21 .card .mem {
      font-family: "JetBrains Mono", monospace; font-size: 24px; color: var(--accent); font-weight: 700;
    }

    /* the memory gauge */
    #scene-21 .gauge { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #scene-21 .gauge .hd {
      font-family: "JetBrains Mono", monospace; font-size: 22px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
    }
    #scene-21 .meter {
      position: relative; width: 92px; height: 452px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--panel); overflow: hidden;
    }
    #scene-21 .meter .fill {
      position: absolute; left: 0; right: 0; bottom: 0; height: 0%; z-index: 1;
      background: linear-gradient(180deg, var(--accent-2), #3aa9bd);
      will-change: height, background;
    }
    #scene-21 .meter .maxline {
      position: absolute; left: 0; right: 0; top: 30px; height: 2px; z-index: 3;
      background: repeating-linear-gradient(90deg, #ffffff 0 8px, transparent 8px 14px);
    }
    #scene-21 .meter .maxlab {
      position: absolute; right: 6px; top: 6px; z-index: 3; font-family: "JetBrains Mono", monospace;
      font-size: 16px; letter-spacing: 1px; color: #ffffff; font-weight: 700;
    }

    /* the verdict caption */
    #scene-21 .verdict {
      position: absolute; left: 50%; top: 792px; transform: translateX(-50%);
      width: 1180px; text-align: center;
    }
    #scene-21 .verdict .big {
      font-size: 60px; font-weight: 800; color: var(--fg); letter-spacing: -1px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-21 .verdict .big .x { color: var(--danger); }
    #scene-21 .verdict .sub {
      font-size: 36px; font-weight: 500; color: var(--muted); margin-top: 12px;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-21" data-composition-id="scene-21" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="tower"
           data-sfx-on-anchor="boom" data-sfx-asset="Anime SFX/Hollow Hit 01.mp3" data-sfx-at-scene-ms="5150" data-sfx-volume="0.35">
        <div class="card" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="1000" data-sfx-volume="0.42"><span class="lab"><span class="d"></span>thread</span><span class="mem">+64 MB</span></div>
        <div class="card"><span class="lab"><span class="d"></span>thread</span><span class="mem">+64 MB</span></div>
        <div class="card"><span class="lab"><span class="d"></span>thread</span><span class="mem">+64 MB</span></div>
        <div class="card" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="2960" data-sfx-volume="0.42"><span class="lab"><span class="d"></span>thread</span><span class="mem">+64 MB</span></div>
        <div class="card"><span class="lab"><span class="d"></span>thread</span><span class="mem">+64 MB</span></div>
        <div class="card"><span class="lab"><span class="d"></span>thread</span><span class="mem">+64 MB</span></div>
      </div>
      <div class="gauge">
        <div class="hd">memory</div>
        <div class="meter">
          <div class="maxline"></div>
          <div class="maxlab">MAX</div>
          <div class="fill"></div>
        </div>
      </div>
    </div>

    <div class="verdict">
      <div class="big">The server <span class="x">collapsed</span>.</div>
      <div class="sub">too many users showed up at once.</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(164.96). The scaffold fades in only after the seam with scene 20 clears.
    tl.from("#scene-21 .stage", { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.40);

    // "Every request opened a new thread / Every thread ate memory" — thread cards stack, memory climbs.
    // request 0.82, opened 1.24, new/thread 1.70-1.90, Every 2.78, thread 3.08, ate 3.64, memory 3.64.
    const beats = [0.82, 1.24, 1.70, 2.78, 3.08, 3.64];
    const fills = [14, 28, 42, 56, 70, 82];
    const cards = gsap.utils.toArray("#scene-21 .card");
    cards.forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, x: -26, scale: 0.96 },
        { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "power2.out" }, beats[i]);
      tl.to("#scene-21 .meter .fill", { height: fills[i] + "%", duration: 0.34, ease: "power2.out" }, beats[i]);
    });

    // The tower teeters before it goes — tension builds under the load (after the stack, into "The server…").
    tl.to("#scene-21 .tower", { rotation: 1.4, transformOrigin: "50% 100%", duration: 0.5, ease: "sine.inOut" }, 4.10);
    tl.to("#scene-21 .tower", { rotation: -1.2, duration: 0.42, ease: "sine.inOut" }, 4.60);

    // "collapsed" — the tower topples, the gauge slams over MAX in red (collapsed 5.12).
    tl.to("#scene-21 .meter .fill",
      { height: "100%", background: "linear-gradient(180deg, #ff6b5d, #b23b30)", duration: 0.25, ease: "power3.in" }, 5.06);
    const fall = [[210, 22], [320, -28], [260, 17], [380, -19], [300, 26], [430, -24]];
    cards.forEach((el, i) => {
      tl.to(el, { y: "+=" + fall[i][0], rotation: fall[i][1], opacity: 0, duration: 0.62, ease: "power2.out" },
        5.10 + i * 0.03);
    });
    tl.to("#scene-21 .tower", { rotation: 9, duration: 0.62, ease: "power2.out" }, 5.10);

    // "The server collapsed" verdict lands as it crashes (The/server 4.68-4.84, collapsed 5.12).
    tl.fromTo("#scene-21 .verdict .big",
      { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.68);
    tl.fromTo("#scene-21 .verdict .big .x",
      { textShadow: "0 0 0 rgba(255,107,93,0)" },
      { textShadow: "0 0 30px rgba(255,107,93,0.55)", duration: 0.4, ease: "power2.out" }, 5.12);

    // "when too many users showed up at once" — the sub explains the trigger (when 5.70, once 7.30).
    tl.fromTo("#scene-21 .verdict .sub",
      { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.74);

    // Seam clear — verdict fades across the trailing overlap with scene 22 (local 7.78-8.28).
    tl.to("#scene-21 .verdict", { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 7.78);

    window.__timelines["scene-21"] = tl;
  </script>
</body>
</html>
