<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 27 — async had to be bolted on</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-27 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-27 .head { position:absolute; left:50%; top:17%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-27 .head .bo { color:var(--accent-2); font-weight:800; }

    #scene-27 .pairs { position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); display:flex; flex-direction:column; gap:44px; }
    #scene-27 .pair { display:flex; align-items:center; }

    #scene-27 .lang { width:230px; height:130px; background:var(--panel); border:1px solid var(--border); border-radius:16px;
      display:flex; align-items:center; gap:18px; padding:0 26px; opacity:0; will-change:transform,opacity; box-shadow:0 18px 46px rgba(0,0,0,0.42); }
    #scene-27 .lang img { width:72px; height:72px; object-fit:contain; flex:none; }
    #scene-27 .lang .ln { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:27px; font-weight:600; color:var(--soft); }

    /* the bolt-bracket connector */
    #scene-27 .bolt { width:76px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; opacity:0; will-change:transform,opacity; }
    #scene-27 .bolt svg { width:26px; height:26px; }

    /* the aftermarket async library */
    #scene-27 .lib { height:130px; min-width:300px; background:#0d1016; border:1px dashed var(--dim); border-radius:16px;
      display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; padding:0 28px; opacity:0; will-change:transform,opacity; }
    #scene-27 .lib .lib-nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:28px; font-weight:700; color:var(--accent-2); }
    #scene-27 .lib .lib-tag { font-size:19px; color:var(--muted); }
  </style>
</head>
<body>
  <div id="scene-27" data-composition-id="scene-27" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">Async had to be <span class="bo">bolted on</span>.</div>

    <div class="pairs">
      <div class="pair p-ruby">
        <div class="lang" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3960"><img src="../assets/icons/ruby.svg" alt="Ruby"><span class="ln">Ruby</span></div>
        <div class="bolt" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="5100">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a8493" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a8493" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <div class="lib" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="4960"><span class="lib-nm">EventMachine</span><span class="lib-tag">async &mdash; add-on</span></div>
      </div>

      <div class="pair p-python">
        <div class="lang" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="6500"><img src="../assets/icons/python.svg" alt="Python"><span class="ln">Python</span></div>
        <div class="bolt" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="7820">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a8493" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a8493" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <div class="lib" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="7680"><span class="lib-nm">Twisted</span><span class="lib-tag">async &mdash; add-on</span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(203.44).
    // Developers 0.50 / async 1.66 / bolt 2.70 / Ruby 3.96 / EventMachine 4.96 / Python 6.50 / Twisted 7.68.

    // "Async had to be bolted on."
    tl.fromTo("#scene-27 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // Ruby, then EventMachine bolts on.
    tl.fromTo("#scene-27 .p-ruby .lang", { opacity:0, x:-30 }, { opacity:1, x:0, duration:0.45, ease:"power3.out" }, 3.96);
    tl.fromTo("#scene-27 .p-ruby .lib", { opacity:0, x:60 }, { opacity:1, x:0, duration:0.45, ease:"power3.out" }, 4.96);
    tl.fromTo("#scene-27 .p-ruby .bolt", { opacity:0, rotate:-40, scale:0.6 }, { opacity:1, rotate:0, scale:1, duration:0.4, ease:"back.out(2)" }, 5.10);

    // Python, then Twisted bolts on.
    tl.fromTo("#scene-27 .p-python .lang", { opacity:0, x:-30 }, { opacity:1, x:0, duration:0.45, ease:"power3.out" }, 6.50);
    tl.fromTo("#scene-27 .p-python .lib", { opacity:0, x:60 }, { opacity:1, x:0, duration:0.45, ease:"power3.out" }, 7.68);
    tl.fromTo("#scene-27 .p-python .bolt", { opacity:0, rotate:-40, scale:0.6 }, { opacity:1, rotate:0, scale:1, duration:0.4, ease:"back.out(2)" }, 7.82);

    // idle: a faint tighten-jitter on the first bolt.
    tl.to("#scene-27 .p-ruby .bolt", { rotate:4, duration:1.4, ease:"sine.inOut", repeat:1, yoyo:true }, 6.0);
    window.__timelines["scene-27"] = tl;
  </script>
</body>
</html>
