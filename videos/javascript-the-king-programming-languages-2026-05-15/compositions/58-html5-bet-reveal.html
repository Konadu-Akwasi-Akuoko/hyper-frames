<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 58 — In 2012, Mark Zuckerberg called Facebook's HTML5 mobile bet</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --fb:#3b82f6; --html5:#e34f26;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-58 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-58 .cap { position:absolute; left:50%; top:184px; transform:translateX(-50%); width:1640px; text-align:center; font-size:44px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; white-space:nowrap; }
    #scene-58 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-58 .cap .zk { color:var(--soft); font-weight:800; }
    #scene-58 .cap .h5 { color:var(--html5); font-weight:800; will-change:text-shadow; }

    #scene-58 .stage { position:absolute; left:50%; top:632px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:26px; }

    #scene-58 .year { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:22px; font-weight:700; color:var(--accent-2); padding:8px 22px; border-radius:999px; border:1px solid rgba(103,232,249,0.4); opacity:0; will-change:transform,opacity; }

    /* the reveal row: the bet chip flips to HTML5 + a mobile phone */
    #scene-58 .revealrow { display:flex; align-items:center; gap:42px; }

    /* the bet chip from the previous scene, still a mystery */
    #scene-58 .slot { position:relative; width:168px; height:184px; display:flex; align-items:center; justify-content:center; }
    #scene-58 .chip { position:absolute; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle at 50% 38%, #1b2740, #0f1726); border:8px dashed rgba(59,130,246,0.7); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 40px rgba(0,0,0,0.55); opacity:0; will-change:transform,opacity; }
    #scene-58 .chip .q { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:62px; font-weight:800; color:var(--fb); }

    /* the HTML5 shield it turns out to be */
    #scene-58 .shield { position:absolute; width:150px; height:170px; opacity:0; will-change:transform,opacity; }
    #scene-58 .shield svg { width:100%; height:100%; filter:drop-shadow(0 10px 26px rgba(227,79,38,0.4)); }

    /* the "× mobile" phone glyph */
    #scene-58 .times { font-size:40px; font-weight:300; color:var(--muted); opacity:0; will-change:opacity; }
    #scene-58 .phone { position:relative; width:104px; height:172px; border-radius:18px; border:3px solid var(--soft); background:#0e1119; opacity:0; will-change:transform,opacity; display:flex; align-items:center; justify-content:center; }
    #scene-58 .phone::before { content:""; position:absolute; top:11px; left:50%; transform:translateX(-50%); width:30px; height:4px; border-radius:2px; background:var(--dim); }
    #scene-58 .phone .scr { width:74px; height:118px; border-radius:6px; background:linear-gradient(160deg,#16202e,#0e1119); display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:30px; }

    #scene-58 .betlbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; font-weight:700; color:var(--muted); letter-spacing:0.3px; opacity:0; will-change:transform,opacity; }
    #scene-58 .betlbl b { color:var(--html5); }
    #scene-58 .betlbl i { font-style:normal; color:var(--soft); }
  </style>
</head>
<body>
  <div id="scene-58" data-composition-id="scene-58" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">In</span> <span class="w">2012,</span> <span class="w zk">Mark</span>
      <span class="w zk">Zuckerberg</span> <span class="w">had</span> <span class="w">called</span>
      <span class="w">Facebook&rsquo;s</span> <span class="w h5">HTML5</span> <span class="w">mobile</span>
      <span class="w">bet</span>
    </div>

    <div class="stage">
      <div class="year">2012</div>
      <div class="revealrow">
        <div class="slot">
          <div class="chip" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="1960"><span class="q">?</span></div>
          <div class="shield" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="4300">
            <svg viewBox="0 0 32 34"><path fill="#e34f26" d="M3 1 L29 1 L26.7 27 L16 31 L5.3 27 Z"/><path fill="#f06b42" d="M16 3 L16 29 L24.8 26 L26.8 3 Z"/><text x="16" y="22" font-family="JetBrains Mono, monospace" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">5</text></svg>
          </div>
        </div>
        <span class="times">&times;</span>
        <div class="phone" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="5040"><div class="scr">📱</div></div>
      </div>
      <div class="betlbl">Facebook&rsquo;s <b>HTML5</b> <i>mobile</i> bet</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(337.04).
    // In 0.50 / 2012 0.70 / Mark 1.96 / Zuckerberg 2.24 / had 3.12 / called 3.36 / Facebook's 3.84 / HTML5 4.30 / mobile 5.04 / bet 5.36.

    // "In 2012, Mark Zuckerberg had called Facebook's HTML5 mobile bet"
    const cw = [0.50, 0.70, 1.96, 2.24, 3.12, 3.36, 3.84, 4.30, 5.04, 5.36];
    gsap.utils.toArray("#scene-58 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // "2012" — the year marker.
    tl.fromTo("#scene-58 .year", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.4, ease:"back.out(1.6)" }, 0.70);

    // the bet chip carries over from sc57, still "?" through the whole setup (Mark 1.96).
    tl.fromTo("#scene-58 .chip", { opacity:0, scale:0.9 }, { opacity:1, scale:1, duration:0.4, ease:"power2.out" }, 1.90);
    tl.to("#scene-58 .chip", { y:"-=6", duration:1.1, ease:"sine.inOut", repeat:1, yoyo:true }, 2.4);

    // "HTML5" — the bet is revealed: it was HTML5 all along; the chip flips to the shield (HTML5 4.30).
    tl.to("#scene-58 .chip", { rotationY:90, opacity:0, duration:0.26, ease:"power2.in" }, 4.16);
    tl.fromTo("#scene-58 .shield", { opacity:0, rotationY:-90, scale:0.8 }, { opacity:1, rotationY:0, scale:1, duration:0.44, ease:"back.out(1.6)" }, 4.34);
    tl.fromTo("#scene-58 .cap .h5", { textShadow:"0 0 0 rgba(227,79,38,0)" }, { textShadow:"0 0 24px rgba(227,79,38,0.55)", duration:0.4, ease:"power2.out" }, 4.38);

    // "mobile" — the × and the phone slide in: a mobile bet (mobile 5.04).
    tl.fromTo("#scene-58 .times", { opacity:0 }, { opacity:1, duration:0.3 }, 4.92);
    tl.fromTo("#scene-58 .phone", { opacity:0, x:26, scale:0.88 }, { opacity:1, x:0, scale:1, duration:0.44, ease:"back.out(1.6)" }, 5.04);

    // "bet" — the label lands (bet 5.36).
    tl.fromTo("#scene-58 .betlbl", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.36, ease:"power2.out" }, 5.36);

    // Seam clear — fade out across the trailing overlap with scene 59 (local 5.52-5.94).
    tl.to("#scene-58 .cap, #scene-58 .stage", { opacity:0, duration:0.32, ease:"power2.inOut" }, 5.52);

    window.__timelines["scene-58"] = tl;
  </script>
</body>
</html>
