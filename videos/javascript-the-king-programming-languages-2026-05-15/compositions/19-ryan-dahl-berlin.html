<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 19 — Ryan Dahl walks onto a stage in Berlin, Nov 2009</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-19 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-19 .when { position:absolute; left:50%; top:13%; transform:translateX(-50%); font-size:42px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-19 .when b { color:var(--fg); font-weight:800; }

    /* the spotlight cone falling on the stage */
    #scene-19 .spot { position:absolute; left:700px; top:6%; width:380px; height:760px; opacity:0; will-change:opacity;
      clip-path:polygon(42% 0, 58% 0, 100% 100%, 0% 100%);
      background:linear-gradient(to bottom, rgba(232,234,237,0.18), rgba(232,234,237,0.04) 55%, rgba(232,234,237,0)); }

    /* portrait of Ryan Dahl on the stage */
    #scene-19 .figure { position:absolute; left:760px; top:50%; transform:translateY(-50%); width:262px; opacity:0; will-change:transform,opacity; }
    #scene-19 .figure .frame { width:262px; height:330px; border-radius:16px; overflow:hidden; border:1px solid var(--border); background:var(--panel); box-shadow:0 26px 70px rgba(0,0,0,0.5); }
    #scene-19 .figure .frame img { width:100%; height:100%; object-fit:cover; filter:grayscale(1) brightness(1.05) contrast(1.02); }
    #scene-19 .figure .cap { margin-top:22px; text-align:center; }
    #scene-19 .figure .cap .nm { font-size:36px; font-weight:800; color:var(--fg); letter-spacing:-0.5px; }
    #scene-19 .figure .cap .pl { margin-top:6px; font-size:23px; font-weight:500; color:var(--muted); opacity:0; will-change:opacity; }

    /* the 150-person audience */
    #scene-19 .audience { position:absolute; left:1170px; top:50%; transform:translateY(-50%); opacity:0; will-change:opacity; }
    #scene-19 .dots { display:grid; grid-template-columns:repeat(15, 12px); gap:8px; }
    #scene-19 .dots .dot { width:12px; height:12px; border-radius:50%; background:#5b6675; opacity:0; will-change:transform,opacity; }
    #scene-19 .audience .alabel { margin-top:24px; font-size:30px; font-weight:600; color:var(--soft); }
    #scene-19 .audience .alabel .n { color:var(--accent-2); font-weight:800; }
  </style>
</head>
<body>
  <div id="scene-19" data-composition-id="scene-19" data-width="1920" data-height="1080">
    <div class="when" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">In <b>November 2009</b>&hellip;</div>

    <div class="spot" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="7160"></div>
    <div class="figure" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="5120">
      <div class="frame"><img src="../assets/images/ryan-dahl.png" alt="Ryan Dahl"></div>
      <div class="cap"><div class="nm">Ryan Dahl</div><div class="pl">on a stage in Berlin</div></div>
    </div>

    <div class="audience">
      <div class="dots"></div>
      <div class="alabel"><span class="n">150</span> people</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    // build the 150-person audience deterministically.
    const grid = document.querySelector("#scene-19 .dots");
    for (let i = 0; i < 150; i++) { const d = document.createElement("span"); d.className = "dot"; grid.appendChild(d); }

    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(150.18).
    // But 0.50 / 2009 1.52 / engineer 4.02 / Ryan-Dahl 5.12 / stage 7.16 / Berlin 7.66 / 150 9.44 / people 10.38.

    // "In November 2009…"
    tl.fromTo("#scene-19 .when", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.50);

    // "an engineer, Ryan Dahl" — the figure walks in.
    tl.fromTo("#scene-19 .figure", { opacity:0, y:34 }, { opacity:1, y:0, duration:0.65, ease:"power3.out" }, 5.12);

    // "walked onto a stage" — the spotlight ignites.
    tl.fromTo("#scene-19 .spot", { opacity:0 }, { opacity:1, duration:0.7, ease:"power2.out" }, 7.16);

    // "in Berlin" — the place caption appears.
    tl.fromTo("#scene-19 .figure .cap .pl", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 7.66);

    // "150 people" — the audience fills the room.
    tl.fromTo("#scene-19 .audience", { opacity:0 }, { opacity:1, duration:0.3 }, 9.30);
    tl.fromTo("#scene-19 .dots .dot",
      { opacity:0, scale:0.4 },
      { opacity:1, scale:1, duration:0.3, ease:"power2.out", stagger:{ each:0.006, grid:[10,15], from:"start" } }, 9.44);

    // idle: a slow spotlight shimmer, the portrait breathes.
    tl.to("#scene-19 .spot", { opacity:0.78, duration:1.8, ease:"sine.inOut", repeat:1, yoyo:true }, 8.2);
    window.__timelines["scene-19"] = tl;
  </script>
</body>
</html>
