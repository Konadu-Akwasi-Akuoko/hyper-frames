<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 52 — Two years later, GitHub renamed it to Electron</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --atom:#a48bff; --electron:#9feaf9;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-52 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-52 .cap { position:absolute; left:50%; top:196px; transform:translateX(-50%); width:1420px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-52 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-52 .cap .el { color:var(--electron); font-weight:800; will-change:text-shadow; }

    /* the rename board */
    #scene-52 .plate { position:absolute; left:50%; top:620px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:24px; padding:40px 70px; border-radius:20px; background:var(--panel); border:1px solid var(--border); box-shadow:0 28px 80px rgba(0,0,0,0.5); opacity:0; will-change:transform,opacity; }

    /* the time-jump marker */
    #scene-52 .tmark { display:flex; align-items:center; gap:10px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; font-weight:700; letter-spacing:0.5px; color:var(--muted); padding:6px 18px; border-radius:999px; border:1px dashed var(--dim); opacity:0; will-change:transform,opacity; }

    /* the name slot — old and new occupy the same place; the board flips */
    #scene-52 .slot { position:relative; width:560px; height:112px; }
    #scene-52 .slot .nm { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:22px; font-family:"JetBrains Mono",ui-monospace,monospace; font-weight:800; letter-spacing:-2px; line-height:1; white-space:nowrap; }
    #scene-52 .old { font-size:62px; color:var(--soft); will-change:opacity; }
    #scene-52 .old .at { color:var(--atom); }
    #scene-52 .old .strike { position:absolute; top:52%; left:50%; transform:translate(-50%,-50%) scaleX(0); transform-origin:left center; width:420px; height:6px; border-radius:3px; background:var(--danger); will-change:transform; }
    #scene-52 .new { font-size:80px; color:var(--electron); opacity:0; will-change:transform,opacity; }
    #scene-52 .new img { width:104px; height:104px; object-fit:contain; will-change:filter; }

    /* the renamer */
    #scene-52 .by { display:flex; align-items:center; gap:11px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; font-weight:600; color:var(--muted); opacity:0; will-change:transform,opacity; }
    #scene-52 .by img { width:26px; height:26px; filter:invert(1); opacity:0.9; }
  </style>
</head>
<body>
  <div id="scene-52" data-composition-id="scene-52" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">Two</span> <span class="w">years</span> <span class="w">later,</span>
      <span class="w">GitHub</span> <span class="w">renamed</span> <span class="w">it</span>
      <span class="w">to</span> <span class="w el">Electron.</span>
    </div>

    <div class="plate">
      <div class="tmark">&#9203; 2 years later</div>
      <div class="slot">
        <div class="nm old"><span class="at">Atom</span> Shell<span class="strike"></span></div>
        <div class="nm new" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3100"><img src="../assets/icons/electron.svg" alt="Electron"><span>Electron</span></div>
      </div>
      <div class="by" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2260"><img src="../assets/icons/github.svg" alt="GitHub"> renamed by GitHub</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(319.58).
    // Two 0.50 / years 0.76 / later 1.10 / GitHub 1.90 / renamed 2.24 / it 2.74 / to 2.86 / Electron 3.10.

    // "Two years later, GitHub renamed it to Electron."
    const cw = [0.50, 0.76, 1.10, 1.90, 2.24, 2.74, 2.86, 3.10];
    gsap.utils.toArray("#scene-52 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // the board carries in holding the old name (Two 0.50).
    tl.fromTo("#scene-52 .plate", { opacity:0, y:24, scale:0.97 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 0.45);
    tl.fromTo("#scene-52 .tmark", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.36, ease:"back.out(1.5)" }, 0.62);

    // "GitHub" — the renamer steps in (GitHub 1.90).
    tl.fromTo("#scene-52 .by", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.38, ease:"power2.out" }, 1.90);

    // "renamed" — the old name is struck through (renamed 2.24).
    tl.to("#scene-52 .old .strike", { scaleX:1, duration:0.42, ease:"power2.inOut" }, 2.26);

    // "to Electron" — the board flips: old name out, new name stamps into the same slot (Electron 3.10).
    tl.to("#scene-52 .old", { opacity:0, duration:0.34, ease:"power2.in" }, 2.78);
    tl.fromTo("#scene-52 .new", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.48, ease:"back.out(1.6)" }, 3.06);
    tl.fromTo("#scene-52 .new img", { filter:"drop-shadow(0 0 0 rgba(159,234,249,0))" }, { filter:"drop-shadow(0 0 24px rgba(103,232,249,0.55))", duration:0.5, ease:"power2.out" }, 3.20);
    tl.fromTo("#scene-52 .cap .el", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 26px rgba(103,232,249,0.6)", duration:0.4, ease:"power2.out" }, 3.14);

    // Subtle life — the board settles.
    tl.to("#scene-52 .plate", { y:"-=5", duration:1.3, ease:"sine.inOut" }, 3.5);

    // Seam clear — fade out across the trailing overlap with scene 53 (local 3.96-4.30).
    tl.to("#scene-52 .cap, #scene-52 .plate", { opacity:0, duration:0.32, ease:"power2.inOut" }, 3.96);

    window.__timelines["scene-52"] = tl;
  </script>
</body>
</html>
