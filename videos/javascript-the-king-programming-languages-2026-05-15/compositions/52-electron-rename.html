<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 52 — Two years later, GitHub renamed it to Electron</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
      --atom: #a48bff; --electron: #67e8f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-52 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-52 .cap {
      position: absolute; left: 50%; top: 196px; transform: translateX(-50%);
      width: 1420px; text-align: center;
      font-size: 50px; font-weight: 600; color: var(--soft); letter-spacing: -0.8px;
    }
    #scene-52 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-52 .cap .el { color: var(--electron); font-weight: 800; will-change: text-shadow; }

    #scene-52 .plate {
      position: absolute; left: 50%; top: 620px; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      padding: 44px 70px; border-radius: 20px;
      background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 28px 80px rgba(0,0,0,0.5);
      opacity: 0; will-change: transform, opacity;
    }

    /* the old name being retired */
    #scene-52 .old {
      position: relative; font-family: "JetBrains Mono", monospace; font-size: 54px; font-weight: 800;
      letter-spacing: -1px; color: var(--soft); will-change: color, opacity;
    }
    #scene-52 .old .at { color: var(--atom); }
    #scene-52 .old .strike {
      position: absolute; top: 52%; left: -8px; width: calc(100% + 16px); height: 5px; border-radius: 3px;
      background: var(--danger); transform: scaleX(0); transform-origin: left center; will-change: transform;
    }

    /* the renamer */
    #scene-52 .arrow {
      display: flex; align-items: center; gap: 14px; opacity: 0; will-change: transform, opacity;
    }
    #scene-52 .arrow .gh { width: 34px; height: 34px; filter: invert(1); opacity: 0.85; }
    #scene-52 .arrow .dn { font-size: 36px; color: var(--muted); line-height: 1; }

    /* the new name */
    #scene-52 .new {
      display: flex; align-items: center; gap: 22px; opacity: 0; will-change: transform, opacity;
    }
    #scene-52 .new img { width: 100px; height: 100px; will-change: filter; }
    #scene-52 .new .wm {
      font-family: "JetBrains Mono", monospace; font-size: 80px; font-weight: 800; letter-spacing: -2px; line-height: 1;
      color: var(--electron);
    }
  </style>
</head>
<body>
  <div id="scene-52" data-composition-id="scene-52" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">Two</span> <span class="w">years</span> <span class="w">later,</span>
      <span class="w">GitHub</span> <span class="w">renamed</span> <span class="w">it</span>
      <span class="w">to</span> <span class="w el">Electron.</span>
    </div>

    <div class="plate">
      <div class="old"><span class="at">Atom</span> Shell<span class="strike" data-sfx-on-anchor="whoosh" data-sfx-asset="Anime SFX/Camera Whoosh 02.mp3" data-sfx-at-scene-ms="2460" data-sfx-volume="0.42"></span></div>
      <div class="arrow">
        <img class="gh" src="assets/icons/github.svg" alt="GitHub">
        <span class="dn">&darr;</span>
      </div>
      <div class="new" data-sfx-on-anchor="pop" data-sfx-asset="Mister Horse Free SFX/Pop/Echoing Pop 01.wav" data-sfx-at-scene-ms="3310" data-sfx-volume="0.35">
        <img src="assets/icons/electron.svg" alt="Electron">
        <span class="wm">Electron</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(319.58).
    // "Two years later, GitHub renamed it to Electron."
    // (Two 0.50, later 1.10, GitHub 1.90, renamed 2.24, Electron 3.10).
    const cw = [0.50, 0.76, 1.10, 1.90, 2.24, 2.74, 2.86, 3.10];
    gsap.utils.toArray("#scene-52 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, cw[i]);
    });

    // the plate carries in holding the old name (Two 0.50).
    tl.fromTo("#scene-52 .plate",
      { opacity: 0, y: 24, scale: 0.97 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.45);

    // "GitHub" — the renamer steps in (GitHub 1.90).
    tl.fromTo("#scene-52 .arrow",
      { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.90);

    // "renamed it" — the old name is struck through and fades back (renamed 2.24).
    tl.to("#scene-52 .old .strike", { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 2.26);
    tl.to("#scene-52 .old", { color: "var(--muted)", opacity: 0.45, duration: 0.5, ease: "power2.out" }, 2.40);

    // "Electron" — the new name and logo ignite (Electron 3.10).
    tl.fromTo("#scene-52 .new",
      { opacity: 0, y: 16, scale: 0.9 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 3.06);
    tl.fromTo("#scene-52 .new img",
      { filter: "drop-shadow(0 0 0 rgba(103,232,249,0))" },
      { filter: "drop-shadow(0 0 22px rgba(103,232,249,0.55))", duration: 0.5, ease: "power2.out" }, 3.20);
    tl.fromTo("#scene-52 .cap .el",
      { textShadow: "0 0 0 rgba(103,232,249,0)" },
      { textShadow: "0 0 26px rgba(103,232,249,0.6)", duration: 0.4, ease: "power2.out" }, 3.14);

    // Subtle life — the plate settles with a breath.
    tl.to("#scene-52 .plate", { y: "-=5", duration: 1.2, ease: "sine.inOut" }, 3.4);

    // Seam clear — fade out across the trailing overlap with scene 53 (local 3.80-4.30).
    tl.to("#scene-52 .cap, #scene-52 .plate",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 3.80);

    window.__timelines["scene-52"] = tl;
  </script>
</body>
</html>
