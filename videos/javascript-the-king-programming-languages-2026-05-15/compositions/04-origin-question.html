<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 04 — how did JavaScript come to be?</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --border:#1f242c; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-04 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-04 .wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1500px; text-align:center; }
    #scene-04 .setup { font-size:40px; font-weight:500; color:var(--soft); opacity:0; will-change:transform,opacity; }
    #scene-04 .setup .imp { color:var(--fg); font-weight:700; }

    /* chapter rule — a thin origin line the headline grows from. */
    #scene-04 .rule { height:1px; width:0; margin:42px auto 40px; background:linear-gradient(90deg, transparent, var(--border), transparent); }
    #scene-04 .rule .seed { position:absolute; left:50%; top:-4px; width:9px; height:9px; border-radius:50%; background:var(--accent-2); transform:translateX(-50%) scale(0); box-shadow:0 0 18px rgba(103,232,249,0.7); will-change:transform; }
    #scene-04 .rule-wrap { position:relative; }

    #scene-04 .head { font-size:104px; font-weight:900; line-height:1.08; letter-spacing:-1.5px; color:var(--fg); }
    #scene-04 .head .w { display:inline-block; opacity:0; will-change:transform,opacity; margin:0 0.1em; }
    #scene-04 .head .js { color:var(--accent); }
  </style>
</head>
<body>
  <div id="scene-04" data-composition-id="scene-04" data-width="1920" data-height="1080">
    <div class="wrap">
      <div class="setup" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1050">Let's answer the most <span class="imp">important</span> question first.</div>
      <div class="rule-wrap"><div class="rule"><span class="seed"></span></div></div>
      <div class="head">
        <span class="w">How</span> <span class="w">did</span> <span class="w js" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="4980">JavaScript</span>
        <span class="w">come</span> <span class="w">to</span> <span class="w">be?</span>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(23.90). setup 0.50 / important 1.58 / first 2.60 / headline 3.76 / JS 4.48.

    tl.fromTo("#scene-04 .setup", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.50);
    tl.to("#scene-04 .setup .imp", { textShadow:"0 0 22px rgba(232,234,237,0.4)", duration:0.4 }, 1.58);

    // origin seed + rule grows at "first" (2.60), the headline springs from it.
    tl.fromTo("#scene-04 .rule .seed", { scale:0 }, { scale:1, duration:0.4, ease:"back.out(2.5)" }, 2.60);
    tl.fromTo("#scene-04 .rule", { width:0 }, { width:760, duration:0.6, ease:"power2.inOut" }, 2.80);

    // headline builds word-by-word from "How" (3.76); JavaScript accents on its word (4.48).
    const t = [3.76, 4.10, 4.48, 5.14, 5.38, 5.60]; // How did JavaScript come to be
    gsap.utils.toArray("#scene-04 .head .w").forEach((el,i)=>{
      tl.fromTo(el, { opacity:0, y:30 }, { opacity:1, y:0, duration:0.42, ease:"back.out(1.4)" }, t[i]);
    });
    tl.fromTo("#scene-04 .head .js", { textShadow:"0 0 0 rgba(247,223,30,0)" }, { textShadow:"0 0 30px rgba(247,223,30,0.5)", duration:0.5 }, 4.48);

    // idle drift.
    tl.to("#scene-04 .wrap", { y:"-=6", duration:3, ease:"sine.inOut", repeat:1, yoyo:true }, 6.0);
    window.__timelines["scene-04"] = tl;
  </script>
</body>
</html>
