<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 20 — Apache choking under concurrent connections</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-20 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-20 .head { position:absolute; left:50%; top:20%; transform:translateX(-50%); font-size:46px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-20 .head .ck { color:var(--danger); font-weight:800; }
    #scene-20 .head .cc { color:var(--accent-2); font-weight:700; }

    #scene-20 .stage { position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:120px; }

    /* incoming concurrent connections */
    #scene-20 .conns { display:flex; flex-direction:column; gap:20px; align-items:flex-end; }
    #scene-20 .conns .ln { display:flex; align-items:center; gap:0; opacity:0; will-change:transform,opacity; }
    #scene-20 .conns .ln .bar { width:130px; height:3px; border-radius:2px; background:var(--accent-2); opacity:0.8; }
    #scene-20 .conns .ln .tip { width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:11px solid var(--accent-2); }
    #scene-20 .conns .clabel { margin-top:14px; font-size:21px; color:var(--muted); align-self:center; }

    /* the Apache server, choking */
    #scene-20 .apache { width:300px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:30px 28px; display:flex; flex-direction:column; align-items:center; gap:18px; opacity:0; will-change:transform,opacity; box-shadow:0 26px 70px rgba(0,0,0,0.46); }
    #scene-20 .apache img { width:96px; height:96px; object-fit:contain; }
    #scene-20 .apache .nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:26px; font-weight:600; color:var(--soft); }
    #scene-20 .apache .meter { width:100%; height:14px; background:#0d1016; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    #scene-20 .apache .meter .fill { height:100%; width:28%; background:var(--ok); border-radius:7px; will-change:width,background-color; }
  </style>
</head>
<body>
  <div id="scene-20" data-composition-id="scene-20" data-width="1920" data-height="1080">
    <div class="head">Apache <span class="ck">choked</span> under <span class="cc">concurrent connections</span>.</div>

    <div class="stage">
      <div class="conns" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2380">
        <div class="ln l1"><span class="bar"></span><span class="tip"></span></div>
        <div class="ln l2"><span class="bar"></span><span class="tip"></span></div>
        <div class="ln l3"><span class="bar"></span><span class="tip"></span></div>
        <div class="ln l4"><span class="bar"></span><span class="tip"></span></div>
        <div class="ln l5"><span class="bar"></span><span class="tip"></span></div>
        <div class="ln l6"><span class="bar"></span><span class="tip"></span></div>
      </div>
      <div class="apache" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1260">
        <img src="../assets/icons/apache.svg" alt="Apache">
        <div class="nm">Apache</div>
        <div class="meter"><div class="fill" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="1740"></div></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(161.16).
    // He'd-watching 0.50 / Apache 1.26 / choke 1.74 / concurrent 2.38 / connections 2.92.

    // the line.
    tl.fromTo("#scene-20 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the Apache server stands up, healthy.
    tl.fromTo("#scene-20 .apache", { opacity:0, y:24, scale:0.95 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(1.5)" }, 1.26);

    // "choke" — the load meter spikes to red, the box shudders.
    tl.to("#scene-20 .apache .fill", { width:"100%", backgroundColor:"#ff6b5d", duration:0.45, ease:"power3.in" }, 1.74);
    tl.to("#scene-20 .apache", { x:"+=5", duration:0.06, yoyo:true, repeat:7 }, 1.74);
    tl.fromTo("#scene-20 .apache", { boxShadow:"0 26px 70px rgba(0,0,0,0.46)" }, { boxShadow:"0 26px 70px rgba(0,0,0,0.46), 0 0 44px rgba(255,107,93,0.34)", duration:0.4 }, 1.78);

    // "concurrent connections" — they flood in toward the server.
    tl.fromTo("#scene-20 .conns .ln", { opacity:0, x:-70 }, { opacity:1, x:0, duration:0.34, ease:"power2.out", stagger:0.06 }, 2.38);

    // idle: the red overload pulses, the connection arrows keep nudging in.
    tl.to("#scene-20 .apache .fill", { opacity:0.72, duration:0.5, ease:"sine.inOut", repeat:3, yoyo:true }, 3.0);
    window.__timelines["scene-20"] = tl;
  </script>
</body>
</html>
