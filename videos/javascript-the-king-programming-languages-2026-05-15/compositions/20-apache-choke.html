<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 20 — Apache choking under concurrent connections</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-20 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-20 .stage {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 1380px; display: flex; align-items: center; justify-content: center; gap: 100px;
    }

    /* the Apache server, under load */
    #scene-20 .server {
      width: 460px; height: 460px; border-radius: 28px;
      border: 2px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      opacity: 0; will-change: transform, opacity, border-color, box-shadow;
    }
    #scene-20 .server img { width: 200px; height: 200px; }
    #scene-20 .server .nm { font-size: 52px; font-weight: 800; color: var(--fg); letter-spacing: -1px; }

    /* the flood of concurrent connections */
    #scene-20 .load { width: 600px; }
    #scene-20 .load .hd {
      font-family: "JetBrains Mono", monospace; font-size: 24px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 22px;
      opacity: 0; will-change: opacity;
    }
    #scene-20 .stack { display: flex; flex-direction: column-reverse; gap: 12px; position: relative; }
    #scene-20 .pill {
      height: 36px; border-radius: 8px; background: var(--accent-2);
      transform-origin: left center; transform: scaleX(0); opacity: 0;
      will-change: transform, opacity;
    }
    #scene-20 .pill.over { background: var(--danger); }
    /* capacity line — where Apache runs out */
    #scene-20 .cap-line {
      position: absolute; left: -10px; right: -10px; height: 2px;
      background: repeating-linear-gradient(90deg, var(--muted) 0 10px, transparent 10px 18px);
      bottom: 196px; opacity: 0;
    }
    #scene-20 .cap-line .t {
      position: absolute; left: 100%; margin-left: 16px; top: -10px; white-space: nowrap;
      font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: 1px;
      color: var(--muted); text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="scene-20" data-composition-id="scene-20" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="server">
        <img src="assets/icons/apache.svg" alt="Apache">
        <div class="nm">Apache</div>
      </div>
      <div class="load">
        <div class="hd">concurrent connections</div>
        <div class="stack"
             data-sfx-on-anchor="whoosh" data-sfx-asset="Anime SFX/Camera Whoosh 01.mp3" data-sfx-at-scene-ms="1620">
          <div class="cap-line"><span class="t">capacity</span></div>
          <div class="pill"></div>
          <div class="pill"></div>
          <div class="pill"></div>
          <div class="pill"></div>
          <div class="pill over"></div>
          <div class="pill over"></div>
          <div class="pill over"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(161.16).
    // "He'd been watching" — Apache box present from the open (He'd 0.50).
    tl.fromTo("#scene-20 .server",
      { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.40);
    tl.fromTo("#scene-20 .load .hd",
      { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.86);
    tl.fromTo("#scene-20 .cap-line",
      { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.00);

    // Connections flood in, stacking fast and overrunning capacity (watching 0.86 -> connections 2.92).
    const pills = gsap.utils.toArray("#scene-20 .pill");
    pills.forEach((el, i) => {
      tl.fromTo(el, { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.22, ease: "power2.out" }, 0.86 + i * 0.18);
    });

    // "choke" — the server reddens, shakes, the over-capacity pills already glaring red (choke 1.74).
    tl.to("#scene-20 .server",
      { borderColor: "#ff6b5d", boxShadow: "0 0 32px rgba(255,107,93,0.4)", duration: 0.3, ease: "power2.out" }, 1.74);
    tl.to("#scene-20 .server",
      { x: "+=7", duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, 1.78);
    tl.to("#scene-20 .server", { x: 0, duration: 0.05 }, 2.10);

    // "concurrent connections" — the header pulses as the label lands (concurrent 2.38).
    tl.fromTo("#scene-20 .load .hd",
      { color: "#7a8493" }, { color: "#67e8f9", duration: 0.4, ease: "power2.out" }, 2.38);

    // Subtle life — the load panel trembles a hair under strain.
    tl.to("#scene-20 .stack", { y: "+=4", duration: 0.9, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.6);

    // Seam clear — stage fades across the trailing overlap with scene 21 (local 3.80-4.30).
    tl.to("#scene-20 .stage", { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 3.80);

    window.__timelines["scene-20"] = tl;
  </script>
</body>
</html>
