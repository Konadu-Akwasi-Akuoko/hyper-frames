<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 26 — every other language: blocking I/O</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-26 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-26 .stage {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 1500px; text-align: center;
    }
    #scene-26 .cap {
      font-size: 52px; font-weight: 700; color: var(--fg); letter-spacing: -1px; margin-bottom: 56px;
    }
    #scene-26 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }

    #scene-26 .rack { display: flex; justify-content: center; gap: 30px; }
    #scene-26 .chip {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      padding: 26px 30px; min-width: 220px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-26 .chip img { width: 64px; height: 64px; }
    #scene-26 .chip .nm { font-size: 30px; font-weight: 700; color: var(--soft); }
    #scene-26 .chip .io {
      font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; letter-spacing: 1px;
      color: var(--accent-2); border: 1px solid rgba(103,232,249,0.4); border-radius: 8px; padding: 5px 14px;
      will-change: color, border-color, background;
    }

    #scene-26 .verdict {
      margin-top: 54px; font-size: 46px; font-weight: 700; color: var(--soft); letter-spacing: -0.5px;
      opacity: 0; will-change: transform, opacity;
    }
    #scene-26 .verdict .blk { color: var(--danger); font-weight: 800; }
  </style>
</head>
<body>
  <div id="scene-26" data-composition-id="scene-26" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="cap">
        <span class="w">Every</span> <span class="w">other</span> <span class="w">language</span>
        <span class="w">had</span> <span class="w">I/O</span> <span class="w">built&nbsp;in.</span>
      </div>

      <div class="rack">
        <div class="chip" data-sfx-on-anchor="card-tap" data-sfx-asset="Mister Horse Free SFX/Click/Mechanical Keyboard Click 01.wav" data-sfx-at-scene-ms="980" data-sfx-volume="0.35"><img src="assets/icons/python.svg" alt="Python"><span class="nm">Python</span><span class="io" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="5280" data-sfx-volume="0.42">I/O</span></div>
        <div class="chip"><img src="assets/icons/ruby.svg" alt="Ruby"><span class="nm">Ruby</span><span class="io">I/O</span></div>
        <div class="chip"><img src="assets/icons/php.svg" alt="PHP"><span class="nm">PHP</span><span class="io">I/O</span></div>
        <div class="chip"><img src="assets/icons/perl.svg" alt="Perl"><span class="nm">Perl</span><span class="io">I/O</span></div>
      </div>

      <div class="verdict">&hellip; and all of it <span class="blk">built around blocking</span>.</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(197.08).
    // "Every other language ... had I/O built in" — caption reveals (Every 0.50 ... built-in 3.20).
    const cap = [0.50, 0.92, 1.20, 1.96, 2.46, 2.90];
    gsap.utils.toArray("#scene-26 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, cap[i]);
    });

    // The language chips cascade in as "every other language" lands (0.7 -> 2.0).
    const chips = gsap.utils.toArray("#scene-26 .chip");
    chips.forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 22, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.78 + i * 0.26);
    });

    // "and it was built around blocking" — the verdict line + every I/O badge flips red to BLOCKING (blocking 5.86).
    tl.fromTo("#scene-26 .verdict",
      { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.12);
    const ios = gsap.utils.toArray("#scene-26 .chip .io");
    ios.forEach((el, i) => {
      tl.to(el, {
        color: "#ff6b5d", borderColor: "rgba(255,107,93,0.55)", background: "rgba(255,107,93,0.10)",
        duration: 0.3, ease: "power2.out"
      }, 5.10 + i * 0.12);
      tl.to(el, { innerText: "BLOCKING" }, 5.10 + i * 0.12);
    });
    tl.fromTo("#scene-26 .verdict .blk",
      { textShadow: "0 0 0 rgba(255,107,93,0)" },
      { textShadow: "0 0 26px rgba(255,107,93,0.5)", duration: 0.4, ease: "power2.out" }, 5.86);

    // Subtle life — the rack drifts a hair.
    tl.to("#scene-26 .rack", { y: "-=5", duration: 3.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.2);

    // Seam clear — stage fades across the trailing overlap with scene 27 (local 6.36-6.86).
    tl.to("#scene-26 .stage", { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 6.36);

    window.__timelines["scene-26"] = tl;
  </script>
</body>
</html>
