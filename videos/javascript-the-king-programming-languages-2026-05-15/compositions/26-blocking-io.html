<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 26 — every other language had I/O built in, around blocking</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-26 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-26 .head { position:absolute; left:50%; top:18%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-26 .head .io { color:var(--accent-2); font-weight:800; }

    #scene-26 .langbox { position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); width:520px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:26px; opacity:0; will-change:transform,opacity; box-shadow:0 28px 74px rgba(0,0,0,0.46); }
    #scene-26 .langbox .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:21px; color:var(--muted); margin-bottom:20px; }
    #scene-26 .langbox .mods { display:flex; flex-direction:column; gap:14px; }
    #scene-26 .mod { display:flex; align-items:center; gap:14px; height:64px; padding:0 22px; background:#0d1016; border:1px solid var(--border); border-radius:12px; opacity:0; will-change:transform,opacity; }
    #scene-26 .mod .mn { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:25px; font-weight:600; color:var(--soft); }
    #scene-26 .mod .tag { margin-left:auto; font-size:18px; font-weight:600; color:var(--muted); }
    #scene-26 .mod.io { border-color:rgba(103,232,249,0.5); }
    #scene-26 .mod.io .mn { color:var(--accent-2); }
    #scene-26 .mod.io .badge { margin-left:auto; display:flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; opacity:0; will-change:transform,opacity;
      background:rgba(255,107,93,0.12); border:1px solid rgba(255,107,93,0.4); }
    #scene-26 .mod.io .badge .bd { font-size:19px; font-weight:700; color:var(--danger); }
    #scene-26 .mod.io .badge .dot { width:9px; height:9px; border-radius:50%; background:var(--danger); }
  </style>
</head>
<body>
  <div id="scene-26" data-composition-id="scene-26" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">Every other language had <span class="io">I/O</span> built in.</div>

    <div class="langbox" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1200">
      <div class="lbl">every other language</div>
      <div class="mods">
        <div class="mod m1" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1550"><span class="mn">runtime</span><span class="tag">core</span></div>
        <div class="mod m2" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="1810"><span class="mn">standard library</span><span class="tag">core</span></div>
        <div class="mod io m3" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2070"><span class="mn">I/O</span><span class="badge" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="5860"><span class="dot"></span><span class="bd">blocking</span></span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(197.08).
    // Every-other 0.50 / language 1.20 / I/O 2.46 / built-in 3.20 / around 5.20 / blocking 5.86.

    // "Every other language…"
    tl.fromTo("#scene-26 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the language, with its modules baked in.
    tl.fromTo("#scene-26 .langbox", { opacity:0, y:24, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 1.20);
    tl.fromTo("#scene-26 .mod", { opacity:0, x:-18 }, { opacity:1, x:0, duration:0.4, ease:"power2.out", stagger:0.26 }, 1.55);

    // "I/O built in" — the I/O module glows, baked into the core.
    tl.fromTo("#scene-26 .head .io", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 24px rgba(103,232,249,0.45)", duration:0.4 }, 2.46);
    tl.fromTo("#scene-26 .mod.io", { boxShadow:"0 0 0 rgba(103,232,249,0)" }, { boxShadow:"0 0 26px rgba(103,232,249,0.22)", duration:0.45 }, 3.20);

    // "built around blocking" — the I/O turns out to block.
    tl.to("#scene-26 .mod.io", { borderColor:"rgba(255,107,93,0.55)", duration:0.4 }, 5.86);
    tl.to("#scene-26 .mod.io .mn", { color:"#ff6b5d", duration:0.4 }, 5.86);
    tl.fromTo("#scene-26 .mod.io .badge", { opacity:0, scale:0.7, x:10 }, { opacity:1, scale:1, x:0, duration:0.4, ease:"back.out(2)" }, 5.86);

    // idle: the blocking dot pulses.
    tl.to("#scene-26 .mod.io .badge .dot", { opacity:0.4, duration:0.55, ease:"sine.inOut", repeat:1, yoyo:true }, 6.4);
    window.__timelines["scene-26"] = tl;
  </script>
</body>
</html>
