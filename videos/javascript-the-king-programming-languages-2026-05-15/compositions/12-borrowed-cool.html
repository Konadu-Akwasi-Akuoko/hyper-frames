<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 12 — Java was a cool name</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    @font-face { font-family:"Excalifont"; src:url("../fonts/Excalifont-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-12 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-12 .setup { position:absolute; left:50%; top:24%; transform:translateX(-50%); font-size:40px; font-weight:500; color:var(--soft); opacity:0; will-change:transform,opacity; white-space:nowrap; }
    #scene-12 .setup .em { color:var(--fg); font-weight:700; }

    #scene-12 .stage { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); width:520px; height:520px; }
    #scene-12 .halo { position:absolute; inset:90px; border-radius:50%; border:2px solid rgba(103,232,249,0.5);
      box-shadow:0 0 60px rgba(103,232,249,0.2), inset 0 0 40px rgba(103,232,249,0.08); transform:scale(0); opacity:0; will-change:transform,opacity; }
    #scene-12 .logo { position:absolute; inset:140px; display:flex; align-items:center; justify-content:center; opacity:0; will-change:transform,opacity; }
    #scene-12 .logo img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 18px 44px rgba(0,0,0,0.55)); }

    #scene-12 .spark { position:absolute; font-size:46px; color:var(--accent-2); opacity:0; will-change:transform,opacity; text-shadow:0 0 16px rgba(103,232,249,0.6); }
    #scene-12 .s1 { left:54px; top:70px; } #scene-12 .s2 { right:60px; top:120px; font-size:34px; }
    #scene-12 .s3 { left:96px; bottom:96px; font-size:30px; } #scene-12 .s4 { right:80px; bottom:70px; }

    #scene-12 .cool { position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); font-family:"Excalifont","Inter",sans-serif;
      font-size:44px; color:var(--accent-2); opacity:0; will-change:transform,opacity; white-space:nowrap; }
    #scene-12 .also { position:absolute; left:50%; bottom:-78px; transform:translateX(-50%); font-family:"Excalifont","Inter",sans-serif;
      font-size:34px; color:rgba(103,232,249,0.62); opacity:0; will-change:transform,opacity; white-space:nowrap; }
  </style>
</head>
<body>
  <div id="scene-12" data-composition-id="scene-12" data-width="1920" data-height="1080">
    <div class="setup">In 1995, <span class="em">Java</span> was the coolest name in tech.</div>
    <div class="stage">
      <div class="halo" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="2050"></div>
      <div class="logo" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1040"><img src="../assets/icons/java.svg" alt="Java"></div>
      <span class="spark s1">&#10022;</span>
      <span class="spark s2">&#10022;</span>
      <span class="spark s3">&#10022;</span>
      <span class="spark s4">&#10022;</span>
      <div class="cool">effortlessly cool</div>
      <div class="also" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="5940">&hellip; so anything near it looked cool too</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(96.14).
    // You-see 0.50 / Java 1.04 / cool-name 2.00 / back-then 2.46 / associating 3.78 / also-cool 5.94.

    tl.fromTo("#scene-12 .setup", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // Java logo reveals (Java).
    tl.fromTo("#scene-12 .logo", { opacity:0, scale:0.7, y:14 }, { opacity:1, scale:1, y:0, duration:0.55, ease:"back.out(1.6)" }, 1.04);

    // the "cool" halo + sparkles ignite (a cool name).
    tl.fromTo("#scene-12 .halo", { opacity:0, scale:0.5 }, { opacity:1, scale:1, duration:0.6, ease:"back.out(1.5)" }, 2.00);
    tl.fromTo("#scene-12 .spark", { opacity:0, scale:0 }, { opacity:1, scale:1, duration:0.4, ease:"back.out(2.2)", stagger:0.1 }, 2.05);
    tl.fromTo("#scene-12 .cool", { opacity:0, y:10, rotate:-3 }, { opacity:1, y:0, rotate:-2, duration:0.45, ease:"back.out(1.8)" }, 2.20);

    // sparkles twinkle continuously.
    tl.to("#scene-12 .s1", { opacity:0.4, duration:0.9, ease:"sine.inOut", repeat:4, yoyo:true }, 3.0);
    tl.to("#scene-12 .s3", { opacity:0.4, duration:1.1, ease:"sine.inOut", repeat:4, yoyo:true }, 3.4);

    // "associating with Java meant you are also cool" — halo pulses, the transfer note lands.
    tl.to("#scene-12 .halo", { boxShadow:"0 0 90px rgba(103,232,249,0.34), inset 0 0 40px rgba(103,232,249,0.1)", scale:1.05, duration:0.6, ease:"power2.out" }, 5.94);
    tl.fromTo("#scene-12 .also", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 5.94);

    // idle: the logo breathes inside the halo.
    tl.to("#scene-12 .logo", { scale:1.03, duration:2.2, ease:"sine.inOut", repeat:2, yoyo:true }, 3.2);
    window.__timelines["scene-12"] = tl;
  </script>
</body>
</html>
