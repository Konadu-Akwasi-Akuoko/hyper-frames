<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 44 — JavaScript went to mobile and desktop. How?</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-44 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-44 .cap { position:absolute; left:50%; top:165px; transform:translateX(-50%); width:1400px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-44 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-44 .cap .pf { color:var(--accent-2); font-weight:800; }

    /* the connectors layer */
    #scene-44 .wires { position:absolute; inset:0; width:1920px; height:1080px; }
    #scene-44 .wires path { fill:none; stroke:var(--dim); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; will-change:stroke; }

    /* the source — the real JS mark, shipping out */
    #scene-44 .js { position:absolute; left:380px; top:500px; width:124px; height:124px; opacity:0; will-change:transform,opacity; }
    #scene-44 .js img { width:124px; height:124px; object-fit:contain; filter:drop-shadow(0 0 22px rgba(247,223,30,0.35)); }

    /* destination cards */
    #scene-44 .dev { position:absolute; display:flex; flex-direction:column; align-items:center; gap:16px; opacity:0; will-change:transform,opacity; }
    #scene-44 .dev .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; font-weight:700; color:var(--muted); letter-spacing:0.5px; will-change:color; }
    #scene-44 #d-mobile { left:1140px; top:332px; }
    #scene-44 #d-desktop { left:1092px; top:606px; }

    #scene-44 .phone { width:92px; height:170px; border:3px solid var(--dim); border-radius:18px; background:var(--panel); position:relative; will-change:border-color,box-shadow; }
    #scene-44 .phone::before { content:""; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:28px; height:4px; border-radius:2px; background:var(--dim); }
    #scene-44 .phone .scr { position:absolute; inset:22px 10px 18px; border-radius:8px; background:#161b24; }

    #scene-44 .monitor { display:flex; flex-direction:column; align-items:center; }
    #scene-44 .monitor .screen { width:208px; height:136px; border:3px solid var(--dim); border-radius:12px; background:var(--panel); position:relative; will-change:border-color,box-shadow; }
    #scene-44 .monitor .screen .scr { position:absolute; inset:12px; border-radius:6px; background:#161b24; }
    #scene-44 .monitor .stand { width:68px; height:16px; background:var(--dim); border-radius:0 0 8px 8px; }
    #scene-44 .monitor .base { width:108px; height:8px; background:var(--dim); border-radius:4px; margin-top:4px; }

    /* the hook question */
    #scene-44 .how { position:absolute; left:50%; top:902px; transform:translate(-50%,-50%); font-size:92px; font-weight:900; color:var(--accent-2); letter-spacing:-2px; opacity:0; will-change:transform,opacity,text-shadow; }
  </style>
</head>
<body>
  <div id="scene-44" data-composition-id="scene-44" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">JavaScript</span> <span class="w">went</span> <span class="w">to</span>
      <span class="w pf">mobile</span> <span class="w">and</span> <span class="w pf">desktop.</span>
    </div>

    <svg class="wires" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <path class="c-up" d="M512 558 H720 V410 H1120"/>
      <path class="c-down" d="M512 558 H720 V700 H1120"/>
    </svg>

    <div class="js" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500"><img src="../assets/icons/javascript.svg" alt="JavaScript"></div>

    <div class="dev" id="d-mobile" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2060">
      <div class="phone"><div class="scr"></div></div>
      <span class="lbl">mobile</span>
    </div>

    <div class="dev" id="d-desktop" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2840">
      <div class="monitor">
        <div class="screen"><div class="scr"></div></div>
        <div class="stand"></div>
        <div class="base"></div>
      </div>
      <span class="lbl">desktop</span>
    </div>

    <div class="how" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="3580">How?</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(289.36).
    // JavaScript 0.50 / went 1.46 / to 1.88 / mobile 2.06 / and 2.64 / desktop 2.84 / How 3.58.

    // "JavaScript went to mobile and desktop."
    const cw = [0.50, 1.46, 1.88, 2.06, 2.64, 2.84];
    gsap.utils.toArray("#scene-44 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // "JavaScript" — the source mark lands at left.
    tl.fromTo("#scene-44 .js", { opacity:0, scale:0.7, x:-16 }, { opacity:1, scale:1, x:0, duration:0.5, ease:"back.out(1.7)" }, 0.55);

    // connectors draw on their target's beat.
    const up = document.querySelector("#scene-44 .c-up");
    const dn = document.querySelector("#scene-44 .c-down");
    const ul = up ? up.getTotalLength() : 800;
    const dl = dn ? dn.getTotalLength() : 800;
    gsap.set(up, { strokeDasharray:ul, strokeDashoffset:ul });
    gsap.set(dn, { strokeDasharray:dl, strokeDashoffset:dl });

    // "mobile" — the upper wire draws and the phone lights cyan.
    tl.to(up, { strokeDashoffset:0, duration:0.55, ease:"power2.out" }, 1.66);
    tl.to(up, { stroke:"#67e8f9", duration:0.4 }, 2.06);
    tl.fromTo("#scene-44 #d-mobile", { opacity:0, x:24, scale:0.9 }, { opacity:1, x:0, scale:1, duration:0.45, ease:"back.out(1.6)" }, 2.06);
    tl.to("#scene-44 #d-mobile .phone", { borderColor:"#67e8f9", boxShadow:"0 0 24px rgba(103,232,249,0.4)", duration:0.4, ease:"power2.out" }, 2.20);
    tl.to("#scene-44 #d-mobile .lbl", { color:"#c2c9d4", duration:0.4 }, 2.20);

    // "desktop" — the lower wire draws and the monitor lights cyan.
    tl.to(dn, { strokeDashoffset:0, duration:0.55, ease:"power2.out" }, 2.44);
    tl.to(dn, { stroke:"#67e8f9", duration:0.4 }, 2.84);
    tl.fromTo("#scene-44 #d-desktop", { opacity:0, x:24, scale:0.9 }, { opacity:1, x:0, scale:1, duration:0.45, ease:"back.out(1.6)" }, 2.84);
    tl.to("#scene-44 #d-desktop .screen", { borderColor:"#67e8f9", boxShadow:"0 0 24px rgba(103,232,249,0.4)", duration:0.4, ease:"power2.out" }, 2.98);
    tl.to("#scene-44 #d-desktop .lbl", { color:"#c2c9d4", duration:0.4 }, 2.98);

    // "How?" — the hook question punches in.
    tl.fromTo("#scene-44 .how", { opacity:0, y:18, scale:0.8 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(2)" }, 3.58);
    tl.fromTo("#scene-44 .how", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 30px rgba(103,232,249,0.5)", duration:0.4, ease:"power2.out" }, 3.80);

    // Subtle life — the JS mark hums.
    tl.to("#scene-44 .js", { y:"-=6", duration:1.7, ease:"sine.inOut", repeat:1, yoyo:true }, 0.9);

    // Seam clear — fade out across the trailing overlap with scene 45 (local 4.12-4.62).
    tl.to("#scene-44 .cap, #scene-44 .wires, #scene-44 .js, #scene-44 #d-mobile, #scene-44 #d-desktop, #scene-44 .how", { opacity:0, duration:0.34, ease:"power2.inOut" }, 4.12);

    window.__timelines["scene-44"] = tl;
  </script>
</body>
</html>
