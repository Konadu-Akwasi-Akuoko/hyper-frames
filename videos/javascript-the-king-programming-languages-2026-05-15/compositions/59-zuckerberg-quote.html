<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 59 — the biggest mistake we've made as a company</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Excalifont";
      src: url("../fonts/Excalifont-Regular.woff2") format("woff2");
      font-weight: 400; font-display: block;
    }
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
      --fb: #3b82f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-59 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    /* big decorative quote mark */
    #scene-59 .qmark {
      position: absolute; left: 332px; top: 250px;
      font-family: "Inter", sans-serif; font-weight: 700; font-size: 300px; line-height: 1; color: rgba(122,132,147,0.16);
      opacity: 0; will-change: transform, opacity;
    }

    #scene-59 .quote {
      position: absolute; left: 50%; top: 480px; transform: translate(-50%, -50%);
      width: 1320px; text-align: center;
      font-family: "Excalifont", "Inter", sans-serif; font-size: 84px; font-weight: 400; line-height: 1.32;
      color: var(--soft); letter-spacing: 0.5px;
    }
    #scene-59 .quote .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-59 .quote .bm { color: var(--danger); will-change: text-shadow; }

    /* attribution */
    #scene-59 .attr {
      position: absolute; left: 50%; top: 760px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 18px; opacity: 0; will-change: transform, opacity;
    }
    #scene-59 .attr .mono {
      width: 64px; height: 64px; border-radius: 50%; flex: none;
      background: rgba(59,130,246,0.16); border: 1px solid rgba(59,130,246,0.5);
      display: flex; align-items: center; justify-content: center;
      font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 800; color: var(--fb);
    }
    #scene-59 .attr .who {
      font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 700; color: var(--soft); letter-spacing: 0.3px;
    }
    #scene-59 .attr .who small { display: block; font-size: 19px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  </style>
</head>
<body>
  <div id="scene-59" data-composition-id="scene-59" data-width="1920" data-height="1080">
    <div class="qmark">&ldquo;</div>

    <div class="quote">
      <span class="w">the</span> <span class="w bm">biggest</span> <span class="w bm">mistake</span>
      <span class="w">we&rsquo;ve</span> <span class="w">made</span> <span class="w">as</span>
      <span class="w">a</span> <span class="w">company.</span>
    </div>

    <div class="attr">
      <div class="mono">MZ</div>
      <div class="who">Mark Zuckerberg<small>CEO, Facebook &middot; 2012</small></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(342.48).
    // "the biggest mistake we've made as a company."
    // (the 0.50, biggest 0.86, mistake 1.32, we've 1.68, made 1.96, as 2.26, a 2.40, company 2.54).
    const cw = [0.50, 0.86, 1.32, 1.68, 1.96, 2.26, 2.40, 2.54];
    gsap.utils.toArray("#scene-59 .quote .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, cw[i]);
    });

    // the big quote mark sets the frame.
    tl.fromTo("#scene-59 .qmark",
      { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.30);

    // "biggest mistake" — the words ignite danger-red (biggest 0.86, mistake 1.32).
    tl.fromTo("#scene-59 .quote .bm",
      { textShadow: "0 0 0 rgba(255,107,93,0)" },
      { textShadow: "0 0 26px rgba(255,107,93,0.55)", duration: 0.45, ease: "power2.out" }, 1.36);

    // the attribution lands after the quote settles (company 2.54).
    tl.fromTo("#scene-59 .attr",
      { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, 2.66);

    // Seam clear — fade out across the trailing overlap with scene 60 (local 3.00-3.50).
    tl.to("#scene-59 .qmark, #scene-59 .quote, #scene-59 .attr",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 3.00);

    window.__timelines["scene-59"] = tl;
  </script>
</body>
</html>
