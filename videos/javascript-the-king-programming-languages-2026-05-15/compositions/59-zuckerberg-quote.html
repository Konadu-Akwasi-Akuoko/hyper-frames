<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 59 — "the biggest mistake we've made as a company" (Zuckerberg)</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family:"Excalifont";
      src:url("../fonts/Excalifont-Regular.woff2") format("woff2");
      font-weight:400; font-display:block;
    }
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --fb:#3b82f6;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-59 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    /* the portrait of the man being quoted — left side cutout */
    #scene-59 .portrait { position:absolute; left:214px; top:212px; width:452px; height:656px; border-radius:18px; overflow:hidden; border:1px solid var(--border); background:var(--panel); box-shadow:0 30px 90px rgba(0,0,0,0.55); opacity:0; will-change:transform,opacity; }
    #scene-59 .portrait .portrait-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; }
    #scene-59 .portrait .yr { position:absolute; left:18px; bottom:16px; z-index:2; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; font-weight:700; color:var(--soft); padding:6px 14px; border-radius:8px; background:rgba(11,13,18,0.74); border:1px solid rgba(59,130,246,0.4); }

    /* the quote block — right of the portrait */
    #scene-59 .quotewrap { position:absolute; left:758px; top:50%; transform:translateY(-50%); width:946px; opacity:0; will-change:transform,opacity; }
    #scene-59 .qmark { position:absolute; left:-8px; top:-120px; font-family:"Excalifont","Inter",sans-serif; font-size:200px; line-height:1; color:var(--fb); opacity:0; will-change:transform,opacity; }
    #scene-59 .quote { position:relative; z-index:1; font-family:"Excalifont","Inter",sans-serif; font-size:64px; line-height:1.34; color:var(--soft); letter-spacing:0.3px; }
    #scene-59 .quote .w { display:inline-block; opacity:0; color:var(--muted); will-change:transform,opacity,color; }
    #scene-59 .quote .bm { color:var(--danger); will-change:text-shadow,color; }

    #scene-59 .attrib { display:flex; align-items:center; gap:16px; margin-top:46px; padding-top:26px; border-top:1px solid var(--border); opacity:0; will-change:transform,opacity; }
    #scene-59 .attrib .who { font-family:"Inter",system-ui,sans-serif; font-size:28px; font-weight:600; color:var(--soft); letter-spacing:0.2px; }
    #scene-59 .attrib .who small { display:block; font-size:19px; font-weight:500; color:var(--muted); margin-top:3px; letter-spacing:0.1px; }
    #scene-59 .attrib .meta { margin-left:auto; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:22px; font-weight:600; color:var(--fb); letter-spacing:0.4px; }
  </style>
</head>
<body>
  <div id="scene-59" data-composition-id="scene-59" data-width="1920" data-height="1080">
    <div class="portrait" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="900">
      <!-- asset: zuckerberg-2012 | photo | wikimedia CC BY 2.0 | TechCrunch/C.Flanigan/WireImage | https://commons.wikimedia.org/wiki/File:Mark_Zuckerberg_TechCrunch_2012.jpg -->
      <img class="portrait-img"
           src="../assets/images/zuckerberg-2012.png"
           alt="Mark Zuckerberg at TechCrunch Disrupt SF, September 2012"
           data-asset
           data-asset-class="photo"
           data-asset-referent="Mark Zuckerberg"
           data-asset-desc="Mark Zuckerberg circa 2012, head-and-shoulders press portrait, vertical crop; somber/serious expression to match the admission of a mistake. Licensed photo (Wikimedia/press).">
      <span class="yr">2012</span>
    </div>

    <div class="quotewrap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <div class="qmark">&ldquo;</div>
      <div class="quote">
        <span class="w">the</span> <span class="w bm">biggest</span> <span class="w bm">mistake</span>
        <span class="w">we&rsquo;ve</span> <span class="w">made</span> <span class="w">as</span>
        <span class="w">a</span> <span class="w">company.</span>
      </div>
      <div class="attrib">
        <span class="who">Mark Zuckerberg<small>on Facebook&rsquo;s HTML5 mobile bet</small></span>
        <span class="meta">FACEBOOK &middot; 2012</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(342.48).
    // the 0.50 / biggest 0.86 / mistake 1.32 / we've 1.68 / made 1.96 / as 2.26 / a 2.40 / company 2.54.

    // the quote card + portrait settle in (transition INTO scene 59, local 0).
    tl.fromTo("#scene-59 .quotewrap", { opacity:0, x:24 }, { opacity:1, x:0, duration:0.55, ease:"power3.out" }, 0.10);
    tl.fromTo("#scene-59 .portrait", { opacity:0, x:-26, scale:0.97 }, { opacity:1, x:0, scale:1, duration:0.55, ease:"power3.out" }, 0.20);
    tl.fromTo("#scene-59 .qmark", { opacity:0, y:16, scale:0.9 }, { opacity:0.9, y:0, scale:1, duration:0.5, ease:"back.out(1.6)" }, 0.30);

    // the quote builds word by word on its spoken beats; each word lights muted -> soft.
    const cw = [0.50, 0.86, 1.32, 1.68, 1.96, 2.26, 2.40, 2.54];
    gsap.utils.toArray("#scene-59 .quote .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:8 }, { opacity:1, y:0, duration:0.26, ease:"power2.out" }, cw[i]);
      if (!el.classList.contains("bm")) {
        tl.to(el, { color:"#c2c9d4", duration:0.24, ease:"power2.out" }, cw[i] + 0.04);
      }
    });

    // "biggest mistake" — the confession lands: the words ignite danger-red (mistake 1.32).
    tl.to("#scene-59 .quote .bm", { color:"#ff6b5d", textShadow:"0 0 26px rgba(255,107,93,0.55)", duration:0.36, ease:"power2.out" }, 1.34);

    // attribution stamps up once the speaker is established (under the quote).
    tl.fromTo("#scene-59 .attrib", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 1.66);

    // constant subtle life — the portrait breathes a hair so nothing sits perfectly still.
    tl.to("#scene-59 .portrait", { y:"-=6", duration:2.4, ease:"sine.inOut", repeat:1, yoyo:true }, 0.85);

    // Seam clear — fade foreground out across the trailing overlap with scene 60 (local 3.00-3.40).
    tl.to("#scene-59 .quotewrap, #scene-59 .portrait", { opacity:0, duration:0.34, ease:"power2.inOut" }, 3.00);

    window.__timelines["scene-59"] = tl;
  </script>
</body>
</html>
