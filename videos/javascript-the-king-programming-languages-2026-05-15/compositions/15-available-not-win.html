<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 15 — designed to be available</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-15 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-15 .wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1300px; text-align:center; }
    #scene-15 .l1 { font-size:62px; font-weight:600; color:var(--soft); opacity:0; will-change:transform,opacity; }
    #scene-15 .l1 .win { position:relative; color:var(--muted); }
    #scene-15 .l1 .win .strike { position:absolute; left:-6px; right:-6px; top:54%; height:6px; width:0; background:var(--muted); border-radius:3px; will-change:width; }

    #scene-15 .l2 { margin-top:40px; font-size:84px; font-weight:800; color:var(--fg); letter-spacing:-1.5px; opacity:0; will-change:transform,opacity; }
    #scene-15 .l2 .avail { color:var(--accent-2); }
    #scene-15 .readily { display:block; font-size:48px; font-weight:700; color:var(--accent-2); margin-top:10px; opacity:0; will-change:transform,opacity; }

    #scene-15 .foot { margin-top:58px; font-size:36px; color:#9aa3b2; opacity:0; will-change:transform,opacity; }
    #scene-15 .foot b { color:var(--soft); font-weight:600; }
  </style>
</head>
<body>
  <div id="scene-15" data-composition-id="scene-15" data-width="1920" data-height="1080">
    <div class="wrap">
      <div class="l1" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="600">JavaScript was never designed to <span class="win">win<span class="strike" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="3020"></span></span>.</div>
      <div class="l2" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="4400">It was designed to be <span class="avail">available</span>.
        <span class="readily" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="6500">readily available.</span>
      </div>
      <div class="foot">being <b>available</b> and <b>winning</b> &mdash; two very different things.</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(119.08).
    // win 3.02 / available 5.32 / readily 6.50 / different 9.94.

    // line 1, then "win" gets struck.
    tl.fromTo("#scene-15 .l1", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.60);
    tl.to("#scene-15 .l1 .win .strike", { width:"calc(100% + 12px)", duration:0.35, ease:"power2.out" }, 3.02);

    // line 2 — "available" is the real goal.
    tl.fromTo("#scene-15 .l2", { opacity:0, y:24 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 4.40);
    tl.fromTo("#scene-15 .l2 .avail", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 34px rgba(103,232,249,0.5)", duration:0.5 }, 5.32);

    // "readily available" reinforces.
    tl.fromTo("#scene-15 .readily", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 6.50);

    // "those two are different things".
    tl.fromTo("#scene-15 .foot", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 9.40);

    // idle: a soft breath on the available line.
    tl.to("#scene-15 .l2", { y:"-=5", duration:3, ease:"sine.inOut", repeat:1, yoyo:true }, 7.5);
    window.__timelines["scene-15"] = tl;
  </script>
</body>
</html>
