<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 57 — Facebook then made a bet</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --fb:#3b82f6;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-57 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-57 .cap { position:absolute; left:50%; top:210px; transform:translateX(-50%); width:1320px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-57 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-57 .cap .bt { color:var(--fb); font-weight:800; will-change:text-shadow; }

    #scene-57 .rig { position:absolute; left:50%; top:614px; transform:translate(-50%,-50%); display:flex; align-items:center; gap:54px; }

    /* the Facebook logo — the bettor */
    #scene-57 .fb { display:flex; flex-direction:column; align-items:center; gap:16px; flex:none; opacity:0; will-change:transform,opacity; }
    #scene-57 .fb img { width:128px; height:128px; object-fit:contain; }
    #scene-57 .fb .lbl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:22px; font-weight:700; color:var(--muted); }

    /* the betting felt */
    #scene-57 .table { position:relative; width:460px; height:212px; border-radius:18px; background:radial-gradient(ellipse at 50% 40%, #16271d, #0f1a14); border:1px solid #20382a; box-shadow:inset 0 0 40px rgba(0,0,0,0.5); flex:none; }
    #scene-57 .table .felt-ln { position:absolute; inset:14px; border-radius:12px; border:1px dashed rgba(125,216,125,0.18); }

    /* the wager being placed */
    #scene-57 .chip { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:148px; height:148px; border-radius:50%; background:radial-gradient(circle at 50% 38%, #1b2740, #0f1726); border:8px dashed rgba(59,130,246,0.7); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 40px rgba(0,0,0,0.55); opacity:0; will-change:opacity; }
    #scene-57 .chip .spin { width:148px; height:148px; position:absolute; inset:-8px; border-radius:50%; will-change:transform; }
    #scene-57 .chip .inner { width:98px; height:98px; border-radius:50%; border:2px solid rgba(59,130,246,0.45); display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:60px; font-weight:800; color:var(--fb); will-change:text-shadow; }
  </style>
</head>
<body>
  <div id="scene-57" data-composition-id="scene-57" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">Facebook</span> <span class="w">then</span> <span class="w">made</span>
      <span class="w">a</span> <span class="w bt">bet.</span>
    </div>

    <div class="rig">
      <div class="fb">
        <img src="../assets/icons/facebook.svg" alt="Facebook">
        <span class="lbl">Facebook</span>
      </div>
      <div class="table">
        <div class="felt-ln"></div>
        <div class="chip" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="1300"><div class="inner" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="1700">?</div></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(335.16).
    // Facebook 0.50 / then 0.85 / made 1.06 / a 1.20 / bet 1.28.

    // "Facebook then made a bet."
    const cw = [0.50, 0.85, 1.06, 1.20, 1.28];
    gsap.utils.toArray("#scene-57 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // "Facebook" — the bettor steps up to the table (Facebook 0.50).
    tl.fromTo("#scene-57 .fb", { opacity:0, x:-24, scale:0.92 }, { opacity:1, x:0, scale:1, duration:0.5, ease:"back.out(1.5)" }, 0.50);
    tl.fromTo("#scene-57 .table", { opacity:0, scale:0.94 }, { opacity:1, scale:1, duration:0.45, ease:"power3.out" }, 0.70);

    // "made a bet" — the chip is tossed onto the felt and spins to rest (bet 1.28).
    tl.fromTo("#scene-57 .chip", { opacity:0 }, { opacity:1, duration:0.2 }, 1.26);
    tl.fromTo("#scene-57 .chip", { y:-46, scale:0.7 }, { y:0, scale:1, duration:0.55, ease:"back.out(1.7)" }, 1.26);
    tl.fromTo("#scene-57 .chip .spin", { rotation:-120 }, { rotation:0, duration:0.6, ease:"power3.out", transformOrigin:"50% 50%" }, 1.26);
    tl.fromTo("#scene-57 .cap .bt", { textShadow:"0 0 0 rgba(59,130,246,0)" }, { textShadow:"0 0 24px rgba(59,130,246,0.55)", duration:0.4, ease:"power2.out" }, 1.32);
    // the "?" pulses — the wager's subject is still a mystery.
    tl.fromTo("#scene-57 .chip .inner", { textShadow:"0 0 0 rgba(59,130,246,0)" }, { textShadow:"0 0 22px rgba(59,130,246,0.7)", duration:0.45, ease:"sine.inOut", repeat:1, yoyo:true }, 1.70);

    // Seam clear — fade out across the trailing overlap with scene 58 (local 1.96-2.38).
    tl.to("#scene-57 .cap, #scene-57 .rig", { opacity:0, duration:0.32, ease:"power2.inOut" }, 1.96);

    window.__timelines["scene-57"] = tl;
  </script>
</body>
</html>
