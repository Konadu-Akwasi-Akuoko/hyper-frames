<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 28 — those libraries were fighting their own language's defaults</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-28 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-28 .head { position:absolute; left:50%; top:17%; transform:translateX(-50%); font-size:46px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-28 .head .fg { color:var(--danger); font-weight:800; }

    #scene-28 .stage { position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:0; }

    /* the aftermarket async library — pulls right */
    #scene-28 .lib { width:280px; height:150px; background:var(--panel); border:1px solid var(--border); border-radius:16px;
      display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:8px; padding:0 28px; opacity:0; will-change:transform,opacity; box-shadow:0 18px 46px rgba(0,0,0,0.42); }
    #scene-28 .lib .lib-nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:26px; font-weight:700; color:var(--accent-2); }
    #scene-28 .lib .lib-tag { font-size:18px; color:var(--muted); }

    /* the strain seam where they pull against each other */
    #scene-28 .strain { width:150px; height:150px; position:relative; display:flex; align-items:center; justify-content:center; }
    #scene-28 .strain .seam { width:4px; height:78px; border-radius:3px; background:var(--dim); opacity:0; will-change:transform,opacity,background-color; }
    #scene-28 .strain .glow { position:absolute; left:50%; top:50%; width:120px; height:120px; transform:translate(-50%,-50%) scale(0.4); border-radius:50%;
      background:radial-gradient(circle, rgba(255,107,93,0.34) 0%, rgba(255,107,93,0) 68%); opacity:0; will-change:transform,opacity; }
    /* opposing force arrows */
    #scene-28 .strain .arr { position:absolute; top:50%; font-size:30px; font-weight:800; color:var(--danger); opacity:0; will-change:transform,opacity; }
    #scene-28 .strain .arr.l { left:6px; transform:translateY(-50%); }
    #scene-28 .strain .arr.r { right:6px; transform:translateY(-50%); }

    /* the language and its built-in defaults — pulls left */
    #scene-28 .lang { width:412px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px 24px; opacity:0; will-change:transform,opacity; box-shadow:0 18px 46px rgba(0,0,0,0.42); }
    #scene-28 .lang .lhead { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:20px; color:var(--muted); margin-bottom:16px; }
    #scene-28 .lang .chips { display:flex; flex-direction:column; gap:11px; }
    #scene-28 .lang .chip { display:flex; align-items:center; gap:12px; height:52px; padding:0 18px; background:#0d1016; border:1px solid var(--border); border-radius:10px; opacity:0; will-change:transform,opacity,border-color; }
    #scene-28 .lang .chip .cn { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:21px; font-weight:600; color:var(--soft); white-space:nowrap; }
    #scene-28 .lang .chip .lock { margin-left:auto; font-size:16px; font-weight:700; color:var(--muted); }
  </style>
</head>
<body>
  <div id="scene-28" data-composition-id="scene-28" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">But those libraries were <span class="fg">fighting</span> their own language's defaults.</div>

    <div class="stage">
      <div class="lib" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1000">
        <span class="lib-nm">async library</span>
        <span class="lib-tag">an add-on, fighting upstream</span>
      </div>

      <div class="strain">
        <span class="arr l">&larr;</span>
        <span class="glow"></span>
        <span class="seam" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1940"></span>
        <span class="arr r">&rarr;</span>
      </div>

      <div class="lang" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="1200">
        <div class="lhead">the language</div>
        <div class="chips">
          <div class="chip c1" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="4000"><span class="cn">blocking by default</span><span class="lock">baked&#8209;in</span></div>
          <div class="chip c2"><span class="cn">synchronous I/O</span><span class="lock">baked&#8209;in</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(211.88).
    // But 0.50 / libraries 1.00 / fighting 1.94 / language's 3.22 / defaults 4.00.

    // "But those libraries…"
    tl.fromTo("#scene-28 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the two sides slide in, facing off.
    tl.fromTo("#scene-28 .lib", { opacity:0, x:-44 }, { opacity:1, x:0, duration:0.5, ease:"power3.out" }, 1.00);
    tl.fromTo("#scene-28 .lang", { opacity:0, x:44 }, { opacity:1, x:0, duration:0.5, ease:"power3.out" }, 1.20);
    tl.fromTo("#scene-28 .lang .chip", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.35, ease:"power2.out", stagger:0.18 }, 1.45);

    // "fighting" — the seam goes taut and red, both sides strain against the center, friction flares.
    tl.fromTo("#scene-28 .strain .seam", { opacity:0, scaleY:0.4 }, { opacity:1, scaleY:1, backgroundColor:"#ff6b5d", duration:0.4, ease:"power3.out" }, 1.94);
    tl.fromTo("#scene-28 .strain .arr.l", { opacity:0, x:14 }, { opacity:1, x:0, duration:0.32, ease:"back.out(2)" }, 1.94);
    tl.fromTo("#scene-28 .strain .arr.r", { opacity:0, x:-14 }, { opacity:1, x:0, duration:0.32, ease:"back.out(2)" }, 1.94);
    tl.fromTo("#scene-28 .strain .glow", { opacity:0, scale:0.4 }, { opacity:1, scale:1, duration:0.4, ease:"power2.out" }, 1.96);
    // the strain pulls the two boxes a hair toward the seam.
    tl.to("#scene-28 .lib", { x:12, duration:0.5, ease:"power2.inOut" }, 1.96);
    tl.to("#scene-28 .lang", { x:-12, duration:0.5, ease:"power2.inOut" }, 1.96);

    // "their own language's defaults" — the baked-in defaults harden (the thing being fought).
    tl.to("#scene-28 .lang .chip", { borderColor:"rgba(255,107,93,0.45)", duration:0.4, stagger:0.14 }, 4.00);
    tl.to("#scene-28 .lang .chip .lock", { color:"#ff6b5d", duration:0.4, stagger:0.14 }, 4.00);

    // idle: a low tension tremor in the seam and a faint flicker in the friction glow.
    tl.to("#scene-28 .strain .seam", { scaleY:0.9, duration:0.32, ease:"sine.inOut", repeat:3, yoyo:true }, 2.6);
    tl.to("#scene-28 .strain .glow", { opacity:0.55, duration:0.6, ease:"sine.inOut", repeat:1, yoyo:true }, 4.5);
    window.__timelines["scene-28"] = tl;
  </script>
</body>
</html>
