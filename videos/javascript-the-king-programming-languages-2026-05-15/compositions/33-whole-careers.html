<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 33 — and that's where they spent their whole careers</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-33 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    /* a faint warm echo of the event-world they lived in */
    #scene-33 .warmth {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 860px; height: 860px; border-radius: 50%;
      background: radial-gradient(circle, rgba(247,223,30,0.09), rgba(247,223,30,0) 60%);
      opacity: 0; will-change: opacity, transform;
    }

    #scene-33 .stage {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 1400px; text-align: center;
    }
    #scene-33 .a {
      font-size: 56px; font-weight: 500; color: var(--soft); letter-spacing: -1px; margin-bottom: 18px;
    }
    #scene-33 .b {
      font-size: 88px; font-weight: 800; color: var(--fg); letter-spacing: -2px; line-height: 1.05;
    }
    #scene-33 .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-33 .b .hl { color: var(--accent); will-change: text-shadow; }
  </style>
</head>
<body>
  <div id="scene-33" data-composition-id="scene-33" data-width="1920" data-height="1080">
    <div class="warmth"></div>
    <div class="stage">
      <div class="a">
        <span class="w">And</span> <span class="w">that&rsquo;s</span> <span class="w">where</span>
        <span class="w">they</span> <span class="w">spent</span>
      </div>
      <div class="b">
        <span class="w">their</span> <span class="w hl">whole</span> <span class="w hl">careers.</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(235.86).
    // "And that's where they spent" (And 0.50, that's 0.64, where 0.92, they 1.20, spent 1.34).
    const a = [0.50, 0.64, 0.92, 1.20, 1.34];
    gsap.utils.toArray("#scene-33 .a .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, a[i]);
    });

    // "their whole careers." — the payoff lands, big and warm (their 1.62, whole 1.92, careers 2.20).
    const b = [1.62, 1.92, 2.20];
    gsap.utils.toArray("#scene-33 .b .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, b[i]);
    });

    // the warm echo swells in behind as the line lands.
    tl.fromTo("#scene-33 .warmth",
      { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 1.4);

    // "careers" holds with a warm glow — a lifetime in the browser (careers 2.20).
    tl.fromTo("#scene-33 .b .hl",
      { textShadow: "0 0 0 rgba(247,223,30,0)" },
      { textShadow: "0 0 32px rgba(247,223,30,0.45)", duration: 0.5, ease: "power2.out", stagger: 0.1 }, 2.24);

    // Seam clear — fade out across the trailing overlap with scene 34 (local 2.92-3.42).
    tl.to("#scene-33 .stage, #scene-33 .warmth",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 2.92);

    window.__timelines["scene-33"] = tl;
  </script>
</body>
</html>
