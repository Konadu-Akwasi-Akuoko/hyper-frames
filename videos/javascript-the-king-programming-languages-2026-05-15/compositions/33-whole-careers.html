<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 33 — that's where they spent their whole careers</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-33 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-33 .head { position:absolute; left:50%; top:24%; transform:translateX(-50%); font-size:50px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-33 .head .wc { color:var(--accent-2); font-weight:800; }

    #scene-33 .midlabel { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font-family:"JetBrains Mono",ui-monospace,monospace; font-size:23px; color:var(--muted); white-space:nowrap; opacity:0; will-change:transform,opacity; }

    #scene-33 .railwrap { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); width:1040px; }
    #scene-33 .rail { position:relative; width:1040px; height:22px; background:#0d1016; border:1px solid var(--border); border-radius:999px; overflow:hidden; opacity:0; will-change:transform,opacity; }
    #scene-33 .rail .fill { position:absolute; left:0; top:0; height:100%; width:100%; transform-origin:left center; transform:scaleX(0); will-change:transform;
      background:linear-gradient(90deg, rgba(103,232,249,0.55), rgba(103,232,249,0.9)); border-radius:999px; }

    #scene-33 .axis { position:relative; width:1040px; height:30px; margin-top:14px; opacity:0; will-change:opacity; }
    #scene-33 .axis .yr { position:absolute; top:0; transform:translateX(-50%); font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--dim); }

    #scene-33 .payoff { position:absolute; left:50%; top:72%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:11px; padding:11px 22px; border-radius:999px;
      background:rgba(103,232,249,0.1); border:1px solid rgba(103,232,249,0.45); opacity:0; will-change:transform,opacity; }
    #scene-33 .payoff .pn { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; font-weight:700; color:var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-33" data-composition-id="scene-33" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">And there they spent their <span class="wc">whole careers</span>.</div>

    <div class="midlabel">every day &mdash; in the browser, in events</div>

    <div class="railwrap">
      <div class="rail"><div class="fill"></div></div>
      <div class="axis">
        <span class="yr" style="left:0%;">day one</span>
        <span class="yr" style="left:33%;">&middot;</span>
        <span class="yr" style="left:66%;">&middot;</span>
        <span class="yr" style="left:100%;">today</span>
      </div>
    </div>

    <div class="payoff"><span class="pn">a whole career</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(235.86).
    // and 0.50 / where 0.92 / spent 1.34 / whole 1.92 / careers 2.20 (held to 3.38).

    // "And there they spent their whole careers."
    tl.fromTo("#scene-33 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the career rail.
    tl.fromTo("#scene-33 .rail", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.45, ease:"power3.out" }, 0.70);
    tl.fromTo("#scene-33 .axis", { opacity:0 }, { opacity:1, duration:0.4 }, 0.92);
    tl.fromTo("#scene-33 .midlabel", { opacity:0, y:8 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 0.92);

    // "spent their whole careers" — the bar fills the entire span.
    tl.to("#scene-33 .rail .fill", { scaleX:1, duration:1.5, ease:"power2.inOut" }, 1.34);

    // the payoff stamps as the bar completes.
    tl.fromTo("#scene-33 .payoff", { opacity:0, scale:0.8, y:8 }, { opacity:1, scale:1, y:0, duration:0.4, ease:"back.out(2)" }, 2.84);

    // idle: a soft shimmer travels the filled bar.
    tl.fromTo("#scene-33 .rail .fill", { boxShadow:"0 0 0 rgba(103,232,249,0)" }, { boxShadow:"0 0 24px rgba(103,232,249,0.4)", duration:0.7, ease:"sine.inOut", repeat:1, yoyo:true }, 2.9);
    window.__timelines["scene-33"] = tl;
  </script>
</body>
</html>
