<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 48 — Atom's pitch was the hackable editor</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-48 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-48 .cap {
      position: absolute; left: 50%; top: 210px; transform: translateX(-50%);
      width: 1380px; text-align: center;
      font-size: 50px; font-weight: 600; color: var(--soft); letter-spacing: -0.8px;
    }
    #scene-48 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-48 .cap .hk { color: var(--accent); font-weight: 800; will-change: text-shadow; }

    #scene-48 .stage {
      position: absolute; left: 50%; top: 612px; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }
    #scene-48 .gear {
      font-size: 150px; line-height: 1; color: var(--accent);
      text-shadow: 0 0 40px rgba(247,223,30,0.35);
      opacity: 0; will-change: transform, opacity;
    }
    #scene-48 .toggles { display: flex; gap: 26px; }
    #scene-48 .tog {
      width: 96px; height: 46px; border-radius: 23px; background: #161b24; border: 1px solid var(--border);
      position: relative; opacity: 0; will-change: transform, opacity;
    }
    #scene-48 .tog .knob {
      position: absolute; top: 5px; left: 5px; width: 34px; height: 34px; border-radius: 50%;
      background: var(--dim); will-change: transform, background;
    }
  </style>
</head>
<body>
  <div id="scene-48" data-composition-id="scene-48" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">And</span> <span class="w">Atom&rsquo;s</span> <span class="w">pitch</span>
      <span class="w">was</span> <span class="w">the</span> <span class="w hk">hackable</span>
      <span class="w">editor.</span>
    </div>

    <div class="stage">
      <div class="gear">&#9881;</div>
      <div class="toggles">
        <div class="tog" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="2200" data-sfx-volume="0.42"><div class="knob"></div></div>
        <div class="tog"><div class="knob"></div></div>
        <div class="tog"><div class="knob"></div></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(305.80).
    // "And Atom's pitch was the hackable editor." (And 0.50 ... editor 2.56).
    const cw = [0.50, 0.76, 1.28, 1.74, 1.88, 1.96, 2.56];
    gsap.utils.toArray("#scene-48 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, cw[i]);
    });

    // the gear spins in and keeps turning — the editor is yours to tinker with.
    tl.fromTo("#scene-48 .gear",
      { opacity: 0, scale: 0.5, rotation: -90 },
      { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.70);
    tl.to("#scene-48 .gear", { rotation: 180, duration: 3.0, ease: "none" }, 1.3);

    // "hackable" — the word flares and the config toggles flip on in sequence (hackable 1.96).
    tl.fromTo("#scene-48 .cap .hk",
      { textShadow: "0 0 0 rgba(247,223,30,0)" },
      { textShadow: "0 0 26px rgba(247,223,30,0.55)", duration: 0.4, ease: "power2.out" }, 2.00);
    gsap.utils.toArray("#scene-48 .tog").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 1.96 + i * 0.16);
      tl.to(el, { borderColor: "rgba(247,223,30,0.5)", duration: 0.3 }, 2.10 + i * 0.16);
      tl.to(el.querySelector(".knob"), { x: 50, background: "#f7df1e", duration: 0.3, ease: "power2.inOut" }, 2.10 + i * 0.16);
    });

    // Seam clear — fade out across the trailing overlap with scene 49 (local 3.04-3.54).
    tl.to("#scene-48 .cap, #scene-48 .stage",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 3.04);

    window.__timelines["scene-48"] = tl;
  </script>
</body>
</html>
