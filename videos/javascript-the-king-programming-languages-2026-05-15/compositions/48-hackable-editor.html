<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 48 — Atom's pitch was the hackable editor</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --ok:#7dd87d; --atom:#a48bff; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-48 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-48 .cap { position:absolute; left:50%; top:210px; transform:translateX(-50%); width:1380px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-48 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-48 .cap .hk { color:var(--atom); font-weight:800; will-change:text-shadow; }

    /* the config panel — everything is yours to tweak */
    #scene-48 .panel { position:absolute; left:50%; top:632px; transform:translateX(-50%); width:480px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:28px 32px 30px; box-shadow:0 28px 80px rgba(0,0,0,0.5); opacity:0; will-change:transform,opacity; }
    #scene-48 .panel .phead { display:flex; align-items:center; gap:14px; padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:22px; }
    #scene-48 .panel .phead svg { width:36px; height:36px; }
    #scene-48 .panel .phead .gr { fill:var(--atom); }
    #scene-48 .panel .phead .gh { fill:var(--bg); }
    #scene-48 .panel .phead .pt { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:22px; font-weight:700; color:var(--soft); }

    #scene-48 .row { display:flex; align-items:center; justify-content:space-between; padding:11px 0; opacity:0; will-change:transform,opacity; }
    #scene-48 .row .rl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; color:var(--muted); will-change:color; }
    #scene-48 .toggle { width:66px; height:32px; border-radius:16px; background:#0d1016; border:1px solid var(--border); position:relative; flex:none; will-change:border-color,background; }
    #scene-48 .toggle .knob { position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:50%; background:var(--dim); will-change:transform,background; }
  </style>
</head>
<body>
  <div id="scene-48" data-composition-id="scene-48" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">and</span> <span class="w">Atom&rsquo;s</span> <span class="w">pitch</span>
      <span class="w">was</span> <span class="w">the</span> <span class="w hk">hackable</span>
      <span class="w">editor.</span>
    </div>

    <div class="panel" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1280">
      <div class="phead">
        <svg viewBox="0 0 48 48">
          <g class="gear">
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(0 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(45 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(90 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(135 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(180 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(225 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(270 24 24)"/>
            <rect class="gr" x="20.5" y="2" width="7" height="10" rx="2" transform="rotate(315 24 24)"/>
            <circle class="gr" cx="24" cy="24" r="15"/>
            <circle class="gh" cx="24" cy="24" r="6.5"/>
          </g>
        </svg>
        <span class="pt">~/.atom</span>
      </div>

      <div class="row"><span class="rl">themes</span><span class="toggle" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2080"><span class="knob"></span></span></div>
      <div class="row"><span class="rl">packages</span><span class="toggle"><span class="knob"></span></span></div>
      <div class="row"><span class="rl">keymaps</span><span class="toggle"><span class="knob"></span></span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(305.80).
    // and 0.50 / Atom's 0.76 / pitch 1.28 / was 1.74 / the 1.88 / hackable 1.96 / editor 2.56.

    // "and Atom's pitch was the hackable editor."
    const cw = [0.50, 0.76, 1.28, 1.74, 1.88, 1.96, 2.56];
    gsap.utils.toArray("#scene-48 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // the config panel settles in; the gear turns (deterministic, finite).
    tl.fromTo("#scene-48 .panel", { opacity:0, y:24, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 1.28);
    tl.fromTo("#scene-48 .gear", { rotation:-60, svgOrigin:"24 24" }, { rotation:0, svgOrigin:"24 24", duration:0.6, ease:"back.out(1.5)" }, 1.30);
    tl.to("#scene-48 .gear", { rotation:"+=360", svgOrigin:"24 24", duration:5.0, ease:"none", repeat:1 }, 1.95);

    // "hackable" — the word flares.
    tl.fromTo("#scene-48 .cap .hk", { textShadow:"0 0 0 rgba(164,139,255,0)" }, { textShadow:"0 0 26px rgba(164,139,255,0.55)", duration:0.4, ease:"power2.out" }, 2.00);

    // ...the config rows flip on in sequence — everything is yours.
    gsap.utils.toArray("#scene-48 .row").forEach((el, i) => {
      const t = 1.96 + i * 0.2;
      tl.fromTo(el, { opacity:0, x:-12 }, { opacity:1, x:0, duration:0.3, ease:"power2.out" }, t);
      tl.to(el.querySelector(".toggle"), { borderColor:"rgba(164,139,255,0.5)", background:"rgba(164,139,255,0.12)", duration:0.3 }, t + 0.12);
      tl.to(el.querySelector(".knob"), { x:34, background:"#a48bff", duration:0.3, ease:"power2.inOut" }, t + 0.12);
      tl.to(el.querySelector(".rl"), { color:"#c2c9d4", duration:0.3 }, t + 0.12);
    });

    // Seam clear — fade out across the trailing overlap with scene 49 (local 3.04-3.54).
    tl.to("#scene-48 .cap, #scene-48 .panel", { opacity:0, duration:0.34, ease:"power2.inOut" }, 3.04);

    window.__timelines["scene-48"] = tl;
  </script>
</body>
</html>
