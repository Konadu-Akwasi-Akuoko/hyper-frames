<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 75 — Not a webview pretending to be native. Actual native UI controls, described in JavaScript.</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
      --win: #4cc2ff; --react: #61dafb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-75 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-75 .cap {
      position: absolute; left: 50%; top: 150px; transform: translateX(-50%);
      width: 1520px; text-align: center; line-height: 1.25;
      font-size: 44px; font-weight: 600; color: var(--soft); letter-spacing: -0.8px;
    }
    #scene-75 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-75 .cap .lie { color: var(--danger); font-weight: 800; }
    #scene-75 .cap .tru { color: var(--ok); font-weight: 800; }
    #scene-75 .cap .js { color: var(--accent); font-weight: 800; }

    #scene-75 .stage {
      position: absolute; left: 50%; top: 668px; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 30px;
    }

    /* the false claim card — presented, then struck */
    #scene-75 .claim {
      width: 760px; padding: 22px 28px; border-radius: 16px; display: flex; align-items: center; gap: 20px;
      background: rgba(17,20,27,0.96); border: 1px solid var(--border);
      opacity: 0; will-change: transform, opacity, filter;
    }
    #scene-75 .claim .mark {
      width: 52px; height: 52px; border-radius: 12px; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 800;
    }
    #scene-75 .claim .body { display: flex; flex-direction: column; gap: 6px; position: relative; }
    #scene-75 .claim .lbl { font-size: 28px; font-weight: 700; color: var(--fg); letter-spacing: -0.3px; }
    #scene-75 .claim .sub { font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 600; color: var(--muted); }

    #scene-75 .claim.false { border-color: rgba(255,107,93,0.4); }
    #scene-75 .claim.false .mark { color: var(--danger); border: 2px solid rgba(255,107,93,0.6); }
    #scene-75 .claim.false .strike {
      position: absolute; left: -6px; top: 18px; height: 4px; width: 0; border-radius: 2px;
      background: var(--danger); transform-origin: left center; will-change: width;
    }

    #scene-75 .claim.true { border-color: rgba(125,216,125,0.45); width: 800px; }
    #scene-75 .claim.true .mark { color: var(--ok); border: 2px solid rgba(125,216,125,0.6); }
    #scene-75 .claim.true .lbl { color: var(--ok); }
    #scene-75 .claim.true .chip {
      display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 4px;
      font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 700; color: var(--accent);
      padding: 5px 13px; border-radius: 8px; background: rgba(247,223,30,0.1); border: 1px solid rgba(247,223,30,0.4);
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-75" data-composition-id="scene-75" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">Not</span> <span class="w">a</span> <span class="w lie">web</span><span class="w lie">view</span>
      <span class="w lie">pretending</span> <span class="w">to</span> <span class="w">be</span> <span class="w">native.</span>
      <span class="w tru">Actual</span> <span class="w tru">native</span> <span class="w tru">UI</span> <span class="w tru">controls,</span>
      <span class="w">described</span> <span class="w">in</span> <span class="w js">JavaScript.</span>
    </div>

    <div class="stage">
      <div class="claim false">
        <div class="mark">&#10007;</div>
        <div class="body">
          <span class="lbl">webview pretending to be native</span>
          <span class="sub">HTML in a box wearing a costume</span>
          <div class="strike"></div>
        </div>
      </div>

      <div class="claim true" data-sfx-on-anchor="pop" data-sfx-asset="Mister Horse Free SFX/Pop/Echoing Pop 01.wav" data-sfx-at-scene-ms="3270" data-sfx-volume="0.35">
        <div class="mark">&#10003;</div>
        <div class="body">
          <span class="lbl">actual native UI controls</span>
          <span class="chip" data-sfx-on-anchor="ui-tick" data-sfx-asset="Mister Horse Free SFX/Click/Soft Click 01.wav" data-sfx-at-scene-ms="6610" data-sfx-volume="0.42">&lt;NativeButton /&gt; &middot; described in JavaScript</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(420.57).
    // "Not a webview pretending to be native. Actual native UI controls, described in JavaScript."
    // (not 0.50, webview 0.86, pretending 1.22, native, 2.08, Actual 3.02, controls 4.30, described 5.30, JavaScript 6.40).
    const cw = [0.50, 0.74, 0.86, 1.02, 1.22, 1.78, 1.90, 2.08,
                3.02, 3.58, 4.02, 4.30, 5.30, 6.02, 6.40];
    gsap.utils.toArray("#scene-75 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" }, cw[i]);
    });

    // "webview" — the false claim is presented (webview 0.86).
    tl.fromTo("#scene-75 .claim.false",
      { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.86);

    // "pretending" — the lie is struck through and the card greys out (pretending 1.22).
    tl.to("#scene-75 .claim.false .strike", { width: 430, duration: 0.32, ease: "power2.in" }, 1.22);
    tl.to("#scene-75 .claim.false", { filter: "grayscale(0.8)", opacity: 0.5, duration: 0.5, ease: "power2.out" }, 1.5);

    // "Actual native UI controls" — the truth asserts, rising below (Actual 3.02).
    tl.fromTo("#scene-75 .claim.true",
      { opacity: 0, y: 26, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 3.02);

    // "described in JavaScript" — the JS code chip pops in (JavaScript 6.40).
    tl.fromTo("#scene-75 .claim.true .chip",
      { opacity: 0, y: 10, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, 6.40);

    // Subtle life — the true card holds with a faint breath.
    tl.to("#scene-75 .claim.true", { y: "-=4", duration: 1.3, ease: "sine.inOut" }, 5.0);

    // Seam clear — fade out across the trailing overlap with scene 76 (local 7.16-7.66).
    tl.to("#scene-75 .cap, #scene-75 .stage",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 7.16);

    window.__timelines["scene-75"] = tl;
  </script>
</body>
</html>
