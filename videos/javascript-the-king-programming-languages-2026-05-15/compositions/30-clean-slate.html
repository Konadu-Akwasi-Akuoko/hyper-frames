<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 30 — JavaScript had no baggage, a clean slate</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-30 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-30 .head { position:absolute; left:50%; top:16%; transform:translateX(-50%); font-size:48px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-30 .head .b { color:var(--accent-2); font-weight:800; }

    #scene-30 .slate { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); width:640px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:26px 30px 30px; opacity:0; will-change:transform,opacity; box-shadow:0 28px 74px rgba(0,0,0,0.46); }
    #scene-30 .slate .shead { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
    #scene-30 .slate .shead img { width:40px; height:40px; object-fit:contain; }
    #scene-30 .slate .shead .nm { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:26px; font-weight:700; color:var(--soft); }
    #scene-30 .slate .sub { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--muted); margin-bottom:22px; }

    #scene-30 .rows { display:flex; flex-direction:column; gap:14px; }
    #scene-30 .row { position:relative; display:flex; align-items:center; height:60px; padding:0 20px; background:#0d1016; border:1px solid var(--border); border-radius:12px; opacity:0; will-change:transform,opacity; }
    #scene-30 .row .rn { position:relative; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:23px; font-weight:600; color:var(--soft); will-change:color; }
    #scene-30 .row .rn .strike { position:absolute; left:-3px; right:-3px; top:50%; height:3px; border-radius:2px; background:var(--muted); transform:scaleX(0); transform-origin:left center; will-change:transform; }
    #scene-30 .row .badge { margin-left:auto; display:flex; align-items:center; gap:9px; padding:6px 15px; border-radius:999px; background:rgba(125,216,125,0.1); border:1px solid rgba(125,216,125,0.36); opacity:0; will-change:transform,opacity; }
    #scene-30 .row .badge .ck { font-size:17px; font-weight:800; color:var(--ok); }
    #scene-30 .row .badge .bt { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:17px; font-weight:700; color:var(--ok); }

    #scene-30 .footer { position:absolute; left:50%; top:88%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:12px; opacity:0; will-change:transform,opacity; }
    #scene-30 .footer .fx { font-size:30px; font-weight:800; color:var(--accent-2); will-change:text-shadow; }
    #scene-30 .footer .sub2 { font-size:24px; color:var(--muted); }
  </style>
</head>
<body>
  <div id="scene-30" data-composition-id="scene-30" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">JavaScript carried <span class="b">nothing</span>.</div>

    <div class="slate">
      <div class="shead"><img src="../assets/icons/javascript.svg" alt="JavaScript"><span class="nm">JavaScript</span></div>
      <div class="sub">what it didn't carry</div>
      <div class="rows">
        <div class="row r1"><span class="rn">I/O library<span class="strike"></span></span><span class="badge" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2400"><span class="ck">&#10003;</span><span class="bt">none</span></span></div>
        <div class="row r2"><span class="rn">legacy<span class="strike"></span></span><span class="badge" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4300"><span class="ck">&#10003;</span><span class="bt">none</span></span></div>
        <div class="row r3"><span class="rn">defaults to fight<span class="strike"></span></span><span class="badge" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="5920"><span class="ck">&#10003;</span><span class="bt">none</span></span></div>
      </div>
    </div>

    <div class="footer" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="6200"><span class="fx">a clean slate</span><span class="sub2">&mdash; nothing to undo</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(221.74).
    // JavaScript 0.50 / I/O 2.12 / library 2.32 / at-all 2.66 / legacy 4.02 / defaults 5.38 / to-fight 5.92.

    // "JavaScript carried nothing."
    tl.fromTo("#scene-30 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the slate comes up, with the three empty rows.
    tl.fromTo("#scene-30 .slate", { opacity:0, y:24, scale:0.97 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 0.70);
    tl.fromTo("#scene-30 .row", { opacity:0, x:-16 }, { opacity:1, x:0, duration:0.4, ease:"power2.out", stagger:0.16 }, 1.00);

    // "no I/O library at all" — struck, marked none.
    tl.to("#scene-30 .r1 .strike", { scaleX:1, duration:0.4, ease:"power2.out" }, 2.12);
    tl.to("#scene-30 .r1 .rn", { color:"#5a626e", duration:0.4 }, 2.12);
    tl.fromTo("#scene-30 .r1 .badge", { opacity:0, scale:0.7, x:10 }, { opacity:1, scale:1, x:0, duration:0.35, ease:"back.out(2)" }, 2.40);

    // "no legacy" — struck.
    tl.to("#scene-30 .r2 .strike", { scaleX:1, duration:0.4, ease:"power2.out" }, 4.02);
    tl.to("#scene-30 .r2 .rn", { color:"#5a626e", duration:0.4 }, 4.02);
    tl.fromTo("#scene-30 .r2 .badge", { opacity:0, scale:0.7, x:10 }, { opacity:1, scale:1, x:0, duration:0.35, ease:"back.out(2)" }, 4.30);

    // "no defaults to fight" — struck.
    tl.to("#scene-30 .r3 .strike", { scaleX:1, duration:0.4, ease:"power2.out" }, 5.38);
    tl.to("#scene-30 .r3 .rn", { color:"#5a626e", duration:0.4 }, 5.38);
    tl.fromTo("#scene-30 .r3 .badge", { opacity:0, scale:0.7, x:10 }, { opacity:1, scale:1, x:0, duration:0.35, ease:"back.out(2)" }, 5.92);

    // the payoff: a clean slate.
    tl.fromTo("#scene-30 .footer", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 6.20);
    tl.fromTo("#scene-30 .footer .fx", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 26px rgba(103,232,249,0.5)", duration:0.5 }, 6.30);

    // idle: a soft breathing glow on the slate.
    tl.fromTo("#scene-30 .slate", { boxShadow:"0 28px 74px rgba(0,0,0,0.46)" }, { boxShadow:"0 28px 74px rgba(0,0,0,0.46), 0 0 36px rgba(103,232,249,0.12)", duration:1.1, ease:"sine.inOut", repeat:1, yoyo:true }, 6.4);
    window.__timelines["scene-30"] = tl;
  </script>
</body>
</html>
