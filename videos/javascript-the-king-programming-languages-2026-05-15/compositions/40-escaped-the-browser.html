<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 40 — JavaScript had escaped the browser</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-40 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-40 .cap {
      position: absolute; left: 50%; top: 168px; transform: translateX(-50%);
      width: 1400px; text-align: center;
      font-size: 52px; font-weight: 600; color: var(--soft); letter-spacing: -1px;
    }
    #scene-40 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-40 .cap .esc { color: var(--accent); font-weight: 800; will-change: text-shadow; }

    #scene-40 .stage {
      position: absolute; left: 50%; top: 660px; transform: translate(-50%, -50%);
      width: 640px; height: 360px;
    }

    /* the browser the language is trapped in */
    #scene-40 .browser {
      position: absolute; inset: 0;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.45);
      overflow: visible; opacity: 0; will-change: transform, opacity;
    }
    #scene-40 .browser .bar {
      display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    #scene-40 .browser .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
    #scene-40 .browser .url {
      flex: 1; height: 30px; margin-left: 8px; border-radius: 8px; background: #161b24; border: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px;
      font-family: "JetBrains Mono", monospace; font-size: 16px; color: var(--muted);
    }
    #scene-40 .browser .crack {
      position: absolute; left: 0; right: 0; top: 132px; height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform: scaleX(0); transform-origin: center; opacity: 0; will-change: transform, opacity;
    }

    /* the JavaScript mark that breaks free */
    #scene-40 .js {
      position: absolute; left: 50%; top: 234px; transform: translate(-50%, -50%);
      width: 132px; height: 132px; border-radius: 22px; background: var(--accent);
      display: flex; align-items: flex-end; justify-content: flex-end; padding: 14px 18px;
      box-shadow: 0 0 0 rgba(247,223,30,0);
      opacity: 0; will-change: transform, opacity, box-shadow;
    }
    #scene-40 .js span {
      font-family: "JetBrains Mono", monospace; font-size: 56px; font-weight: 900; color: #0b0d12; letter-spacing: -3px; line-height: 1;
    }

    /* the burst behind the break-out */
    #scene-40 .burst {
      position: absolute; left: 50%; top: 30%; width: 320px; height: 320px; margin: -160px 0 0 -160px;
      border-radius: 50%; border: 4px solid var(--accent); opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-40" data-composition-id="scene-40" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">JavaScript</span> <span class="w">had</span>
      <span class="w esc">escaped</span> <span class="w">the</span> <span class="w">browser.</span>
    </div>

    <div class="stage" data-allow-overflow>
      <div class="burst"></div>
      <div class="browser" data-allow-overflow>
        <div class="bar"><i></i><i></i><i></i><div class="url">javascript : the browser</div></div>
        <div class="crack"></div>
      </div>
      <div class="js" data-sfx-on-anchor="whoosh" data-sfx-asset="Anime SFX/Camera Whoosh 02.mp3" data-sfx-at-scene-ms="2150"><span>JS</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(266.56).
    // "JavaScript had escaped the browser." (JavaScript 0.50, had 1.70, escaped 2.04, the 2.61, browser 2.80).
    const cw = [0.50, 1.70, 2.04, 2.61, 2.80];
    gsap.utils.toArray("#scene-40 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, cw[i]);
    });

    // "JavaScript" — the browser, with the language trapped inside, appears (JavaScript 0.50).
    tl.fromTo("#scene-40 .browser",
      { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.55);
    tl.fromTo("#scene-40 .js",
      { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 0.85);

    // "escaped" — the mark bursts up and out of the browser; the frame cracks and recedes (escaped 2.04).
    tl.fromTo("#scene-40 .browser .crack",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 2.04);
    tl.to("#scene-40 .js",
      { y: -300, scale: 1.7, duration: 0.7, ease: "back.out(1.3)" }, 2.10);
    tl.to("#scene-40 .js",
      { boxShadow: "0 0 50px rgba(247,223,30,0.6)", duration: 0.5, ease: "power2.out" }, 2.10);
    // the burst ring blows outward behind it (immediateRender off so it stays hidden until the break-out).
    tl.fromTo("#scene-40 .burst",
      { opacity: 0.8, scale: 0.3 }, { opacity: 0, scale: 1.3, duration: 0.8, ease: "power2.out", immediateRender: false }, 2.14);
    // "the browser" — the emptied frame dims and sinks away, left behind (browser 2.80).
    tl.to("#scene-40 .browser",
      { opacity: 0.32, scale: 0.9, y: 40, duration: 0.6, ease: "power2.inOut" }, 2.60);

    // Subtle life — the freed mark hangs and breathes.
    tl.to("#scene-40 .js", { y: "-=8", duration: 1.4, ease: "sine.inOut", repeat: 1, yoyo: true }, 3.0);

    // Seam clear — fade out across the trailing overlap with scene 41 (local 3.56-4.06).
    tl.to("#scene-40 .cap, #scene-40 .stage",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 3.56);

    window.__timelines["scene-40"] = tl;
  </script>
</body>
</html>
