<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 40 — JavaScript had escaped the browser</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-40 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-40 .head { position:absolute; left:50%; top:16%; transform:translateX(-50%); font-size:50px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-40 .head .esc { color:var(--accent-2); font-weight:800; }

    /* the browser — JS's old cage */
    #scene-40 .browser { position:absolute; left:50%; top:62%; transform:translate(-50%,-50%); width:380px; height:266px; background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; will-change:opacity,filter; box-shadow:0 24px 60px rgba(0,0,0,0.46); }
    #scene-40 .browser .bt { height:44px; display:flex; align-items:center; padding:0 18px; background:#0d1016; border-bottom:1px solid var(--border); }
    #scene-40 .browser .bt span { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--muted); }
    #scene-40 .browser .bv { position:relative; height:222px; }

    /* the escape burst at the top edge */
    #scene-40 .burst { position:absolute; left:50%; top:calc(62% - 133px); transform:translate(-50%,-50%); width:90px; height:90px; border-radius:50%; border:3px solid rgba(247,223,30,0.7); opacity:0; will-change:transform,opacity; }

    /* the JS logo — escaping */
    #scene-40 .js { position:absolute; left:50%; top:62%; transform:translate(-50%,-50%); width:118px; height:118px; opacity:0; will-change:transform,opacity; }
    #scene-40 .js img { width:118px; height:118px; object-fit:contain; filter:drop-shadow(0 0 0 rgba(247,223,30,0)); will-change:filter; }
  </style>
</head>
<body>
  <div id="scene-40" data-composition-id="scene-40" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">JavaScript had <span class="esc">escaped</span> the browser.</div>

    <div class="browser">
      <div class="bt"><span>browser</span></div>
      <div class="bv"></div>
    </div>

    <div class="burst" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="2040"></div>
    <div class="js" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1000"><img src="../assets/icons/javascript.svg" alt="JavaScript"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(266.56).
    // JavaScript 0.50 / had 1.70 / escaped 2.04 / the 2.61 / browser 2.80.

    // "JavaScript had…"
    tl.fromTo("#scene-40 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the browser cage, with JS held inside.
    tl.fromTo("#scene-40 .browser", { opacity:0, y:20, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 0.70);
    tl.fromTo("#scene-40 .js", { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.45, ease:"back.out(1.8)" }, 1.00);
    // a restless wobble — it wants out.
    tl.to("#scene-40 .js", { rotation:6, duration:0.18, ease:"sine.inOut", repeat:3, yoyo:true }, 1.5);

    // "escaped" — JS bursts up and out of the frame, leaving the cage empty.
    tl.fromTo("#scene-40 .burst", { opacity:0.9, scale:0.3 }, { opacity:0, scale:3, duration:0.6, ease:"power2.out" }, 2.04);
    tl.to("#scene-40 .js", { y:-300, x:120, scale:1.55, rotation:-10, duration:0.7, ease:"power2.out" }, 2.04);
    tl.to("#scene-40 .js img", { filter:"drop-shadow(0 0 34px rgba(247,223,30,0.7))", duration:0.5 }, 2.04);
    // the cage dims, emptied.
    tl.to("#scene-40 .browser", { opacity:0.4, filter:"grayscale(0.6) brightness(0.7)", duration:0.5 }, 2.30);

    // "the browser" — JS hangs free above, breathing.
    tl.to("#scene-40 .js", { y:-310, duration:1.0, ease:"sine.inOut", repeat:1, yoyo:true }, 2.9);
    window.__timelines["scene-40"] = tl;
  </script>
</body>
</html>
