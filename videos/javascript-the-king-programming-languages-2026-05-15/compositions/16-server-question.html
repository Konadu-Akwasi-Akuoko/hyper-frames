<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 16 — how the hell did JavaScript get to the server?</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    @font-face { font-family:"Excalifont"; src:url("../fonts/Excalifont-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-16 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-16 .head { position:absolute; left:50%; top:20%; transform:translateX(-50%); font-size:54px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-16 .head .js { color:var(--soft); font-weight:800; }
    #scene-16 .head .sv { color:var(--soft); font-weight:800; }

    #scene-16 .stage { position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:150px; }

    /* browser window — JavaScript's home */
    #scene-16 .browser { width:440px; height:300px; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; opacity:0; will-change:transform,opacity; box-shadow:0 26px 70px rgba(0,0,0,0.45); }
    #scene-16 .browser .bar { height:48px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:9px; padding:0 18px; }
    #scene-16 .browser .bar .d { width:11px; height:11px; border-radius:50%; background:var(--dim); }
    #scene-16 .browser .bar .url { flex:1; height:22px; margin-left:10px; background:#0d1016; border-radius:6px; }
    #scene-16 .browser .view { height:calc(300px - 48px); display:flex; align-items:center; justify-content:center; }
    #scene-16 .browser .view img { width:128px; height:128px; object-fit:contain; filter:drop-shadow(0 12px 30px rgba(247,223,30,0.18)); }

    /* server rack — the destination */
    #scene-16 .rack { width:280px; height:320px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:13px; opacity:0; will-change:transform,opacity; box-shadow:0 26px 70px rgba(0,0,0,0.45); }
    #scene-16 .rack .unit { flex:1; background:#0d1016; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; padding:0 16px; gap:11px; }
    #scene-16 .rack .unit .led { width:9px; height:9px; border-radius:50%; background:var(--dim); }
    #scene-16 .rack .unit .led.on { background:var(--accent-2); box-shadow:0 0 10px rgba(103,232,249,0.7); }
    #scene-16 .rack .unit .vent { margin-left:auto; width:64px; height:3px; border-radius:2px; background:var(--border);
      box-shadow:0 7px 0 var(--border), 0 14px 0 var(--border); }

    /* the leap across the gap */
    #scene-16 .link { position:absolute; left:calc(50% + 80px); top:58%; transform:translate(-50%,-50%); width:150px; height:160px; pointer-events:none; }
    #scene-16 .link svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    #scene-16 .link .arc { fill:none; stroke:var(--accent-2); stroke-width:3; stroke-linecap:round; }
    #scene-16 .link .qm { position:absolute; left:50%; top:-26px; transform:translateX(-50%); font-family:"Excalifont","Inter",sans-serif;
      font-size:92px; color:var(--accent-2); text-shadow:0 0 24px rgba(103,232,249,0.5); opacity:0; will-change:transform,opacity; }
  </style>
</head>
<body>
  <div id="scene-16" data-composition-id="scene-16" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">How the hell did <span class="js">JavaScript</span> get to the <span class="sv" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="5520">server</span>?</div>

    <div class="stage">
      <div class="browser" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1100">
        <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="url"></span></div>
        <div class="view"><img src="../assets/icons/javascript.svg" alt="JavaScript"></div>
      </div>
      <div class="rack" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2240">
        <div class="unit"><span class="led on"></span><span class="led"></span><span class="vent"></span></div>
        <div class="unit"><span class="led"></span><span class="led on"></span><span class="vent"></span></div>
        <div class="unit"><span class="led on"></span><span class="led"></span><span class="vent"></span></div>
        <div class="unit"><span class="led"></span><span class="led"></span><span class="vent"></span></div>
      </div>
    </div>

    <div class="link" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="4300">
      <svg viewBox="0 0 150 160" preserveAspectRatio="none">
        <path class="arc" d="M2 120 C 40 10, 110 10, 148 120"/>
      </svg>
      <div class="qm">?</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(129.50).
    // So-guys 0.50 / question 2.24 / how-hell 3.22 / JavaScript 4.30 / server 5.52.

    // the question lands.
    tl.fromTo("#scene-16 .head", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.50);

    // JavaScript's home: the browser.
    tl.fromTo("#scene-16 .browser", { opacity:0, x:-40, scale:0.96 }, { opacity:1, x:0, scale:1, duration:0.55, ease:"power3.out" }, 1.10);

    // the destination: a server rack.
    tl.fromTo("#scene-16 .rack", { opacity:0, x:40, scale:0.96 }, { opacity:1, x:0, scale:1, duration:0.55, ease:"power3.out" }, 2.24);

    // "JavaScript" — the leap arc draws + the incredulous "?" pops.
    const arc = document.querySelector("#scene-16 .arc");
    const len = arc.getTotalLength();
    gsap.set(arc, { strokeDasharray:len, strokeDashoffset:len });
    tl.to("#scene-16 .arc", { strokeDashoffset:0, duration:0.5, ease:"power2.inOut" }, 4.30);
    tl.fromTo("#scene-16 .head .js", { textShadow:"0 0 0 rgba(247,223,30,0)" }, { textShadow:"0 0 28px rgba(247,223,30,0.5)", duration:0.4 }, 4.30);
    tl.fromTo("#scene-16 .qm", { opacity:0, scale:0.4, rotate:-12 }, { opacity:1, scale:1, rotate:-6, duration:0.45, ease:"back.out(2.2)" }, 4.55);

    // "server" — the rack lights up, destination confirmed.
    tl.to("#scene-16 .rack .led", { background:"#67e8f9", boxShadow:"0 0 10px rgba(103,232,249,0.7)", duration:0.4, stagger:0.05 }, 5.52);
    tl.fromTo("#scene-16 .head .sv", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 26px rgba(103,232,249,0.5)", duration:0.4 }, 5.52);

    // idle: the "?" wobbles, the leap breathes.
    tl.to("#scene-16 .qm", { rotate:-9, duration:1.8, ease:"sine.inOut", repeat:1, yoyo:true }, 5.6);
    window.__timelines["scene-16"] = tl;
  </script>
</body>
</html>
