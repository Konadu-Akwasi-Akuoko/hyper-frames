<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 13 — slap AI on it</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; }
    @font-face { font-family:"Excalifont"; src:url("../fonts/Excalifont-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-13 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-13 .stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:640px; }
    #scene-13 .card { position:relative; height:330px; background:var(--panel); border:1px solid var(--border); border-radius:20px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; opacity:0; will-change:transform,opacity;
      box-shadow:0 30px 80px rgba(0,0,0,0.45); }
    #scene-13 .card .rocket { width:96px; height:96px; color:var(--muted); }
    #scene-13 .card .lbl { font-size:36px; font-weight:600; color:var(--soft); }

    /* the "AI" sticker that gets slapped on */
    #scene-13 .badge { position:absolute; right:-44px; top:-44px; width:150px; height:150px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center; transform:scale(0) rotate(-18deg); opacity:0;
      will-change:transform,opacity; box-shadow:0 18px 44px rgba(247,223,30,0.35); }
    #scene-13 .badge span { font-size:62px; font-weight:900; color:#0b0d12; letter-spacing:-1px; }

    #scene-13 .status { margin-top:48px; display:flex; flex-direction:column; gap:18px; }
    #scene-13 .row { display:flex; align-items:baseline; gap:16px; font-size:32px; opacity:0; will-change:transform,opacity; }
    #scene-13 .row .k { color:var(--muted); width:230px; text-align:right; font-weight:500; white-space:nowrap; }
    #scene-13 .row .v { font-weight:700; color:var(--soft); }
    #scene-13 .row.changed .v { font-family:"Excalifont","Inter",sans-serif; color:var(--muted); }
    #scene-13 .row.genius .v { color:var(--accent-2); }
    #scene-13 .row.genius .v .sp { text-shadow:0 0 18px rgba(103,232,249,0.7); }
  </style>
</head>
<body>
  <div id="scene-13" data-composition-id="scene-13" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="card" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="900">
        <svg class="rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c3 2 4.5 5 4.5 9 0 2-.6 3.7-1.5 5h-6c-.9-1.3-1.5-3-1.5-5 0-4 1.5-7 4.5-9z"/>
          <circle cx="12" cy="9" r="2"/><path d="M9 16l-3 3 1.5 .5M15 16l3 3-1.5 .5"/><path d="M10.5 19.5h3l-1.5 2.5z"/>
        </svg>
        <div class="lbl">your startup</div>
        <div class="badge" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2140"><span>AI</span></div>
      </div>
      <div class="status">
        <div class="row changed" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="4560"><span class="k">what changed</span><span class="v">nothing, really</span></div>
        <div class="row genius" data-sfx-on-anchor="msg-ding" data-sfx-at-scene-ms="6900"><span class="k">now</span><span class="v"><span class="sp">adjacent to genius &#10022;</span></span></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(102.48).
    // same-energy 0.90 / AI 2.14 / startup 2.88 / nothing-different 4.56 / adjacent-to-genius 6.90.

    // the plain startup card.
    tl.fromTo("#scene-13 .card", { opacity:0, y:30, scale:0.95 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 0.90);

    // "AI" gets slapped on — a hard slam.
    tl.fromTo("#scene-13 .badge", { opacity:0, scale:2.0, rotate:6 }, { opacity:1, scale:1, rotate:-15, duration:0.4, ease:"back.out(2.2)" }, 2.14);
    tl.to("#scene-13 .card", { x:"+=6", duration:0.08, yoyo:true, repeat:3 }, 2.14); // the slap shakes the card

    // "you did nothing different".
    tl.fromTo("#scene-13 .row.changed", { opacity:0, x:-14 }, { opacity:1, x:0, duration:0.45, ease:"power2.out" }, 4.56);

    // "but suddenly you are adjacent to genius" — the value pops despite no change.
    tl.fromTo("#scene-13 .row.genius", { opacity:0, x:-14 }, { opacity:1, x:0, duration:0.5, ease:"back.out(1.6)" }, 6.90);
    tl.fromTo("#scene-13 .card", { boxShadow:"0 30px 80px rgba(0,0,0,0.45)" }, { boxShadow:"0 30px 80px rgba(0,0,0,0.45), 0 0 60px rgba(103,232,249,0.3)", duration:0.5 }, 6.95);

    // idle: the AI sticker wobbles a touch like a real slapped-on sticker.
    tl.to("#scene-13 .badge", { rotate:-11, duration:2.2, ease:"sine.inOut", repeat:2, yoyo:true }, 3.2);
    window.__timelines["scene-13"] = tl;
  </script>
</body>
</html>
