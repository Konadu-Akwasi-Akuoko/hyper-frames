<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 45 — In 2013, an engineer at GitHub named Cheng Zhao</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-45 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    /* the dossier card */
    #scene-45 .card { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:stretch; gap:48px; background:var(--panel); border:1px solid var(--border); border-radius:24px; padding:44px 56px 44px 44px; box-shadow:0 32px 90px rgba(0,0,0,0.5); opacity:0; will-change:transform,opacity; }

    /* the portrait */
    #scene-45 .portrait { position:relative; width:250px; height:320px; border-radius:18px; overflow:hidden; flex:none; background:#0d1016; border:2px solid var(--border); will-change:opacity,filter,border-color,box-shadow; opacity:0.32; filter:grayscale(1); }
    #scene-45 .portrait img.headshot { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }

    #scene-45 .info { display:flex; flex-direction:column; justify-content:center; gap:20px; min-width:380px; }
    #scene-45 .info .year { align-self:flex-start; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; font-weight:700; letter-spacing:1px; color:var(--accent-2); border:1px solid rgba(103,232,249,0.4); border-radius:999px; padding:7px 22px; background:rgba(103,232,249,0.05); opacity:0; will-change:transform,opacity; }
    #scene-45 .info .name { font-size:64px; font-weight:800; color:var(--fg); letter-spacing:-1.5px; line-height:1.0; opacity:0; will-change:transform,opacity; }
    #scene-45 .info .role { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:500; color:var(--muted); opacity:0; will-change:transform,opacity; }
    #scene-45 .info .role img { width:34px; height:34px; filter:invert(1) brightness(0.92); opacity:0; will-change:opacity; }
    #scene-45 .info .role .gh { color:var(--soft); font-weight:700; opacity:0; will-change:opacity; }
    #scene-45 .info .role .sep { color:var(--dim); opacity:0; will-change:opacity; }
  </style>
</head>
<body>
  <div id="scene-45" data-composition-id="scene-45" data-width="1920" data-height="1080">
    <div class="card" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <div class="portrait" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="4040"
           data-asset data-asset-class="photo"
           data-asset-referent="Cheng Zhao (zcbenz), the GitHub engineer who created Atom Shell / Electron"
           data-asset-desc="A head-and-shoulders portrait of Cheng Zhao, the software engineer at GitHub who built Atom Shell (later renamed Electron). Likely sourced from a conference talk or his GitHub profile. Fills a 250x320 vertical portrait box; dark-friendly, neutral background.">
        <img class="headshot" src="../assets/images/cheng-zhao-portrait.png" alt="Cheng Zhao — GitHub engineer, Electron's creator">
      </div>

      <div class="info">
        <span class="year">2013</span>
        <span class="name">Cheng&nbsp;Zhao</span>
        <span class="role" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="2020">
          <span>Engineer</span>
          <span class="sep">&middot;</span>
          <img src="../assets/icons/github.svg" alt="GitHub" data-sfx-on-anchor="ui-tick" data-sfx-at-scene-ms="2680">
          <span class="gh">GitHub</span>
        </span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(293.48).
    // In 0.50 / 2013 0.64 / an 1.86 / engineer 2.02 / at 2.46 / GitHub 2.68 / named 3.52 / Cheng 4.04 / Zhao 4.42.

    // the card frame settles in.
    tl.fromTo("#scene-45 .card", { opacity:0, y:26, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"power3.out" }, 0.50);

    // "In 2013" — the year pill.
    tl.fromTo("#scene-45 .info .year", { opacity:0, y:12, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.45, ease:"back.out(1.7)" }, 0.64);

    // "an engineer" — the role word.
    tl.fromTo("#scene-45 .info .role", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 2.02);

    // "at GitHub" — the mark + company resolve.
    tl.to("#scene-45 .info .role .sep", { opacity:1, duration:0.3 }, 2.62);
    tl.fromTo("#scene-45 .info .role img", { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.4, ease:"back.out(2)" }, 2.68);
    tl.to("#scene-45 .info .role .gh", { opacity:1, duration:0.35 }, 2.72);

    // "named Cheng Zhao" — the portrait lights up and the name lands (the who).
    tl.to("#scene-45 .portrait", { opacity:1, filter:"grayscale(0)", borderColor:"#67e8f9", boxShadow:"0 0 30px rgba(103,232,249,0.3)", duration:0.55, ease:"power2.out" }, 4.04);
    tl.fromTo("#scene-45 .info .name", { opacity:0, x:22 }, { opacity:1, x:0, duration:0.5, ease:"power3.out" }, 4.04);

    // Subtle life — the card breathes.
    tl.to("#scene-45 .card", { y:"-=6", duration:2.4, ease:"sine.inOut", repeat:1, yoyo:true }, 1.4);

    // Seam clear — fade out across the trailing overlap with scene 46 (local 4.98-5.48).
    tl.to("#scene-45 .card", { opacity:0, duration:0.34, ease:"power2.inOut" }, 4.98);

    window.__timelines["scene-45"] = tl;
  </script>
</body>
</html>
