<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 39 — centered divs got to touch a database</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-39 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-39 .head { position:absolute; left:50%; top:15%; transform:translateX(-50%); font-size:46px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-39 .head .d { color:var(--accent-2); font-weight:800; }

    #scene-39 .stage { position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:60px; }

    /* the front-end dev: a browser centering a div */
    #scene-39 .frontend { display:flex; flex-direction:column; align-items:center; gap:14px; opacity:0; will-change:transform,opacity; }
    #scene-39 .frontend .card { width:300px; height:230px; background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 22px 56px rgba(0,0,0,0.44); }
    #scene-39 .frontend .fbar { height:40px; display:flex; align-items:center; padding:0 16px; background:#0d1016; border-bottom:1px solid var(--border); }
    #scene-39 .frontend .fbar span { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:16px; color:var(--muted); }
    #scene-39 .frontend .fviewport { height:140px; display:flex; align-items:center; justify-content:center; }
    #scene-39 .frontend .divbox { width:92px; height:58px; border:1.5px solid var(--accent-2); border-radius:9px; background:rgba(103,232,249,0.08);
      display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; font-weight:700; color:var(--accent-2); opacity:0; will-change:transform,opacity; }
    #scene-39 .frontend .fcss { height:50px; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:16px; color:var(--muted); opacity:0; will-change:opacity; }
    #scene-39 .frontend .flabel { font-size:21px; color:var(--soft); opacity:0; will-change:opacity; }

    /* the touch */
    #scene-39 .reach { display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; will-change:opacity; margin-bottom:42px; }
    #scene-39 .reach .rl { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--muted); }
    #scene-39 .reach .rr { position:relative; width:120px; height:2px; background:repeating-linear-gradient(90deg, var(--dim) 0 8px, transparent 8px 16px); }
    #scene-39 .reach .rr .ar { position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:0; height:0; border-top:7px solid transparent; border-bottom:7px solid transparent; border-left:11px solid var(--dim); }

    /* the database */
    #scene-39 .dbwrap { display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:42px; }
    #scene-39 .db { position:relative; width:170px; height:210px; opacity:0; will-change:transform,opacity; }
    #scene-39 .db svg { width:170px; height:210px; }
    #scene-39 .db .dbody { fill:var(--panel); stroke:var(--border); stroke-width:2.5; will-change:stroke,fill; }
    #scene-39 .db .dtop { fill:#0d1016; stroke:var(--border); stroke-width:2.5; will-change:stroke; }
    #scene-39 .db .dband { fill:none; stroke:var(--dim); stroke-width:2; will-change:stroke; }
    #scene-39 .db .sweat { position:absolute; right:30px; top:54px; width:14px; height:18px; border-radius:0 50% 50% 50%; transform:rotate(45deg); background:var(--accent-2); opacity:0; will-change:transform,opacity; }
    #scene-39 .db .glitch { position:absolute; left:18px; width:134px; height:3px; background:var(--danger); opacity:0; will-change:transform,opacity; }
    #scene-39 .dblabel { font-size:21px; color:var(--soft); opacity:0; will-change:opacity,color; }

    #scene-39 .punch { position:absolute; left:50%; top:85%; transform:translate(-50%,-50%); font-size:34px; font-weight:600; color:var(--soft); white-space:nowrap; opacity:0; will-change:transform,opacity; }
    #scene-39 .punch .ns { color:var(--danger); font-weight:800; }
  </style>
</head>
<body>
  <div id="scene-39" data-composition-id="scene-39" data-width="1920" data-height="1080">
    <div class="head" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">They centered <span class="d">divs</span> for a living.</div>

    <div class="stage">
      <div class="frontend">
        <div class="card">
          <div class="fbar"><span>index.html</span></div>
          <div class="fviewport"><div class="divbox" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1390">div</div></div>
          <div class="fcss">place-items: center;</div>
        </div>
        <span class="flabel">centered divs for a living</span>
      </div>

      <div class="reach">
        <span class="rl">touched</span>
        <span class="rr"><span class="ar"></span></span>
      </div>

      <div class="dbwrap" data-sfx-on-anchor="boom" data-sfx-at-scene-ms="4870">
        <div class="db" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="3390">
          <svg viewBox="0 0 170 210" preserveAspectRatio="none">
            <path class="dbody" d="M22 32 V172 A63 24 0 0 0 148 172 V32"/>
            <ellipse class="dtop" cx="85" cy="32" rx="63" ry="24"/>
            <path class="dband" d="M22 78 A63 24 0 0 0 148 78"/>
            <path class="dband" d="M22 124 A63 24 0 0 0 148 124"/>
          </svg>
          <span class="glitch" style="top:96px;"></span>
          <span class="glitch" style="top:138px;"></span>
          <span class="sweat" data-sfx-on-anchor="card-blip" data-sfx-at-scene-ms="6070"></span>
        </div>
        <span class="dblabel">a database</span>
      </div>
    </div>

    <div class="punch">&hellip;and the database has <span class="ns">never been the same</span>.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(259.33).
    // The 0.50 / centered 1.39 / for-a-living 2.23 / touch 3.39 / database 3.77 / and 4.87 / never 6.07 / same 6.81.

    // "They centered divs for a living."
    tl.fromTo("#scene-39 .head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.50);

    // the front-end card; the div snaps to center.
    tl.fromTo("#scene-39 .frontend", { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.5, ease:"power3.out" }, 0.71);
    tl.fromTo("#scene-39 .divbox", { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.4, ease:"back.out(2)" }, 1.39);
    tl.fromTo("#scene-39 .fcss", { opacity:0 }, { opacity:1, duration:0.35 }, 1.70);
    tl.fromTo("#scene-39 .flabel", { opacity:0 }, { opacity:1, duration:0.35 }, 2.23);

    // "got to touch a database" — the reach, then the DB slides in.
    tl.fromTo("#scene-39 .reach", { opacity:0, x:-8 }, { opacity:1, x:0, duration:0.4, ease:"power2.out" }, 3.09);
    tl.fromTo("#scene-39 .db", { opacity:0, x:26, scale:0.92 }, { opacity:1, x:0, scale:1, duration:0.5, ease:"power3.out" }, 3.39);
    tl.fromTo("#scene-39 .dblabel", { opacity:0 }, { opacity:1, duration:0.35 }, 3.77);

    // "and the database has never been the same" — it panics.
    // a nervous shake.
    tl.to("#scene-39 .db", { x:"+=5", duration:0.07, ease:"none", repeat:9, yoyo:true }, 4.87);
    // it reddens.
    tl.to("#scene-39 .db .dbody", { stroke:"#ff6b5d", fill:"rgba(255,107,93,0.08)", duration:0.4 }, 5.11);
    tl.to("#scene-39 .db .dtop", { stroke:"#ff6b5d", duration:0.4 }, 5.11);
    tl.to("#scene-39 .dblabel", { color:"#ff6b5d", duration:0.4 }, 5.11);
    // glitch bars flicker across.
    tl.fromTo("#scene-39 .glitch", { opacity:0, scaleX:0.2 }, { opacity:0.8, scaleX:1, duration:0.12, ease:"none", stagger:0.1, yoyo:true, repeat:3 }, 5.3);
    // a sweat drop rolls down on "never".
    tl.fromTo("#scene-39 .db .sweat", { opacity:0, y:-6 }, { opacity:1, y:0, duration:0.3, ease:"power1.in" }, 6.07);
    tl.to("#scene-39 .db .sweat", { y:60, opacity:0, duration:0.7, ease:"power1.in" }, 6.4);
    // it tips, queasy.
    tl.to("#scene-39 .db", { rotation:-7, duration:0.5, ease:"power2.inOut" }, 6.07);

    // the punchline.
    tl.fromTo("#scene-39 .punch", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 6.40);

    // idle: it keeps trembling, tipped.
    tl.to("#scene-39 .db", { x:"+=3", duration:0.1, ease:"none", repeat:5, yoyo:true }, 7.1);
    window.__timelines["scene-39"] = tl;
  </script>
</body>
</html>
