<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 50 — So Atom had to ship with a browser inside it</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
      --atom: #a48bff; --chrome: #4a8cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: "Inter", system-ui, sans-serif;
    }
    #scene-50 { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

    #scene-50 .cap {
      position: absolute; left: 50%; top: 188px; transform: translateX(-50%);
      width: 1400px; text-align: center;
      font-size: 50px; font-weight: 600; color: var(--soft); letter-spacing: -0.8px;
    }
    #scene-50 .cap .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
    #scene-50 .cap .br { color: var(--chrome); font-weight: 800; }

    /* the Atom editor — the outer window */
    #scene-50 .editor {
      position: absolute; left: 50%; top: 620px; transform: translate(-50%, -50%);
      width: 840px; border-radius: 14px; overflow: hidden;
      background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 28px 80px rgba(0,0,0,0.5);
      opacity: 0; will-change: transform, opacity, box-shadow;
    }
    #scene-50 .editor .bar {
      display: flex; align-items: center; gap: 12px; padding: 13px 18px;
      background: #0f1219; border-bottom: 1px solid var(--border);
    }
    #scene-50 .editor .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
    #scene-50 .editor .bar .title {
      margin-left: 8px; font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--muted);
    }
    #scene-50 .editor .bar .title b { color: var(--atom); font-weight: 700; }
    #scene-50 .editor .stage { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; }

    /* the browser — the inner window crammed inside the editor */
    #scene-50 .browser {
      width: 600px; border-radius: 10px; overflow: hidden;
      background: #0d1018; border: 1px solid rgba(74,140,255,0.5);
      box-shadow: 0 0 0 rgba(74,140,255,0);
      opacity: 0; will-change: transform, opacity, box-shadow;
    }
    #scene-50 .browser .tabs {
      display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px 0; background: #0a0c12;
    }
    #scene-50 .browser .tab {
      padding: 8px 18px; border-radius: 8px 8px 0 0; background: #141925; border: 1px solid rgba(74,140,255,0.3); border-bottom: none;
      font-size: 16px; color: var(--soft); font-family: "Inter", sans-serif;
    }
    #scene-50 .browser .addr {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #141925; border-bottom: 1px solid var(--border);
    }
    #scene-50 .browser .addr .dots { display: flex; gap: 6px; }
    #scene-50 .browser .addr .dots b { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
    #scene-50 .browser .addr .url {
      flex: 1; height: 26px; border-radius: 13px; background: #0a0c12; border: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 14px; font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--muted);
    }
    #scene-50 .browser .view { height: 96px; background: #0a0c12; }

    /* the absurdity badge */
    #scene-50 .badge {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
      padding: 9px 20px; border-radius: 999px; background: rgba(74,140,255,0.14); border: 1px solid rgba(74,140,255,0.5);
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700; color: var(--chrome); white-space: nowrap;
      opacity: 0; will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="scene-50" data-composition-id="scene-50" data-width="1920" data-height="1080">
    <div class="cap">
      <span class="w">So</span> <span class="w">Atom</span> <span class="w">had</span>
      <span class="w">to</span> <span class="w">ship</span> <span class="w">with</span>
      <span class="w">a</span> <span class="w br">browser</span> <span class="w">inside</span>
      <span class="w">it.</span>
    </div>

    <div class="editor">
      <div class="bar">
        <i></i><i></i><i></i>
        <span class="title">&mdash; <b>Atom</b> &middot; a text editor</span>
      </div>
      <div class="stage">
        <div class="browser" data-sfx-on-anchor="card-tap" data-sfx-asset="Mister Horse Free SFX/Click/Mechanical Keyboard Click 01.wav" data-sfx-at-scene-ms="2030" data-sfx-volume="0.42">
          <div class="tabs"><div class="tab">New Tab</div></div>
          <div class="addr">
            <div class="dots"><b></b><b></b><b></b></div>
            <div class="url">chrome://an-entire-browser</div>
          </div>
          <div class="view"></div>
        </div>
        <div class="badge">+ an entire browser</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene-local = global - data_start(313.98).
    // "So Atom had to ship with a browser inside it." (ship 1.34, browser 1.78, inside 2.16, it 2.58).
    const cw = [0.50, 0.74, 1.06, 1.20, 1.34, 1.54, 1.70, 1.78, 2.16, 2.58];
    gsap.utils.toArray("#scene-50 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, cw[i]);
    });

    // "ship" — the Atom editor window settles in (ship 1.34).
    tl.fromTo("#scene-50 .editor",
      { opacity: 0, y: 26, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 1.28);

    // "browser" — a whole browser window materialises crammed inside it (browser 1.78).
    tl.fromTo("#scene-50 .browser",
      { opacity: 0, scale: 0.78 },
      { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.78);

    // "inside it" — the editor frame glows blue around the trapped browser, and the absurdity lands (inside 2.16, it 2.58).
    tl.to("#scene-50 .browser",
      { boxShadow: "0 0 40px rgba(74,140,255,0.4)", duration: 0.45, ease: "power2.out" }, 2.16);
    tl.to("#scene-50 .editor",
      { boxShadow: "0 28px 80px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(74,140,255,0.4)", duration: 0.45, ease: "power2.out" }, 2.20);
    tl.fromTo("#scene-50 .badge",
      { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 2.24);

    // Subtle life — the crammed browser shifts, uneasy in its cage.
    tl.to("#scene-50 .browser", { y: "-=4", duration: 1.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.9);

    // Seam clear — fade out across the trailing overlap with scene 51 (local 2.80-3.30).
    tl.to("#scene-50 .cap, #scene-50 .editor",
      { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 2.80);

    window.__timelines["scene-50"] = tl;
  </script>
</body>
</html>
