<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 50 — So Atom had to ship with a browser inside it</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg:#0b0d12; --panel:#11141b; --border:#1f242c;
      --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150;
      --accent:#f7df1e; --accent-2:#67e8f9; --danger:#ff6b5d; --ok:#7dd87d;
      --atom:#a48bff; --chrome:#4a8cff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-50 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-50 .cap { position:absolute; left:50%; top:182px; transform:translateX(-50%); width:1440px; text-align:center; font-size:50px; font-weight:600; color:var(--soft); letter-spacing:-0.8px; }
    #scene-50 .cap .w { display:inline-block; opacity:0; will-change:transform,opacity; }
    #scene-50 .cap .br { color:var(--chrome); font-weight:800; will-change:text-shadow; }

    /* the Atom editor — the outer shell that has to carry the cargo */
    #scene-50 .editor { position:absolute; left:50%; top:636px; transform:translate(-50%,-50%); width:860px; height:392px; border-radius:16px; overflow:hidden; background:var(--panel); border:1px solid var(--border); box-shadow:0 30px 84px rgba(0,0,0,0.52); opacity:0; will-change:transform,opacity; }
    #scene-50 .editor .bar { display:flex; align-items:center; gap:12px; padding:14px 20px; background:#0f1219; border-bottom:1px solid var(--border); }
    #scene-50 .editor .bar i { width:12px; height:12px; border-radius:50%; background:var(--dim); }
    #scene-50 .editor .bar .abadge { width:24px; height:24px; margin-left:6px; }
    #scene-50 .editor .bar .abadge .nuc { fill:var(--atom); }
    #scene-50 .editor .bar .abadge .orbit { fill:none; stroke:var(--atom); stroke-width:5; opacity:0.9; }
    #scene-50 .editor .bar .title { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--muted); }
    #scene-50 .editor .bar .title b { color:var(--atom); font-weight:700; }
    #scene-50 .editor .stage { position:relative; height:331px; display:flex; align-items:center; justify-content:center; }

    /* the browser — a whole Chromium window crammed into the editor, slightly too big */
    #scene-50 .browser { position:relative; width:632px; border-radius:11px; overflow:hidden; background:#0d1018; border:1px solid rgba(74,140,255,0.55); opacity:0; will-change:transform,opacity; }
    #scene-50 .browser .tabs { display:flex; align-items:flex-end; gap:8px; padding:9px 12px 0; background:#0a0c12; }
    #scene-50 .browser .tab { padding:7px 18px; border-radius:8px 8px 0 0; background:#141925; border:1px solid rgba(74,140,255,0.3); border-bottom:none; font-size:15px; color:var(--soft); }
    #scene-50 .browser .addr { display:flex; align-items:center; gap:10px; padding:11px 16px; background:#141925; border-bottom:1px solid var(--border); }
    #scene-50 .browser .addr .nav { display:flex; gap:7px; }
    #scene-50 .browser .addr .nav b { width:9px; height:9px; border-radius:50%; background:var(--dim); }
    #scene-50 .browser .addr .url { flex:1; height:28px; border-radius:14px; background:#0a0c12; border:1px solid var(--border); display:flex; align-items:center; padding:0 15px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:14px; color:var(--muted); }
    #scene-50 .browser .view { height:104px; background:#0a0c12; display:flex; align-items:center; gap:14px; padding:0 22px; }
    #scene-50 .browser .view .blk { height:11px; border-radius:6px; background:#1b2130; }

    /* the cage ring that locks around the cargo on "inside it" */
    #scene-50 .cage { position:absolute; inset:0; border-radius:16px; border:2px solid rgba(74,140,255,0); pointer-events:none; will-change:border-color,box-shadow; }

    /* the absurdity nameplate — hung in the stage's bottom margin, below the browser */
    #scene-50 .tag { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); padding:7px 22px; border-radius:999px; background:var(--bg); border:1px solid rgba(74,140,255,0.5); font-family:"JetBrains Mono",ui-monospace,monospace; font-size:19px; font-weight:700; color:var(--chrome); white-space:nowrap; opacity:0; will-change:transform,opacity; }
  </style>
</head>
<body>
  <div id="scene-50" data-composition-id="scene-50" data-width="1920" data-height="1080">
    <div class="cap" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">
      <span class="w">So</span> <span class="w">Atom</span> <span class="w">had</span>
      <span class="w">to</span> <span class="w">ship</span> <span class="w">with</span>
      <span class="w">a</span> <span class="w br">browser</span> <span class="w">inside</span>
      <span class="w">it.</span>
    </div>

    <div class="editor" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1340">
      <div class="bar">
        <i></i><i></i><i></i>
        <svg class="abadge" viewBox="0 0 100 100">
          <g class="o1"><ellipse class="orbit" cx="50" cy="50" rx="40" ry="15"/></g>
          <g class="o2"><ellipse class="orbit" cx="50" cy="50" rx="40" ry="15"/></g>
          <g class="o3"><ellipse class="orbit" cx="50" cy="50" rx="40" ry="15"/></g>
          <circle class="nuc" cx="50" cy="50" r="9"/>
        </svg>
        <span class="title">&mdash; <b>Atom</b> &middot; a text editor</span>
      </div>
      <div class="stage">
        <div class="browser" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="1780">
          <div class="tabs"><div class="tab">New Tab</div></div>
          <div class="addr">
            <div class="nav"><b></b><b></b><b></b></div>
            <div class="url">chrome://an-entire-browser-engine</div>
          </div>
          <div class="view">
            <span class="blk" style="width:34%"></span>
            <span class="blk" style="width:22%"></span>
            <span class="blk" style="width:30%"></span>
          </div>
        </div>
        <div class="cage" data-sfx-on-anchor="snap" data-sfx-at-scene-ms="2200"></div>
        <div class="tag">+ a whole browser, shipped inside</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // Scene-local = global - data_start(313.98).
    // So 0.50 / Atom 0.74 / had 1.06 / to 1.20 / ship 1.34 / with 1.54 / a 1.70 / browser 1.78 / inside 2.16 / it 2.58.

    // base rotations form the 3-orbit atom mark in the title bar.
    gsap.set("#scene-50 .abadge .o1", { rotation:0, svgOrigin:"50 50" });
    gsap.set("#scene-50 .abadge .o2", { rotation:60, svgOrigin:"50 50" });
    gsap.set("#scene-50 .abadge .o3", { rotation:120, svgOrigin:"50 50" });

    // "So Atom had to ship with a browser inside it."
    const cw = [0.50, 0.74, 1.06, 1.20, 1.34, 1.54, 1.70, 1.78, 2.16, 2.58];
    gsap.utils.toArray("#scene-50 .cap .w").forEach((el, i) => {
      tl.fromTo(el, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.28, ease:"power2.out" }, cw[i]);
    });

    // "ship" — the Atom editor shell settles in, empty, waiting for its cargo.
    tl.fromTo("#scene-50 .editor", { opacity:0, y:26, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 1.28);

    // "browser" — a whole Chromium window crams in, oversized and tilted, never quite fitting.
    tl.fromTo("#scene-50 .browser",
      { opacity:0, scale:0.72, rotateZ:-3 },
      { opacity:1, scale:1.04, rotateZ:-1.4, duration:0.5, ease:"back.out(1.7)" }, 1.78);
    tl.fromTo("#scene-50 .tag", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.34, ease:"back.out(1.6)" }, 2.04);
    tl.fromTo("#scene-50 .cap .br", { textShadow:"0 0 0 rgba(74,140,255,0)" }, { textShadow:"0 0 26px rgba(74,140,255,0.55)", duration:0.4, ease:"power2.out" }, 1.86);

    // "inside it" — the blue cage snaps shut around the trapped browser; it settles, caged.
    tl.to("#scene-50 .cage",
      { borderColor:"rgba(74,140,255,0.6)", boxShadow:"inset 0 0 34px rgba(74,140,255,0.22)", duration:0.4, ease:"power2.out" }, 2.20);
    tl.to("#scene-50 .browser", { scale:1, rotateZ:0, duration:0.4, ease:"power2.inOut" }, 2.40);

    // Subtle life — the caged browser strains, never still; the atom mark turns slowly.
    tl.to("#scene-50 .browser", { y:"-=4", duration:1.5, ease:"sine.inOut", repeat:1, yoyo:true }, 2.9);
    tl.to("#scene-50 .abadge .o1", { rotation:"+=360", svgOrigin:"50 50", duration:5.5, ease:"none", repeat:1 }, 1.4);

    // Seam clear — fade out across the trailing overlap with scene 51 (local 2.96-3.30).
    tl.to("#scene-50 .cap, #scene-50 .editor", { opacity:0, duration:0.32, ease:"power2.inOut" }, 2.96);

    window.__timelines["scene-50"] = tl;
  </script>
</body>
</html>
