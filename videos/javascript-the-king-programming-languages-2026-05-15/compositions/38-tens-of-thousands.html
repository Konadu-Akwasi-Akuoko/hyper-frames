<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 38 — within months, tens of thousands were running to it</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#0b0d12; --panel:#11141b; --border:#1f242c; --fg:#e8eaed; --soft:#c2c9d4; --muted:#7a8493; --dim:#3a4150; --accent:#f7df1e; --accent-2:#67e8f9; --ok:#7dd87d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:"Inter",system-ui,sans-serif; }
    #scene-38 { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    #scene-38 .hero { position:absolute; left:11%; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
    #scene-38 .hero .kick { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:24px; color:var(--muted); opacity:0; will-change:transform,opacity; }
    #scene-38 .hero .big { font-size:116px; font-weight:800; line-height:1.0; color:var(--accent-2); letter-spacing:-2px; opacity:0; will-change:transform,opacity; }
    #scene-38 .hero .sub { font-size:34px; font-weight:500; color:var(--soft); margin-top:6px; opacity:0; will-change:transform,opacity; }
    #scene-38 .hero .sub .n { color:var(--ok); font-weight:700; }

    /* the steep growth curve */
    #scene-38 .growth { position:absolute; right:9%; top:54%; transform:translateY(-50%); width:520px; height:360px; opacity:0; will-change:opacity; }
    #scene-38 .growth svg { position:absolute; inset:0; width:520px; height:360px; }
    #scene-38 .growth .axis { fill:none; stroke:var(--border); stroke-width:2; }
    #scene-38 .growth .curve { fill:none; stroke:var(--accent-2); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 10px rgba(103,232,249,0.4)); }
    #scene-38 .growth .nodecap { position:absolute; right:-26px; top:-26px; width:84px; height:84px; opacity:0; will-change:transform,opacity; }
    #scene-38 .growth .nodecap img { width:84px; height:84px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(125,216,125,0.5)); }
    #scene-38 .growth .glabel { position:absolute; left:6px; bottom:-2px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:18px; color:var(--dim); }
  </style>
</head>
<body>
  <div id="scene-38" data-composition-id="scene-38" data-width="1920" data-height="1080">
    <div class="hero">
      <span class="kick" data-sfx-on-anchor="card-tap" data-sfx-at-scene-ms="500">within months</span>
      <span class="big" data-sfx-on-anchor="pop" data-sfx-at-scene-ms="1380">Tens of<br>thousands</span>
      <span class="sub">of engineers ran to <span class="n">Node.js</span>.</span>
    </div>

    <div class="growth">
      <svg viewBox="0 0 520 360" preserveAspectRatio="none">
        <polyline class="axis" points="40,20 40,320 500,320"/>
        <polyline class="curve" points="56,310 150,300 240,280 320,236 390,168 450,84 486,28"/>
      </svg>
      <div class="nodecap" data-sfx-on-anchor="whoosh" data-sfx-at-scene-ms="3100"><img src="../assets/icons/nodejs.svg" alt="Node.js"></div>
      <span class="glabel">adoption</span>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });
    // Scene-local = global - data_start(255.50).
    // Within 0.50 / months 0.86 / tens 1.38 / thousands 1.76 / engineers 2.20 / running 2.98 / to-it 3.44.

    // "within months"
    tl.fromTo("#scene-38 .kick", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 0.50);

    // "Tens of thousands" — the scale lands hard.
    tl.fromTo("#scene-38 .big", { opacity:0, y:20, scale:0.88 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.6)" }, 1.38);

    // "of engineers ran to Node.js"
    tl.fromTo("#scene-38 .sub", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 2.20);

    // the growth curve shoots up; Node caps the peak as they run to it.
    tl.fromTo("#scene-38 .growth", { opacity:0 }, { opacity:1, duration:0.3 }, 1.70);
    const curve = document.querySelector("#scene-38 .curve");
    const clen = curve ? curve.getTotalLength() : 900;
    gsap.set("#scene-38 .curve", { strokeDasharray:clen, strokeDashoffset:clen });
    tl.to("#scene-38 .curve", { strokeDashoffset:0, duration:1.4, ease:"power2.in" }, 1.76);
    tl.fromTo("#scene-38 .nodecap", { opacity:0, scale:0.5, y:14 }, { opacity:1, scale:1, y:0, duration:0.45, ease:"back.out(2)" }, 3.10);

    // idle: the Node cap bobs, the hero number breathes its glow.
    tl.to("#scene-38 .nodecap", { y:-7, duration:0.9, ease:"sine.inOut", repeat:1, yoyo:true }, 3.6);
    tl.fromTo("#scene-38 .big", { textShadow:"0 0 0 rgba(103,232,249,0)" }, { textShadow:"0 0 30px rgba(103,232,249,0.4)", duration:0.8, ease:"sine.inOut", repeat:1, yoyo:true }, 3.6);
    window.__timelines["scene-38"] = tl;
  </script>
</body>
</html>
