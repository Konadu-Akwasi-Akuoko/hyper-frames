<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 12 — Landing</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12; --panel: #11141b; --border: #1f242c;
      --fg: #e8eaed; --soft: #c2c9d4; --muted: #7a8493; --dim: #3a4150;
      --accent: #f7df1e; --accent-2: #67e8f9; --danger: #ff6b5d; --ok: #7dd87d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent; font-family: "Inter", system-ui, sans-serif;
    }
    #scene-12-landing {
      position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
    }

    .landing {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 160px; gap: 36px; box-sizing: border-box;
    }

    /* Callback chips — code editor / password manager / Start menu */
    .recall-row { display: flex; gap: 22px; opacity: 0; }
    .recall-chip {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 20px;
      font-size: 18px; font-weight: 600; color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      display: flex; align-items: center; gap: 10px; opacity: 0;
    }
    .rc-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .rc-editor .rc-dot  { background: var(--accent-2); }
    .rc-pwmgr .rc-dot   { background: var(--ok); }
    .rc-win .rc-dot     { background: #0078d4; }

    /* "you are running" setup line */
    .running-line {
      font-size: 44px; font-weight: 700; color: var(--muted);
      text-align: center; opacity: 0;
    }

    /* JS badge + JavaScript word */
    .js-reveal-row {
      display: flex; align-items: center; gap: 28px; opacity: 0;
    }
    .js-badge-lg {
      width: 120px; height: 120px; background: var(--accent);
      border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 8px 10px;
    }
    .js-badge-lg-text {
      font-size: 54px; font-weight: 900; color: #000;
      font-family: "Inter", sans-serif; line-height: 1;
    }
    .js-word {
      font-size: 120px; font-weight: 900; letter-spacing: -0.04em;
      color: var(--accent); line-height: 0.9;
    }

    /* Verdict lines */
    .verdict-not {
      font-size: 34px; font-weight: 600; color: var(--muted);
      text-align: center; max-width: 1100px; line-height: 1.4; opacity: 0;
    }
    .verdict-not .not-won {
      text-decoration: line-through; color: var(--muted);
    }

    .verdict-truth {
      font-size: 48px; font-weight: 800; color: var(--soft);
      text-align: center; max-width: 1200px; line-height: 1.3; opacity: 0;
    }
    .verdict-truth .mobility-word { color: var(--accent-2); }
  </style>
</head>
<body>
  <div id="scene-12-landing" data-composition-id="scene-12-landing" data-width="1920" data-height="1080">
    <div class="landing">

      <!-- Callback chips: "your code editor / password manager / Start menu of Windows" -->
      <div class="recall-row" id="recall-row">
        <div class="recall-chip rc-editor" id="rc-editor">
          <div class="rc-dot"></div>your code editor
        </div>
        <div class="recall-chip rc-pwmgr" id="rc-pwmgr">
          <div class="rc-dot"></div>your password manager
        </div>
        <div class="recall-chip rc-win" id="rc-win">
          <div class="rc-dot"></div>the Windows Start menu
        </div>
      </div>

      <!-- "you are running" -->
      <div class="running-line" id="running-line">you are running</div>

      <!-- Big JS reveal -->
      <div class="js-reveal-row" id="js-reveal-row">
        <div class="js-badge-lg">
          <div class="js-badge-lg-text">JS</div>
        </div>
        <div class="js-word">JavaScript</div>
      </div>

      <!-- Qualifier -->
      <div class="verdict-not" id="verdict-not">
        not because it has <span class="not-won">won</span>,
      </div>

      <!-- Truth -->
      <div class="verdict-truth" id="verdict-truth">
        because it was already there — and it was built for <span class="mobility-word">mobility</span>.
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene entrance crossfade from scene-11
      tl.fromTo("#scene-12-landing", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);

      // Recall chips — "the next time you open" (0.77) → first chip group appears
      tl.fromTo("#recall-row", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.75);
      // code editor at "code" (1.15)
      tl.fromTo("#rc-editor", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.13);
      // password manager at "password" (2.29)
      tl.fromTo("#rc-pwmgr", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.27);
      // Start menu at "Start" (3.95)
      tl.fromTo("#rc-win", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.93);

      // "you are running" at "running" (7.01)
      tl.fromTo("#running-line", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.99);

      // Big JS reveal at "JavaScript," (7.67)
      tl.fromTo("#js-reveal-row", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.65, ease: "back.out(2.5)", transformOrigin: "center" }, 7.65);

      // "not because it has won," at "not" (8.83)
      tl.fromTo("#verdict-not", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.81);

      // "because it was already there and it was built for mobility." at "because" (10.63)
      tl.fromTo("#verdict-truth", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 10.61);

      // FINAL EXIT — fade to black after "mobility." (13.65). ONLY SCENE WHERE EXIT ANIMATIONS ARE ALLOWED.
      tl.to("#scene-12-landing", { opacity: 0, duration: 1.8, ease: "power1.inOut" }, 13.8);

      window.__timelines["scene-12-landing"] = tl;
    </script>
  </div>
</body>
</html>
