[project]
name = "dup-detect"
version = "0.14.0"
description = "Deterministically find duplicate takes (textually-identical phrase repeats) in a Scribe v2 transcript and emit them as flagged candidate cuts, keeping the tighter take."
readme = "README.md"
authors = [
    { name = "Akwasi Konadu Akuoko", email = "akwasikonadueverlasting@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dup-detect = "dup_detect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
