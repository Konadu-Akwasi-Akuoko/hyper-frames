[project]
name = "cut-video"
version = "0.14.0"
description = "Apply cuts.json removed-spans to a video or audio source, emitting one frame-accurate cut master whose picture and audio are cut on identical keep-windows."
readme = "README.md"
authors = [
    { name = "Akwasi Konadu Akuoko", email = "akwasikonadueverlasting@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cut-video = "cut_video.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
