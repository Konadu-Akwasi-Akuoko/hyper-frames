[project]
name = "inspo-ingest"
version = "0.14.0"
description = "Download a bounded YouTube section, scene-detect and rank cut frames, tile a film-strip PNG + hero frame, and print a motion-inspo index-entry stub."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Akwasi Konadu Akuoko", email = "akwasikonadueverlasting@gmail.com" }
]
dependencies = [
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
]

[project.scripts]
inspo-ingest = "inspo_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]
