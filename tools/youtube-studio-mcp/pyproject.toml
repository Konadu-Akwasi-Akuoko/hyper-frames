[project]
name = "youtube-studio-mcp"
version = "0.14.0"
description = "MCP server exposing YouTube Analytics, Reporting, and Data API v3 to Claude Code."
readme = "README.md"
authors = [
    { name = "Akwasi Konadu Akuoko", email = "akwasikonadueverlasting@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "sqlite-utils>=3.37",
    "platformdirs>=4.3.6",
    "pydantic>=2.9.0",
    "sqlglot>=25.20.0",
]

[project.scripts]
youtube-studio-mcp = "youtube_studio_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
