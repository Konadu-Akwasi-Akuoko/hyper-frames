[project]
name = "image-prep"
version = "0.14.0"
description = "Background removal + house VFX presets (grain/duotone/halftone/vintage) that turn a supplied photo into a palette-consistent cutout for video-director asset boxes."
readme = "README.md"
authors = [
    { name = "Akwasi Konadu Akuoko", email = "akwasikonadueverlasting@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.26.0",
]

[project.optional-dependencies]
# Background removal pulls onnxruntime + a model download — kept optional so the
# VFX presets stay light. Enable with: uv sync --extra bg
bg = [
    "rembg>=2.0.0",
]

[project.scripts]
image-prep = "image_prep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
