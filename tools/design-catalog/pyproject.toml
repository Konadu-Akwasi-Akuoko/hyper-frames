[project]
name = "design-catalog"
version = "0.14.0"
description = "Scan design-catalog/ entries and emit catalog.json — the index consumed by the static viewer."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Akwasi Konadu Akuoko", email = "akwasikonadueverlasting@gmail.com" }
]
dependencies = []

[project.scripts]
design-catalog = "design_catalog.cli:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]
