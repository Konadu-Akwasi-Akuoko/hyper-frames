<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hyper-frames pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,30..100,0..1;1,9..144,300..700,30..100,0..1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Warm dark palette — never pure black */
      --bg: #0F0E0C;
      --bg-subtle: #131210;
      --surface-1: #1A1815;
      --surface-2: #221F1B;
      --surface-3: #2B2723;

      --border-subtle: #2A2723;
      --border: #3A3631;
      --border-strong: #4D4842;

      --text: #EDE7DC;
      --text-secondary: #B5AC9D;
      --text-muted: #8A8278;
      --text-dim: #5C544A;
      --text-fade: #3F3934;

      /* Copper — single strategic accent */
      --accent: #D4A574;
      --accent-muted: #8B6F4D;
      --accent-soft: rgba(212, 165, 116, 0.10);

      /* States */
      --amber: #E0A050;
      --amber-soft: rgba(224, 160, 80, 0.18);
      --green: #8FAF7E;
      --green-soft: rgba(143, 175, 126, 0.18);
      --red: #C4615A;
      --red-soft: rgba(196, 97, 90, 0.13);

      /* Type */
      --font-display: 'Fraunces', 'Source Serif Pro', Georgia, serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

      /* Spatial */
      --radius-sm: 3px;
      --radius: 5px;
      --radius-lg: 8px;
      --header-h: 52px;
      --panel-w: 400px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.4;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
      grid-template-columns: 1fr var(--panel-w);
      grid-template-areas:
        "header header"
        "board panel";
      position: relative;
    }

    body:has(.panel[hidden]) {
      grid-template-columns: 1fr 0;
    }

    /* Subtle grain — gives the dark surface tooth */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.025;
      background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      mix-blend-mode: overlay;
    }

    /* ============================== TOPBAR */
    .topbar {
      grid-area: header;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      z-index: 10;
    }

    /* Hairline copper scan-line at the very top edge */
    .topbar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--accent-muted) 30%, var(--accent) 50%, var(--accent-muted) 70%, transparent 100%);
      opacity: 0.5;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-mark {
      width: 16px;
      height: 16px;
      color: var(--accent);
      align-self: center;
      transform: translateY(-1px);
    }

    .brand-name {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: -0.015em;
      color: var(--text);
      font-variation-settings: 'opsz' 14, 'SOFT' 60, 'WONK' 0;
    }

    .brand-section {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      padding: 5px 10px 5px 8px;
      margin-right: 8px;
      letter-spacing: 0.02em;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-pill::before {
      content: '';
      display: block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green-soft);
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 11px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 120ms ease;
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn:hover {
      background: var(--surface-1);
      color: var(--text);
      border-color: var(--border-subtle);
    }

    .btn .glyph {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .btn:hover .glyph { color: var(--accent); }

    .btn-icon {
      width: 28px;
      height: 28px;
      padding: 0;
      justify-content: center;
      font-size: 12px;
    }

    /* ============================== BOARD */
    .board {
      grid-area: board;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 18px 12px 18px 16px;
      position: relative;
    }

    .columns {
      display: flex;
      gap: 6px;
      height: 100%;
      min-width: max-content;
    }

    .column {
      width: 210px;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      position: relative;
    }

    /* Subtle vertical glow on the leftmost edge of each column to imply column-ness without borders */
    .column::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, var(--border-subtle) 20%, var(--border-subtle) 80%, transparent 100%);
      opacity: 0.5;
    }
    .column:first-child::before { display: none; }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px 14px;
      position: sticky;
      top: 0;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 70%, transparent 100%);
      backdrop-filter: blur(6px);
      z-index: 2;
    }

    .stage-name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .count {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-fade);
      padding: 1px 7px;
      border-radius: 100px;
      border: 1px solid var(--border-subtle);
      min-width: 20px;
      text-align: center;
      background: var(--bg-subtle);
    }

    .count[data-active] {
      color: var(--text-secondary);
      border-color: var(--border);
    }

    .column-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* ============================== CARD */
    .card {
      position: relative;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 12px 13px 13px;
      cursor: grab;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .card:hover {
      border-color: var(--border);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    /* The currently-open card gets a copper edge */
    .card.is-open {
      border-color: var(--accent-muted);
      background: var(--surface-2);
      box-shadow:
        0 0 0 1px var(--accent-soft),
        0 4px 12px -4px rgba(0, 0, 0, 0.5);
    }
    .card.is-open::after {
      content: '';
      position: absolute;
      left: -1px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
      min-height: 13px;
    }

    .slug {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.005em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .drift {
      flex-shrink: 0;
      width: 13px;
      height: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--amber);
      cursor: help;
    }

    .drift svg {
      filter: drop-shadow(0 0 3px rgba(224, 160, 80, 0.4));
    }

    .title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 15px;
      line-height: 1.22;
      letter-spacing: -0.012em;
      color: var(--text);
      margin-bottom: 3px;
      font-variation-settings: 'opsz' 14, 'SOFT' 50, 'WONK' 0;
    }

    .date {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-fade);
      letter-spacing: 0.01em;
      margin-bottom: 11px;
    }

    .dots {
      display: flex;
      gap: 5px;
      list-style: none;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--text-fade);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .dot-partial {
      background: var(--amber);
      border-color: var(--amber);
      box-shadow: 0 0 0 2px var(--amber-soft);
      animation: dot-breath 2.4s ease-in-out infinite;
    }

    .dot-present {
      background: var(--green);
      border-color: var(--green);
    }

    @keyframes dot-breath {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .card:hover .dot { transform: scale(1.08); }

    /* ============================== EMPTY COLUMN */
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius);
      margin: 4px 2px;
      min-height: 80px;
    }

    .empty-text {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 12px;
      color: var(--text-fade);
      text-align: center;
      letter-spacing: -0.005em;
      font-variation-settings: 'opsz' 14, 'SOFT' 80;
      line-height: 1.4;
    }

    /* Scrollbars */
    .board::-webkit-scrollbar,
    .column-body::-webkit-scrollbar { width: 8px; height: 8px; }
    .board::-webkit-scrollbar-thumb,
    .column-body::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 100px;
    }
    .board::-webkit-scrollbar-thumb:hover,
    .column-body::-webkit-scrollbar-thumb:hover { background: var(--border); }
    .board::-webkit-scrollbar-track,
    .column-body::-webkit-scrollbar-track { background: transparent; }

    /* Subtle entrance — page-load reveal */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .column     { animation: fade-up 500ms ease both; }
    .column:nth-child(1) { animation-delay: 60ms; }
    .column:nth-child(2) { animation-delay: 120ms; }
    .column:nth-child(3) { animation-delay: 180ms; }
    .column:nth-child(4) { animation-delay: 240ms; }
    .column:nth-child(5) { animation-delay: 300ms; }
    .column:nth-child(6) { animation-delay: 360ms; }
    .column:nth-child(7) { animation-delay: 420ms; }
    .column:nth-child(8) { animation-delay: 480ms; }
  </style>
</head>
<body>

  <!-- ============================== TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="2.5" width="14" height="2" fill="currentColor" opacity="0.95"/>
          <rect x="1" y="7" width="14" height="2" fill="currentColor" opacity="0.55"/>
          <rect x="1" y="11.5" width="14" height="2" fill="currentColor" opacity="0.25"/>
        </svg>
      </span>
      <span class="brand-name">hyper-frames</span>
      <span class="brand-section">Pipeline</span>
    </div>
    <div class="toolbar">
      <span class="status-pill">0 cards · never synced</span>
      <button class="btn" id="btn-add"><span class="glyph">+</span>Add</button>
      <button class="btn" id="btn-sync"><span class="glyph">↻</span>Sync</button>
      <button class="btn btn-icon" id="btn-help" aria-label="Help">?</button>
    </div>
  </header>

  <!-- ============================== BOARD -->
  <main class="board"></main>

  <!-- ============================== SIDE PANEL -->
  <aside class="panel" hidden></aside>

  <script>
  (() => {
    'use strict';

    const STAGES = [
      { id: 'idea',      label: 'Idea' },
      { id: 'research',  label: 'Research' },
      { id: 'script',    label: 'Script' },
      { id: 'voiceover', label: 'Voiceover' },
      { id: 'compose',   label: 'Compose' },
      { id: 'thumbnail', label: 'Thumbnail' },
      { id: 'render',    label: 'Render' },
      { id: 'published', label: 'Published' },
    ];

    // Ordered for the 7 progress dots (left to right). 'idea' has no dot.
    // 'voiceover' rolls in narration: 'partial' = mp3+transcript only;
    // 'present' = +narration-map.json.
    const ARTIFACTS = [
      { id: 'research',  label: 'Research' },
      { id: 'script',    label: 'Script' },
      { id: 'voiceover', label: 'Voiceover' },
      { id: 'compose',   label: 'Compose' },
      { id: 'thumbnail', label: 'Thumbnail' },
      { id: 'render',    label: 'Render' },
      { id: 'published', label: 'Published' },
    ];

    const DRIFT_SVG = `
      <svg width="11" height="10" viewBox="0 0 11 10" fill="none" aria-hidden="true">
        <path d="M5.5 1L10 9H1L5.5 1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
        <circle cx="5.5" cy="6.5" r="0.7" fill="currentColor"/>
      </svg>`;

    function dotClass(status) {
      if (status === 'present') return 'dot dot-present';
      if (status === 'partial') return 'dot dot-partial';
      return 'dot';
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function frag(htmlStr) {
      return document.createRange().createContextualFragment(htmlStr);
    }

    function setContent(el, htmlStr) {
      el.replaceChildren(frag(htmlStr));
    }

    function renderColumn(stage, cards) {
      const count = cards.length;
      const countAttr = count > 0 ? 'data-active' : '';
      const body = count === 0
        ? `<div class="empty"><span class="empty-text">No cards in flight.</span></div>`
        : cards.map(renderCard).join('');
      return `
        <div class="column" data-stage="${stage.id}">
          <div class="column-header">
            <span class="stage-name">${escapeHtml(stage.label)}</span>
            <span class="count" ${countAttr}>${count}</span>
          </div>
          <div class="column-body">${body}</div>
        </div>
      `;
    }

    function renderCard(card) {
      const isOpen = card.id === state.ui.panelOpenCardId;
      const drift = card.hasDrift
        ? `<span class="drift" title="Scan suggests: ${escapeHtml(card.suggestedLabel || '')}">${DRIFT_SVG}</span>`
        : '';
      const dots = ARTIFACTS.map(a => {
        const status = card.artifacts?.[a.id] || 'missing';
        return `<li class="${dotClass(status)}" title="${escapeHtml(a.label)}"></li>`;
      }).join('');
      return `
        <article class="card${isOpen ? ' is-open' : ''}" data-card-id="${escapeHtml(card.id)}" draggable="true">
          <div class="card-meta">
            <span class="slug">${escapeHtml(card.slug)}</span>
            ${drift}
          </div>
          <h3 class="title">${escapeHtml(card.title)}</h3>
          <time class="date">${escapeHtml(card.date)}</time>
          <ol class="dots" aria-label="Pipeline progress">${dots}</ol>
        </article>
      `;
    }

    function relativeTime(iso) {
      if (!iso) return 'never';
      const ms = Date.now() - new Date(iso).getTime();
      const s = Math.floor(ms / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }

    function updateStatusPill() {
      const pill = document.querySelector('.status-pill');
      if (!pill) return;
      const n = state.cards.length;
      const last = state.lastSyncedAt;
      const synced = last ? `synced ${relativeTime(last)}` : 'never synced';
      pill.textContent = `${n} card${n === 1 ? '' : 's'} · ${synced}`;
    }

    let state = {
      schemaVersion: 1,
      lastSyncedAt: null,
      ui: { panelOpenCardId: null },
      cards: [
        { id: 'a', slug: 'font-rendering', title: 'The Pixel Olympics',
          date: '2026-05-09', stage: 'idea',
          artifacts: { research: 'missing', script: 'missing', voiceover: 'missing',
            compose: 'missing', thumbnail: 'missing', render: 'missing', published: 'missing' },
          notes: '', createdAt: '2026-05-09T09:00:00Z', updatedAt: '2026-05-09T09:00:00Z',
          lastScannedAt: null, hasDrift: false },
        { id: 'b', slug: 'tcp-handshake', title: 'Three-Way Hello',
          date: '2026-04-28', stage: 'research',
          artifacts: { research: 'present', script: 'missing', voiceover: 'missing',
            compose: 'missing', thumbnail: 'missing', render: 'missing', published: 'missing' },
          notes: '', createdAt: '2026-04-28T09:00:00Z', updatedAt: '2026-04-28T09:00:00Z',
          lastScannedAt: null, hasDrift: false },
        { id: 'c', slug: 'why-text-is-hard', title: 'Why Text Is Hard',
          date: '2026-05-07', stage: 'compose',
          artifacts: { research: 'present', script: 'present', voiceover: 'present',
            compose: 'partial', thumbnail: 'present', render: 'missing', published: 'missing' },
          notes: '', createdAt: '2026-05-07T09:00:00Z', updatedAt: '2026-05-07T09:00:00Z',
          lastScannedAt: null, hasDrift: false },
        { id: 'd', slug: 'ssl-cert-magic', title: 'How TLS Trusts Anyone',
          date: '2026-05-03', stage: 'voiceover',
          artifacts: { research: 'present', script: 'present', voiceover: 'present',
            compose: 'partial', thumbnail: 'missing', render: 'missing', published: 'missing' },
          notes: '', createdAt: '2026-05-03T09:00:00Z', updatedAt: '2026-05-03T09:00:00Z',
          lastScannedAt: null, hasDrift: true, suggestedLabel: 'Compose' },
        { id: 'e', slug: 'color-spaces', title: 'Why RGB Lies',
          date: '2026-04-15', stage: 'published',
          artifacts: { research: 'present', script: 'present', voiceover: 'present',
            compose: 'present', thumbnail: 'present', render: 'present', published: 'present' },
          notes: '', createdAt: '2026-04-15T09:00:00Z', updatedAt: '2026-04-15T09:00:00Z',
          lastScannedAt: null, hasDrift: false },
      ],
    };

    function render() {
      const board = document.querySelector('.board');
      const cards = state.cards;
      const cardsByStage = Object.fromEntries(STAGES.map(s => [s.id, []]));
      for (const c of cards) {
        if (cardsByStage[c.stage]) cardsByStage[c.stage].push(c);
      }
      for (const arr of Object.values(cardsByStage)) {
        arr.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      }
      setContent(board, `<div class="columns">${
        STAGES.map(s => renderColumn(s, cardsByStage[s.id])).join('')
      }</div>`);
      updateStatusPill();
    }

    render();
  })();
  </script>

</body>
</html>
